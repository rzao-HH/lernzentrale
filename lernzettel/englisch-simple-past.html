<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Lernzettel Englisch: Simple Past</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --bg:#e7ebf2;--panel:#f8f9fc;--line:#c7cfe0;--text:#1b2238;--muted:#566081;
  --brass:#94661c;--teal:#0f7f7a;--bad:#b3342b;--badbg:#f9e1dd;--night:#1b2238;
  --display:"IM Fell English","Iowan Old Style",Georgia,"Times New Roman",serif;
  --body:"Nunito","Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-weight:600;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit}
header{padding:22px 16px 10px;max-width:1100px;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;margin:0;color:var(--night)}
.sub{margin:6px 0 0;color:var(--muted);font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:0 12px 40px}
section{margin-top:18px}
h2{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 4px 10px;color:var(--night);
  border-bottom:1px solid var(--line);padding-bottom:6px}
h2 .nr{font-family:var(--body);font-weight:800;font-size:.8rem;color:#fff;background:var(--teal);border-radius:999px;min-width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;
  text-align:left;cursor:pointer;overflow:hidden}
.card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#dde2ec;border-bottom:1px solid var(--line)}
.cap{padding:6px 7px 8px}
.pg{font-size:.68rem;font-weight:800;color:var(--brass)}
.ct{font-size:.78rem;font-weight:800;line-height:1.2;margin-top:1px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.cd{hyphens:auto;-webkit-hyphens:auto}
.cd{font-size:.7rem;color:var(--muted);line-height:1.25;margin-top:2px}
.flag{position:absolute;top:6px;right:6px;background:var(--bad);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 6px}
@media (min-width:700px){
  header{padding:34px 24px 12px}
  h1{font-size:2.6rem}.sub{font-size:1.05rem}
  main{padding:0 24px 60px}
  h2{font-size:1.7rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .cap{padding:9px 11px 12px}.pg{font-size:.8rem}.ct{font-size:1rem}.cd{font-size:.88rem}
  .flag{font-size:.75rem}
}
/* Seitenansicht */
#v{position:fixed;inset:0;z-index:10;background:#2a3150;display:none;flex-direction:column}
#v.open{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--night);color:#efe8d8}
.bar .ttl{flex:1;min-width:0;line-height:1.15}
.bar .ttl b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{font-size:.75rem;color:#b9c0d8}
.ib{flex:none;min-width:44px;height:44px;border-radius:10px;border:1px solid #4a5478;background:#2d3656;color:#fff;font-size:1.3rem;font-weight:800;cursor:pointer}
.ib:disabled{opacity:.4}
#sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:8px}
#stage{position:relative;margin:0 auto}
#stage img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.mark{position:absolute;border:3px solid var(--bad);border-radius:6px;pointer-events:none}
#note{display:none;margin:0 10px 6px;background:var(--badbg);color:#6b1d17;border-left:5px solid var(--bad);border-radius:8px;padding:8px 10px;font-size:.85rem;line-height:1.3}
#note.show{display:block}
.nav{display:flex;align-items:center;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--night)}
.nav .nb{flex:1;height:48px;border-radius:10px;border:0;background:var(--teal);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.nav .cnt{color:#b9c0d8;font-size:.85rem;min-width:52px;text-align:center}
@media (min-width:700px){.bar .ttl b{font-size:1.15rem}.bar .ttl span{font-size:.9rem}#note{font-size:1rem}}
</style>
</head>
<body>
<header>
  <h1>Lernzettel Englisch: Simple Past</h1>
  <p class="sub">2 Blätter zu Unit 5/6: Merkblatt und Schreibaufgabe. Antippen zum Vergrößern.</p>
</header>
<main id="list"></main>

<div id="v" role="dialog" aria-modal="true" aria-label="Seitenansicht">
  <div class="bar">
    <div class="ttl"><b id="vt"></b><span id="vd"></span></div>
    <button class="ib" id="zo" aria-label="Verkleinern">−</button>
    <button class="ib" id="zi" aria-label="Vergrößern">+</button>
    <button class="ib" id="cl" aria-label="Schließen">✕</button>
  </div>
  <div id="sc"><div id="stage"><img id="vi" alt=""></div></div>
  <div id="note">⚠️ <b>Richtig: Resublimieren</b> (gasförmig → fest). Sublimieren ist fest → gasförmig.</div>
  <div class="nav">
    <button class="nb" id="pv">‹ Zurück</button>
    <span class="cnt" id="ct"></span>
    <button class="nb" id="nx">Weiter ›</button>
  </div>
</div>

const MARKS = {};
const flat = [];
const list = document.getElementById("list");
META.forEach((g,gi)=>{
  const s=document.createElement("section");
  s.innerHTML=`<h2><span class="nr">${gi+1}</span>${g.i} ${g.t}</h2><div class="grid"></div>`;
  const grid=s.querySelector(".grid");
  g.items.forEach(it=>{
    const idx=flat.push(it)-1;
    const b=document.createElement("button");
    b.className="card";
    b.innerHTML=`<img alt="" loading="lazy" src="${it.th}"><div class="cap"><div class="pg">Seite ${it.n}</div><div class="ct">${it.t}</div><div class="cd">${it.d}</div></div>`+(it.note?`<span class="flag">Hinweis</span>`:"");
    b.onclick=()=>openAt(idx);
    grid.appendChild(b);
  });
  list.appendChild(s);
});

const v=document.getElementById("v"), vi=document.getElementById("vi"), stage=document.getElementById("stage"), sc=document.getElementById("sc");
const note=document.getElementById("note");
let cur=0, lvl=0, L=[];
const isTablet=()=>window.innerWidth>=700;

function levels(){
  const cw=sc.clientWidth-16, ch=sc.clientHeight-16;
  const r=(vi.naturalHeight||1600)/(vi.naturalWidth||900);
  const out=[];
  const fitAll=Math.min(cw, ch/r);
  if(isTablet() && fitAll<cw-4) out.push(fitAll);
  out.push(cw, cw*1.5, cw*2, cw*3);
  return out;
}
function apply(keep){
  const ox=sc.scrollLeft+sc.clientWidth/2, oy=sc.scrollTop+sc.clientHeight/2;
  const oldW=stage.offsetWidth||1;
  L=levels(); lvl=Math.max(0,Math.min(L.length-1,lvl));
  stage.style.width=Math.round(L[lvl])+"px";
  document.getElementById("zo").disabled=lvl===0;
  document.getElementById("zi").disabled=lvl===L.length-1;
  if(keep){const f=stage.offsetWidth/oldW; sc.scrollLeft=ox*f-sc.clientWidth/2; sc.scrollTop=oy*f-sc.clientHeight/2;}
}
function openAt(i){
  cur=(i+flat.length)%flat.length;
  const it=flat[cur];
  document.getElementById("vt").textContent=it.t;
  document.getElementById("vd").textContent="Seite "+it.n+": "+it.d;
  document.getElementById("ct").textContent=(cur+1)+" / "+flat.length;
  stage.querySelectorAll(".mark").forEach(m=>m.remove());
  (MARKS[it.k]||[]).forEach(([x,y,w,h])=>{const m=document.createElement("div");m.className="mark";
    m.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;stage.appendChild(m);});
  if(it.note)note.innerHTML=it.note;
  note.classList.toggle("show",!!it.note);
  if(!v.classList.contains("open")){v.classList.add("open");document.body.style.overflow="hidden";}
  lvl=0;
  vi.onload=()=>{apply(false);sc.scrollTo(0,0);};
  vi.src=BIG[it.k];
  if(vi.complete&&vi.naturalWidth){apply(false);sc.scrollTo(0,0);}
}
function closeV(){v.classList.remove("open");document.body.style.overflow="";vi.removeAttribute("src");}
document.getElementById("cl").onclick=closeV;
document.getElementById("pv").onclick=()=>openAt(cur-1);
document.getElementById("nx").onclick=()=>openAt(cur+1);
document.getElementById("zi").onclick=()=>{lvl++;apply(true);};
document.getElementById("zo").onclick=()=>{lvl--;apply(true);};
vi.addEventListener("dblclick",()=>{lvl=lvl>0?0:Math.min(2,L.length-1);apply(true);});
let rt;
const re=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(v.classList.contains("open"))apply(true);},150);};
window.addEventListener("resize",re);
window.addEventListener("orientationchange",re);
document.addEventListener("keydown",e=>{
  if(!v.classList.contains("open"))return;
  if(e.key==="Escape")closeV();
  else if(e.key==="ArrowLeft")openAt(cur-1);
  else if(e.key==="ArrowRight")openAt(cur+1);
});
</script>
