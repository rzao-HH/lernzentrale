<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fach-Start 1: Weg mit Schritten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
button{font-family:Nunito,sans-serif;cursor:pointer;color:#2b2140}
.h{font-family:'Baloo 2',sans-serif;font-weight:800;margin:0;line-height:1.05}
.stk{background:#fff;border:3px solid #2b2140;border-radius:22px;box-shadow:0 5px 0 #2b2140;box-sizing:border-box}
.back{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 16px 0 10px;border:3px solid #2b2140;border-radius:14px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 0 #2b2140}
.pk{width:100%;display:flex;align-items:center;gap:14px;min-height:72px;padding:0 18px;border:0;background:transparent;text-align:left;font-size:19px;font-weight:800}
.num{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid #2b2140;display:flex;align-items:center;justify-content:center;font:800 20px 'Baloo 2',sans-serif}
.num.sitzt{background:#ffd34d}.num.uebt{background:#3557e8;color:#fff}.num.neu{background:#fff4e2;border-style:dashed;border-color:#b9a383;color:#8d7a5f}
.chip{padding:5px 12px;border-radius:999px;border:2px solid #2b2140;font-size:13px;font-weight:800;white-space:nowrap}
.step{display:flex;gap:14px;padding:12px 16px;border-radius:16px;align-items:flex-start}
.step.now{background:#ffe9a6;border:3px solid #2b2140}
.step.done{opacity:.75}
.step.later{opacity:.55}
.sn{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid #2b2140;display:flex;align-items:center;justify-content:center;font:800 16px 'Baloo 2',sans-serif;background:#fff}
.step.done .sn{background:#ffd34d}.step.now .sn{background:#3557e8;color:#fff}
.mod{min-height:44px;padding:0 14px;border:2px solid #2b2140;border-radius:12px;background:#fff;font-size:15px;font-weight:800}
.step.now .mod.first{background:#ff6b4a;box-shadow:0 3px 0 #2b2140}
.tabs{position:absolute;left:16px;right:16px;bottom:14px;height:78px;background:#fff;border:3px solid #2b2140;border-radius:26px;box-shadow:0 5px 0 #2b2140;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;color:#7d6a52}
.tab.on{color:#2b2140;background:#ffd34d}
</style>
</helmet>
<div style="width: 768px; height: 1024px; position: relative; overflow: hidden; background: #fff4e2; color: #2b2140; font-family: Nunito, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 106px; padding: 28px 36px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Welten</button>
      <span style="padding: 8px 16px; border: 3px solid #2b2140; border-radius: 999px; background: #ffd34d; font-weight: 800; font-size: 15px">Rang Komet · 280 Punkte</span>
    </div>
    <h1 class="h" style="font-size: 42px">Winkel-Akademie</h1>

    <div style="display: flex; align-items: flex-end; gap: 10px">
      <svg width="92" height="76" viewBox="-6 -20 104 86" aria-hidden="true"><g stroke="#FF7A5C" stroke-width="3" stroke-linecap="round" fill="none"><path d="M20 46 L8 54 M24 50 L14 60 M60 46 L72 54 M56 50 L66 60"></path><path d="M22 36 Q8 34 8 22 M58 36 Q72 30 74 14"></path></g><circle cx="8" cy="17" r="9" fill="#FF7A5C"></circle><circle cx="74" cy="9" r="9" fill="#FF7A5C"></circle><ellipse cx="40" cy="42" rx="24" ry="16" fill="#FF7A5C"></ellipse><path d="M32 28 L32 20 M48 28 L48 20" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round"></path><circle cx="32" cy="16" r="6" fill="#fff"></circle><circle cx="48" cy="16" r="6" fill="#fff"></circle><circle cx="33" cy="16" r="2.6" fill="#0A1B27"></circle><circle cx="49" cy="16" r="2.6" fill="#0A1B27"></circle><path d="M33 46 Q40 53 47 46" stroke="#7A2A1A" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg>
      <div class="stk" style="flex-grow: 1; padding: 14px 18px; border-radius: 22px 22px 22px 6px; font-size: 17px; font-weight: 700; line-height: 1.4">Jedes Paket geht in vier Schritten. Bei <b>Paket 2</b> hast du Schritt 1 geschafft. Jetzt kommt <b>Schritt 2: Üben</b>.</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px"><span class="sn" style="width: 28px; height: 28px; font-size: 14px">1</span>Verstehen</span>
      <span style="flex-grow: 1; margin: 0 8px; border-top: 3px dotted #b9a383"></span>
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px"><span class="sn" style="width: 28px; height: 28px; font-size: 14px">2</span>Üben</span>
      <span style="flex-grow: 1; margin: 0 8px; border-top: 3px dotted #b9a383"></span>
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px"><span class="sn" style="width: 28px; height: 28px; font-size: 14px">3</span>Erleben</span>
      <span style="flex-grow: 1; margin: 0 8px; border-top: 3px dotted #b9a383"></span>
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px"><span class="sn" style="width: 28px; height: 28px; font-size: 14px">4</span>Prüfen</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{pakete}}" as="p" hint-placeholder-count="5">
        <div class="stk" style="padding: 0; background: {{p.bg}}">
          <button type="button" class="pk" onClick="{{p.toggle}}" aria-expanded="{{p.open}}">
            <span class="num {{p.st}}">{{p.n}}</span>
            <span style="flex-grow: 1">{{p.name}}</span>
            <span class="chip" style="background: {{p.chipBg}}">{{p.chip}}</span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{p.rot}}"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 14px 16px">
              <sc-for list="{{p.steps}}" as="s" hint-placeholder-count="4">
                <div class="step {{s.cls}}">
                  <span class="sn">{{s.mark}}</span>
                  <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
                    <div style="display: flex; justify-content: space-between; gap: 10px"><strong style="font-size: 17px; font-weight: 800">{{s.title}}</strong><span style="font-size: 14px; font-weight: 800; color: #7d4a12">{{s.tag}}</span></div>
                    <span style="font-size: 15px; font-weight: 700; color: #5b4a36">{{s.why}}</span>
                    <sc-if value="{{s.showMods}}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; gap: 8px; flex-wrap: wrap">
                        <sc-for list="{{s.mods}}" as="m" hint-placeholder-count="3"><button type="button" class="mod {{m.first}}">{{m.t}}</button></sc-for>
                      </div>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <div class="stk" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #ffd9cf">
        <span class="num" style="background: #ff6b4a"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"></path></svg></span>
        <div style="display: flex; flex-direction: column; flex-grow: 1"><strong style="font-size: 18px; font-weight: 800">Abschlusstest</strong><span style="font-size: 14px; font-weight: 700; color: #5b4a36">Am Ende: alle Pakete, wie in der Arbeit, mit Note</span></div>
      </div>
    </div>
  </div>
  <nav class="tabs" aria-label="Hauptmenü">
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Heute</button>
    <button type="button" class="tab on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>Welten</button>
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><circle cx="17" cy="9" r="2.8"></circle><path d="M16.5 14.6c2.6.1 4.4 1.8 5 4.9"></path></svg>Gemeinsam</button>
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.2 4.1-6.5 8-6.5s7 2.3 8 6.5"></path></svg>Ich</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { open: 1 }; }
  renderVals() {
    const P = [['Spitz und recht','sitzt'],['Stumpf und gestreckt','uebt'],['Überstumpf','neu'],['Null, voll und Grenzfälle','neu'],['Kompass und Kurs','neu'],['Winkel benennen','neu']];
    const S = [
      { title: 'Verstehen', why: 'Erst lesen, worum es geht.', mods: ['Wissen lesen', 'Lernzettel'] },
      { title: 'Üben', why: 'So lange üben, bis es klappt.', mods: ['Winkelart erkennen', 'Messen', 'Schätzen'] },
      { title: 'Erleben', why: 'Ausprobieren und anwenden.', mods: ['Winkel zeichnen', 'Zeitrunde'] },
      { title: 'Prüfen', why: 'Zeigen, was du kannst.', mods: ['Kurztest', 'Duell'] }
    ];
    const cur = { sitzt: 4, uebt: 1, neu: 0 };
    const pakete = P.map(([name, st], i) => {
      const open = this.state.open === i, c = cur[st];
      const steps = S.map((s, j) => {
        const cls = j < c ? 'done' : (j === c ? 'now' : 'later');
        return { title: (j + 1) + ' · ' + s.title, why: s.why, cls, mark: j < c ? '✓' : String(j + 1), tag: cls === 'now' ? 'jetzt dran' : (cls === 'done' ? 'geschafft' : 'danach'), showMods: cls !== 'later', mods: s.mods.map((t, k) => ({ t, first: k === 0 && cls === 'now' ? 'first' : '' })) };
      });
      return { n: i + 1, name, st, open, rot: open ? 'rotate(180deg)' : 'none', bg: open ? '#ffffff' : '#fffaf0',
        chip: st === 'sitzt' ? 'sicher' : (st === 'uebt' ? 'noch üben' : 'neu'), chipBg: st === 'sitzt' ? '#ffd34d' : (st === 'uebt' ? '#c9d4ff' : '#fff'),
        steps, toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) };
    });
    return { pakete };
  }
}
</script>
</body>
</html>
