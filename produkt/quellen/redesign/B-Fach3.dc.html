<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fach-Start 3: Was willst du heute?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
button{font-family:Nunito,sans-serif;cursor:pointer;color:#2b2140}
.h{font-family:'Baloo 2',sans-serif;font-weight:800;margin:0;line-height:1.05}
.stk{background:#fff;border:3px solid #2b2140;border-radius:22px;box-shadow:0 5px 0 #2b2140;box-sizing:border-box}
.back{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 16px 0 10px;border:3px solid #2b2140;border-radius:14px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 0 #2b2140}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:168px;padding:20px;border:3px solid #2b2140;border-radius:24px;box-shadow:0 6px 0 #2b2140;text-align:left;box-sizing:border-box}
.door.sel{transform:translateY(4px);box-shadow:0 2px 0 #2b2140;outline:4px solid #2b2140;outline-offset:3px}
.ic{width:52px;height:52px;border-radius:16px;border:3px solid #2b2140;background:#fff;display:flex;align-items:center;justify-content:center}
.item{display:flex;align-items:center;gap:14px;min-height:66px;padding:0 18px;border:3px solid #2b2140;border-radius:18px;background:#fff;box-shadow:0 4px 0 #2b2140;font-size:17px;font-weight:800;text-align:left;width:100%;box-sizing:border-box}
.item small{display:block;font-size:14px;font-weight:700;color:#7d6a52}
.tabs{position:absolute;left:16px;right:16px;bottom:14px;height:78px;background:#fff;border:3px solid #2b2140;border-radius:26px;box-shadow:0 5px 0 #2b2140;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;color:#7d6a52}
.tab.on{color:#2b2140;background:#ffd34d}
</style>
</helmet>
<div style="width: 768px; height: 1024px; position: relative; overflow: hidden; background: #fff4e2; color: #2b2140; font-family: Nunito, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 106px; padding: 28px 36px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow-y: auto">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Welten</button>
      <span style="padding: 8px 16px; border: 3px solid #2b2140; border-radius: 999px; background: #ffd34d; font-weight: 800; font-size: 15px">Rang Komet · 280 Punkte</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <svg width="96" height="80" viewBox="-6 -20 104 86" aria-hidden="true"><g stroke="#FF7A5C" stroke-width="3" stroke-linecap="round" fill="none"><path d="M20 46 L8 54 M24 50 L14 60 M60 46 L72 54 M56 50 L66 60"></path><path d="M22 36 Q8 34 8 22 M58 36 Q72 30 74 14"></path></g><circle cx="8" cy="17" r="9" fill="#FF7A5C"></circle><circle cx="74" cy="9" r="9" fill="#FF7A5C"></circle><ellipse cx="40" cy="42" rx="24" ry="16" fill="#FF7A5C"></ellipse><path d="M32 28 L32 20 M48 28 L48 20" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round"></path><circle cx="32" cy="16" r="6" fill="#fff"></circle><circle cx="48" cy="16" r="6" fill="#fff"></circle><circle cx="33" cy="16" r="2.6" fill="#0A1B27"></circle><circle cx="49" cy="16" r="2.6" fill="#0A1B27"></circle><path d="M33 46 Q40 53 47 46" stroke="#7A2A1A" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg>
      <div class="stk" style="flex-grow: 1; padding: 14px 18px; border-radius: 22px 22px 22px 6px">
        <h1 class="h" style="font-size: 32px">Winkel-Akademie</h1>
        <p style="margin: 4px 0 0; font-size: 18px; font-weight: 800">Was willst du heute machen?</p>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{doors}}" as="d" hint-placeholder-count="4">
        <button type="button" class="door {{d.sel}}" style="background: {{d.color}}" onClick="{{d.pick}}" aria-pressed="{{d.on}}">
          <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2b2140" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
          <strong class="h" style="font-size: 26px">{{d.title}}</strong>
          <span style="font-size: 15px; font-weight: 700">{{d.why}}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #a24a14">{{pickTitle}}</span>
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <button type="button" class="item" style="background: {{it.bg}}">
            <span style="flex-grow: 1">{{it.t}}<small>{{it.s}}</small></span>
            <span style="font-size: 14px; font-weight: 800">{{it.tag}}</span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noPick}}" hint-placeholder-val="{{ false }}">
      <div class="stk" style="padding: 16px 18px; box-shadow: none; border-style: dashed; background: transparent; font-size: 16px; font-weight: 700; color: #5b4a36">Tipp: Wer nicht weiß, was dran ist, tippt auf „Üben, was wackelt“. Da sucht Krabbi die Aufgaben aus.</div>
    </sc-if>
  </div>
  <nav class="tabs" aria-label="Hauptmenü">
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Heute</button>
    <button type="button" class="tab on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>Welten</button>
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><circle cx="17" cy="9" r="2.8"></circle><path d="M16.5 14.6c2.6.1 4.4 1.8 5 4.9"></path></svg>Gemeinsam</button>
    <button type="button" class="tab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4.2 4.1-6.5 8-6.5s7 2.3 8 6.5"></path></svg>Ich</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { door: 1 }; }
  renderVals() {
    const D = [
      { title: 'Neues lernen', why: 'Das nächste Paket anfangen und verstehen', color: '#c9d4ff', icon: 'M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-7a3 3 0 0 0-3 3',
        list: [{ t: 'Paket 3 · Überstumpf', s: 'Wissen lesen, 5 Minuten', tag: 'als Nächstes' }, { t: 'Paket 4 · Grenzfälle', s: 'Wissen lesen', tag: '' }, { t: 'Lernzettel: alle Winkelarten', s: 'zum Ausdrucken', tag: '' }] },
      { title: 'Üben, was wackelt', why: 'Krabbi sucht die Aufgaben mit Fehlern aus', color: '#ffd34d', icon: 'M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z',
        list: [{ t: 'Stumpfe Winkel erkennen', s: 'Paket 2 · 4 Fehler beim letzten Mal', tag: 'empfohlen' }, { t: 'Messen mit dem Geodreieck', s: 'Paket 2', tag: '' }, { t: 'Spitz und recht wiederholen', s: 'Paket 1 · vor 9 Tagen', tag: '' }] },
      { title: 'Spielen und ausprobieren', why: 'Zeichnen, Schätzen, gegen die Zeit', color: '#c9f2d9', icon: 'M6 12h4M8 10v4M15 11h.01M18 13h.01M7 6h10a5 5 0 0 1 5 5v1a4 4 0 0 1-7 2.6H9A4 4 0 0 1 2 12v-1a5 5 0 0 1 5-5z',
        list: [{ t: 'Winkel zeichnen', s: 'mit dem Finger', tag: '' }, { t: 'Schätzen', s: 'Augenmaß', tag: '' }, { t: 'Zeitrunde', s: '60 Sekunden, Rekord: 14', tag: '' }] },
      { title: 'Testen, ob es sitzt', why: 'Kurztest, Abschlusstest oder Duell', color: '#ffd9cf', icon: 'M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 21h8',
        list: [{ t: 'Kurztest Paket 2', s: 'mit Note', tag: '' }, { t: 'Abschlusstest', s: 'alle Pakete, wie in der Arbeit', tag: 'in 5 Tagen' }, { t: 'Duell', s: 'gegen Familie oder Klasse', tag: '' }] }
    ];
    const k = this.state.door;
    const doors = D.map((d, i) => ({ ...d, on: k === i, sel: k === i ? 'sel' : '', pick: () => this.setState({ door: this.state.door === i ? -1 : i }) }));
    const cur = D[k];
    return { doors, hasPick: k >= 0, noPick: k < 0, pickTitle: cur ? cur.title : '',
      items: cur ? cur.list.map((x, j) => ({ ...x, bg: j === 0 ? '#fffbe9' : '#ffffff' })) : [] };
  }
}
</script>
</body>
</html>
