o.pick}}" aria-pressed="{{o.on}}"><b>{{o.v}}</b>{{o.t}}</button></sc-for></div></div><div class="card" style="padding:12px 16px"><b style="font-size:18px">2 · Wie steht das Paket?</b><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px"><sc-for list="{{sts}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><b>{{o.v}}</b>{{o.t}}</button></sc-for></div></div><div class="card" style="padding:12px 16px"><b style="font-size:18px">3 · Was stimmt noch?</b><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px"><sc-for list="{{tgs}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="box"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></span>{{o.t}}</button></sc-for></div></div><div class="card" style="padding:14px 18px;background:#FFFFFF;display:flex;gap:18px;align-items:stretch"><div style="flex:1"><span class="cap muted">So rechne ich</span><sc-for list="{{steps}}" as="l" hint-placeholder-count="3"><div class="line"><span style="flex:1">{{l.t}}</span><b class="h" style="font-size:20px;font-weight:700">{{l.v}}</b></div></sc-for></div><div style="width:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;border:3px solid #1D1B3A;border-radius:20px;background:{{resBg}};text-align:center"><span style="font-size:15px;font-weight:700">eine richtige Antwort</span><span class="h" style="font-size:64px;line-height:1">{{pts}}</span><span style="font-size:16px;font-weight:700">{{ptsWord}}</span><span class="muted" style="font-size:14px">10 richtige: {{pts10}}</span></div></div><div style="display:flex;align-items:flex-end;gap:10px"><svg width="56" height="67" viewBox="0 -24 120 144" aria-hidden="true" style="flex:none;overflow:visible"><path d="M54 50L44 2M66 50l10-48" stroke="#1D1B3A" stroke-width="3" stroke-linecap="round" fill="none"></path><path d="M44 -12l2.6 5.3 5.8.8-4.2 4.1 1 5.8L44 1.2l-5.2 2.8 1-5.8-4.2-4.1 5.8-.8Z" fill="#FFC83D" stroke="#1D1B3A" stroke-width="2" stroke-linejoin="round"></path><path d="M76 -12l2.6 5.3 5.8.8-4.2 4.1 1 5.8L76 1.2l-5.2 2.8 1-5.8-4.2-4.1 5.8-.8Z" fill="#FFC83D" stroke="#1D1B3A" stroke-width="2" stroke-linejoin="round"></path><path d="M30 88l-11 8M27 79l-13 4M90 88l11 8M93 79l13 4" stroke="#C75A12" stroke-width="5" stroke-linecap="round" fill="none"></path><path d="M33 68C22 63 17 56 17 46M87 68c11-5 16-12 16-22" stroke="#F47B20" stroke-width="7" stroke-linecap="round" fill="none"></path><circle cx="17" cy="38" r="12" fill="#F47B20" stroke="#1D1B3A" stroke-width="2.5"></circle><path d="M17 40L9 25h14Z" fill="#C75A12"></path><circle cx="103" cy="38" r="12" fill="#F47B20" stroke="#1D1B3A" stroke-width="2.5"></circle><path d="M103 40l8-15H97Z" fill="#C75A12"></path><path d="M50 54L46 32M70 54l4-22" stroke="#F47B20" stroke-width="6" stroke-linecap="round" fill="none"></path><ellipse cx="60" cy="74" rx="34" ry="26" fill="#F47B20" stroke="#1D1B3A" stroke-width="3"></ellipse><ellipse cx="60" cy="83" rx="21" ry="11" fill="#FFA24D"></ellipse><circle cx="46" cy="27" r="10" fill="#FFFFFF" stroke="#1D1B3A" stroke-width="2.5"></circle><circle cx="74" cy="27" r="10" fill="#FFFFFF" stroke="#1D1B3A" stroke-width="2.5"></circle><circle cx="48" cy="28" r="4.5" fill="#1D1B3A"></circle><circle cx="76" cy="28" r="4.5" fill="#1D1B3A"></circle><path d="M52 73q8 7 16 0" stroke="#1D1B3A" stroke-width="3" stroke-linecap="round" fill="none"></path><circle cx="41" cy="72" r="4" fill="#FF8F6B"></circle><circle cx="79" cy="72" r="4" fill="#FF8F6B"></circle></svg><div class="bubble" style="flex:1">{{say}}</di <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { art: 'selbst', st: 'ueben', kann: false, mix: true, deckel: false, zweit: false, fast: false }; }
  renderVals() {
    const s = this.state, d = (x) => String(x).replace('.', ',');
    const A = [['tippen', 'Antippen', 4], ['ordnen', 'Ordnen', 6], ['selbst', 'Selbst machen', 10], ['lesen', 'Lesen', 0]];
    const S = [['neu', 'neu', 1], ['ueben', 'noch üben', 1], ['dran', 'wieder dran', 1], ['lange', 'lange nicht geübt', 1.2], ['sicher', 'sicher, nicht dran', 0.15]];
    const set = (k, v) => () => this.setState({ [k]: v });
    const arts = A.map((a) => ({ t: a[1], v: a[2], on: s.art === a[0], cls: 'sb' + (s.art === a[0] ? ' on' : ''), pick: set('art', a[0]) }));
    const sts = S.map((a) => ({ t: a[1], v: a[2] === 1 ? '×1' : '×' + d(a[2]), on: s.st === a[0], cls: 'sb' + (s.st === a[0] ? ' on' : ''), pick: set('st', a[0]) }));
    const T = [['kann', 'Ich kann es schon selbst (Können-Haken)'], ['mix', 'Gemischt mit anderen Paketen'], ['deckel', 'Schon die 3. Runde mit dem Paket heute'], ['zweit', 'Erst im zweiten Versuch richtig'], ['fast', 'Sehr schnell getippt, ohne zu lesen']];
    const tgs = T.map((t) => ({ t: t[1], on: !!s[t[0]], cls: 'tg' + (s[t[0]] ? ' on' : ''), pick: () => this.setState({ [t[0]]: !s[t[0]] }) }));
    const a = A.find((x) => x[0] === s.art), st = S.find((x) => x[0] === s.st);
    const steps = []; let pts = 0, say = '', zero = false;
    if (s.art === 'lesen') { zero = true; steps.push({ t: 'Lesen und Lernkarten umdrehen', v: '0' }); say = 'Lesen bringt keine Punkte. Es macht die Aufgaben danach leichter, und der kurze Check danach zählt.'; }
    else if (s.fast && s.art !== 'selbst') { zero = true; steps.push({ t: a[1] + ': ' + a[2], v: a[2] }); steps.push({ t: 'Zu schnell, also geraten', v: '= 0' }); say = 'Raten bringt nichts. Lies die Frage in Ruhe, dann zählt deine Antwort, auch für die Haken.'; }
    else if (s.zweit && s.art !== 'selbst') { zero = true; steps.push({ t: a[1] + ': ' + a[2], v: a[2] }); steps.push({ t: 'Zweiter Versuch beim Antippen', v: '= 0' }); say = 'Beim Antippen bleibt im zweiten Versuch ja fast nur noch Raten übrig. Darum gibt es dafür nichts.'; }
    else {
      let f = 1; steps.push({ t: a[1], v: a[2] });
      if (st[2] !== 1) { f *= st[2]; steps.push({ t: st[0] === 'lange' ? 'lange nicht geübt: Bonus' : 'kannst du schon, nicht wieder dran', v: '× ' + d(st[2]) }); }
      else steps.push({ t: st[1] + ': volle Punkte', v: '× 1' });
      if (s.kann && s.art === 'tippen') { f *= 0.5; steps.push({ t: 'Antippen ist für dich leicht', v: '× 0,5' }); }
      if (s.mix) { f *= 1.2; steps.push({ t: 'gemischt wie in der Arbeit', v: '× 1,2' }); }
      if (s.deckel) { f *= 0.15; steps.push({ t: 'heute schon viel geübt', v: '× 0,15' }); }
      if (f > 1.5) { f = 1.5; steps.push({ t: 'höchstens', v: '× 1,5' }); }
      pts = Math.max(1, Math.round(a[2] * f));
      if (s.zweit) { pts = Math.max(1, Math.round(pts / 2)); steps.push({ t: 'zweiter Versuch: die Hälfte', v: '÷ 2' }); }
      steps.push({ t: 'gerundet, mindestens 1', v: '= ' + pts });
      if (s.fast) say = 'Beim Selbstmachen kann man nicht raten. Schnell sein ist hier in Ordnung.';
      else if (pts >= 10) say = 'Super Wahl! Selbst machen und mischen, so lernst du am meisten.';
      else if (s.deckel) say = 'Heute hast du das schon oft geübt. Morgen gibt es wieder volle Punkte. Probier doch ein anderes Paket!';
      else if (st[0] === 'sicher') say = 'Das kannst du schon. Volle Punkte gibt es wieder, wenn das Paket wieder dran ist.';
      else if (pts <= 3) say = 'Das ist für dich leicht, darum gibt es wenig. Probier es mal selbst, dann gibt es mehr.';
      else say = 'Gut! Noch mehr gibt es, wenn du es selbst machst oder mit anderen Paketen mischst.';
    }
    return { arts, sts, tgs, steps, pts, pts10: (pts * 10) + ' Punkte', ptsWord: pts === 1 ? 'Punkt' : 'Punkte', say, resBg: zero ? '#FFE9D6' : pts >= 10 ? '#DDF5E7' : '#FFF1C7' };
  }
}

</script>
