<!DOCTYPE html>

<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12152a;--card:#1c2140;--line:#323a66;--text:#eef0fb;--muted:#a3aad0;--soft:#252b52;
  --W:#8b98ff;--Z:#3ec4bb;--E:#ff8a6a;--D:#e2a15b;--ok:#5fd18a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12152a;--card:#1c2140;--line:#323a66;--text:#eef0fb;--muted:#a3aad0;--soft:#252b52;
  --W:#8b98ff;--Z:#3ec4bb;--E:#ff8a6a;--D:#e2a15b;--ok:#5fd18a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.tb{margin-top:6px}.tbar{height:6px}

 body.compact .app .meta,body.compact .app .goal,body.compact .app .bar,body.compact .app details.past,body.compact .app details.rest,body.compact .app .tb,body.compact .app .top small,body.compact .app .lnk[data-plan],body.compact footer,body.compact .sum{display:none}
 body.compact .app .top{padding:10px 14px}body.compact .app .ico{width:38px;height:38px;font-size:20px}body.compact .app .body{padding:10px 14px}body.compact .todo{margin-top:4px}}

</style>

<script>
/* ===== Familien-Sync (Supabase) ===== */
(function(){
  const SB_URL='https://vhmxzlztbpjwfytnyhbv.supabase.co',SB_KEY='sb_publishable_x23BTTRX3UJBmXf0gGhyvQ_osygIIcE';

  try{const m=location.hash.match(/^#fam=([^&]+)/);if(m){const c=decodeURIComponent(m[1]).trim();if(c.length>=12){oSet.call(localStorage,'lz-fam',c);oRem.call(localStorage,'lz-synced');}history.replaceState(null,'',location.pathname+location.search);}}catch(e){}

  function mergeNU(A,B){

    const out={list,cur,n};if(del.length)out.del=del;return out;}
  function mergeErg(A,B){
    const seen=new Set(),out=[];
    [...(Array.isArray(B)?B:[]),...(Array.isArray(A)?A:[])].forEach(r=>{if(!r)return;const key=JSON.stringify([r.a,r.u,r.ts,r.g,r.k,r.units]);if(!seen.has(key)){seen.add(key);out.push(r);}});
    out.sort((x,y)=>(x.ts||0)-(y.ts||0));return out.length>600?out.slice(-600):out;}
  const P0=o=>{try{return JSON.parse(o);}catch(e){return null;}};
  async function pull(){

  const d=new Date(ts), now=new Date(), mins=Math.round((now-d)/60000);
  const t=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(dstr(d)===dstr(now))return mins<2?"gerade eben":"heute, "+t+" Uhr";
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(dstr(d)===dstr(y))return"gestern, "+t+" Uhr";
  const days=Math.round((new Date(dstr(now).replace(/-/g,"/"))-new Date(dstr(d).replace(/-/g,"/")))/86400000);
  return"vor "+days+" Tagen";
}
function names(us){return us.map(u=>esc(u.icon+" "+u.name)).join(", ");}
function mkTests(C,U,days){

      grp(d.learn,3,"Neu",T);
      grp(d.rep.filter(u=>seen[u.id]===2),2,"Wiederholung",T);

ght:800}\n.geonum2{fill:var(--accent2);font-family:var(--body);font-weight:800}\n.geozero{fill:var(--bad)}\n.geohandle{fill:var(--arc);stroke:var(--bg);stroke-width:2}\n.geoctl{display:flex;flex-wrap:wrap;gap:8px}\n.geoctl .btn-s{min-height:46px}\n/* Result */\n.result{min-height:100%;display:grid;place-items:center;padding:24px}\n.rcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px}\n.rtitle{font-family:var(--display);font-size:20px;color:var(--muted)}\n.rbig{font-family:var(--display);font-size:72px;font-weight:700;line-height:1}\n.rstars{font-size:52px;color:var(--arc);letter-spacing:6px}\n.rcard p{margin:0;font-size:18px;font-weight:700}\n.note{font-family:var(--display);font-size:64px;font-weight:700;line-height:1.1}\n.n1,.n2{color:var(--ok)} .n3,.n4{color:var(--half)} .n5,.n6{color:var(--bad)}\n.review{list-style:none;padding:0;margin:10px 0;text-align:left;display:grid;gap:6px}\n.review li{background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;gap:10px}\n.review li span{font-weight:900;width:18px}\n.review li.ok span{color:var(--ok)} .review li.half span{color:var(--half)} .review li.bad span{color:var(--bad)}\n.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}\n\n/* Learn */\n.learn{max-width:1000px;margin:0 auto;padding:20px 22px 60px}\n.learn .back{margin-bottom:10px}\n.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}\n.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}\n.tcard b{font-family:var(--display);font-size:18px;display:block}\n.tcard span{color:var(--muted);font-weight:700;font-size:14px}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;font-size:17px;line-height:1.5;max-width:75ch}\n.box ol{margin:6px 0;padding-left:22px}\n\n\n/* Pakete 5–8 */\n.tlab{font-family:var(--display);font-weight:700;font-size:20px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}\n.tsm{font-family:var(--body);font-weight:800;font-size:15px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}\n.tlab.hot{fill:var(--arc)} .r1t{fill:var(--ray1)} .r2t{fill:var(--ray2)}\n.bigl{font-family:\"Times New Roman\",Georgia,serif;font-style:italic;font-size:150px;fill:var(--arc)}\n.midl{font-family:var(--display);font-weight:700;font-size:64px;fill:var(--arc)}\n.cmp{fill:var(--panel);fill-opacity:.55;stroke:var(--text);stroke-width:2}\n.cmpx{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}\n.cmpt{stroke:var(--text);stroke-width:2}\n.turn{fill:none;stroke:var(--arc);stroke-width:4;stroke-linecap:round}\n.turn.thin{stroke-width:2;stroke-dasharray:6 6}\n.ahead{fill:var(--arc)}\n.hl{fill:none;stroke:var(--bad);stroke-width:12;stroke-opacity:.5;stroke-linecap:round}\n.hl.thin{stroke-width:7}\n.gl{stroke:var(--line);stroke-width:1}\n.axis{stroke:var(--text);stroke-width:2}\n.pt{fill:var(--bad);stroke:var(--bg);stroke-width:2}\n.shape{fill:var(--accent);fill-opacity:.1;stroke:var(--text);stroke-width:3;stroke-linejoin:round}\n.rsq{fill:none;stroke:var(--ok);stroke-width:3.5}\n.arcf2{fill:var(--bad);fill-opacity:.16;stroke:var(--bad);stroke-width:2.5}\n.types.wide{grid-template-columns:1fr}.types.wide .tbtn{font-size:16px;text-align:left;padding:10px 14px;min-height:52px}\n.pgrp{font-family:var(--display);font-size:17px;color:var(--muted);margin:16px 0 8px}\n.cl-list{display:grid;gap:8px}\n.cl-row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.cl-row.done{opacity:.72}\n.cl-t{flex:1 1 240px;min-width:0;line-height:1.35}\n.cl-t small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}\n.cl-chip{border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px;white-space:nowrap}\n.cl-chip.ok{background:var(--okbg);color:var(--ok)}.cl-chip.half{background:var(--halfbg);color:var(--half)}.cl-chip.no{background:var(--panel2);color:var(--muted)}\n.cl-nr{font-family:var(--display);font-weight:700;min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}\n.cl-cb{width:28px;height:28px;accent-color:var(--ok);flex:none;margin:0}\n.cl-sec{font-family:var(--display);font-size:16px;color:var(--muted);margin:18px 0 6px}\n.cl-go{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px 12px;font-weight:800;flex:none}\n.clcard{background:var(--panel);border:2px solid var(--ok);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}\n.clcard>div{flex:1 1 240px}.clcard b{font-family:var(--display);font-size:19px}.clcard small{display:block;color:var(--muted);font-weight:700}\n/* Toast & confetti */\n.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:50;background:var(--panel);border:2px solid var(--arc);border-radius:16px;padding:12px 20px;font-weight:900;font-size:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:tin .3s ease-out}\n@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}\n.conf{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.2s ease-in forwards}\n@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.6}}\n@media (prefers-reduced-motion: reduce){.conf{display:none}.toast{animation:none}}\n@media (max-width:520px){header.top{gap:6px;padding:8px 8px}.brand{font-size:15px;gap:6px}.brand svg{width:26px;height:26px}.rank{gap:6px}.ri{font-size:22px}.rt b{font-size:13px}header.top .icon-btn{width:38px;height:38px;font-size:17px}.lp-btn{padding:0 5px}}\n@media (max-width:640px){.hero{grid-template-columns:1fr}.hero svg{display:none}.rt{min-width:0}.rt small{display:none}}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <button class=\"brand\" id=\"brand\" aria-label=\"Zur Basis\">\n    <svg viewBox=\"0 0 40 40\" aria-hidden=\"true\"><line x1=\"6\" y1=\"32\" x2=\"36\" y2=\"32\" stroke=\"var(--ray1)\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><line x1=\"6\" y1=\"32\" x2=\"28\" y2=\"8\" stroke=\"var(--ray2)\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><path d=\"M6 32 L18 32 A12 12 0 0 0 14.1 23.2 Z\" fill=\"var(--arc)\" fill-opacity=\".35\" stroke=\"var(--arc)\" stroke-width=\"2\"/><\/svg>\n    Winkel-Akademie\n  <\/button>\n  <div class=\"rank\" id=\"rank\"><\/div>\n  <button class=\"icon-btn\" id=\"soundBtn\" aria-label=\"Ton an/aus\"><\/button>\n<\/header>\n<main id=\"app\"><\/main>\n\n<script>\n(function(){\n\"use strict\";\nconst $=s=>document.querySelector(s);\nconst app=$('#app');\nconst NS='http://www.w3.org/2000/svg';\nconst KEY='winkelakademie-v1'+(window.__UK||'')+(window.__UK||'')+(window.__UK||'');\nconst DEF={vgeo:false,xp:0,sel:['p1','p2'],diff:'leicht',sound:true,stats:{},high:{},grades:{},cl:{}};\nlet S=JSON.parse(JSON.stringify(DEF));\ntry{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}\nif(!S.cl)S.cl={};\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}\n\nconst rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\n\nconst TYPES={\n  null:{short:'Nullwinkel',s:'ein Nullwinkel',range:'genau 0°'},\n  spitz:{short:'spitz',s:'ein spitzer Winkel',range:'größer als 0° und kleiner als 90°'},\n  recht:{short:'recht',s:'ein rechter Winkel',range:'genau 90°'},\n  stumpf:{short:'stumpf',s:'ein stumpfer Winkel',range:'größer als 90° und kleiner als 180°'},\n  gestreckt:{short:'gestreckt',s:'ein gestreckter Winkel',range:'genau 180°'},\n  ueber:{short:'überstumpf',s:'ein überstumpfer Winkel',range:'größer als 180° und kleiner als 360°'},\n  voll:{short:'Vollwinkel',s:'ein Vollwinkel',range:'genau 360°'}\n};\nconst TYPE_ORDER=['null','spitz','recht','stumpf','gestreckt','ueber','voll'];\nfunction typeOf(d){if(d===0)return'null';if(d<90)return'spitz';if(d===90)return'recht';if(d<180)return'stumpf';if(d===180)return'gestreckt';if(d<360)return'ueber';return'voll';}\n\nconst PACKS=[\n  {id:'p1',nr:1,icon:'🛰️',name:'Spitz & Recht',goal:'Ich erkenne spitze Winkel (zwischen 0° und 90°) und rechte Winkel (90°) und kann sie mit dem Geodreieck messen.',\n   gen:()=>Math.random()<.3?90:rnd(5,85)},\n  {id:'p2',nr:2,icon:'🚀',name:'Stumpf & Gestreckt',goal:'Ich erkenne stumpfe Winkel (zwischen 90° und 180°) und gestreckte Winkel (180°) und kann sie messen.',\n   gen:()=>Math.random()<.3?180:rnd(95,175)},\n  {id:'p3',nr:3,icon:'🪐',name:'Überstumpf',goal:'Ich erkenne überstumpfe Winkel (zwischen 180° und 360°) und messe sie mit dem Trick „360° minus Innenwinkel“.',\n   gen:()=>rnd(185,355)},\n  {id:'p4',nr:4,icon:'🌌',name:'Null, Voll & Grenzfälle',goal:'Ich kenne Nullwinkel (0°) und Vollwinkel (360°) und ordne knifflige Grenzfälle wie 89°, 91° oder 179° sicher ein.',\n   gen:()=>Math.random()<.45?pick([0,360]):pick([1,2,3,4,88,89,91,92,178,179,181,182,356,357,358,359])},\n  {id:'p5',nr:5,icon:'🧭',name:'Kompass & Kurs',task:true,goal:'Ich lese Drehungen am Kompass ab (rechts/links, als Bruchteil wie ¼ oder ⅜), kenne die Himmelsrichtungen in Grad und bestimme den Kurs von A nach B.'},\n  {id:'p6',nr:6,icon:'🏷️',name:'Winkel benennen',task:true,goal:'Ich benenne Scheitel, Schenkel und Winkelbogen, kenne α, β, γ, δ, ε und die Teile des Geodreiecks.'},\n  {id:'p7',nr:7,icon:'🧮',name:'Winkel berechnen',task:true,goal:'Ich berechne Winkel ohne zu messen: Nebenwinkel (180°), Vollkreis (360°), Scheitelwinkel, Dreieck (180°) und überstumpfe Winkel.'},\n  {id:'p8',nr:8,icon:'📏',name:'Senkrechte & Parallelen',task:true,goal:'Ich erkenne senkrechte (⊥) und parallele (∥) Geraden, finde rechte Winkel in Figuren und zeichne Senkrechte und Parallelen durch einen Punkt.'}\n];\nconst packById=id=>PACKS.find(p=>p.id===id);\n\nconst MODES={\n  measure:{icon:'📐',title:'Messen mit Geodreieck',desc:'Miss den Winkel mit deinem echten Geodreieck – oder mit dem virtuellen.'},\n  visual:{icon:'👁️',title:'Winkelart erkennen',desc:'Sieh dir den Winkel an und bestimme die Winkelart.'},\n  degree:{icon:'🔢',title:'Gradzahl einordnen',desc:'Eine Gradzahl erscheint. Welche Winkelart ist das?'},\n  estimate:{icon:'🎯',title:'Schätzen',desc:'Ohne Geodreieck: Wie gut ist dein Augenmaß?'},\n  draw:{icon:'✍️',title:'Winkel zeichnen',desc:'Dreh den grünen Laser mit dem Finger auf die richtige Gradzahl.'},\n  time:{icon:'⏱️',title:'Zeitrunde',desc:'60 Sekunden: so viele richtige Antworten wie möglich.'},\n  task:{icon:'🧭',title:'Aufgaben-Mission',desc:'Kompass, Bezeichnungen, Berechnen, Senkrechte & Parallelen – aus deinen Paketen 5–8.'},\n  test:{icon:'🏆',title:'Abschlusstest',desc:'12–15 gemischte Aufgaben ohne Hilfen. Am Ende gibt es eine Note.'},\n  learn:{icon:'📡',title:'Wissen',desc:'Alle Winkelarten und Messtricks zum Nachlesen.'}\n};\nconst RANKS=[{n:'Sternenstaub',xp:0,i:'✨'},{n:'Meteor',xp:100,i:'☄️'},{n:'Komet',xp:250,i:'🌠'},{n:'Planet',xp:500,i:'🪐'},{n:'Pulsar',xp:850,i:'💫'},{n:'Supernova',xp:1300,i:'🌟'},{n:'Galaxis-Legende',xp:2000,i:'🌌'}];\nconst PRAISE=['Treffer! 🎯','Stark! ⭐','Volltreffer! 🚀','Perfekt! ✨','Genau richtig! 💫','Mission erfüllt! 🛸'];\nconst NOTE_TXT=['','sehr gut','gut','befriedigend','ausreichend','mangelhaft','ungenügend'];\nconst HINT=`<ol><li>Den Nullpunkt in der Mitte der langen Kante genau auf den Scheitelpunkt ● legen.<\/li><li>Die lange Kante genau auf den <b style=\"color:var(--ray1)\">blauen<\/b> Schenkel legen.<\/li><li>Am <b style=\"color:var(--ray2)\">grünen<\/b> Schenkel ablesen – auf der Skala, die am blauen Schenkel bei 0 beginnt.<\/li><li>Überstumpf (Bogen größer als ein Halbkreis)? Miss den kleinen Winkel und rechne 360° minus.<\/li><li>Kein Geodreieck dabei? Blende das virtuelle ein: Zum Verschieben ziehen, am gelben Griff drehen. In der Nähe des Scheitels rastet es ein.<\/li><\/ol>`;\n\nfunction combo(){return S.sel.slice().sort().join('+');}\nfunction rankIdx(xp){let r=0;RANKS.forEach((k,i)=>{if(xp>=k.xp)r=i;});return r;}\n\n/* Sound */\nlet AC=null;\nfunction sfx(type){\n  if(!S.sound)return;\n  try{\n    AC=AC||new (window.AudioContext||window.webkitAudioContext)();\n    const t=AC.currentTime;\n    const notes=type==='ok'?[[660,0],[990,.09]]:type==='bad'?[[190,0],[140,.12]]:[[523,0],[659,.1],[784,.2],[1046,.3]];\n    notes.forEach(([f,d])=>{\n      const o=AC.createOscillator(),g=AC.createGain();\n      o.type=type==='bad'?'sawtooth':'square';\n      o.frequency.setValueAtTime(f,t+d);\n      if(type==='ok')o.frequency.exponentialRampToValueAtTime(f*1.5,t+d+.08);\n      g.gain.setValueAtTime(.0001,t+d);\n      g.gain.exponentialRampToValueAtTime(.07,t+d+.01);\n      g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);\n      o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.17);\n    });\n  }catch(e){}\n}\n\n/* Header */\nfunction renderHeader(){\n  const i=rankIdx(S.xp),r=RANKS[i],nx=RANKS[i+1];\n  const pct=nx?(S.xp-r.xp)/(nx.xp-r.xp)*100:100;\n  $('#rank').innerHTML=`<span class=\"ri\">${r.i}<\/span><div class=\"rt\"><b>${r.n}<\/b><div class=\"xpbar\"><i style=\"width:${pct}%\"><\/i><\/div><small>${S.xp} XP${nx?' · nächster Rang bei '+nx.xp:' · höchster Rang!'}<\/small><\/div>`;\n  $('#soundBtn').textContent=S.sound?'🔊':'🔇';\n}\n$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderHeader();};\n$('#brand').onclick=()=>home();\n\nfunction addXP(n){\n  const before=rankIdx(S.xp);S.xp+=n;save();renderHeader();\n  const after=rankIdx(S.xp);\n  if(after>before){setTimeout(()=>{toast(`${RANKS[after].i} Neuer Rang: ${RANKS[after].n}!`);confetti();sfx('rank');},250);}\n}\nfunction toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}\nfunction confetti(){\n  for(let i=0;i<30;i++){\n    const s=document.createElement('span');s.className='conf';\n    s.textContent=pick(['✦','★','✧','•','✺']);\n    s.style.left=Math.random()*100+'vw';\n    s.style.color=pick(['#4cc9ff','#7cff6b','#ffd166','#b58cff','#ff7a90']);\n    s.style.animationDelay=(Math.random()*.5)+'s';\n    s.style.fontSize=(14+Math.random()*24)+'px';\n    document.body.appendChild(s);setTimeout(()=>s.remove(),3000);\n  }\n}\n\n/* Stats / Lernziel */\nfunction packSum(id){const s=S.stats[id];return s?s.h.reduce((a,b)=>a+b,0):0;}\nfunction recordStat(pid,ok){\n  const s=S.stats[pid]||(S.stats[pid]={h:[],done:false});\n  s.h.push(ok?1:0); if(s.h.length>20)s.h.shift();\n  if(!s.done&&packSum(pid)>=16){\n    s.done=true; save();\n    setTimeout(()=>{toast(`🏅 Lernziel erreicht: Paket ${packById(pid).nr} · ${packById(pid).name}`);confetti();sfx('rank');},400);\n    addXP(50);\n  }\n  save();\n}\n\n/* Geometrie */\nfunction P(vx,vy,r,a){const t=a*Math.PI/180;return[vx+r*Math.cos(t),vy-r*Math.sin(t)];}\nfunction arcPath(vx,vy,r,a1,deg){\n  const[x1,y1]=P(vx,vy,r,a1),[x2,y2]=P(vx,vy,r,a1+deg);\n  return `M ${vx} ${vy} L ${x1} ${y1} A ${r} ${r} 0 ${deg>180?1:0} 0 ${x2} ${y2} Z`;\n}\nfunction layout(W,H,deg,rot,pad,maxL){\n  const pts=[[0,0],P(0,0,1,rot),P(0,0,1,rot+deg)];\n  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);\n  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);\n  const bw=Math.max(maxX-minX,.05),bh=Math.max(maxY-minY,.05);\n  const L=Math.max(20,Math.min((W-2*pad)/bw,(H-2*pad)/bh,maxL));\n  return{vx:pad+((W-2*pad)-(maxX-minX)*L)/2-minX*L,vy:pad+((H-2*pad)-(maxY-minY)*L)/2-minY*L,L};\n}\nfunction el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}\nfunction prepSvg(){\n  const svg=$('#svg'),st=$('#stage');const W=st.clientWidth,H=st.clientHeight;\n  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);\n  svg.innerHTML='';\n  svg.onpointerdown=svg.onpointermove=svg.onpointerup=svg.onpointercancel=null;\n  const defs=el('defs',{},svg);\n  const f=el('filter',{id:'glow',filterUnits:'userSpaceOnUse',x:0,y:0,width:W,height:H},defs);\n  el('feGaussianBlur',{stdDeviation:3.5,result:'b'},f);\n  const m=el('feMerge',{},f);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);\n  return{svg,W,H};\n}\nfunction label(g,x,y,txt,W,H){\n  x=Math.min(W-40,Math.max(40,x));y=Math.min(H-24,Math.max(24,y));\n  const t=el('text',{x,y,class:'deglabel','text-anchor':'middle','dominant-baseline':'middle'},g);t.textContent=txt;\n}\nfunction renderAngle(q,o={}){\n  const{svg,W,H}=prepSvg();\n  const big=q.kind==='measure';\n  const{vx,vy,L}=big?layout(W,H,q.deg,q.rot,60,Math.min(W,H)*.62):layout(W,H,q.deg,q.rot,40,Math.min(W,H)*.44);\n  const ar=big?Math.min(46,L*.2):Math.min(64,L*.26);\n  if(G)G.vtx={x:vx,y:vy};\n  const g=el('g',{},svg);\n  if(q.deg>=360)el('circle',{cx:vx,cy:vy,r:ar,class:'arcf'},g);\n  else if(q.deg>0)el('path',{d:arcPath(vx,vy,ar,q.rot,q.deg),class:'arcf'},g);\n  const[x1,y1]=P(vx,vy,L,q.rot),[x2,y2]=P(vx,vy,L,q.rot+q.deg);\n  const cls=big?' thin':'';\n  el('line',{x1:vx,y1:vy,x2:x1,y2:y1,class:'ray r1'+cls,filter:'url(#glow)'},g);\n  el('line',{x1:vx,y1:vy,x2:x2,y2:y2,class:'ray r2'+cls,filter:'url(#glow)'},g);\n  if(q.deg===90&&!big){const[dx,dy]=P(vx,vy,ar*.5,q.rot+45);el('circle',{cx:dx,cy:dy,r:4.5,class:'dot'},g);}\n  el('circle',{cx:vx,cy:vy,r:big?4:6,class:'vertex'},g);\n  if(o.reveal){const[lx,ly]=P(vx,vy,ar+36,q.rot+q.deg/2);label(g,lx,ly,q.deg+'°',W,H);}\n}\n\n/* Zeichnen */\nfunction setupDraw(){\n  const q=G.q;const{svg,W,H}=prepSvg();\n  const vx=W/2,vy=H/2,L=Math.min(W,H)/2-34,ar=Math.min(64,L*.26);\n  G.dg={vx,vy,L,ar,W,H};\n  const g=el('g',{},svg);\n  G.dArc=el('path',{class:'arcf',d:''},g);\n  const[x1,y1]=P(vx,vy,L,q.rot);\n  el('line',{x1:vx,y1:vy,x2:x1,y2:y1,class:'ray r1',filter:'url(#glow)'},g);\n  G.dRay=el('line',{x1:vx,y1:vy,x2:vx,y2:vy,class:'ray r2',filter:'url(#glow)'},g);\n  el('circle',{cx:vx,cy:vy,r:6,class:'vertex'},g);\n  G.dG=g;G.vtx={x:vx,y:vy};\n  if(G.drawVal==null){const t=el('text',{x:W/2,y:H-22,'text-anchor':'middle',class:'help'},svg);t.textContent=W<440?'Tippe und zieh':'Tippe und zieh – der grüne Schenkel folgt deinem Finger';G.dHelp=t;}\n  const setFrom=e=>{\n    if(G.locked)return;\n    const r=svg.getBoundingClientRect();\n    const vb=svg.viewBox.baseVal,kx=vb.width/r.width,ky=vb.height/r.height;const a=Math.atan2(-((e.clientY-r.top)*ky-vy),(e.clientX-r.left)*kx-vx)*180/Math.PI;\n    let rel=Math.round(((a-q.rot)%360+360)%360); if(rel===360)rel=0;\n    G.drawVal=rel;updateDraw(rel);\n    if(G.dHelp){G.dHelp.remove();G.dHelp=null;}\n    const d=$('#done');if(d)d.disabled=false;\n  };\n  svg.onpointerdown=e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}G.dragging=true;setFrom(e);};\n  svg.onpointermove=e=>{if(G.dragging)setFrom(e);};\n  svg.onpointerup=svg.onpointercancel=()=>{G.dragging=false;};\n  if(G.drawVal!=null)updateDraw(G.drawVal);\n}\nfunction updateDraw(rel){\n  const{vx,vy,L,ar}=G.dg;const[x,y]=P(vx,vy,L,G.q.rot+rel);\n  G.dRay.setAttribute('x2',x);G.dRay.setAttribute('y2',y);\n  G.dArc.setAttribute('d',rel>0?arcPath(vx,vy,ar,G.q.rot,rel):'');\n}\nfunction revealDraw(){\n  const{vx,vy,L,ar,W,H}=G.dg;const q=G.q;\n  const[x,y]=P(vx,vy,L,q.rot+q.deg);\n  el('line',{x1:vx,y1:vy,x2:x,y2:y,class:'ghost'},G.dG);\n  const[lx,ly]=P(vx,vy,L*.72,q.rot+q.deg);label(G.dG,lx,ly,'Ziel '+q.deg+'°',W,H);\n  if(G.drawVal!=null){const[ux,uy]=P(vx,vy,ar+40,q.rot+G.drawVal/2);label(G.dG,ux,uy,G.drawVal+'°',W,H);}\n}\n\n/* Virtuelles Geodreieck */\nlet GEO=null;\n\n/* ===== Zoom (Lupe) für Messen und Zeichnen ===== */\nlet ZM={z:1,px:0,py:0};\ntry{ZM.z=Math.min(3,Math.max(1,+(localStorage.getItem('winkel-zoom')||1)));}catch(e){}\nfunction zoomApply(){\n  const st=$('#stage');if(!st)return;\n  const kind=G&&G.q&&G.q.kind,on=kind==='measure'||kind==='draw';\n  const zc=$('#zoomctl');if(zc){zc.hidden=!on;const b=zc.querySelector('[data-z=\"1\"]'),c=zc.querySelector('[data-z=\"-1\"]');if(b)b.disabled=ZM.z>=3;if(c)c.disabled=ZM.z<=1;zc.querySelector('.zl').textContent=ZM.z===1?'1×':ZM.z+'×';}\n  const z=on?ZM.z:1,v=(G&&G.vtx)||{x:st.clientWidth/2,y:st.clientHeight-26};\n  const tx=v.x-z*v.x+ZM.px,ty=v.y-z*v.y+ZM.py;\n  ['#svg','#geo'].forEach(s=>{const e=$(s);if(e)e.style.transform=z===1?'':`translate(${tx}px,${ty}px) scale(${z})`;});\n  st.classList.toggle('zoomed',z>1);\n}\nfunction zoomStep(d){ZM.z=Math.min(3,Math.max(1,ZM.z+d*.5));if(ZM.z===1){ZM.px=0;ZM.py=0;}try{localStorage.setItem('winkel-zoom',ZM.z);}catch(e){}zoomApply();}\ndocument.addEventListener('pointerdown',e=>{\n  const st=$('#stage');if(!st||!st.contains(e.target)||e.target.closest('#zoomctl'))return;\n  if(!(G&&G.q&&G.q.kind==='measure'&&ZM.z>1)||e.target.closest('.geo'))return;\n  const sx=e.clientX,sy=e.clientY,px=ZM.px,py=ZM.py;\n  const mv=ev=>{ZM.px=px+(ev.clientX-sx);ZM.py=py+(ev.clientY-sy);zoomApply();};\n  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};\n  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);\n});\nfunction renderGeoCtl(){\n  const c=$('#geoctl');if(!c)return;\n  c.innerHTML=`<button class=\"btn-s\" id=\"geoTog\">📐 Virtuelles Geodreieck ${S.vgeo?'ausblenden':'einblenden'}<\/button>`+\n    (S.vgeo?`<button class=\"btn-s\" data-r=\"1\" aria-label=\"1 Grad nach links drehen\">⟲ 1°<\/button><button class=\"btn-s\" data-r=\"-1\" aria-label=\"1 Grad nach rechts drehen\">⟳ 1°<\/button><button class=\"btn-s\" id=\"geoReset\">Zurücksetzen<\/button>`:'');\n  $('#geoTog').onclick=()=>{S.vgeo=!S.vgeo;save();renderGeo();renderGeoCtl();};\n  c.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!GEO)return;GEO.rot=(GEO.rot+Number(b.dataset.r)+360)%360;geoApply();});\n  const r=$('#geoReset');if(r)r.onclick=()=>{GEO=null;renderGeo();};\n}\nfunction geoApply(){if(G&&G.geoG&&GEO)G.geoG.setAttribute('transform',`translate(${GEO.x} ${GEO.y}) rotate(${-GEO.rot})`);}\nfunction angDiff(a,b){const d=Math.abs(((a-b)%360+360)%360);return Math.min(d,360-d);}\nfunction renderGeo(){\n  const gs=$('#geo');if(!gs)return;\n  gs.innerHTML='';\n  if(!(S.vgeo&&G&&G.q&&G.q.kind==='measure'))return;\n  const st=$('#stage'),W=st.clientWidth,H=st.clientHeight;\n  gs.setAttribute('viewBox',`0 0 ${W} ${H}`);gs.setAttribute('width',W);gs.setAttribute('height',H);\n  const Hh=Math.min(W,H)*.55;\n  if(!GEO||GEO.x<0||GEO.x>W||GEO.y<0||GEO.y>H)GEO={x:W/2,y:H-26,rot:0};\n  const g=el('g',{class:'geo'},gs);G.geoG=g;\n  el('polygon',{points:`${-Hh},0 ${Hh},0 0,${-Hh}`,class:'geobody'},g);\n  const R=Hh*.68,fs=Math.max(10,Math.round(Hh/21)),big=Hh*.07;\n  for(let t=0;t<=180;t++){\n    const len=t%10===0?big:t%5===0?Hh*.045:Hh*.025;\n    const c=Math.cos(t*Math.PI/180),s=Math.sin(t*Math.PI/180);\n    el('line',{x1:R*c,y1:-R*s,x2:(R-len)*c,y2:-(R-len)*s,class:'geotick'},g);\n    if(t%10===0){\n      const r1=R-big-fs*.8,r2=R-big-fs*2;\n      const a=el('text',{x:r1*c,y:-r1*s,class:'geonum','font-size':fs,'text-anchor':'middle','dominant-baseline':'middle'},g);a.textContent=t;\n      const b=el('text',{x:r2*c,y:-r2*s,class:'geonum2','font-size':fs*.85,'text-anchor':'middle','dominant-baseline':'middle'},g);b.textContent=180-t;\n    }\n  }\n  const cm=Hh/8;\n  for(let i=-7;i<=7;i++){\n    for(let m=0;m<10&&i<7;m++){const x=(i+m/10)*cm;if(x>Hh-4)break;el('line',{x1:x,y1:0,x2:x,y2:-(m===5?Hh*.03:Hh*.018),class:'geotick'},g);}\n    el('line',{x1:i*cm,y1:0,x2:i*cm,y2:-Hh*.045,class:'geotick'},g);\n    if(i!==0){const tx=el('text',{x:i*cm,y:-Hh*.045-fs*.6,class:'geonum','font-size':fs*.8,'text-anchor':'middle'},g);tx.textContent=Math.abs(i);}\n  }\n  el('line',{x1:0,y1:0,x2:0,y2:-R*.55,class:'geotick'},g);\n  el('circle',{cx:0,cy:0,r:4,class:'geozero'},g);\n  const hy=-Hh-34;\n  el('line',{x1:0,y1:-Hh,x2:0,y2:hy,class:'geotick'},g);\n  const hd=el('circle',{cx:0,cy:hy,r:22,class:'geohandle'},g);\n  const ht=el('text',{x:0,y:hy,'text-anchor':'middle','dominant-baseline':'central','font-size':22,style:'pointer-events:none'},g);ht.textContent='⟳';\n  geoApply();\n  const pt=e=>{const r=gs.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};\n  const snap=()=>{\n    const v=G.vtx;\n    if(v&&Math.hypot(GEO.x-v.x,GEO.y-v.y)<16){GEO.x=v.x;GEO.y=v.y;}\n    const q=G.q;\n    for(const t of[q.rot,q.rot+180,q.rot+q.deg,q.rot+q.deg+180]){if(angDiff(GEO.rot,t)<2.5){GEO.rot=((t%360)+360)%360;break;}}\n  };\n  let drag=null;\n  g.addEventListener('pointerdown',e=>{\n    e.stopPropagation();try{g.setPointerCapture(e.pointerId);}catch(_){}\n    const p=pt(e);\n    drag=e.target===hd?{mode:'rot'}:{mode:'move',dx:GEO.x-p.x,dy:GEO.y-p.y};\n  });\n  g.addEventListener('pointermove',e=>{\n    if(!drag)return;const p=pt(e);\n    if(drag.mode==='move'){GEO.x=Math.min(W,Math.max(0,p.x+drag.dx));GEO.y=Math.min(H,Math.max(0,p.y+drag.dy));}\n    else{const a=Math.atan2(-(p.y-GEO.y),p.x-GEO.x)*180/Math.PI;GEO.rot=((a-90)%360+360)%360;}\n    snap();geoApply();\n  });\n  const end=()=>{drag=null;};\n  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);\n}\n\n/* Spiel-Engine */\nlet G=null,lastDeg=null;\n\n/* ===== Pakete 5–8: Aufgaben-Modul ===== */\nconst DIRS=['Norden','Nordosten','Osten','Südosten','Süden','Südwesten','Westen','Nordwesten'];\nconst FRC=['','⅛','¼','⅜','½','⅝','¾','⅞','1'];\nconst GREEK=[['α','Alpha'],['β','Beta'],['γ','Gamma'],['δ','Delta'],['ε','Epsilon']];\nconst mA=k=>90-k; /* Kurs (rechts herum ab Norden) -> Mathe-Winkel */\nfunction tx(g,x,y,t,cls,ex){const e=el('text',Object.assign({x,y,class:cls||'tlab','text-anchor':'middle','dominant-baseline':'middle'},ex||{}),g);e.textContent=t;return e;}\nfunction ln(g,x1,y1,x2,y2,cls){return el('line',{x1,y1,x2,y2,class:cls},g);}\nfunction head(g,x,y,ang,sz){const a=ang*Math.PI/180,b1=a+Math.PI*.82,b2=a-Math.PI*.82;\n  el('polygon',{points:`${x},${y} ${x+sz*Math.cos(b1)},${y-sz*Math.sin(b1)} ${x+sz*Math.cos(b2)},${y-sz*Math.sin(b2)}`,class:'ahead'},g);}\nfunction compass(g,cx,cy,R){\n  el('circle',{cx,cy,r:R,class:'cmp'},g);\n  ln(g,cx-R,cy,cx+R,cy,'cmpx');ln(g,cx,cy-R,cx,cy+R,'cmpx');\n  for(let k=0;k<8;k++){const a=mA(k*45),[x1,y1]=P(cx,cy,R,a),[x2,y2]=P(cx,cy,k%2?R*.9:R*.82,a);ln(g,x1,y1,x2,y2,'cmpt');}\n  [['N',0],['O',90],['S',180],['W',270]].forEach(([t,k])=>{const[x,y]=P(cx,cy,R+20,mA(k));tx(g,x,y,t,'tlab');});\n}\nfunction turnArc(g,cx,cy,r,a0,amt,right){\n  const a1=right?a0-amt:a0+amt,[x0,y0]=P(cx,cy,r,a0),[x1,y1]=P(cx,cy,r,a1);\n  el('path',{d:`M ${x0} ${y0} A ${r} ${r} 0 ${amt>180?1:0} ${right?1:0} ${x1} ${y1}`,class:'turn'},g);\n  head(g,x1,y1,right?a1-90:a1+90,14);\n}\nfunction arrowLine(g,x0,y0,x1,y1,cls){ln(g,x0,y0,x1,y1,cls||'ray r2');head(g,x1,y1,Math.atan2(-(y1-y0),x1-x0)*180/Math.PI,16);}\nfunction sector(g,vx,vy,r,a0,deg,cls){if(deg<=0)return;el('path',{d:arcPath(vx,vy,r,a0,deg),class:cls||'arcf'},g);}\nfunction arcLabel(g,vx,vy,r,a0,deg,t,cls){const[x,y]=P(vx,vy,r,a0+deg/2);tx(g,x,y,t,cls||'tlab');}\nfunction mcOpts(correct,dist,n){const s=[...new Set(dist.filter(d=>d!==correct))];const o=shuffle([correct,...shuffle(s).slice(0,(n||4)-1)]);return{opts:o,ans:o.indexOf(correct)};}\nconst dirV=k=>({0:[0,1],45:[1,1],90:[1,0],135:[1,-1],180:[0,-1],225:[-1,-1],270:[-1,0],315:[-1,1]})[k];\nfunction fitScale(W,H,bw,bh,pad){return Math.min((W-2*pad)/bw,(H-2*pad)/bh);}\n\n/* --- Paket 5: Kompass & Kurs --- */\nfunction t5dreh(){\n  const s=rnd(0,7)*45,k=rnd(1,6),r=Math.random()<.5,amt=k*45,e=((s+(r?amt:-amt))%360+360)%360;\n  const d=r?'rechts':'links',o=r?'links':'rechts',L=(x,kk)=>`${x}, ${FRC[kk]} Drehung (${kk*45}°)`;\n  const m=mcOpts(L(d,k),[L(o,k),L(d,k<6?k+1:k-1),L(d,k>1?k-1:k+2),L(o,8-k)]);\n  return Object.assign(m,{short:'Drehung am Kompass',ask:'Gib die <b>Drehrichtung<\/b> und die <b>Drehung als Bruchteil<\/b> einer vollen Drehung an.',\n    expl:`Der Pfeil dreht sich ${r?'rechts herum (im Uhrzeigersinn)':'links herum (gegen den Uhrzeigersinn)'} von ${DIRS[s/45]} nach ${DIRS[e/45]}. Das sind ${amt}°. Eine volle Drehung hat 360°, also ${amt}° = ${FRC[k]} Drehung.`,\n    draw(svg,W,H){const g=el('g',{},svg),R=Math.min(W,H)*.34,cx=W/2,cy=H/2+6;compass(g,cx,cy,R);\n      const[x0,y0]=P(cx,cy,R*.72,mA(s)),[x1,y1]=P(cx,cy,R*.72,mA(e));ln(g,cx,cy,x0,y0,'ray r1 thin');arrowLine(g,cx,cy,x1,y1,'ray r2 thin');\n      turnArc(g,cx,cy,R*.4,mA(s),amt,r);el('circle',{cx,cy,r:5,class:'vertex'},g);}});\n}\nfunction t5wohin(){\n  const s=rnd(0,7),k=rnd(1,7),r=Math.random()<.5,e=((s+(r?k:-k))%8+8)%8;\n  return{short:'Himmelsrichtung nach Drehung',ask:`Du schaust nach <b>${DIRS[s]}<\/b> und drehst dich um <b>${k*45}° nach ${r?'rechts':'links'}<\/b>. Wohin schaust du jetzt?`,\n    opts:DIRS.slice(),ans:e,expl:`${k*45}° sind ${k}-mal 45°. Jeder 45°-Schritt ist eine Himmelsrichtung weiter: von ${DIRS[s]} ${r?'rechts herum':'links herum'} ${k} Schritte bis ${DIRS[e]}.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),R=Math.min(W,H)*.34,cx=W/2,cy=H/2+6;compass(g,cx,cy,R);\n      const[x0,y0]=P(cx,cy,R*.72,mA(s*45));arrowLine(g,cx,cy,x0,y0,'ray r1 thin');\n      if(rev){const[x1,y1]=P(cx,cy,R*.72,mA(e*45));arrowLine(g,cx,cy,x1,y1,'ray r2 thin');turnArc(g,cx,cy,R*.4,mA(s*45),k*45,r);}\n      el('circle',{cx,cy,r:5,class:'vertex'},g);}};\n}\nfunction t5kurs(){\n  const k=rnd(0,7)*45,show=Math.random()<.5;\n  return{short:'Kurs bestimmen',num:true,ans:k,tol:0,ask:show?'Welchen <b>Kurs<\/b> zeigt der Pfeil? (Kurs = Rechtsdrehung ab Norden = 0°)':`Welcher <b>Kurs<\/b> führt nach <b>${DIRS[k/45]}<\/b>?`,\n    expl:`Der Kurs wird immer von Norden (0°) aus rechts herum gemessen: Osten 90°, Süden 180°, Westen 270°. ${DIRS[k/45]} hat den Kurs ${k}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),R=Math.min(W,H)*.34,cx=W/2,cy=H/2+6;compass(g,cx,cy,R);\n      if(show||rev){const[x,y]=P(cx,cy,R*.78,mA(k));arrowLine(g,cx,cy,x,y,'ray r2 thin');}\n      if(rev&&k>0){turnArc(g,cx,cy,R*.38,90,k,true);arcLabel(g,cx,cy,R*.58,90,-k,k+'°','tlab hot');}\n      el('circle',{cx,cy,r:5,class:'vertex'},g);}};\n}\nfunction t5bruch(){\n  const k=rnd(1,7);\n  if(Math.random()<.5)return{short:'Bruchteil in Grad',num:true,ans:k*45,tol:0,ask:`Wie viel Grad sind <b>${FRC[k]} Drehung<\/b>?`,\n    expl:`Eine volle Drehung hat 360°. ⅛ Drehung = 360° : 8 = 45°. ${FRC[k]} Drehung = ${k} · 45° = ${k*45}°.`,draw:(svg,W,H)=>pie(svg,W,H,k,true)};\n  const m=mcOpts(FRC[k]+' Drehung',[1,2,3,4,5,6,7].map(i=>FRC[i]+' Drehung'));\n  return Object.assign(m,{short:'Grad in Bruchteil',ask:`Welcher Bruchteil einer vollen Drehung sind <b>${k*45}°<\/b>?`,\n    expl:`${k*45}° : 45° = ${k}. Also ${k} Achtel${k%2===0?' = '+FRC[k]:''} einer vollen Drehung.`,draw:(svg,W,H,rev)=>pie(svg,W,H,k,rev)});\n}\nfunction pie(svg,W,H,k,show){const g=el('g',{},svg),R=Math.min(W,H)*.32,cx=W/2,cy=H/2;el('circle',{cx,cy,r:R,class:'cmp'},g);\n  for(let i=0;i<8;i++){const[x,y]=P(cx,cy,R,mA(i*45));ln(g,cx,cy,x,y,'cmpx');}\n  sector(g,cx,cy,R,90-k*45,k*45,'arcf');if(show)tx(g,cx,cy+R+26,k*45+'°','tlab hot');}\nfunction t5koord(){\n  let ax,ay,k,n,bx,by;\n  for(let t=0;t<200;t++){ax=rnd(0,7);ay=rnd(0,5);k=rnd(0,7)*45;n=rnd(1,3);const v=dirV(k);bx=ax+v[0]*n;by=ay+v[1]*n;if(bx>=0&&bx<=7&&by>=0&&by<=5)break;}\n  const drawG=(svg,W,H,rev)=>{const g=el('g',{},svg),c=fitScale(W,H,8,6,34),ox=(W-7*c)/2,oy=(H+5*c)/2,X=x=>ox+x*c,Y=y=>oy-y*c;\n    for(let x=0;x<=7;x++){ln(g,X(x),Y(0),X(x),Y(5),'gl');tx(g,X(x),Y(0)+18,String(x),'tsm');}\n    for(let y=0;y<=5;y++){ln(g,X(0),Y(y),X(7),Y(y),'gl');tx(g,X(0)-16,Y(y),String(y),'tsm');}\n    ln(g,X(0),Y(0),X(7.3),Y(0),'axis');ln(g,X(0),Y(0),X(0),Y(5.3),'axis');tx(g,X(7.45),Y(0),'x','tsm');tx(g,X(0),Y(5.5),'y','tsm');\n    const[nx,ny]=[X(0)+c*.2,Y(5)+2];tx(g,W-26,28,'N ↑','tlab');\n    if(rev)arrowLine(g,X(ax),Y(ay),X(bx),Y(by),'ray r2 thin');\n    el('circle',{cx:X(ax),cy:Y(ay),r:6,class:'pt'},g);tx(g,X(ax)+14,Y(ay)-14,'A','tlab');\n    el('circle',{cx:X(bx),cy:Y(by),r:6,class:'pt'},g);tx(g,X(bx)+14,Y(by)-14,'B','tlab');};\n  if(Math.random()<.6)return{short:'Kurs von A nach B',num:true,ans:k,tol:0,ask:'Mit welchem <b>Kurs<\/b> geht man von A nach B?',\n    expl:`Von A(${ax}|${ay}) nach B(${bx}|${by}) geht es nach ${DIRS[k/45]}. Kurs = Rechtsdrehung ab Norden: ${k}°.`,draw:drawG};\n  const c=`B(${bx}|${by})`,m=mcOpts(c,[`B(${by}|${bx})`,`B(${bx+1}|${by})`,`B(${bx}|${by+1})`,`B(${Math.max(0,bx-1)}|${by})`,`B(${bx}|${Math.max(0,by-1)})`]);\n  return Object.assign(m,{short:'Koordinaten ablesen',ask:'Welche <b>Koordinaten<\/b> hat der Punkt B?',expl:`Erst nach rechts (x-Wert), dann nach oben (y-Wert): B liegt bei x = ${bx} und y = ${by}, also ${c}.`,draw:drawG});\n}\n\n/* --- Paket 6: Winkel benennen --- */\nfunction angleFig(svg,W,H,deg,hl){const g=el('g',{},svg),{vx,vy,L}=layout(W,H,deg,0,56,Math.min(W,H)*.62),ar=Math.min(60,L*.28);\n  if(hl==='bogen')el('path',{d:`M ${P(vx,vy,ar,0).join(' ')} A ${ar} ${ar} 0 0 0 ${P(vx,vy,ar,deg).join(' ')}`,class:'hl'},g);\n  if(hl==='a')ln(g,vx,vy,...P(vx,vy,L,0),'hl');\n  if(hl==='b')ln(g,vx,vy,...P(vx,vy,L,deg),'hl');\n  if(hl==='s')el('circle',{cx:vx,cy:vy,r:16,class:'hl'},g);\n  sector(g,vx,vy,ar,0,deg);ln(g,vx,vy,...P(vx,vy,L,0),'ray r1 thin');ln(g,vx,vy,...P(vx,vy,L,deg),'ray r2 thin');\n  el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);\n  tx(g,vx-20,vy+20,'S','tlab');const[ax,ay]=P(vx,vy,L*.92,-6),[bx,by]=P(vx,vy,L*.92,deg+7);tx(g,ax,ay,'a','tlab');tx(g,bx,by,'b','tlab');arcLabel(g,vx,vy,ar*.62,0,deg,'α','tlab');}\nfunction t6teil(){\n  const p=pick([['s','der Scheitel (S)'],['a','der Schenkel a'],['b','der Schenkel b'],['bogen','der Winkelbogen']]),deg=rnd(40,75);\n  const m=mcOpts(p[1],['der Scheitel (S)','der Schenkel a','der Schenkel b','der Winkelbogen','der Nullpunkt']);\n  return Object.assign(m,{short:'Teile des Winkels',ask:'Wie heißt das <b>markierte<\/b> Teil des Winkels?',\n    expl:'Ein Winkel besteht aus dem Scheitel S und den beiden Schenkeln a und b. Der Winkelbogen zeigt, welcher Winkel gemeint ist, und bekommt einen griechischen Buchstaben.',\n    draw:(svg,W,H)=>angleFig(svg,W,H,deg,p[0])});\n}\nfunction t6griech(){\n  const i=rnd(0,4),[l,n]=GREEK[i];\n  if(Math.random()<.5){const m=mcOpts(n,GREEK.map(x=>x[1]));return Object.assign(m,{short:'Griechischer Buchstabe',ask:'Wie heißt dieser <b>griechische Buchstabe<\/b>?',expl:GREEK.map(x=>x[0]+' = '+x[1]).join(', ')+'.',draw:(svg,W,H)=>{tx(el('g',{},svg),W/2,H/2,l,'bigl');}});}\n  const m=mcOpts(l,GREEK.map(x=>x[0]));return Object.assign(m,{short:'Griechischer Buchstabe',ask:`Welcher Buchstabe ist <b>${n}<\/b>?`,expl:GREEK.map(x=>x[0]+' = '+x[1]).join(', ')+'.',draw:(svg,W,H)=>{tx(el('g',{},svg),W/2,H/2,n,'midl');}});\n}\nconst GEOPARTS=['der Nullpunkt','das Längenmaß (Lineal)','die Mittellinie','die äußere Winkelskala','die innere Winkelskala','die 90°-Ecke','eine 45°-Ecke','die parallelen Hilfslinien'];\nfunction geoStatic(svg,W,H,part){\n  const Hh=Math.min(W*.44,H*.8),cx=W/2,cy=H/2+Hh*.42,g=el('g',{transform:`translate(${cx} ${cy})`},svg);\n  el('polygon',{points:`${-Hh},0 ${Hh},0 0,${-Hh}`,class:'geobody'},g);\n  const R=Hh*.68,R2=R-Hh*.2,fs=Math.max(9,Math.round(Hh/22));\n  for(let t=0;t<=180;t+=5){const len=t%10===0?Hh*.06:Hh*.035,c=Math.cos(t*Math.PI/180),s=Math.sin(t*Math.PI/180);ln(g,R*c,-R*s,(R-len)*c,-(R-len)*s,'geotick');\n    if(t%30===0&&t>0&&t<180){tx(g,(R-Hh*.1)*c,-(R-Hh*.1)*s,String(t),'geonum',{'font-size':fs});tx(g,(R2)*c,-(R2)*s,String(180-t),'geonum2',{'font-size':fs*.9});}}\n  for(let i=1;i<=4;i++)ln(g,-Hh*(1-i*.16)+Hh*.12,-Hh*i*.1,Hh*(1-i*.16)-Hh*.12,-Hh*i*.1,'geotick');\n  for(let i=-7;i<=7;i++){const x=i*Hh/8;ln(g,x,0,x,-Hh*.04,'geotick');}\n  ln(g,0,0,0,-R*.62,'geotick');el('circle',{cx:0,cy:0,r:4,class:'geozero'},g);\n  const hl={\n    'der Nullpunkt':()=>el('circle',{cx:0,cy:0,r:14,class:'hl'},g),\n    'das Längenmaß (Lineal)':()=>ln(g,-Hh*.9,-3,Hh*.9,-3,'hl'),\n    'die Mittellinie':()=>ln(g,0,-4,0,-R*.62,'hl'),\n    'die äußere Winkelskala':()=>el('path',{d:`M ${R-Hh*.05} 0 A ${R-Hh*.05} ${R-Hh*.05} 0 0 0 ${-(R-Hh*.05)} 0`,class:'hl'},g),\n    'die innere Winkelskala':()=>el('path',{d:`M ${R2} 0 A ${R2} ${R2} 0 0 0 ${-R2} 0`,class:'hl'},g),\n    'die 90°-Ecke':()=>el('circle',{cx:0,cy:-Hh,r:18,class:'hl'},g),\n    'eine 45°-Ecke':()=>el('circle',{cx:pick([-1,1])*Hh,cy:0,r:18,class:'hl'},g),\n    'die parallelen Hilfslinien':()=>{for(let i=1;i<=4;i++)ln(g,-Hh*(1-i*.16)+Hh*.12,-Hh*i*.1,Hh*(1-i*.16)-Hh*.12,-Hh*i*.1,'hl thin');}\n  };\n  hl[part]();\n}\nfunction t6geo(){const part=pick(GEOPARTS),m=mcOpts(part,GEOPARTS);\n  return Object.assign(m,{short:'Teile des Geodreiecks',ask:'Wie heißt das <b>markierte<\/b> Teil des Geodreiecks?',\n    expl:'Nullpunkt in der Mitte der langen Kante, darüber die Mittellinie. Die lange Kante ist das Lineal. Außen die äußere, innen die innere Winkelskala. Die parallelen Hilfslinien verlaufen parallel zur langen Kante. Oben die 90°-Ecke, links und rechts je eine 45°-Ecke.',\n    draw:(svg,W,H)=>geoStatic(svg,W,H,part)});}\nconst W6=[\n  ['Wie heißt der Punkt, an dem sich die beiden Schenkel treffen?','der Scheitel',['der Nullpunkt','der Winkelbogen','die Mitte']],\n  ['Womit beschriftet man die Schenkel?','mit kleinen Buchstaben a und b',['mit griechischen Buchstaben','mit Zahlen','mit großen Buchstaben A und B']],\n  ['Womit beschriftet man den Scheitel?','mit dem großen Buchstaben S',['mit α','mit einer Gradzahl','mit dem kleinen Buchstaben s']],\n  ['Womit beschriftet man Winkel?','mit griechischen Buchstaben wie α, β, γ',['mit kleinen Buchstaben a, b, c','mit großen Buchstaben S, T','gar nicht']],\n  ['Wohin legst du beim Messen den Nullpunkt des Geodreiecks?','genau auf den Scheitel S',['auf das Ende von Schenkel a','in die Mitte des Winkelbogens','irgendwo auf Schenkel b']],\n  ['An welcher Skala liest du beim Messen ab?','an der Skala, die auf der Seite von Schenkel a mit 10° beginnt',['immer an der äußeren Skala','immer an der inneren Skala','an der Zentimeter-Skala']],\n  ['Wie lang soll der erste Schenkel beim Zeichnen mindestens sein?','6 cm',['1 cm','2 cm','20 cm']]\n];\nfunction t6wissen(){const[q,c,d]=pick(W6),m=mcOpts(c,d);return Object.assign(m,{short:'Wissen: Winkel & Geodreieck',ask:q,expl:`Richtig ist: ${c}.`,draw:(svg,W,H)=>angleFig(svg,W,H,55,'')});}\n\n/* --- Paket 7: Winkel berechnen --- */\nfunction t7neben(){\n  const x=pick([20,25,30,35,40,45,50,55,60,65,70,75,80,85,95,100,110,115,120,130,135,140,145,150,160]),a=180-x,rot=Math.random()<.5;\n  return{short:'Nebenwinkel',num:true,ans:a,tol:0,ask:'Berechne <b>α<\/b>, ohne zu messen.',expl:`Nebenwinkel ergänzen sich zu 180°: α = 180° − ${x}° = ${a}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),vx=W/2,vy=H*.66,L=Math.min(W*.42,H*.55);const r0=rot?180-x:0;\n      ln(g,vx-L,vy,vx+L,vy,'ray r1 thin');const[x2,y2]=P(vx,vy,L,rot?180-x:x);ln(g,vx,vy,x2,y2,'ray r2 thin');\n      const ar=Math.min(70,L*.34);if(!rot){sector(g,vx,vy,ar,0,x,'arcf');sector(g,vx,vy,ar*.8,x,a,'arcf2');arcLabel(g,vx,vy,ar+24,0,x,x+'°');arcLabel(g,vx,vy,ar*.55,x,a,rev?a+'°':'α','tlab hot');}\n      else{sector(g,vx,vy,ar,180-x,x,'arcf');sector(g,vx,vy,ar*.8,0,a,'arcf2');arcLabel(g,vx,vy,ar+24,180-x,x,x+'°');arcLabel(g,vx,vy,ar*.55,0,a,rev?a+'°':'α','tlab hot');}\n      el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);}};\n}\nfunction t7voll(){\n  let A;for(let t=0;t<300;t++){A=[rnd(8,28)*5,rnd(8,28)*5,rnd(8,28)*5];const d=360-A[0]-A[1]-A[2];if(d>=40&&d<=160){A.push(d);break;}}\n  const u=rnd(0,3),rot=rnd(0,11)*30,names=['α','β','γ','δ'];\n  return{short:'Winkel im Vollkreis',num:true,ans:A[u],tol:0,ask:`Berechne <b>${names[u]}<\/b>, ohne zu messen.`,\n    expl:`Alle Winkel um einen Punkt ergeben zusammen 360°: ${names[u]} = 360° − ${A.filter((_,i)=>i!==u).map(v=>v+'°').join(' − ')} = ${A[u]}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),vx=W/2,vy=H/2,L=Math.min(W,H)*.4,ar=Math.min(64,L*.36);let a0=rot;\n      A.forEach((v,i)=>{sector(g,vx,vy,ar,a0,v,i===u?'arcf2':'arcf');arcLabel(g,vx,vy,ar+26,a0,v,i===u?(rev?v+'°':names[i]):v+'°',i===u?'tlab hot':'tlab');a0+=v;});\n      a0=rot;A.forEach((v,i)=>{ln(g,vx,vy,...P(vx,vy,L,a0),i%2?'ray r2 thin':'ray r1 thin');a0+=v;});el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);}};\n}\nfunction t7scheitel(){\n  const a=pick([30,35,40,45,50,55,60,65,70,75,80,100,110,115,120,125,130,140]),ask=pick(['β','γ','δ']),val={β:180-a,γ:a,δ:180-a}[ask];\n  return{short:'Scheitel- und Nebenwinkel',num:true,ans:val,tol:0,ask:`Zwei Geraden schneiden sich. <b>α = ${a}°<\/b>. Wie groß ist <b>${ask}<\/b>?`,\n    expl:ask==='γ'?`γ liegt α genau gegenüber (Scheitelwinkel). Gegenüberliegende Winkel sind gleich groß: γ = ${a}°.`:`${ask} liegt neben α (Nebenwinkel). Nebenwinkel ergänzen sich zu 180°: ${ask} = 180° − ${a}° = ${val}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),vx=W/2,vy=H/2,L=Math.min(W,H)*.44,ar=Math.min(58,L*.3);\n      const S=[['α',0,a],['β',a,180-a],['γ',180,a],['δ',180+a,180-a]];\n      S.forEach(([n,s,d])=>{sector(g,vx,vy,ar,s,d,n===ask?'arcf2':'arcf');arcLabel(g,vx,vy,ar+22,s,d,n==='α'?`α = ${a}°`:n===ask?(rev?`${n} = ${val}°`:n+' = ?'):n,n===ask?'tlab hot':'tsm');});\n      ln(g,...P(vx,vy,L,180),...P(vx,vy,L,0),'ray r1 thin');ln(g,...P(vx,vy,L,a+180),...P(vx,vy,L,a),'ray r2 thin');el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);}};\n}\nfunction cornerArc(g,V,U,Wp,r,label,cls){const a1=Math.atan2(-(U[1]-V[1]),U[0]-V[0])*180/Math.PI,a2=Math.atan2(-(Wp[1]-V[1]),Wp[0]-V[0])*180/Math.PI;\n  let d=((a2-a1)%360+360)%360,s=a1;if(d>180){s=a2;d=360-d;}sector(g,V[0],V[1],r,s,d,cls||'arcf');arcLabel(g,V[0],V[1],r+20,s,d,label,cls==='arcf2'?'tlab hot':'tsm');}\nfunction t7dreieck(){\n  let a,b,c;for(let t=0;t<100;t++){a=rnd(6,20)*5;b=rnd(6,20)*5;c=180-a-b;if(c>=30)break;}\n  const u=rnd(0,2),ang=[a,b,c],nm=['α','β','γ'];\n  return{short:'Winkelsumme im Dreieck',num:true,ans:ang[u],tol:0,ask:`Berechne <b>${nm[u]}<\/b>, ohne zu messen.`,\n    expl:`In jedem Dreieck ergeben die drei Winkel zusammen 180°: ${nm[u]} = 180° − ${ang.filter((_,i)=>i!==u).map(v=>v+'°').join(' − ')} = ${ang[u]}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),rad=Math.PI/180,Ls=Math.sin(b*rad)/Math.sin(c*rad);const pts=[[0,0],[1,0],[Ls*Math.cos(a*rad),Ls*Math.sin(a*rad)]];\n      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mxy=Math.max(...ys);\n      const s=fitScale(W,H,mxx-mnx,mxy,60),ox=(W-(mxx-mnx)*s)/2-mnx*s,oy=(H+mxy*s)/2;const Q=pts.map(p=>[ox+p[0]*s,oy-p[1]*s]);\n      el('polygon',{points:Q.map(p=>p.join(',')).join(' '),class:'shape'},g);\n      const r=Math.min(46,s*.14);[[0,1,2],[1,2,0],[2,0,1]].forEach(([i,j,k])=>{cornerArc(g,Q[i],Q[j],Q[k],r,i===u?(rev?`${nm[i]} = ${ang[i]}°`:nm[i]+' = ?'):`${ang[i]}°`,i===u?'arcf2':'arcf');});}};\n}\nfunction t7trick(){\n  const y=pick([200,210,220,230,240,250,260,270,280,290,300,310,320,330]),x=360-y,v=Math.random()<.5;\n  return{short:'Überstumpfe Winkel',num:true,ans:v?y:x,tol:0,\n    ask:v?`Der kleine Winkel auf der anderen Seite hat <b>${x}°<\/b>. Wie groß ist der <b>überstumpfe<\/b> Winkel β?`:`Du sollst den überstumpfen Winkel <b>β = ${y}°<\/b> zeichnen. Welchen Winkel zeichnest du mit dem Geodreieck auf der anderen Seite?`,\n    expl:`Ein ganzer Kreis hat 360°. Überstumpfer Winkel und kleiner Winkel ergänzen sich zu 360°: ${v?`360° − ${x}° = ${y}°`:`360° − ${y}° = ${x}°`}.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),vx=W/2,vy=H/2,L=Math.min(W,H)*.4,ar=Math.min(60,L*.36);\n      sector(g,vx,vy,ar,0,y,'arcf2');sector(g,vx,vy,ar*.6,y,x,'arcf');ln(g,vx,vy,...P(vx,vy,L,0),'ray r1 thin');ln(g,vx,vy,...P(vx,vy,L,y),'ray r2 thin');\n      arcLabel(g,vx,vy,ar+26,0,y,v?(rev?`β = ${y}°`:'β = ?'):`β = ${y}°`,'tlab hot');arcLabel(g,vx,vy,ar*.6+22,y,x,v?`${x}°`:(rev?`${x}°`:'?'),'tlab');el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);}};\n}\nfunction t7summe(){\n  const p=rnd(4,14)*5,q=rnd(4,12)*5,tot=p+q,v=Math.random()<.5;\n  return{short:'Winkel zusammensetzen',num:true,ans:v?tot:q,tol:0,ask:v?`Berechne den ganzen Winkel <b>α<\/b>.`:`Der ganze Winkel ist <b>α = ${tot}°<\/b>. Wie groß ist das fehlende Teilstück?`,\n    expl:v?`Die Teilwinkel werden addiert: α = ${p}° + ${q}° = ${tot}°.`:`Vom ganzen Winkel wird das bekannte Stück abgezogen: ${tot}° − ${p}° = ${q}°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),vx=W*.3,vy=H*.72,L=Math.min(W*.6,H*.62),ar=Math.min(90,L*.4);\n      sector(g,vx,vy,ar,0,p,'arcf');sector(g,vx,vy,ar,p,q,v?'arcf':'arcf2');el('path',{d:`M ${P(vx,vy,ar*1.35,0).join(' ')} A ${ar*1.35} ${ar*1.35} 0 0 0 ${P(vx,vy,ar*1.35,tot).join(' ')}`,class:'turn thin'},g);\n      [0,p,tot].forEach((a,i)=>ln(g,vx,vy,...P(vx,vy,L,a),i===1?'ray r1 thin':'ray r2 thin'));\n      arcLabel(g,vx,vy,ar*.62,0,p,p+'°','tsm');arcLabel(g,vx,vy,ar*.62,p,q,v?q+'°':(rev?q+'°':'?'),v?'tsm':'tlab hot');\n      arcLabel(g,vx,vy,ar*1.35+24,0,tot,v?(rev?`α = ${tot}°`:'α = ?'):`α = ${tot}°`,v?'tlab hot':'tlab');el('circle',{cx:vx,cy:vy,r:5,class:'vertex'},g);}};\n}\n\n/* --- Paket 8: Senkrechte & Parallelen --- */\nfunction lineThrough(g,x,y,ang,L,cls){const[x1,y1]=P(x,y,L,ang),[x2,y2]=P(x,y,L,ang+180);return ln(g,x1,y1,x2,y2,cls);}\nfunction t8lage(){\n  const th=rnd(0,17)*10,type=pick(['senk','par','keins','senk','par']),dd=type==='keins'?pick([-1,1])*pick([12,16,20,65,70,75]):0;\n  const opts=['senkrecht zueinander (⊥)','parallel zueinander (∥)','weder noch'],ans=type==='senk'?0:type==='par'?1:2;\n  return{short:'Senkrecht oder parallel?',opts,ans,ask:'Wie liegen die beiden Geraden zueinander?',\n    expl:type==='senk'?'Die Geraden schneiden sich im rechten Winkel (90°). Sie sind senkrecht zueinander: g ⊥ h.':type==='par'?'Die Geraden haben überall den gleichen Abstand und schneiden sich nie. Sie sind parallel: g ∥ h.':`Die Geraden schneiden sich unter ${Math.abs(dd)}°, nicht im rechten Winkel. Sie sind weder senkrecht noch parallel.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),cx=W/2,cy=H/2,L=Math.min(W,H)*.42;\n      if(type==='senk'){lineThrough(g,cx,cy,th,L,'ray r1 thin');const[px,py]=P(cx,cy,L*.3,th);lineThrough(g,px,py,th+90,L*.8,'ray r2 thin');\n        if(rev){const r=16,[a1,b1]=P(px,py,r,th),[a2,b2]=P(px,py,r*Math.SQRT2,th+45),[a3,b3]=P(px,py,r,th+90);el('path',{d:`M ${a1} ${b1} L ${a2} ${b2} L ${a3} ${b3}`,class:'rsq'},g);}}\n      else if(type==='par'){const[p1x,p1y]=P(cx,cy,L*.28,th+90),[p2x,p2y]=P(cx,cy,L*.28,th-90);lineThrough(g,p1x,p1y,th,L,'ray r1 thin');lineThrough(g,p2x,p2y,th,L,'ray r2 thin');}\n      else{const[p1x,p1y]=P(cx,cy,L*.3,th+90),[p2x,p2y]=P(cx,cy,L*.3,th-90);lineThrough(g,p1x,p1y,th,L,'ray r1 thin');lineThrough(g,p2x,p2y,th+dd,L,'ray r2 thin');}\n      tx(g,24,H-24,'g','tlab r1t');tx(g,48,H-24,'h','tlab r2t');}};\n}\nconst SHAPES=[\n  ['Rechteck',[[0,0],[4,0],[4,2.4],[0,2.4]]],['Quadrat',[[0,0],[3,0],[3,3],[0,3]]],['rechtwinkliges Dreieck',[[0,0],[4,0],[0,3]]],\n  ['Dreieck',[[0,0],[4,0],[1.4,3]]],['Trapez',[[0,0],[4,0],[2.6,2.6],[0,2.6]]],['Viereck',[[0,0],[4,.5],[3.4,3],[.4,2.3]]],\n  ['Haus-Fünfeck',[[0,0],[3,0],[4.5,1.5],[3,3],[0,3]]],['Parallelogramm',[[0,0],[3.4,0],[4.6,2.4],[1.2,2.4]]],['Drachenviereck',[[0,0],[2,-1.4],[4,0],[2,3]]]\n];\nfunction rightCorners(pts){const n=pts.length,out=[];for(let i=0;i<n;i++){const A=pts[(i+n-1)%n],B=pts[i],C=pts[(i+1)%n];const u=[A[0]-B[0],A[1]-B[1]],v=[C[0]-B[0],C[1]-B[1]];\n  const ang=Math.acos((u[0]*v[0]+u[1]*v[1])/Math.hypot(...u)/Math.hypot(...v))*180/Math.PI;if(Math.abs(ang-90)<.6)out.push(i);}return out;}\nfunction t8recht(){\n  const[nm,pts0]=pick(SHAPES),rot=rnd(0,11)*30*Math.PI/180,pts=pts0.map(([x,y])=>[x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)]),rc=rightCorners(pts);\n  return{short:'Rechte Winkel in Figuren',num:true,unit:'',ans:rc.length,tol:0,ask:'Wie viele <b>rechte Winkel<\/b> hat die Figur? Prüfe mit der 90°-Ecke deines Geodreiecks.',\n    expl:rc.length?`Die Figur (${nm}) hat ${rc.length} rechte${rc.length===1?'n':''} Winkel. Sie sind jetzt grün markiert.`:`Die Figur (${nm}) hat keinen rechten Winkel. Kein Winkel ist genau 90°.`,\n    draw(svg,W,H,rev){const g=el('g',{},svg),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mny=Math.min(...ys),s=fitScale(W,H,Math.max(...xs)-mnx,Math.max(...ys)-mny,60);\n      const ox=(W-(Math.max(...xs)-mnx)*s)/2,oy=(H+(Math.max(...ys)-mny)*s)/2,Q=pts.map(([x,y])=>[ox+(x-mnx)*s,oy-(y-mny)*s]);\n      el('polygon',{points:Q.map(p=>p.join(',')).join(' '),class:'shape'},g);\n      if(rev)rc.forEach(i=>{const n=Q.length,B=Q[i],A=Q[(i+n-1)%n],C=Q[(i+1)%n],r=18,ua=[(A[0]-B[0]),(A[1]-B[1])],uc=[(C[0]-B[0]),(C[1]-B[1])],la=Math.hypot(...ua),lc=Math.hypot(...uc);\n        const p1=[B[0]+ua[0]/la*r,B[1]+ua[1]/la*r],p3=[B[0]+uc[0]/lc*r,B[1]+uc[1]/lc*r],p2=[p1[0]+uc[0]/lc*r,p1[1]+uc[1]/lc*r];el('path',{d:`M ${p1.join(' ')} L ${p2.join(' ')} L ${p3.join(' ')}`,class:'rsq'},g);});}};\n}\nfunction t8zeichnen(){\n  const par=Math.random()<.5,th=rnd(1,17)*10,off=rnd(0,1);\n  return{short:par?'Parallele zeichnen':'Senkrechte zeichnen',inter:true,target:par?th:th+90,\n    ask:par?'Zeichne die <b>Parallele<\/b> zu g durch den Punkt P. Zieh mit dem Finger: Die Linie dreht sich um P.':'Zeichne die <b>Senkrechte<\/b> zu g durch den Punkt P. Zieh mit dem Finger: Die Linie dreht sich um P.',\n    expl:par?'Parallelen zeichnest du mit den parallelen Hilfslinien des Geodreiecks: Eine Hilfslinie auf g legen, das Geodreieck bis P verschieben und entlang der langen Kante zeichnen.':'Senkrechte zeichnest du mit der Mittellinie: Die Mittellinie des Geodreiecks genau auf g legen, die lange Kante durch P, dann zeichnen. Den rechten Winkel mit ⦜ markieren.',\n    draw(svg,W,H,rev){const g=el('g',{},svg),cx=W/2,cy=H/2,L=Math.max(W,H);const q=G.q;\n      lineThrough(g,cx,cy,th,L,'ray r1 thin');tx(g,...P(cx,cy,Math.min(W,H)*.42,th),'g','tlab r1t');\n      const[px,py]=off?P(cx,cy,Math.min(W,H)*.26,th+90):P(cx,cy,Math.min(W,H)*.2,th+120);q.P=[px,py];\n      if(rev)lineThrough(g,px,py,q.target,L,'ghost');\n      if(G.drawVal!=null)lineThrough(g,px,py,G.drawVal,L,'ray r2 thin');\n      el('circle',{cx:px,cy:py,r:7,class:'pt'},g);tx(g,px+16,py-16,'P','tlab');\n      if(G.drawVal==null&&!rev)tx(svg,W/2,H-22,'Tippe und zieh','help');\n      if(rev||G.locked)return;\n      const setA=e=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,kx=vb.width/r.width,ky=vb.height/r.height;\n        const a=Math.atan2(-((e.clientY-r.top)*ky-py),(e.clientX-r.left)*kx-px)*180/Math.PI;G.drawVal=Math.round(((a%180)+180)%180);redraw();const d=$('#done');if(d)d.disabled=false;};\n      svg.onpointerdown=e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}G.dragging=true;setA(e);};\n      svg.onpointermove=e=>{if(G.dragging)setA(e);};svg.onpointerup=svg.onpointercancel=()=>{G.dragging=false;};}};\n}\nconst W8=[\n  ['Welches Zeichen bedeutet „senkrecht zueinander“?','⊥',['∥','=','∠']],\n  ['Welches Zeichen bedeutet „parallel zueinander“?','∥',['⊥','≈','∠']],\n  ['Zwei Geraden schneiden sich nie und haben überall den gleichen Abstand. Sie sind …','parallel',['senkrecht','gestreckt','überstumpf']],\n  ['Zwei Geraden bilden einen rechten Winkel. Sie sind …','senkrecht zueinander',['parallel','gleich lang','spitz']],\n  ['Mit welchem Teil des Geodreiecks zeichnest du am einfachsten Parallelen?','mit den parallelen Hilfslinien',['mit der äußeren Winkelskala','mit der 45°-Ecke','mit dem Nullpunkt allein']],\n  ['Wie viele rechte Winkel hat jedes Rechteck?','4',['2','1','keinen']],\n  ['Du sollst eine Parallele im Abstand von 1 cm zeichnen. Was hilft dir?','die Hilfslinie mit der Beschriftung 1 auf dem Geodreieck',['die 90°-Ecke','die Zahl 10 auf der Winkelskala','die 45°-Ecke']]\n];\nfunction t8wissen(){const[q,c,d]=pick(W8),m=mcOpts(c,d);return Object.assign(m,{short:'Wissen: Senkrechte & Parallelen',ask:q,expl:`Richtig ist: ${c}.`,\n  draw(svg,W,H){const g=el('g',{},svg),cx=W/2,cy=H/2,L=Math.min(W,H)*.36;lineThrough(g,cx,cy-L*.3,0,L,'ray r1 thin');lineThrough(g,cx,cy+L*.3,0,L,'ray r1 thin');lineThrough(g,cx,cy,90,L*.8,'ray r2 thin');}});}\n\nconst TASKS={p5:[t5dreh,t5wohin,t5kurs,t5bruch,t5koord],p6:[t6teil,t6griech,t6geo,t6wissen],p7:[t7neben,t7voll,t7scheitel,t7dreieck,t7trick,t7summe],p8:[t8lage,t8recht,t8zeichnen,t8wissen]};\nconst selA=()=>PACKS.some(p=>p.gen&&S.sel.includes(p.id));\nconst selT=()=>PACKS.some(p=>p.task&&S.sel.includes(p.id));\nfunction genTask(){\n  let packs=PACKS.filter(p=>p.task&&S.sel.includes(p.id));\n  let p;if(G.mode==='test'){G.tp=(G.tp||0)+1;if(!G.tpo)G.tpo=shuffle(packs);p=G.tpo[G.tp%G.tpo.length];}else p=pick(packs);\n  let f;for(let t=0;t<10;t++){f=pick(TASKS[p.id]);if(f!==G.lastF)break;}G.lastF=f;\n  return Object.assign(f(),{kind:'task',pack:p.id});\n}\nfunction taskAnsText(q,v){if(q.opts)return q.opts[v];if(q.inter)return v==null?'–':v+'°';return v+(q.unit==null?'°':q.unit);}\nfunction taskRightText(q){if(q.opts)return q.opts[q.ans];if(q.inter)return q.short;return q.ans+(q.unit==null?'°':q.unit);}\nfunction gradeTask(q,v){\n  if(q.inter){const d0=Math.abs(((v-q.target)%180+180)%180),d=Math.min(d0,180-d0),sc=d<=3?1:d<=7?.5:0;\n    return{correct:sc===1,score:sc,msg:(sc===1?pick(PRAISE)+' ':sc?`Fast: ${d}° daneben. `:`Leider ${d}° daneben. `)+q.expl};}\n  const ok=q.opts?+v===q.ans:Math.abs(v-q.ans)<=(q.tol||0);\n  return{correct:ok,score:ok?1:0,msg:ok?`${pick(PRAISE)} ${q.expl}`:`Leider nein. Richtig ist <b>${taskRightText(q)}<\/b>. ${q.expl}`};\n}\n\nfunction okFor(kind,d){\n  if(kind==='measure'||kind==='estimate')return d>=10&&d<=350;\n  if(kind==='draw')return d>=5&&d<=355;\n  if(kind==='visual')return!((Math.abs(d-90)<6&&d!==90)||(Math.abs(d-180)<6&&d!==180)||(d>0&&d<6)||(d>354&&d<360));\n  return true;\n}\nfunction genDeg(kind){\n  const packs=PACKS.filter(p=>p.gen&&S.sel.includes(p.id));\n  for(let t=0;t<80;t++){const p=pick(packs),d=p.gen();if(d===lastDeg||!okFor(kind,d))continue;lastDeg=d;return{deg:d,pack:p.id};}\n  const p=pick(packs);let d=p.gen();\n  if(!okFor(kind,d)){d=d<180?rnd(20,80):rnd(200,340);}\n  lastDeg=d;return{deg:d,pack:p.id};\n}\nfunction rotFor(kind){\n  if(S.diff==='profi')return rnd(0,359);\n  if(kind==='measure'||kind==='draw')return 0;\n  return pick([0,0,0,90,180,270]);\n}\nfunction stopAll(){\n  if(!G)return;\n  clearInterval(G.timer);clearTimeout(G.to);\n  if(G.ro)G.ro.disconnect();\n}\nfunction startMode(m){\n  if(m==='learn')return learn();\n  if(!S.sel.length)return;\n  stopAll();\n  G={mode:m,i:0,total:m==='test'?12:m==='time'?Infinity:10,score:0,log:[],locked:false,xp:0,finished:false};\n  if(m==='test'){const a=selA(),t=selT();G.kinds=shuffle(a&&t?['degree','degree','visual','visual','measure','measure','measure','draw','task','task','task','task','task','task','task']:t?Array(12).fill('task'):['degree','degree','degree','degree','visual','visual','visual','visual','measure','measure','measure','draw']);G.total=G.kinds.length;}\n  app.innerHTML=`<div class=\"game\">\n    <div class=\"gbar\"><button class=\"icon-btn\" id=\"back\" aria-label=\"Abbrechen\">✕<\/button>\n      <div class=\"gtitle\">${MODES[m].icon} ${MODES[m].title}<\/div><div class=\"gprog\" id=\"gprog\"><\/div>\n      ${m==='time'?'<div class=\"timebar\" id=\"timebar\"><\/div>':''}<\/div>\n    <div class=\"gbody\"><div class=\"stage\" id=\"stage\"><div class=\"zoomctl\" id=\"zoomctl\" hidden><button type=\"button\" data-z=\"-1\" aria-label=\"Verkleinern\">−<\/button><span class=\"zl\">1×<\/span><button type=\"button\" data-z=\"1\" aria-label=\"Vergrößern\">+<\/button><\/div><svg id=\"svg\" xmlns=\"${NS}\"><\/svg><svg id=\"geo\" xmlns=\"${NS}\"><\/svg><div class=\"bignum\" id=\"bignum\" hidden><\/div><\/div>\n    <div class=\"panel\" id=\"panel\"><\/div><\/div><\/div>`;\n  $('#back').onclick=home;\n  $('#zoomctl').querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>zoomStep(+b.dataset.z));\n  if(m==='time'){G.end=Date.now()+60000;G.timer=setInterval(tick,100);}\n  if('ResizeObserver' in window){let raf=0;G.ro=new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(redraw);});G.ro.observe($('#stage'));}\n  next();\n}\nfunction tick(){\n  const left=Math.max(0,G.end-Date.now());\n  const tb=$('#timebar');if(tb)tb.style.width=(left/600)+'%';\n  const tt=$('#ttext');if(tt)tt.textContent=Math.ceil(left/1000)+' s';\n  if(left<=0)finish();\n}\nfunction kindFor(){const m=G.mode;if(m==='test')return G.kinds[G.i];if(m==='time')return Math.random()<.5?'visual':'degree';return m;}\nfunction next(){\n  if(G.finished)return;\n  if(G.i>=G.total)return finish();\n  G.locked=false;G.drawVal=null;G.revealed=false;G.buf='';\n  const kind=kindFor();\n  if(kind==='task')G.q=genTask();\n  else{const d=genDeg(kind);G.q={kind,deg:d.deg,pack:d.pack,rot:rotFor(kind)};}\n  renderQ();\n}\nfunction redraw(){\n  if(!G||G.finished||!G.q||!$('#stage'))return;\n  const q=G.q;\n  if(q.kind==='task'){const{svg,W,H}=prepSvg();q.draw(svg,W,H,!!G.revealed);}\n  else if(q.kind==='draw'){setupDraw();if(G.revealed)revealDraw();}\n  else if(q.kind!=='degree')renderAngle(q,{reveal:G.revealed});\n  renderGeo();\n}\nfunction renderQ(){\n  const q=G.q,m=G.mode;\n  $('#gprog').innerHTML=m==='time'?`${G.score} Punkte · <span id=\"ttext\">${Math.ceil(Math.max(0,G.end-Date.now())/1000)} s<\/span>`:`${G.i+1} / ${G.total}`;\n  const bn=$('#bignum');bn.hidden=q.kind!=='degree';\n  if(q.kind==='degree'){prepSvg();bn.textContent=q.deg+'°';}\n  else if(q.kind==='task'){const{svg,W,H}=prepSvg();q.draw(svg,W,H,false);}\n  else if(q.kind==='draw')setupDraw();\n  else renderAngle(q);\n  renderGeo();\n  renderPanel();\n  ZM.px=0;ZM.py=0;zoomApply();\n}\nfunction askText(q){\n  switch(q.kind){\n    case'measure':return'Miss den markierten Winkel mit deinem Geodreieck. Wie viel Grad hat er?';\n    case'visual':return'Welche Winkelart siehst du?';\n    case'degree':return'Welche Winkelart hat diese Gradzahl?';\n    case'estimate':return'Schätze ohne Geodreieck: Wie viel Grad hat der Winkel?';\n    case'draw':return`Zeichne einen Winkel von <span class=\"tgt\">${q.deg}°<\/span>.<br><small style=\"color:var(--muted)\">Der Bogen zeigt dir, welcher Winkel entsteht (gegen den Uhrzeigersinn).<\/small>`;\n  }\n}\nfunction renderPanel(){\n  const q=G.q,p=$('#panel'),test=G.mode==='test';\n  p.classList.remove('answered');\n  let h=`<div class=\"ask\">${test?'<small style=\"color:var(--muted)\">Test: Auswertung erst am Ende<\/small><br>':''}${q.kind==='task'?q.ask:askText(q)}<\/div>`;\n  if(q.kind==='task'){\n    if(q.opts){const wide=q.opts.some(o=>o.length>12);h+=`<div class=\"types${wide?' wide':''}\">${q.opts.map((o,i)=>`<button class=\"tbtn\" data-t=\"${i}\">${o}<\/button>`).join('')}<\/div>`;}\n    else if(q.inter)h+=`<button class=\"big go\" id=\"done\" ${G.drawVal==null?'disabled':''}>Fertig ✔<\/button>`;\n    else h+=`<div class=\"npd\" id=\"npd\">– ${q.unit==null?'°':q.unit}<\/div><div class=\"numpad\">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n=\"${n}\">${n}<\/button>`).join('')}<button data-n=\"del\" aria-label=\"Löschen\">⌫<\/button><button data-n=\"0\">0<\/button><button data-n=\"ok\" class=\"ok\">OK<\/button><\/div>`;\n    h+=`<div id=\"fb\"><\/div>`;\n  }else{\n  if(q.kind==='measure')h+=`<div class=\"geoctl\" id=\"geoctl\"><\/div>`;\n  if(q.kind==='visual'||q.kind==='degree')h+=`<div class=\"types\">${TYPE_ORDER.map(t=>`<button class=\"tbtn\" data-t=\"${t}\">${TYPES[t].short}<\/button>`).join('')}<\/div>`;\n  else if(q.kind==='draw')h+=`<button class=\"big go\" id=\"done\" ${G.drawVal==null?'disabled':''}>Fertig ✔<\/button>`;\n  else h+=`<div class=\"npd\" id=\"npd\">– °<\/div><div class=\"numpad\">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n=\"${n}\">${n}<\/button>`).join('')}<button data-n=\"del\" aria-label=\"Löschen\">⌫<\/button><button data-n=\"0\">0<\/button><button data-n=\"ok\" class=\"ok\">OK<\/button><\/div>`;\n  if(q.kind==='measure'&&!test)h+=`<button class=\"hintbtn\" id=\"hintbtn\">💡 Tipp zum Messen<\/button><div class=\"hint\" id=\"hint\" hidden>${HINT}<\/div>`;\n  h+=`<div id=\"fb\"><\/div>`;}\n  p.innerHTML=h;p.scrollTop=0;\n  if(q.kind==='measure')renderGeoCtl();\n  p.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>answer(b.dataset.t));\n  p.querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{\n    const n=b.dataset.n;\n    if(n==='del')G.buf=G.buf.slice(0,-1);\n    else if(n==='ok'){if(G.buf!=='')return answer(parseInt(G.buf,10));}\n    else if(G.buf.length<3)G.buf=(G.buf==='0'?'':G.buf)+n;\n    $('#npd').textContent=(G.buf||'–')+' '+(q.kind==='task'&&q.unit!=null?q.unit:'°');\n  });\n  const d=$('#done');if(d)d.onclick=()=>{if(G.drawVal!=null)answer(G.drawVal);};\n  const hb=$('#hintbtn');if(hb)hb.onclick=()=>{const hi=$('#hint');hi.hidden=!hi.hidden;};\n}\nfunction grade(q,v){\n  if(q.kind==='task')return gradeTask(q,v);\n  const T=typeOf(q.deg),TT=TYPES[T];\n  if(q.kind==='visual'||q.kind==='degree'){\n    const c=v===T;\n    return{correct:c,score:c?1:0,msg:c?`${pick(PRAISE)} ${q.deg}° ist ${TT.s}.`:`Leider nein. ${q.deg}° ist ${TT.s}: ${TT.range}.`};\n  }\n  if(q.kind==='measure'){\n    const d=Math.abs(v-q.deg);\n    let msg;\n    if(d===0)msg=`Exakt ${q.deg}°! 🎯`;\n    else if(d<=2)msg=`${pick(PRAISE)} Genau sind es ${q.deg}° – du hattest ${v}°.`;\n    else if(q.deg>180&&Math.abs(v-(360-q.deg))<=3)msg=`Du hast den Innenwinkel gemessen (${v}°). Der markierte Winkel ist überstumpf: 360° − ${360-q.deg}° = ${q.deg}°.`;\n    else if(q.deg<180&&Math.abs(v-(180-q.deg))<=3)msg=`Skala verwechselt? Du hast ${v}° abgelesen, richtig sind ${q.deg}°. Lies auf der Skala ab, die am blauen Schenkel bei 0 beginnt.`;\n    else if(d<=5)msg=`Knapp daneben: Richtig sind ${q.deg}°, du hattest ${v}°. Leg den Nullpunkt ganz genau auf den Scheitel.`;\n    else msg=`Richtig wären ${q.deg}°. Du hattest ${v}°. Schau dir den Tipp zum Messen an.`;\n    return{correct:d<=2,score:d<=2?1:d<=5?.5:0,msg};\n  }\n  if(q.kind==='estimate'){\n    const d=Math.abs(v-q.deg),score=d<=5?1:d<=10?.66:d<=20?.33:0,st=Math.round(score*3);\n    return{correct:d<=10,score,msg:`<span style=\"color:var(--arc);font-size:24px\">${'★'.repeat(st)}${'☆'.repeat(3-st)}<\/span><br>Tatsächlich: ${q.deg}° – du lagst ${d}° ${d===0?'daneben? Nein, genau richtig!':'daneben.'}`};\n  }\n  const d=Math.abs(v-q.deg);\n  return{correct:d<=5,score:d<=5?1:d<=10?.5:0,msg:d<=5?`${pick(PRAISE)} Dein Winkel: ${v}°, Ziel: ${q.deg}°.`:`Dein Winkel: ${v}°, Ziel: ${q.deg}°. Die gestrichelte Linie zeigt, wo der Schenkel hingehört.`};\n}\nfunction markButtons(val){\n  const T=typeOf(G.q.deg);\n  document.querySelectorAll('.tbtn').forEach(b=>{if(b.dataset.t===T)b.classList.add('ok');else if(b.dataset.t===val)b.classList.add('bad');});\n}\nfunction flash(ok){const st=$('#stage');if(!st)return;st.classList.add(ok?'fok':'fbad');setTimeout(()=>st.classList.remove('fok','fbad'),450);}\nfunction answer(val){\n  if(!G||G.locked||G.finished)return;\n  G.locked=true;\n  const q=G.q,r=grade(q,val);\n  G.log.push({q,val,r});\n  recordStat(q.pack,r.correct);\n  if(G.mode==='test'){G.i++;return next();}\n  if(q.kind==='visual'||q.kind==='degree')markButtons(val);\n  if(q.kind==='task'&&q.opts)document.querySelectorAll('.tbtn').forEach(b=>{if(+b.dataset.t===q.ans)b.classList.add('ok');else if(b.dataset.t===String(val))b.classList.add('bad');});\n  sfx(r.correct?'ok':'bad');flash(r.correct);\n  if(G.mode==='time'){\n    if(r.correct)G.score++;\n    const gp=$('#gprog');if(gp)gp.firstChild.nodeValue=`${G.score} Punkte · `;\n    G.to=setTimeout(next,r.correct?350:1200);return;\n  }\n  const xp=q.kind==='estimate'?Math.round(r.score*3)*4:r.score===1?10:r.score>0?5:0;\n  if(xp){G.xp+=xp;addXP(xp);}\n  G.revealed=true;\n  if(q.kind==='task')redraw();else if(q.kind==='draw')revealDraw();else if(q.kind!=='degree')renderAngle(q,{reveal:true});\n  $('#panel').classList.add('answered');\n  const fb=$('#fb');\n  fb.innerHTML=`<div class=\"fbox ${r.correct?'ok':r.score>0?'half':'bad'}\"><div>${r.msg}<\/div>${xp?`<div class=\"xpgain sm\">+${xp} XP<\/div>`:''}<button class=\"big go\" id=\"weiter\">${G.i+1>=G.total?'Auswertung ▶':'Weiter ▶'}<\/button><\/div>`;\n  $('#weiter').onclick=()=>{G.i++;next();};\n  fb.scrollIntoView({behavior:'smooth',block:'nearest'});\n}\nfunction noteFor(p){return p>=92?1:p>=81?2:p>=67?3:p>=50?4:p>=30?5:6;}\nfunction fmt(n){return(Math.round(n*100)/100).toLocaleString('de-DE');}\nfunction finish(){\n  if(G.finished)return;\n  stopAll();G.finished=true;\n  const m=G.mode,k=combo();let body='';\n  if(m==='time'){\n    const old=S.high[k]||0,rec=G.score>old;\n    if(rec){S.high[k]=G.score;save();}\n    const xp=G.score*5;if(xp)addXP(xp);\n    body=`<div class=\"rbig\">${G.score}<\/div><p>richtige Antworten in 60 Sekunden<\/p><p>${rec&&G.score>0?'🏆 Neuer Rekord!':'Rekord: '+old}<\/p>${xp?`<div class=\"xpgain\">+${xp} XP<\/div>`:''}`;\n    if(rec&&G.score>0)confetti();\n  }else if(m==='test'){\n    const max=G.log.length,pts=G.log.reduce((a,l)=>a+l.r.score,0),pct=pts/max*100,n=noteFor(pct);lzRec(\"W\",S.sel,n);\n    if(!S.grades[k]||n<S.grades[k]){S.grades[k]=n;save();}\n    const xp=[0,100,80,60,40,20,10][n];addXP(xp);\n    const rv=G.log.map((l,i)=>{\n      const q=l.q,r=l.r,T=q.kind==='task'?null:typeOf(q.deg);let t;\n      if(q.kind==='task')t=`${q.short}: ${taskAnsText(q,l.val)}${r.score===1?'':` (richtig: ${taskRightText(q)})`}`;\n      else if(q.kind==='degree')t=`${q.deg}° einordnen: ${TYPES[l.val].short}${r.correct?'':` (richtig: ${TYPES[T].short})`}`;\n      else if(q.kind==='visual')t=`Winkelart im Bild: ${TYPES[l.val].short}${r.correct?'':` (richtig: ${TYPES[T].short}, ${q.deg}°)`}`;\n      else if(q.kind==='measure')t=`Messen: ${l.val}° (richtig: ${q.deg}°)`;\n      else t=`${q.deg}° zeichnen: du hattest ${l.val}°`;\n      const c=r.score===1?'ok':r.score>0?'half':'bad';\n      return`<li class=\"${c}\"><span>${r.score===1?'✓':r.score>0?'½':'✗'}<\/span>${i+1}. ${t}<\/li>`;\n    }).join('');\n    body=`<div class=\"note n${n}\">Note ${n}<\/div><p>${NOTE_TXT[n]} · ${fmt(pts)} von ${max} Punkten (${Math.round(pct)} %)<\/p>${window.lzEval?lzEval(S.sel,n):''}<div class=\"xpgain\">+${xp} XP<\/div><ul class=\"review\">${rv}<\/ul>`;\n    if(n<=2)confetti();\n  }else{\n    const c=G.log.filter(l=>l.r.correct).length,pct=c/G.log.length;\n    const st=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;\n    body=`<div class=\"rstars\">${'★'.repeat(st)}${'☆'.repeat(3-st)}<\/div><div class=\"rbig\">${c} / ${G.log.length}<\/div><p>${m==='estimate'?'gut geschätzt (höchstens 10° daneben)':m==='draw'?'genau gezeichnet (höchstens 5° daneben)':'richtig'}<\/p>${G.xp?`<div class=\"xpgain\">+${G.xp} XP<\/div>`:''}`;\n    if(st===3)confetti();\n  }\n  app.innerHTML=`<div class=\"result\"><div class=\"rcard\"><div class=\"rtitle\">${MODES[m].icon} ${MODES[m].title}<\/div>${body}<div class=\"rbtns\"><button class=\"big go\" id=\"again\">Nochmal<\/button><button class=\"big sec\" id=\"tohome\">Zur Basis<\/button><\/div><\/div><\/div>`;\n  $('#again').onclick=()=>startMode(m);$('#tohome').onclick=home;\n}\n\n/* Wissen */\nfunction miniSVG(deg){\n  const W=170,H=120,{vx,vy,L}=layout(W,H,deg,0,16,54),ar=Math.min(26,L*.4);\n  let s=`<svg viewBox=\"0 0 ${W} ${H}\" width=\"${W}\" height=\"${H}\" aria-hidden=\"true\">`;\n  if(deg>=360)s+=`<circle cx=\"${vx}\" cy=\"${vy}\" r=\"${ar}\" class=\"arcf\"/>`;\n  else if(deg>0)s+=`<path d=\"${arcPath(vx,vy,ar,0,deg)}\" class=\"arcf\"/>`;\n  const[x1,y1]=P(vx,vy,L,0),[x2,y2]=P(vx,vy,L,deg);\n  s+=`<line x1=\"${vx}\" y1=\"${vy}\" x2=\"${x1}\" y2=\"${y1}\" class=\"ray r1\"/><line x1=\"${vx}\" y1=\"${vy}\" x2=\"${x2}\" y2=\"${y2}\" class=\"ray r2\"/>`;\n  if(deg===90){const[dx,dy]=P(vx,vy,ar*.5,45);s+=`<circle cx=\"${dx}\" cy=\"${dy}\" r=\"3.5\" class=\"dot\"/>`;}\n  return s+`<circle cx=\"${vx}\" cy=\"${vy}\" r=\"4.5\" class=\"vertex\"/><\/svg>`;\n}\nfunction learn(){\n  stopAll();G=null;\n  const ex={null:0,spitz:45,recht:90,stumpf:130,gestreckt:180,ueber:250,voll:360};\n  app.innerHTML=`<div class=\"learn\"><button class=\"btn-s back\" id=\"lb\">← Zur Basis<\/button>\n  <h2>📡 Die sieben Winkelarten<\/h2>\n  <div class=\"tcards\">${TYPE_ORDER.map(t=>`<div class=\"tcard\">${miniSVG(ex[t])}<b>${t==='null'||t==='voll'?TYPES[t].short:TYPES[t].s.replace('ein ','').replace(/^./,c=>c.toUpperCase())}<\/b><span>${TYPES[t].range}<\/span><\/div>`).join('')}<\/div>\n  <h2>📐 So misst du mit dem Geodreieck<\/h2>\n  <div class=\"box\">${HINT}<\/div>\n  <h2>🪐 Überstumpfe Winkel messen<\/h2>\n  <div class=\"box\">Kein Geodreieck dabei? Beim Messen kannst du ein virtuelles einblenden.<br><br>Das Geodreieck geht nur bis 180°. Darum misst du den <b>kleinen Winkel auf der anderen Seite<\/b> und ziehst ihn von 360° ab.<br>Beispiel: Der kleine Winkel hat 110°. Dann hat der überstumpfe Winkel 360° − 110° = <b>250°<\/b>.<\/div>\n  <h2>💡 Merkhilfen<\/h2>\n  <div class=\"box\">Spitz wie die Nase einer Rakete, stumpf wie ein aufgeklappter Laptop, gestreckt wie ein gerader Laserstrahl. Ein Vollwinkel ist eine komplette Umdrehung – wie ein Raumschiff, das einmal im Kreis fliegt.<\/div>${LEARN2}<\/div>`;\n  $('#lb').onclick=home;app.scrollTop=0;\n}\n\n\n/* ===== Checkliste der Schule ===== */\nconst ALL_IDS=PACKS.map(p=>p.id);\nconst A14=['p1','p2','p3','p4'],A13=['p1','p2','p3'];\nconst CL_KANN=[\n  {t:'… Winkelgrößen von einem Kompass entnehmen.',packs:['p5'],m:'task'},\n  {t:'… Winkelarten unterscheiden und sie mit den griechischen Buchstaben α, β, γ und δ bezeichnen.',packs:['p1','p2','p3','p4','p6'],m:'visual'},\n  {t:'… mit dem Geodreieck umgehen und Winkel messen.',packs:A13,m:'measure'},\n  {t:'… Winkel nach vorgegebenen Größen zeichnen.',packs:['p1','p2','p3','p7','p8'],m:'draw'},\n  {t:'… mein Wissen überprüfen.',test:true,packs:ALL_IDS,m:'test'}\n];\nconst CL_TEILE=[\n  ['Gemeinsamer Start mit dem Kompass'],\n  {n:1,t:'ml S. 36: blauer Kasten + Nr. 1',app:'Paket 5 · Aufgaben-Mission',packs:['p5'],m:'task'},\n  {n:2,t:'ml S. 37: blauen Kasten lesen, Nr. 2, 5, 6, 7',app:'Paket 5 · Drehungen, Bruchteile, Himmelsrichtungen',packs:['p5'],m:'task'},\n  {n:3,t:'AH S. 12: alle Aufgaben',app:'Paket 5 · Aufgaben-Mission',packs:['p5'],m:'task'},\n  ['Einführung Winkel · Winkelarten und griechische Buchstaben'],\n  {n:4,t:'Infoblatt „Der Winkel“, Infoblatt „Griechische Buchstaben“, AB „Der Winkel“',app:'Paket 6 · Teile des Winkels, α bis ε',packs:['p6'],m:'task'},\n  {n:5,t:'AH S. 13: alle Aufgaben',app:'Pakete 1–4 · Winkelart erkennen',packs:A14,m:'visual'},\n  {n:6,t:'Winkelarten an der Tafel + AB „Die Winkelarten“',app:'Pakete 1–4 · Gradzahl einordnen',packs:A14,m:'degree'},\n  {n:7,t:'ml S. 39: Nr. 4, 5, 6',app:'Pakete 1–4 · Winkelart erkennen',packs:A14,m:'visual'},\n  {n:8,t:'AH S. 14: Nr. 1, 2, 3, 5',app:'Pakete 1–4 · Schätzen',packs:A14,m:'estimate'},\n  {n:9,t:'Winkelscheiben ausschneiden',app:'Basteln im Heft · in der App passt Schätzen dazu',packs:A14,m:'estimate'},\n  {n:10,t:'ml S. 39: Nr. 7 b + c',app:'Pakete 1–4 · Gradzahl einordnen',packs:A14,m:'degree'},\n  ['Einführung Geodreieck · Winkel messen'],\n  {n:11,t:'AB „Das Geodreieck“',app:'Paket 6 · Teile des Geodreiecks',packs:['p6'],m:'task'},\n  {n:12,t:'Übungsheft Geodreieck (für die LZ)',app:'Paket 8 · Senkrechte & Parallelen',packs:['p8'],m:'task'},\n  {n:13,t:'Infoblatt „Winkel messen 1 + 2“',app:'Wissen lesen, dann Messen',packs:A13,m:'learn'},\n  {n:14,t:'AB „Winkel messen – spitze Winkel 1 + 2“',app:'Paket 1 · Messen',packs:['p1'],m:'measure'},\n  {n:15,t:'AB „Winkel messen – Einstieg“',app:'Pakete 1–3 · Messen',packs:A13,m:'measure'},\n  {n:16,t:'AB „Winkel messen – stumpfe Winkel 1 + 2“',app:'Paket 2 · Messen',packs:['p2'],m:'measure'},\n  {n:17,t:'Für Schnelle: ABs „Winkel messen I + II“',app:'Pakete 1–4 · Messen mit Einstellung „Profi“',packs:A14,m:'measure'},\n  ['Winkel zeichnen'],\n  {n:18,t:'Infoblatt „Winkel zeichnen 1 + 2“',app:'Wissen lesen, dann Winkel zeichnen',packs:A13,m:'learn'},\n  {n:19,t:'ABs „Winkel zeichnen“: spitze, stumpfe und überstumpfe Winkel 1',app:'Pakete 1–3 · Winkel zeichnen',packs:A13,m:'draw'},\n  {n:20,t:'ml S. 41: Nr. 4, 5, 7 (beides dauert!)',app:'Winkel zeichnen + Paket 7 (Scheitelwinkel, Dreieck)',packs:['p1','p2','p3','p7'],m:'draw'},\n  {n:21,t:'ml S. 42: blauen Kasten lesen + Nr. 9, 12, 13',app:'Paket 7 · Winkel berechnen',packs:['p7'],m:'task'},\n  {n:22,t:'AH S. 16: alle Aufgaben',app:'Paket 7 · Winkel berechnen',packs:['p7'],m:'task'},\n  {n:23,t:'Für Schnelle: AH S. 17 (Schatzsuche), AB „Partnerbogen Kreis und Winkel“, Übungskartei Winkel',app:'Paket 5 (Kurs, Koordinaten) + Paket 7',packs:['p5','p7'],m:'task'},\n  ['Mein Wissen überprüfen'],\n  {n:24,t:'AH S. 18: Test (links leicht, rechts mittel)',app:'Abschlusstest mit allen 8 Paketen',packs:ALL_IDS,m:'test'}\n];\nconst packDoneW=id=>!!(S.stats[id]&&S.stats[id].done);\nfunction kannState(r){\n  if(r.test){const g=S.grades[ALL_IDS.slice().sort().join('+')];return g&&g<=2?['ok',`Note ${g} im Abschlusstest mit allen Paketen`]:g?['half',`Beste Note ${g}, Ziel: 1 oder 2`]:['no','Abschlusstest mit allen 8 Paketen machen'];}\n  const d=r.packs.filter(packDoneW).length;return d===r.packs.length?['ok','Alle Lernziele dazu erreicht']:d?['half',`${d} von ${r.packs.length} Lernzielen erreicht`]:['no','Noch kein Lernziel dazu erreicht'];\n}\nfunction clCounts(){return{k:CL_KANN.filter(r=>kannState(r)[0]==='ok').length,d:CL_TEILE.filter(r=>r.n&&S.cl[r.n]).length};}\nfunction clCard(){const c=clCounts();return`<div class=\"clcard\"><div><b>✅ Checkliste „Karte und Kompass – Winkel“<\/b><small>${c.k} von 5 Zielen erreicht · ${c.d} von 24 Schulaufgaben abgehakt<\/small><\/div><button class=\"big go\" id=\"clOpen\">Checkliste öffnen<\/button><\/div>`;}\nfunction clGo(packs,m){if(m==='learn'){S.sel=packs.slice();save();return learn();}S.sel=packs.slice();save();home();setTimeout(()=>{const t=app.querySelector('[data-m=\"'+m+'\"]');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.focus();}},60);}\nfunction checklist(){\n  stopAll();G=null;const y=app.scrollTop;\n  const pn=ps=>ps.length===8?'alle Pakete':'Paket '+ps.map(id=>packById(id).nr).join(', ');\n  const kann=CL_KANN.map((r,i)=>{const[st,txt]=kannState(r);return`<div class=\"cl-row${st==='ok'?' done':''}\"><span class=\"cl-nr\">${st==='ok'?'✓':i+1}<\/span><div class=\"cl-t\"><b>Ich kann ${r.t}<\/b><small>${pn(r.packs)} · ${txt}<\/small><\/div><span class=\"cl-chip ${st}\">${st==='ok'?'geschafft':st==='half'?'teilweise':'offen'}<\/span><button class=\"cl-go\" data-k=\"${i}\">Üben ▶<\/button><\/div>`;}).join('');\n  const teile=CL_TEILE.map(r=>{if(!r.n)return`<div class=\"cl-sec\">${r[0]}<\/div>`;const on=!!S.cl[r.n];\n    return`<div class=\"cl-row${on?' done':''}\"><input type=\"checkbox\" class=\"cl-cb\" id=\"cl${r.n}\" data-n=\"${r.n}\" ${on?'checked':''}><span class=\"cl-nr\">${r.n}<\/span><label class=\"cl-t\" for=\"cl${r.n}\"><b>${r.t}<\/b><small>In der App: ${r.app}${on?` · erledigt am ${S.cl[r.n]}`:''}<\/small><\/label><button class=\"cl-go\" data-n=\"${r.n}\">Üben ▶<\/button><\/div>`;}).join('');\n  const c=clCounts();\n  app.innerHTML=`<div class=\"learn\"><button class=\"btn-s back\" id=\"lb\">← Zur Basis<\/button>\n    <h2>✅ Karte und Kompass – Winkel<\/h2><p class=\"sub\">Die Checkliste aus der Schule. Die Ziele werden grün, wenn du die Lernziele der passenden Pakete erreichst. Die Schulaufgaben hakst du selbst ab.<\/p>\n    <h2 style=\"font-size:20px\">🎯 Ich kann … <span class=\"cl-chip ${c.k===5?'ok':'no'}\">${c.k} / 5<\/span><\/h2><div class=\"cl-list\">${kann}<\/div>\n    <h2 style=\"font-size:20px\">📚 Aufgaben aus der Schule <span class=\"cl-chip ${c.d===24?'ok':'no'}\">${c.d} / 24<\/span><\/h2>\n    <p class=\"sub\">AH = Arbeitsheft Grundlagen 6 · ml = mathe live 6 · AB = Arbeitsblatt. „Üben ▶“ wählt die passenden Pakete und springt zur passenden Mission.<\/p>\n    <div class=\"cl-list\">${teile}<\/div><\/div>`;\n  $('
