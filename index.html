now?3:2,0,6.3);ctx.fill();});\n  if(W.car){const x=W.car.x*w,y=top-(W.pot&&Math.abs(x-cx)<hw?-10:Math.abs(x-cx)<hw?lift:0);ctx.fillStyle='#e0412f';ctx.fillRect(x-34,y-26,68,18);ctx.fillRect(x-20,y-38,38,14);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x-20,y-6,7,0,6.3);ctx.arc(x+20,y-6,7,0,6.3);ctx.fill();}\n  ctx.fillStyle='#222';ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(`🌡️ ${wkT(W.T)}  ·  Frost-Tau-Runden: ${W.cyc}`,8,18);};\n W.info=()=>{let t;if(W.pot)t='🕳️ <b>Schlagloch:<\/b> Beim Frost hat das Eis den Hohlraum vergrößert und den Asphalt angehoben. Nach dem Tauen braucht das Wasser wieder weniger Platz, unter dem Asphalt ist ein leerer Hohlraum. Das schwere Auto hat die Decke eingedrückt.';\n  else if(W.ice>.05&&W.T<=0)t='❄️ Das Wasser im Riss ist gefroren. Eis braucht mehr Platz: Es drückt den Hohlraum auseinander und <b>hebt den Asphalt an<\/b>. Solange das Eis da ist, stützt es die Straße.';\n  else if(W.ice>.05)t='🌤️ Das Eis taut. Das Wasser braucht wieder weniger Platz als das Eis.';\n  else if(W.hv>1.03&&W.w<W.hv-.05)t='⚠️ Nach dem Tauen ist der Hohlraum größer als vorher. Das Tauwasser versickert, der Hohlraum wird leer: Der Asphalt darüber hat keine Stütze mehr.';\n  else if(W.w>.05)t='💧 Regenwasser ist durch den Riss in den Hohlraum unter dem Asphalt gelaufen.';\n  else t='🛣️ Eine Straße mit einem kleinen Riss. Lass es regnen und probier dann Frost und Tauwetter aus.';\n  return t+(W.carInfo?`<br>🚗 ${W.carInfo}`:'');};\n W.check=hit=>{if(W.w>.3)hit('rain');if(W.hv>1.05&&W.ice>.3)hit('lift');if(W.winterOk)hit('winter');if(W.potNow)hit('pot');if(W.cyc>=3)hit('cyc');};\n W.speed=1.5;return W;},\n/* ---------- Acker ---------- */\nacker:()=>{const W={tg:8,T:8,rain:0,drops:[],cl:[],froze:false,cycles:0,sown:false,grow:0,freezeEv:0};\n const mk=()=>{W.cl=[];for(let i=0;i<9;i++)W.cl.push({x:.08+i*.105,y:.62+(i%2)*.1,r:.052,wet:0,frozen:false,seed:i});};mk();\n W.ctl=()=>`<label>Temperatur: <b id=\"wkl\">8 °C<\/b><input type=\"range\" id=\"wkr\" min=\"-15\" max=\"25\" value=\"8\"><\/label>\n  <div class=\"mxchips\"><button data-q=\"8\">🍂 Herbst 8 °C<\/button><button data-q=\"-10\">❄️ Winter −10 °C<\/button><button data-q=\"12\">🌷 Frühling 12 °C<\/button><\/div>\n  <div class=\"mxbtns\"><button class=\"big sec\" id=\"wkrain\">🌧️ Regen<\/button><button class=\"big sec\" id=\"wksow\">🌱 Säen<\/button><\/div><button class=\"big sec\" id=\"wknew\">⟲ Neuer Acker<\/button>`;\n W.lupe=()=>wkLupe();\n W.bind=c=>{const r=$('#wkr'),set=v=>{W.tg=v;r.value=v;$('#wkl').textContent=wkT(v);};r.oninput=e=>set(+e.target.value);c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>set(+b.dataset.q));\n  $('#wkrain').onclick=()=>{W.rain=3;};$('#wksow').onclick=()=>{W.sown=true;W.grow=0;W.sowT=W.T;W.sowLoose=W.loose();};$('#wknew').onclick=()=>{mk();Object.assign(W,{cycles:0,sown:false,grow:0,froze:false,dryTry:false,burstNow:false});};};\n W.loose=()=>Math.min(100,Math.round((W.cl.length-9)/27*100));\n W.step=dt=>{W.T+=(W.tg-W.T)*.5*dt;\n  if(W.rain>0){W.rain-=dt;if(Math.random()<.7)W.drops.push({x:Math.random(),y:0,snow:W.T<=0});if(W.T>0)W.cl.forEach(c=>c.wet=Math.min(1,c.wet+.35*dt));}\n  W.drops.forEach(d=>d.y+=dt*(d.snow?.4:1.6));W.drops=W.drops.filter(d=>d.y<.55);\n  if(W.T>18)W.cl.forEach(c=>c.wet=Math.max(0,c.wet-.01*dt));\n  if(W.T<0&&!W.froze){W.froze=true;W.freezeEv++;let split=false;const n=[];\n   W.cl.forEach(c=>{if(c.wet>.4&&c.r>.016){split=true;const r2=c.r*.72;n.push({x:c.x-r2*.55,y:c.y+(Math.random()-.5)*.02,r:r2,wet:c.wet,frozen:true,seed:c.seed*2+1},{x:c.x+r2*.55,y:c.y+(Math.random()-.5)*.02,r:r2,wet:c.wet,frozen:true,seed:c.seed*2+2});}else n.push(Object.assign(c,{frozen:true}));});\n   W.cl=n;if(split){W.burstNow=true;W.cycles++;}else if(W.cl.every(c=>c.wet<.2))W.dryTry=true;}\n  if(W.T>0&&W.froze){W.froze=false;W.cl.forEach(c=>c.frozen=false);}\n  if(W.sown&&W.T>5)W.grow=Math.min(1,W.grow+.08*dt);};\n W.draw=ctx=>{const w=W.W,h=W.H;ctx.clearRect(0,0,w,h);ctx.fillStyle=W.T<=0?'#e3ecf6 assiert mit den Klumpen nichts.';\n  if(W.cl.some(c=>c.wet>.4))return'💧 Das Regenwasser ist in die Poren der Erdklumpen gesickert.';\n  return'🌾 Ein Acker mit großen, harten Erdklumpen. Probier Regen und Frost aus.';};\n W.check=hit=>{if(W.cl.some(c=>c.wet>.5))hit('wet');if(W.dryTry)hit('dry');if(W.burstNow)hit('burst');if(W.loose()>=60)hit('loose');if(W.sown&&W.grow>.5&&W.sowLoose>=50)hit('sow');};\n W.speed=1.5;return W;},\n/* ---------- Flasche ---------- */\nflasche:()=>{const W={kind:'pet',fill:'full',place:-18,T:20,f:0,run:false,state:'',res:''};\n W.ctl=()=>`<div class=\"mxchips\" id=\"wkk\"><button data-k=\"pet\" class=\"on\">🧴 Plastikflasche, zu<\/button><button data-k=\"glas\">🍾 Glasflasche, zu<\/button><button data-k=\"cup\">🥛 offener Becher<\/button><\/div>\n  <div class=\"mxchips\" id=\"wkf\"><button data-f=\"full\" class=\"on\">randvoll<\/button><button data-f=\"half\">halb voll<\/button><\/div>\n  <div class=\"mxchips\" id=\"wkp\"><button data-p=\"-18\" class=\"on\">❄️ Gefrierfach −18 °C<\/button><button data-p=\"4\">🥶 Kühlschrank 4 °C<\/button><button data-p=\"20\">🏠 Küche 20 °C<\/button><\/div>\n  <div class=\"mxbtns\"><button class=\"big go\" id=\"wkgo\">▶ Hineinstellen<\/button><button class=\"big sec\" id=\"wknew\">⟲ Neu<\/button><\/div>`;\n W.lupe=()=>wkLupe();\n W.bind=c=>{const sync=()=>{c.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===W.kind));c.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===W.fill));c.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===W.place));};\n  const reset=()=>{Object.assign(W,{T:20,f:0,run:false,state:'',res:'',t:0});sync();};\n  c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{W.kind=b.dataset.k;reset();});c.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{W.fill=b.dataset.f;reset();});c.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{W.place=+b.dataset.p;reset();});\n  $('#wkgo').onclick=()=>{reset();W.run=true;};$('#wknew').onclick=reset;};\n W.step=dt=>{if(!W.run)return;W.t=(W.t||0)+dt;\n  if(W.T>0.01||W.place>0)W.T+=((W.place<0?-1:W.place)-W.T)*.6*dt;if(W.place<0&&W.T<0&&W.f<1)W.T=0;\n  if(W.place<0&&W.T<=0.05){W.T=0;if(W.f<1)W.f=Math.min(1,W.f+.12*dt);else W.T=Math.max(W.place,W.T-2*dt);}\n  const full=W.fill==='full',closed=W.kind!=='cup';\n  if(W.f>0&&full&&closed&&!W.state){if(W.kind==='glas'&&W.f>.25)W.state='shatter';if(W.kind==='pet'&&W.f>.55)W.state='burst';}\n  if(W.t>9&&W.place>0)W.res=W.place===4?'fridge':'room';};\n W.draw=ctx=>{const w=W.W,h=W.H;ctx.clearRect(0,0,w,h);ctx.fillStyle=W.place<0?'#e3eef9':W.place===4?'#eaf3f7':'#f6efe3';ctx.fillRect(0,0,w,h);\n  const cx=w/2,bw=W.kind==='cup'?w*.3:w*.2,bot=h*.9,bh=W.kind==='cup'?h*.45:h*.62,top=bot-bh,full=W.fill==='full';\n  const lvl0=full?.97:.5,vol=lvl0*((1-W.f)+1.09*W.f),bulge=W.kind==='pet'&&full&&W.f>0?Math.min(1,W.f/0.55)*10:0;\n  const wid=bw+bulge*2;\n  if(W.state==='shatter'){ctx.strokeStyle='#6a8f6a';ctx.lineWidth=3;[[-.6,.2],[.5,.4],[-.2,.8],[.3,.1]].forEach(([dx,dy],i)=>{ctx.beginPath();ctx.moveTo(cx+dx*bw*1.3,top+dy*bh);ctx.lineTo(cx+dx*bw*1.3+14,top+dy*bh+20);ctx.stroke();});\n   ctx.fillStyle='rgba(225,240,255,.97)';ctx.fillRect(cx-bw/2,bot-bh*vol,bw,bh*vol);ctx.fillStyle='#222';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('💥 Die Glasflasche ist zersprungen!',cx,h*.12);return;}\n  const lvl=Math.min(W.kind==='cup'?1.25:1,vol);\n  if(lvl>0){const fh=bh*Math.min(1,lvl),iceH=fh*(1.09*W.f*lvl0/vol);ctx.fillStyle='rgba(90,160,255,.45)';ctx.fillRect(cx-wid/2,bot-fh,wid,fh);ctx.fillStyle='rgba(225,240,255,.97)';ctx.fillRect(cx-wid/2,bot-fh,wid,Math.min(fh,iceH+(W.f>0?fh*W.f*.5:0)));}\n  if(W.kind==='cup'&&vol>1){ctx.fillStyle='rgba(225,240,255,.97)';ctx.beginPath();ctx.moveTo(cx-bw/2,top);ctx.quadraticCurveTo(cx,top-(vol-1)*bh*2.2,cx+bw/2,top);ctx.fill();}\n  ctx.strokeStyle=W.kind==='glas'?'#4f7d4f':'#7aa7d6';ctx.lineWidth=3;ctx.beginPath();\n  if(W.kind==='cup'){ctx.moveTo(cx-bw/2,top);ctx.lineTo(cx-bw/2,bot);ctx.lineTo(cx+bw/2,bot);ctx.lineTo(cx+bw/2,top);}\n  else{ctx.moveTo(cx-10,top-38);ctx.lineTo(cx-10,top-14);ctx.lineTo(cx-wid/2,top+8);ctx.lineTo(cx-wid/2,bot);ctx.lineTo(cx+wid/2,bot);ctx.lineTo(cx+wid/2,top+8);ctx.lineTo(cx+10,top-14);ctx.lineTo(cx+10,top-38);ctx.fillStyle='#e0412f';ctx.fillRect(cx-12,top-48,24,11);}\n  ctx.stroke();\n  if(W.state==='burst'){ctx.strokeStyle='#c0392b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+wid/2,top+bh*.4);ctx.lineTo(cx+wid/2-14,top+bh*.5);ctx.lineTo(cx+wid/2+2,top+bh*.6);ctx.stroke();ctx.fillStyle='#222';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('💥 Die Plastikflasche ist aufgeplatzt!',cx,h*.12);}\n  ctx.fillStyle='#222';ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(`🌡️ ${wkT(W.T)}${W.f>0?' · gefroren: '+Math.round(W.f*100)+' %':''}`,8,18);};\n W.info=()=>{const full=W.fill==='full';if(!W.run)return'Wähle ein Gefäß, wie voll es ist und wohin es kommt. Dann tippe auf „Hineinstellen“.';\n  if(W.state==='shatter')return'🍾 Das Wasser ist beim Gefrieren um etwa ein Zehntel größer geworden. Glas kann nicht nachgeben: Es zerspringt. Deshalb friert man keine vollen Glasflaschen ein.';\n  if(W.state==='burst')return'🧴 Das Eis braucht mehr Platz als das Wasser vorher. In der randvollen, geschlossenen Flasche ist dafür kein Platz: Sie wölbt sich und platzt auf.';\n  if(W.kind==='cup'&&full&&W.f>0)return'🥛 Der Becher ist offen: Das Eis kann nach oben ausweichen und wächst über den Rand hinaus.';\n  if(W.fill==='half'&&W.f>=1)return'✅ Die halb volle Flasche hält: Das Eis hat genug Platz, um sich auszudehnen. Der Wasserspiegel ist nur etwas gestiegen.';\n  if(W.res==='fridge')return'🥶 Im Kühlschrank wird das Wasser nur 4 °C kalt. Das ist über 0 °C: Es friert nicht.';\n  if(W.res==='room')return'🏠 In der Küche passiert nichts: Das Wasser bleibt flüssig.';\n  if(W.f>0)return'❄️ Das Wasser gefriert. Die Temperatur bleibt dabei bei 0 °C.';\n  return'⏳ Das Wasser kühlt ab …';};\n W.check=hit=>{if(W.state==='burst')hit('burst');if(W.state==='shatter')hit('glass');if(W.fill==='half'&&W.kind!=='cup'&&W.f>=1)hit('safe');if(W.kind==='cup'&&W.fill==='full'&&W.f>.6)hit('dome');if(W.res==='fridge'&&W.fill==='full'&&W.kind!=='cup')hit('fridge');};\n W.speed=1.4;return W;}\n};\nwindow.__WK=()=>G;\n\n/* ---------- Zauberkessel ---------- */\nfunction lab(){\n  G={mode:'lab',finished:false,T:20,prevT:20,done:{},raf:0,t:0,task:null};\n  const MIS=[\n    {id:'m1',p:'p1',t:'Verwandle das Wasser in Eis.',ok:e=>e.T<0},\n    {id:'m2',p:'p2',t:'Lass das Eis wieder schmelzen.',ok:e=>e.ev==='Schmelzen'},\n    {id:'m3',p:'p1',t:'Bring das Wasser zum Sieden.',ok:e=>e.T>=100},\n    {id:'m4',p:'p2',t:'Lass den Dampf kondensieren.',ok:e=>e.ev==='Kondensieren'},\n    {id:'m5',p:'p4',t:'Finde die Temperatur, bei der Wasser am schwersten ist.',ok:e=>e.T===4}\n  ].filter(x=>S.sel.includes(x.p));\n  G.mis=MIS;\n  app.innerHTML=`<div class=\"play\" style=\"height:100%\"><div class=\"pbar2\"><button class=\"icon-btn\" id=\"back\" aria-label=\"Zurück zur Eingangshalle\">✕<\/button><div class=\"ptitle\">⚗️ Zauberkessel<\/div><\/div>\n  <div class=\"labwrap\"><div class=\"labstage\" id=\"labstage\"><canvas id=\"cv\"><\/canvas><div class=\"spell\" id=\"spell\"><\/div><div class=\"lbcover\" id=\"lbcover\"><div>🙈 <b>Der Kessel ist verdeckt.<\/b><br><small>Stell die Temperatur so ein, wie du denkst, und tippe dann auf „Prüfen“.<\/small><\/div><\/div><\/div>\n  <div class=\"labside\">\n    <div class=\"tread\"><span id=\"tval\">20 °C<\/span><b id=\"sname\">flüssig<\/b><\/div>\n    <input type=\"range\" id=\"temp\" min=\"-20\" max=\"120\" step=\"1\" value=\"20\" aria-label=\"Temperatur\">\n    <div class=\"tbtns\"><button data-d=\"-10\">−10<\/button><button data-d=\"-1\">−1<\/button><button data-d=\"1\">+1<\/button><button data-d=\"10\">+10<\/button><\/div>\n    <div class=\"dens\"><div class=\"dbar\"><i id=\"dfill\"><\/i><\/div><div><b>Dichte-Messer<\/b><div id=\"dval\" style=\"font-weight:800\"><\/div><small id=\"dtip\"><\/small><\/div><\/div>\n    ${MIS.length?`<div class=\"lbtask\" id=\"lbtask\" style=\"display:none\"><\/div><div class=\"lbmis\" id=\"lbmis\"><\/div>`:''}\n  <\/div><\/div><\/div>`;\n  $('#back').onclick=home;\n  {const pb=$('.pbar2'),st=$('#labstage');if(pb&&st)st.style.top=pb.offsetHeight+'px';}\n  const sl=$('#temp');\n  sl.oninput=()=>setT(+sl.value);\n  document.querySelectorAll('.tbtns button').forEach(b=>b.onclick=()=>setT(Math.max(-20,Math.min(120,G.T+ +b.dataset.d))));\n  drawMis();\n  initSim();\n  if('ResizeObserver' in window){G.ro=new ResizeObserver(()=>initSim(true));G.ro.observe($('#labstage'));}\n  setT(20);\n  const loop=()=>{if(G.finished||G.mode!=='lab')return;stepSim();G.raf=requestAnimationFrame(loop);};\n  G.raf=requestAnimationFrame(loop);\n}\nconst stOf=T=>T<0?'fest':T<100?'flüssig':'gasförmig';\nfunction density(T){if(T<0)return .917+(-T)*.0001;if(T<100)return 1-.0000045*(T-4)*(T-4);return .0006;}\nfunction setT(T){\n  if(G.task&&!G.task.solved&&!G.task.hide){G.task.hide=true;lbHide();}\n  const prev=G.T;G.T=T;$('#temp').value=T;\n  $('#tval').textContent=T+' °C';$('#sname').textContent=stOf(T);\n  let ev=null;\n  if(prev<0&&T>=0)ev='Schmelzen';else if(prev>=0&&T<0)ev='Erstarren';\n  if(prev<100&&T>=100)ev='Verdampfen';else if(prev>=100&&T<100)ev='Kondensieren';\n  if(prev<0&&T>=100)ev='Verdampfen';if(prev>=100&&T<0)ev='Erstarren';\n  if(ev&&!(G.task&&G.task.hide)){const sp=$('#spell');sp.textContent='✨ '+ev+'!';sp.classList.remove('show');void sp.offsetWidth;sp.classList.add('show');sfx('ok');}\n  const d=density(T);\n  $('#dfill').style.height=(T>=100?2:Math.max(4,(d-.9)/.1*100))+'%';\n  $('#dval').textContent=T>=100?'fast 0 g/cm³ (Dampf)':d.toFixed(4).replace('.',',')+' g/cm³';\n  $('#dtip').textContent=T===4?'👑 Höchste Dichte – hier ist Wasser am schwersten!':T<0?'Eis ist leichter als Wasser – es schwimmt.':T>=100?'Dampf braucht viel mehr Platz.':'';\n  if(G.task){const k=G.task;if(T<0)k.frozen=true;if(T>=100)k.boiled=true;if(ev==='Schmelzen')k.melted=true;if(ev==='Kondensieren')k.cond=true;}\n}\n/* ===== Zauberkessel: Aufträge gezielt starten und prüfen ===== */\nconst LB_H={\n m1:[\"Eis ist Wasser im festen Zustand. Bei welcher Temperatur gefriert Wasser?\",\"Wasser gefriert bei 0 °C. Es muss also kälter sein.\",\"Lösung: Stell die Temperatur unter 0 °C, zum Beispiel auf −10 °C.\"],\n m2:[\"Zum Schmelzen brauchst du zuerst Eis.\",\"Kühle erst unter 0 °C, dann erwärme das Eis wieder über 0 °C.\",\"Lösung: Stell zuerst −10 °C ein, dann 10 °C. Bei 0 °C schmilzt das Eis.\"],\n m3:[\"Sieden heißt: Das Wasser kocht und wird zu Dampf. Wie heiß muss es dafür sein?\",\"Wasser siedet bei 100 °C.\",\"Lösung: Stell 100 °C oder mehr ein.\"],\n m4:[\"Kondensieren heißt: Dampf wird wieder flüssig. Dafür brauchst du zuerst Dampf.\",\"Erhitze auf 100 °C oder mehr, dann kühle wieder unter 100 °C ab.\",\"Lösung: Stell zuerst 110 °C ein, dann 50 °C.\"],\n m5:[\"Am schwersten ist Wasser, wenn seine Teilchen am dichtesten liegen. Denk an den See im Winter: Welche Temperatur hat das Wasser ganz unten?\",\"Die Temperatur liegt knapp über 0 °C. So kalt ist es am Grund eines tiefen Sees.\",\"Lösung: Stell genau 4 °C ein.\"]\n};\nfunction lbOk(id){const T=G.T,k=G.task;return id==='m1'?T<0:id==='m2'?(k.melted&&T>=0&&T<100):id==='m3'?T>=100:id==='m4'?(k.cond&&T>=0&&T<100):id==='m5'?T===4:false;}\nfunction lbState(id){const T=G.T,k=G.task,st=stOf(T);\n  if(id==='m2'&&!k.frozen)return'Es ist noch gar kein Eis entstanden, das schmelzen könnte.';\n  if(id==='m2'&&!k.melted)return`Bei ${T} °C ist das Wasser noch Eis.`;\n  if(id==='m4'&&!k.boiled)return'Es ist noch gar kein Dampf entstanden.';\n  if(id==='m4'&&!k.cond)return`Bei ${T} °C ist das Wasser noch gasförmig.`;\n  if((id==='m2'||id==='m4')&&T>=100)return`Bei ${T} °C ist das Wasser gasförmig, nicht flüssig.`;\n  if((id==='m2'||id==='m4')&&T<0)return`Bei ${T} °C ist das Wasser fest.`;\n  if(id==='m5')return`Bei ${T} °C ist die Dichte ${density(T)>=1?'hoch':'noch nicht am höchsten'}.`;\n  return`Bei ${T} °C ist das Wasser ${st}.`;}\nfunction lbHide(){const h=!!(G.task&&G.task.hide),st=$('#labstage');if(st)st.classList.toggle('lbhid',h);document.querySelectorAll('#sname,.dens').forEach(e=>e.classList.toggle('lbveil',h));}\nfunction lbStart(id){G.task={id,hide:true,fails:0,frozen:G.T<0,boiled:G.T>=100,melted:false,cond:false,msg:'',cls:''};lbHide();drawMis();const b=$('#lbtask');if(b)b.scrollIntoView({behavior:'smooth',block:'nearest'});}\nfunction lbCheck(){const k=G.task;if(!k)return;const x=G.mis.find(m=>m.id===k.id);k.hide=false;lbHide();\n  if(lbOk(k.id)){G.done[k.id]=true;const xp=Math.max(3,10-3*k.fails);addXP(xp);recordStat(x.p,k.fails===0);sfx('ok');\n    k.msg=`✅ Richtig gelöst${k.fails?` nach ${k.fails} ${k.fails===1?'Fehlversuch':'Fehlversuchen'}`:' beim ersten Versuch'}! +${xp} Hauspunkte`;k.cls='ok';k.solved=true;\n    if(G.mis.every(y=>G.done[y.id]))setTimeout(()=>{toast('🔮 Alle Aufträge erfüllt!');confetti();sfx('rank');},900);}\n  else{k.fails++;sfx('bad');if(k.fails===3)recordStat(x.p,false);const h=LB_H[k.id][Math.min(k.fails,3)-1];\n    k.msg=`❌ ${k.fails}. Fehlversuch. ${lbState(k.id)}<br>💡 ${h}`;k.cls='bad';}\n  drawMis();}\nfunction drawMis(){const u=$('#lbmis'),bn=$('#lbtask');if(!u)return;const k=G.task;\n  u.innerHTML=`<div class=\"lbh\">Aufträge (${G.mis.filter(x=>G.done[x.id]).length} von ${G.mis.length})<\/div>${G.mis.map(x=>`<div class=\"lbi ${G.done[x.id]?'done':''} ${k&&k.id===x.id?'act':''}\"><span>${G.done[x.id]?'✅':'🎯'}<\/span><span class=\"lbt\">${x.t}<\/span>${G.done[x.id]?'':k&&k.id===x.id?'<small>läuft<\/small>':`<button class=\"lbgo\" data-lb=\"${x.id}\">Starten<\/button>`}<\/div>`).join('')}<p class=\"lbnote\">Du kannst jederzeit frei experimentieren. Ein Auftrag zählt erst, wenn du ihn startest und auf „Prüfen“ tippst.<\/p>`;\n  u.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>lbStart(b.dataset.lb));\n  if(bn){if(!k){bn.innerHTML='';bn.style.display='none';return;}const x=G.mis.find(m=>m.id===k.id);bn.style.display='';\n    bn.innerHTML=`<div class=\"lbtop\"><b>🎯 Auftrag:<\/b> ${x.t}<\/div>${k.msg?`<div class=\"lbmsg ${k.cls}\">${k.msg}<\/div>`:'<div class=\"lbmsg\">Der Kessel ist verdeckt. Stell die Temperatur ein und tippe dann auf „Prüfen“. Erst dann siehst du, was passiert.<\/div>'}\n     <div class=\"lbbtns\">${k.solved?'<button class=\"big go\" id=\"lbdone\">Weiter<\/button>':`<button class=\"big go\" id=\"lbchk\">✔ Prüfen<\/button><button class=\"big sec\" id=\"lbx\">Abbrechen<\/button>`}<\/div>${!k.solved&&k.fails?`<div class=\"lbfails\">Fehlversuche: ${'❌'.repeat(k.fails)}<\/div>`:''}`;\n    const c=$('#lbchk');if(c)c.onclick=lbCheck;const xx=$('#lbx');if(xx)xx.onclick=()=>{G.task=null;lbHide();drawMis();};const d=$('#lbdone');if(d)d.onclick=()=>{G.task=null;lbHide();drawMis();};}}\nfunction initSim(keep){\n  const st=$('#labstage'),cv=$('#cv');if(!st||!cv)return;\n  const W=st.clientWidth,H=st.clientHeight,dpr=window.devicePixelRatio||1;\n  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);\n  const bw=Math.min(W*.62,H*.95),x0=(W-bw)/2,x1=x0+bw,y0=H*.1,y1=H*.8;\n  const cols=9,rows=4,sp=bw*.92/cols,r=sp/2.35;\n  const old=keep&&G.sim?G.sim.p:null;\n  const p=[];\n  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){\n    const tx=x0+bw*.04+sp/2+j*sp+(i%2?sp*.25:-sp*.25),ty=y1-r*1.2-i*sp*.92;\n    const k=i*cols+j,o=old&&old[k];\n    p.push({tx,ty,x:o?Math.min(x1-r,Math.max(x0+r,o.x)):tx,y:o?Math.min(y1-r,Math.max(y0+r,o.y)):ty,vx:0,vy:0,ph:Math.random()*6.28});\n  }\n  G.sim={ctx,W,H,x0,x1,y0,y1,r,sp,p,state:keep&&G.sim?G.sim.state:null,cols,rows};\n}\nfunction stepSim(){\n  const s=G.sim;if(!s)return;const T=G.T,st=stOf(T),r=s.r;G.t++;\n  if(st!==s.state){if(s.state==='fest'||s.state===null)s.p.forEach(q=>{q.vx=(Math.random()-.5)*r*.2;q.vy=(Math.random()-.5)*r*.2;});s.state=st;}\n  const g=r*.035;\n  for(const q of s.p){\n    if(st==='fest'){\n      const amp=r*(.04+(T+20)/20*.12);\n      const tx=q.tx+Math.sin(G.t*.25+q.ph)*amp,ty=q.ty+Math.cos(G.t*.21+q.ph)*amp;\n      q.x+=(tx-q.x)*.12;q.y+=(ty-q.y)*.12;q.vx=q.vy=0;\n    }else{\n      if(st==='flüssig'){const k=r*(.02+T/100*.08);q.vy+=g;q.vx+=(Math.random()-.5)*k*2;q.vy+=(Math.random()-.5)*k*2;q.vx*=.93;q.vy*=.93;}\n      else{const target=r*(.28+(T-100)/20*.1),v=Math.hypot(q.vx,q.vy)||.001;if(v<.01){const a=Math.random()*6.28;q.vx=Math.cos(a);q.vy=Math.sin(a);}q.vx+=(q.vx/v*target-q.vx)*.08;q.vy+=(q.vy/v*target-q.vy)*.08;}\n      q.x+=q.vx;q.y+=q.vy;\n      const e=st==='gasförmig'?1:.5;\n      if(q.x<s.x0+r){q.x=s.x0+r;q.vx=Math.abs(q.vx)*e;}if(q.x>s.x1-r){q.x=s.x1-r;q.vx=-Math.abs(q.vx)*e;}\n      if(q.y<s.y0+r){q.y=s.y0+r;q.vy=Math.abs(q.vy)*e;}if(q.y>s.y1-r){q.y=s.y1-r;q.vy=-Math.abs(q.vy)*e;}\n    }\n  }\n  if(st!=='fest'){\n    const mn=st==='flüssig'?2.02*r:2*r;\n    for(let i=0;i<s.p.length;i++)for(let j=i+1;j<s.p.length;j++){\n      const a=s.p[i],b=s.p[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);\n      if(d<mn&&d>0){const push=(mn-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;\n        if(st==='gasförmig'){const t=a.vx;a.vx=b.vx;b.vx=t;const u=a.vy;a.vy=b.vy;b.vy=u;}}\n    }\n  }\n  drawSim(st);\n}\nfunction drawSim(st){\n  const s=G.sim,c=s.ctx,T=G.T,r=s.r;\n  const cs=getComputedStyle(document.documentElement);\n  const ink=cs.getPropertyValue('--text').trim()||'#1b2238',brass=cs.getPropertyValue('--brass').trim()||'#94661c';\n  c.clearRect(0,0,s.W,s.H);\n  // Feuer oder Frost\n  const cx=(s.x0+s.x1)/2,bw=s.x1-s.x0;\n  if(T>20){\n    const h=(T-20)/100*s.H*.14+6;\n    for(let i=0;i<7;i++){const fx=s.x0+bw*(.12+i*.127),fh=h*(.6+Math.random()*.5);\n      c.beginPath();c.moveTo(fx-bw*.05,s.y1+s.H*.13);c.quadraticCurveTo(fx,s.y1+s.H*.13-fh*1.4,fx+bw*.05,s.y1+s.H*.13);c.closePath();\n      c.fillStyle=`rgba(255,${120+Math.random()*80|0},40,.85)`;c.fill();}\n  }else if(T<0){\n    c.fillStyle='rgba(140,200,255,.18)';c.fillRect(s.x0-20,s.y0-10,bw+40,s.y1-s.y0+30);\n    c.font=`${Math.round(r*2.4)}px sans-serif`;c.textAlign='center';\n    ['❄','❅','❆'].forEach((f,i)=>{c.fillText(f,s.x0-r*2.2,s.y0+(s.y1-s.y0)*(.2+i*.3));c.fillText(f,s.x1+r*2.2,s.y0+(s.y1-s.y0)*(.35+i*.25));});\n  }\n  // Kessel\n  c.beginPath();c.moveTo(s.x0-6,s.y0-14);c.lineTo(s.x0-6,s.y1+2);c.quadraticCurveTo(s.x0-6,s.y1+14,s.x0+10,s.y1+14);c.lineTo(s.x1-10,s.y1+14);c.quadraticCurveTo(s.x1+6,s.y1+14,s.x1+6,s.y1+2);c.lineTo(s.x1+6,s.y0-14);\n  c.lineWidth=5;c.strokeStyle=brass;c.stroke();\n  // Bindungen im Eis\n  if(st==='fest'){\n    c.strokeStyle='rgba(90,160,230,.6)';c.lineWidth=2;\n    for(let i=0;i<s.p.length;i++){const a=s.p[i];for(let j=i+1;j<s.p.length;j++){const b=s.p[j];if(Math.hypot(a.tx-b.tx,a.ty-b.ty)<s.sp*1.15){c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}}}\n  }\n  const fill=st==='fest'?'#a9d8ff':st==='flüssig'?'#3d8fe0':'#dfe3ec',stroke=st==='fest'?'#2d6fb3':st==='flüssig'?'#1d5ea8':'#8a93a6';\n  for(const q of s.p){c.beginPath();c.arc(q.x,q.y,r*.92,0,6.283);c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=stroke;c.stroke();\n    c.beginPath();c.arc(q.x-r*.3,q.y-r*.3,r*.22,0,6.283);c.fillStyle='rgba(255,255,255,.6)';c.fill();}\n  c.fillStyle=ink;c.font=`800 ${Math.max(14,Math.round(r*1.1))}px Nunito, sans-serif`;c.textAlign='center';\n  c.fillText(st==='fest'?'Eis – Kristallgitter mit festen Abständen':st==='flüssig'?'Wasser – Teilchen dicht und ungeordnet':'Wasserdampf – viel Abstand, schnelle Teilchen',cx,s.y0-24);\n}\n\n/* ---------- See-Rätsel ---------- */\nfunction lake(){\n  G={mode:'lake',finished:false,sel:null,place:{},checked:false};\n  const SL=[\n    {id:'s0',x:118,y:98,v:20},{id:'s1',x:150,y:160,v:16},{id:'s2',x:188,y:222,v:12},{id:'s3',x:232,y:284,v:8},{id:'s4',x:286,y:340,v:4},\n    {id:'w0',x:580,y:132,v:1},{id:'w1',x:552,y:200,v:2},{id:'w2',x:510,y:268,v:3},{id:'w3',x:420,y:336,v:4}\n  ];\n  G.SL=SL;\n  G.chips=[...[20,16,12,8,4].map((v,i)=>({id:'cs'+i,v,g:'Sommer'})),...[1,2,3,4].map((v,i)=>({id:'cw'+i,v,g:'Winter'}))];\n  G.chips=G.chips.map(c=>c);\n  shell('lake');\n  $('#pprog').textContent='';\n  drawLake();\n}\nfunction drawLake(){\n  const c=$('#card'),SL=G.SL,placed=G.place;\n  const usedChips=new Set(Object.values(placed));\n  const chipById=id=>G.chips.find(x=>x.id===id);\n  let svg=`<svg class=\"lake\" viewBox=\"0 0 800 420\" role=\"img\" aria-label=\"See im Querschnitt, links Sommer, rechts Winter\">\n  <defs><linearGradient id=\"wat\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#7fc4f0\"/><stop offset=\"1\" stop-color=\"#1f5f9e\"/><\/linearGradient>\n  <clipPath id=\"bowl\"><path d=\"M30 90 C 150 90 170 390 400 395 C 630 390 650 90 770 90 Z\"/><\/clipPath><\/defs>\n  <rect x=\"0\" y=\"0\" width=\"800\" height=\"420\" fill=\"var(--panel2)\"/>\n  <path d=\"M0 90 L30 90 C 150 90 170 390 400 395 C 630 390 650 90 770 90 L800 90 L800 420 L0 420 Z\" fill=\"#8a6b45\" opacity=\".55\"/>\n  <g clip-path=\"url(#bowl)\"><rect x=\"0\" y=\"90\" width=\"800\" height=\"330\" fill=\"url(#wat)\" opacity=\".9\"/>\n  <rect x=\"400\" y=\"90\" width=\"400\" height=\"30\" fill=\"#eef7ff\"/>\n  ${[150,212,274,332].map(y=>`<line x1=\"0\" x2=\"400\" y1=\"${y}\" y2=\"${y}\" stroke=\"#fff\" stroke-opacity=\".5\" stroke-width=\"2\"/>`).join('')}\n  ${[190,258,326].map(y=>`<line x1=\"400\" x2=\"800\" y1=\"${y}\" y2=\"${y}\" stroke=\"#fff\" stroke-opacity=\".5\" stroke-width=\"2\"/>`).join('')}\n  <\/g>\n  <line x1=\"400\" y1=\"30\" x2=\"400\" y2=\"400\" stroke=\"var(--text)\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/>\n  <text x=\"200\" y=\"50\" text-anchor=\"middle\" font-family=\"IM Fell English, Georgia, serif\" font-size=\"30\" fill=\"var(--text)\">☀️ Sommer<\/text>\n  <text x=\"600\" y=\"50\" text-anchor=\"middle\" font-family=\"IM Fell English, Georgia, serif\" font-size=\"30\" fill=\"var(--text)\">❄️ Winter<\/text>\n  <text x=\"690\" y=\"111\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"16\" fill=\"#1f5f9e\">Eisschicht 0 °C<\/text>`;\n  const narrow=window.innerWidth<700;\n  SL.forEach(s=>{\n    const cid=placed[s.id],ch=cid&&chipById(cid);\n    let cls='lslot'+(ch?' f':'');\n    if(G.checked&&ch)cls+=ch.v===s.v?' ok':' bad';\n    svg+=`<g class=\"${cls}\" data-s=\"${s.id}\" style=\"cursor:pointer\"><rect x=\"${s.x}\" y=\"${s.y}\" width=\"96\" height=\"40\" rx=\"10\"/><text x=\"${s.x+48}\" y=\"${s.y+28}\" text-anchor=\"middle\">${ch?ch.v+' °C':'?'}<\/text><\/g>`;\n  });\n  svg+='<\/svg>';\n  if(narrow){const inner=svg.replace(/^<svg[^>]*>/,'').replace(/<\\/svg>$/,'');\n    svg=`<svg class=\"lake\" viewBox=\"0 20 410 385\" role=\"img\" aria-label=\"See im Sommer\">${inner}<\/svg><svg class=\"lake\" viewBox=\"390 20 410 385\" role=\"img\" aria-label=\"See im Winter\">${inner.replace(/id=\"wat\"/,'id=\"wat2\"').replace(/url\\(#wat\\)/,'url(#wat2)').replace(/id=\"bowl\"/,'id=\"bowl2\"').replace(/url\\(#bowl\\)/,'url(#bowl2)')}<\/svg>`;}\n  const chipRow=g=>`<div class=\"chips\"><b>${g}<\/b>${G.chips.filter(x=>x.g===g).map(x=>`<button class=\"chip ${G.sel===x.id?'sel':''} ${usedChips.has(x.id)?'used':''}\" data-c=\"${x.id}\">${x.v} °C<\/button>`).join('')}<\/div>`;\n  c.innerHTML=`<div class=\"q\">Welche Temperatur hat das Wasser in jeder Schicht? <small style=\"display:block;margin-top:4px\">Tippe ein Kärtchen an und dann ein Feld im See.<\/small><\/div>${svg}${chipRow('Sommer')}${chipRow('Winter')}\n  <div id=\"fb\">${G.checked?'':`<button class=\"big go\" id=\"chk\" ${Object.keys(placed).length<9?'disabled':''}>Prüfen<\/button>`}<\/div>`;\n  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.checked)return;G.sel=G.sel===b.dataset.c?null:b.dataset.c;drawLake();});\n  c.querySelectorAll('.lslot').forEach(g=>g.addEventListener('click',()=>{\n    if(G.checked)return;const sid=g.dataset.s;\n    if(G.sel){for(const k in G.place)if(G.place[k]===G.sel)delete G.place[k];G.place[sid]=G.sel;G.sel=null;}\n    else if(G.place[sid])delete G.place[sid];\n    drawLake();\n  }));\n  const chk=$('#chk');if(chk)chk.onclick=checkLake;\n  if(G.checked)showLakeFb();\n}\nfunction checkLake(){\n  G.checked=true;\n  G.lakeScore=G.SL.filter(s=>{const ch=G.chips.find(x=>x.id===G.place[s.id]);return ch&&ch.v===s.v;}).length;\n  const ok=G.lakeScore>=8;sfx(ok?'ok':'bad');recordStat('p4',ok);\n  const xp=G.lakeScore*3;addXP(xp);G.xp=xp;\n  if(G.lakeScore===9)confetti();\n  drawLake();\n}\nfunction showLakeFb(){\n  const n=G.lakeScore;\n  $('#fb').innerHTML=`<div class=\"fbox ${n===9?'ok':n>=6?'half':'bad'}\"><div>${n} von 9 Feldern richtig. ${n===9?pick(PRAISE):'Die roten Felder stimmen noch nicht.'}<br>Im Sommer ist es oben am wärmsten (20 °C) und nach unten wird es kälter. Im Winter liegt oben das Eis mit 0 °C, darunter wird es wärmer: 1 °C, 2 °C, 3 °C. Am Boden hat das Wasser immer 4 °C – dort ist es am schwersten.<\/div><div class=\"xpgain\">+${G.xp} Hauspunkte<\/div><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"big go\" id=\"again2\">Nochmal<\/button><button class=\"big sec\" id=\"home2\">Zur Eingangshalle<\/button><\/div><\/div>`;\n  $('#again2').onclick=lake;$('#home2').onclick=home;\n}\n\n/* ---------- Teilchen-Tabelle ---------- */\nfunction table(){\n  const nat=a=>a.every((x,i)=>x===i);let rows,cols;\n  do{rows=shuffle(TABLE_ROWS.map((_,i)=>i));}while(nat(rows));\n  do{cols=shuffle([0,1,2]);}while(nat(cols));\n  G={mode:'table',finished:false,v:{},checked:false,rows,cols:cols.map(i=>STATES[i])};\n  shell('table');$('#pprog').textContent='';drawTable();\n}\nfunction drawTable(){\n  const c=$('#card');\n  let h=`<div class=\"q\">Wie verhalten sich die Wasserteilchen? Kreuze an. <small style=\"display:block;margin-top:4px\">Ein Merkmal kann zu mehreren Zuständen passen.<\/small><\/div><div style=\"overflow-x:auto\"><table class=\"ttab\"><thead><tr><th><\/th>${G.cols.map(st=>`<th>${({fest:'🧊',flüssig:'💧',gasförmig:'☁️'})[st]} ${st}<\/th>`).join('')}<\/tr><\/thead><tbody>`;\n  G.rows.forEach(i=>{const [lab,key]=TABLE_ROWS[i];\n    h+=`<tr><td>${lab}<\/td>`;\n    G.cols.forEach(st=>{\n      const id=i+'|'+st,on=!!G.v[id];let cls='cell';\n      if(G.checked){const should=key.includes(st);if(on&&should)cls+=' ok';else if(on&&!should)cls+=' bad';else if(!on&&should)cls+=' miss';}\n      h+=`<td><button class=\"${cls}\" data-id=\"${id}\" aria-label=\"${lab} – ${st}\">${on?'✗':G.checked&&key.includes(st)?'○':''}<\/button><\/td>`;\n    });\n    h+='<\/tr>';\n  });\n  h+=`<\/tbody><\/table><\/div><div id=\"fb\">${G.checked?'':'<button class=\"big go\" id=\"chk\">Prüfen<\/button>'}<\/div>`;\n  c.innerHTML=h;\n  c.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{if(G.checked)return;G.v[b.dataset.id]=!G.v[b.dataset.id];drawTable();});\n  const chk=$('#chk');\n  if(chk)chk.onclick=()=>{\n    G.checked=true;let right=0;\n    TABLE_ROWS.forEach(([l,key],i)=>STATES.forEach(st=>{if(!!G.v[i+'|'+st]===key.includes(st))right++;}));\n    G.right=right;const pct=right/24;sfx(pct>=.8?'ok':'bad');recordStat('p1',pct>=.8);\n    G.xp=Math.round(pct*30);addXP(G.xp);if(right===24)confetti();\n    drawTable();\n  };\n  if(G.checked){\n    $('#fb').innerHTML=`<div class=\"fbox ${G.right===24?'ok':G.right>=18?'half':'bad'}\"><div>${G.right} von 24 Feldern richtig. Grün = richtig angekreuzt, rot = falsch angekreuzt, gelber Kreis = fehlt.<br><b>Fest:<\/b> regelmäßig angeordnet in festen Abständen, schwingen am Platz. <b>Flüssig:<\/b> dicht nebeneinander, ungeordnet, bewegen sich frei, berühren sich noch. Im Eis liegen die Teilchen also etwas weiter auseinander als im flüssigen Wasser: Deshalb ist Eis leichter und schwimmt. <b>Gasförmig:<\/b> ungeordnet, frei, schnell, viel Abstand.<\/div><div class=\"xpgain\">+${G.xp} Hauspunkte<\/div><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"big go\" id=\"again2\">Nochmal<\/button><button class=\"big sec\" id=\"home2\">Zur Eingangshalle<\/button><\/div><\/div>`;\n    $('#again2').onclick=table;$('#home2').onclick=home;\n  }\n}\n\n/* ---------- Lückentext ---------- */\nfunction gaps(){\n  const pool=GAPTEXTS.filter(t=>t.p.some(p=>S.sel.includes(p)));\n  const T=G&&G.mode==='gaps'&&pool.length>1?pick(pool.filter(t=>t!==G.T)):pick(pool);\n  G={mode:'gaps',finished:false,T,fill:{},sel:null,checked:false};\n  const words=[];T.parts.forEach(x=>{if(Array.isArray(x))words.push(x[0]);});\n  G.answers=words;G.bank=shuffle(words.concat(T.extra)).map((w,i)=>({id:'b'+i,w}));\n  shell('gaps');$('#pprog').textContent=T.t;drawGaps();\n}\nfunction drawGaps(){\n  const c=$('#card'),used=new Set(Object.values(G.fill));let gi=0;\n  const bw=id=>G.bank.find(b=>b.id===id).w;\n  let txt='';\n  G.T.parts.forEach(x=>{\n    if(Array.isArray(x)){const i=gi++,bid=G.fill[i];let cls='gap'+(G.sel==='g'+i?' sel':'');\n      if(G.checked)cls+=bid&&bw(bid)===G.answers[i]?' ok':' bad';\n      txt+=`<button class=\"${cls}\" data-g=\"${i}\">${bid?esc(bw(bid)):'&nbsp;'}<\/button>`;}\n    else txt+=esc(x);\n  });\n  c.innerHTML=`<div class=\"q\">Setze die Wörter ein. <small style=\"display:block;margin-top:4px\">Tippe ein Wort und dann eine Lücke an. Tippe eine gefüllte Lücke an, um das Wort zurückzulegen.<\/small><\/div><div class=\"gtext\">${txt}<\/div>\n  <div class=\"chips\">${G.bank.map(b=>`<button class=\"chip ${G.sel===b.id?'sel':''} ${used.has(b.id)?'used':''}\" data-b=\"${b.id}\">${esc(b.w)}<\/button>`).join('')}<\/div>\n  <div id=\"fb\">${G.checked?'':`<button class=\"big go\" id=\"chk\" ${Object.keys(G.fill).length<G.answers.length?'disabled':''}>Prüfen<\/button>`}<\/div>`;\n  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(G.checked||used.has(b.dataset.b))return;\n    if(G.sel&&G.sel[0]==='g'){const gi=+G.sel.slice(1);G.fill[gi]=b.dataset.b;G.sel=null;}else G.sel=G.sel===b.dataset.b?null:b.dataset.b;drawGaps();});\n  c.querySelectorAll('.gap').forEach(b=>b.onclick=()=>{if(G.checked)return;const gi=+b.dataset.g;\n    if(G.sel&&G.sel[0]==='b'){G.fill[gi]=G.sel;G.sel=null;}else if(G.fill[gi]!==undefined){delete G.fill[gi];}else G.sel='g'+gi;drawGaps();});\n  const chk=$('#chk');\n  if(chk)chk.onclick=()=>{\n    G.checked=true;G.right=G.answers.filter((a,i)=>G.fill[i]&&bw(G.fill[i])===a).length;\n    const pct=G.right/G.answers.length;sfx(pct>=.8?'ok':'bad');G.T.p.filter(p=>S.sel.includes(p)).forEach(p=>recordStat(p,pct>=.8));\n    G.xp=G.right*3;addXP(G.xp);if(pct===1)confetti();drawGaps();\n  };\n  if(G.checked){\n    const wrong=G.answers.map((a,i)=>G.fill[i]&&bw(G.fill[i])===a?null:`Lücke ${i+1}: ${a}`).filter(Boolean);\n    $('#fb').innerHTML=`<div class=\"fbox ${wrong.length===0?'ok':wrong.length<=2?'half':'bad'}\"><div>${G.right} von ${G.answers.length} Lücken richtig. ${wrong.length?'Richtig wäre: '+esc(wrong.join(' · ')):pick(PRAISE)}<\/div><div class=\"xpgain\">+${G.xp} Hauspunkte<\/div><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"big go\" id=\"again2\">Nächster Text<\/button><button class=\"big sec\" id=\"home2\">Zur Eingangshalle<\/button><\/div><\/div>`;\n    $('#again2').onclick=gaps;$('#home2').onclick=home;\n  }\n}\n\n/* ---------- Protokoll-Puzzle ---------- */\nfunction proto(){\n  G={mode:'proto',finished:false,done:[],miss:0,btns:shuffle(PROTO)};\n  shell('proto');$('#pprog').textContent='';drawProto();\n}\nfunction drawProto(){\n  const c=$('#card');\n  c.innerHTML=`<div class=\"q\">Tippe die Teile des Versuchsprotokolls in der richtigen Reihenfolge an.<small style=\"display:block;margin-top:4px\">Versuch: „Wiegt Wasser immer gleich viel?“<\/small><\/div>\n  <ol class=\"plist\">${G.done.map(x=>`<li>${x}<\/li>`).join('')}<\/ol>\n  <div class=\"pbtns\">${G.btns.filter(b=>!G.done.includes(b)).map(b=>`<button class=\"opt\" data-b=\"${b}\" style=\"text-align:center\">${b}<\/button>`).join('')}<\/div><div id=\"fb\"><\/div>`;\n  c.querySelectorAll('.pbtns .opt').forEach(b=>b.onclick=()=>{\n    if(b.dataset.b===PROTO[G.done.length]){G.done.push(b.dataset.b);sfx('ok');\n      if(G.done.length===PROTO.length){const sc=Math.max(0,1-G.miss/6);recordStat('p5',G.miss<=1);G.xp=Math.round(sc*30);addXP(G.xp);if(G.miss===0)confetti();drawProto();\n        $('#fb').innerHTML=`<div class=\"fbox ${G.miss===0?'ok':G.miss<=2?'half':'bad'}\"><div>${G.miss===0?'Fehlerfrei! ':''}Fertig mit ${G.miss} Fehlversuch${G.miss===1?'':'en'}. Merke: Erst fragen und vermuten, dann Material bereitlegen und durchführen, dann beobachten – und in der Auswertung erklären.<\/div><div class=\"xpgain\">+${G.xp} Hauspunkte<\/div><div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"big go\" id=\"again2\">Nochmal<\/button><button class=\"big sec\" id=\"home2\">Zur Eingangshalle<\/button><\/div><\/div>`;\n        $('#again2').onclick=proto;$('#home2').onclick=home;return;}\n      drawProto();}\n    else{G.miss++;sfx('bad');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(()=>b.classList.remove('bad'),500);}\n  });\n}\n\n/* ---------- Eingangshalle ---------- */\nfunction pkGrades(pid){const u=(window.__NUTZER&&window.__NUTZER.cur)||'u1';let t=null,w=null;\n  try{JSON.parse(localStorage.getItem('lz-ergebnisse')||'[]').forEach(r=>{if(!r||r.a!=='Z'||(r.u||'u1')!==u||!(r.units||[]).includes(pid))return;const g=+r.g;if(!g)return;if(r.k==='write'){if(w===null||g<w)w=g;}else if(!r.k){if(t===null||g<t)t=g;}});}catch(e){}\n  Object.entries(S.grades||{}).forEach(([k,g])=>{if(k.split('+').includes(pid)&&(t===null||g<t))t=+g;});\n  Object.entries(S.wgrades||{}).forEach(([k,g])=>{if(k.split('+').includes(pid)&&(w===null||g<w))w=+g;});return{t,w};}\nfunction pkBadge(ic,lab,g){return g?`<span class=\"pkg ok n${g}\">${ic} ${lab}: <b>Note ${g}<\/b><\/span>`:`<span class=\"pkg\">${ic} ${lab}: noch offen<\/span>`;}\nfunction home(){\n  stopAll();G=null;\n  const k=combo();\n  const houseSec=`<h2>${S.house?'Dein Haus':'Wähle dein Haus'}<\/h2>${S.house?'':'<p class=\"sub\">Jede richtige Antwort bringt deinem Haus Punkte.<\/p>'}\n  <div class=\"houses\">${Object.entries(HOUSES).map(([id,h])=>`<button class=\"house ${S.house===id?'on':''}\" data-h=\"${id}\" style=\"--hc:${h.c}\"><span class=\"hi\">${h.i}<\/span><b>${h.n}<\/b><span>${h.d}<\/span><\/button>`).join('')}<\/div>`;\n  const packs=PACKS.map(p=>{\n    const on=S.sel.includes(p.id),s=S.stats[p.id],sum=packSum(p.id),done=s&&s.done;\n    return`<button class=\"pack ${on?'on':''}\" data-p=\"${p.id}\" aria-pressed=\"${on}\"><div class=\"ptop\"><span class=\"picon\">${p.icon}<\/span><span class=\"pname\"><small>Paket ${p.nr}<\/small>${p.name}<\/span><span class=\"check\">${on?'✓':''}<\/span><\/div>\n    <div class=\"pgoal\"><b>Lernziel:<\/b> ${p.goal}<\/div><div class=\"pbar\"><i style=\"width:${done?100:Math.min(100,sum/16*100)}%\"><\/i><\/div>\n    <small class=\"pst\">${done?'🏅 Lernziel erreicht':`Fortschritt: ${sum} von 16 Treffern (aus den letzten 20 Aufgaben)`}<\/small>\n    ${(()=>{const g=pkGrades(p.id);return`<div class=\"pkgs\">${pkBadge('🏆','Prüfung',g.t)}${pkBadge('✍️','Schreibtest',g.w)}<\/div>`;})()}<\/button>`;\n  }).join('');\n  const tile=m=>{const M=MODES[m],a=avail(m);return`<button class=\"mode ${m==='test'||m==='write'?'feature':''}\" data-m=\"${m}\" ${a?'':'disabled'}><span class=\"mi\">${M.i}<\/span><b>${M.t}<\/b><span>${M.d}<\/span><span class=\"tags\">${m==='book'?'<i>alle Pakete<\/i>':M.p.length===5?'<i>alle Pakete<\/i>':M.p.map(p=>`<i>Paket ${packById(p).nr}<\/i>`).join('')}<\/span><\/button>`;};\n  const grp=(g,title)=>`<div class=\"mgroup\">${title}<\/div><div class=\"modes\">${Object.keys(MODES).filter(m=>MODES[m].g===g).map(tile).join('')}<\/div>`;\n  app.innerHTML=`<div class=\"home\">\n  <section class=\"hero\"><div><h1>Wasser-Zauberschule<\/h1><p>Eis, Wasser und Dampf verwandeln sich ineinander – wie durch Zauberei. Lerne die Regeln dahinter und sammle Punkte für dein Haus.<\/p><\/div>\n  <svg viewBox=\"0 0 170 170\" aria-hidden=\"true\"><circle cx=\"85\" cy=\"85\" r=\"80\" fill=\"var(--panel)\" stroke=\"var(--brass)\" stroke-width=\"3\"/>\n  <path d=\"M40 70 L130 70 L122 132 Q85 148 48 132 Z\" fill=\"var(--panel2)\" stroke=\"var(--brass)\" stroke-width=\"4\"/>\n  <circle cx=\"68\" cy=\"112\" r=\"9\" fill=\"#3d8fe0\"/><circle cx=\"90\" cy=\"118\" r=\"9\" fill=\"#3d8fe0\"/><circle cx=\"104\" cy=\"104\" r=\"9\" fill=\"#3d8fe0\"/><circle cx=\"80\" cy=\"96\" r=\"9\" fill=\"#3d8fe0\"/>\n  <circle cx=\"72\" cy=\"46\" r=\"7\" fill=\"#dfe3ec\" stroke=\"#8a93a6\" stroke-width=\"2\"/><circle cx=\"100\" cy=\"30\" r=\"7\" fill=\"#dfe3ec\" stroke=\"#8a93a6\" stroke-width=\"2\"/><circle cx=\"92\" cy=\"54\" r=\"7\" fill=\"#dfe3ec\" stroke=\"#8a93a6\" stroke-width=\"2\"/>\n  <path d=\"M60 150 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0\" fill=\"none\" stroke=\"#e8792f\" stroke-width=\"4\" stroke-linecap=\"round\"/><\/svg><\/section>\n  ${houseSec}\n  ${window.lzHint?lzHint():\"\"}<h2>Pakete wählen<\/h2><p class=\"sub\">Tippe die Pakete an, die du lernen willst. Die Lernwege nutzen deine Auswahl.<\/p>\n  <div class=\"packs\">${packs}<\/div>\n  <h2>Lernweg wählen<\/h2>${S.sel.length?'':'<p class=\"warn\">Wähle zuerst mindestens ein Paket.<\/p>'}\n  ${grp('learn','Entdecken')}${grp('play','Knobeln')}${grp('quiz','Prüfen')}\n  <h2>Einstellungen<\/h2><div class=\"settings\">\n   <div class=\"set\"><div><b>Rekorde mit dieser Paket-Auswahl<\/b><small>Blitz-Duell: ${S.high[k]||0} Punkte · Beste Prüfungsnote: ${S.grades[k]?S.grades[k]+' ('+NOTE_TXT[S.grades[k]]+')':'noch keine Prüfung'}<\/small><\/div><\/div>\n   <div class=\"set\"><div><b>Fortschritt zurücksetzen<\/b><small>Löscht Hauspunkte, Ränge, Lernziele und Rekorde auf diesem Gerät.<\/small><\/div><button class=\"btn-s\" id=\"reset\">Zurücksetzen<\/button><\/div>\n  <\/div><\/div>`;\n  app.querySelectorAll('.house').forEach(b=>b.onclick=()=>{S.house=b.dataset.h;save();applyHouse();renderHeader();const y=app.scrollTop;home();app.scrollTop=y;});\n  app.querySelectorAll('.pack').forEach(b=>b.onclick=()=>{const id=b.dataset.p;S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];save();const y=app.scrollTop;home();app.scrollTop=y;});\n  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>startMode(b.dataset.m));\n  $('#reset').onclick=()=>{if(confirm('Wirklich den ganzen Fortschritt löschen?')){const sel=S.sel,h=S.house;S=JSON.parse(JSON.stringify(DEF));S.sel=sel;S.house=h;save();renderHeader();home();}};\n}\nlet rzT=0;\nwindow.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{\n  if(!G||G.finished)return;\n  if(G.mode==='lake')drawLake();\n  else if(G.ana&&G.cur&&G.cur.t==='ana'&&$('#slots')&&!G.locked)drawAna();\n},150);});\nwindow.lzRehome=()=>{if(document.querySelector('.packs')&&!document.querySelector('.lzh')){const y=app.scrollTop;home();app.scrollTop=y;}};\nwindow.lzSelect=(ids,mt)=>{S.sel=ids.split(',');save();home();const t=app.querySelector('[data-m=\"'+(mt||'test')+'\"]');if(t)t.scrollIntoView({behavior:'smooth',block:'center'});};\n/* ===== Ergänzungen aus dem Buch S. 116–118 ===== */\nCARDS.p1.push(\n ['Schmelztemperatur','Die Temperatur, bei der ein Stoff zwischen fest und flüssig wechselt. Bei Wasser: 0 °C.'],\n ['Siedetemperatur','Die Temperatur, bei der ein Stoff zwischen flüssig und gasförmig wechselt. Bei Wasser: 100 °C. Darüber kann ein Stoff nur gasförmig sein.'],\n ['Wasser – ein besonderer Stoff','Wasser ist der einzige Stoff, der in der Natur in allen drei Aggregatzuständen vorkommt: als Eis, als Wasser und als Wasserdampf.'],\n ['Kann man Wasserdampf sehen?','Nein, Wasserdampf ist unsichtbar. Die weißen Schwaden über dem Kochtopf und die Wolken sind schon winzige flüssige Wassertröpfchen.'],\n ['Andere Stoffe bei 20 °C (Buch S. 117, M1)','Kupfer, Zinn und Kerzenwachs sind fest. Wasser ist flüssig. Sauerstoff ist gasförmig.'],\n ['Zinn, Kerzenwachs, Kupfer (M1)','Zinn schmilzt bei etwa 232 °C. Kerzenwachs schmilzt laut Diagramm bei etwa 40 °C und wird bei etwa 250 °C gasförmig. Kupfer bleibt bis über 400 °C fest.']\n);\nCARDS.p2.push(\n ['Übergänge überspringen','Ein Stoff kann direkt von fest zu gasförmig werden (Sublimation) oder von gasförmig zu fest (Resublimation), ohne flüssig zu sein.'],\n ['Die Pfütze verschwindet im Frost','Eine gefrorene Pfütze kann auch unter 0 °C verschwinden: Das Eis sublimiert direkt zu Wasserdampf.'],\n ['Raureif und Eisblumen','An sehr kalten Tagen wird Wasserdampf aus der Luft direkt zu Eiskristallen: Er resublimiert.'],\n ['Der Iod-Versuch','Festes Iod wird im Becherglas erhitzt und wird direkt zu violettem Ioddampf (Sublimation). Am Uhrglas, das mit Eiswürfeln gekühlt wird, wird der Dampf wieder fest (Resublimation).'],\n ['Bleigießen','Blei schmilzt bei 327 °C. Im kalten Wasser erstarrt es sofort wieder. Blei ist giftig, heute nimmt man einen anderen Stoff.'],\n ['Wie schnell verdunstet Wasser?','Je höher die Temperatur, desto schneller verdunstet Wasser.']\n);\nMC.push(\n {p:'p1',q:'Wie heißt die Temperatur, bei der ein Stoff zwischen fest und flüssig wechselt?',a:['Schmelztemperatur','Siedetemperatur','Raumtemperatur','Dampftemperatur'],ex:'Bei Wasser liegt die Schmelztemperatur bei 0 °C.'},\n {p:'p1',q:'Wie heißt die Temperatur, bei der ein Stoff zwischen flüssig und gasförmig wechselt?',a:['Siedetemperatur','Schmelztemperatur','Frostgrenze','Erstarrungswärme'],ex:'Bei Wasser liegt die Siedetemperatur bei 100 °C.'},\n {p:'p1',q:'In welchem Aggregatzustand ist Wasser bei 112 °C?',a:['gasförmig','flüssig','fest','halb fest, halb flüssig'],ex:'Über der Siedetemperatur von 100 °C kann Wasser nur gasförmig sein.'},\n {p:'p1',q:'In welchem Aggregatzustand ist Wasser bei −12 °C?',a:['fest','flüssig','gasförmig','Es verdampft gerade'],ex:'Unter 0 °C ist Wasser fest.'},\n {p:'p1',q:'Was sind die weißen Schwaden über einem Kochtopf?',a:['winzige flüssige Wassertröpfchen','unsichtbarer Wasserdampf','Rauch','Eiskristalle'],ex:'Wasserdampf selbst ist unsichtbar. Was man sieht, ist schon wieder zu Tröpfchen kondensiert.'},\n {p:'p1',q:'Welcher Stoff ist bei 20 °C gasförmig?',a:['Sauerstoff','Kupfer','Zinn','Kerzenwachs'],ex:'Kupfer, Zinn und Kerzenwachs sind bei 20 °C fest, Sauerstoff ist gasförmig.'},\n {p:'p2',q:'Wie nennt man es, wenn ein fester Stoff direkt gasförmig wird?',a:['Sublimation','Resublimation','Kondensation','Erstarren'],ex:'Beispiel: Eine gefrorene Pfütze verschwindet bei Frost.'},\n {p:'p2',q:'Was passiert beim Iod-Versuch am gekühlten Uhrglas?',a:['Der Ioddampf wird direkt wieder fest (Resublimation).','Das Iod schmilzt.','Das Iod verdunstet.','Das Iod wird flüssig und tropft herunter.'],ex:'Das Uhrglas wird mit Eiswürfeln gekühlt. Dort wird der Ioddampf direkt zu festem Iod.'},\n {p:'p2',q:'Was passiert beim Bleigießen, wenn das flüssige Blei ins kalte Wasser kommt?',a:['Es erstarrt sofort.','Es verdampft.','Es sublimiert.','Es bleibt flüssig.'],ex:'Das Wasser kühlt das Blei sofort unter seine Schmelztemperatur von 327 °C.'}\n);\nTF.push(\n {p:'p1',s:'Wasserdampf ist unsichtbar.',t:true,ex:'Die weißen Schwaden über dem Kochtopf sind schon winzige flüssige Wassertröpfchen.'},\n {p:'p1',s:'Die Schmelztemperatur von Wasser ist 100 °C.',t:false,ex:'Wasser schmilzt bei 0 °C. 100 °C ist die Siedetemperatur.'},\n {p:'p1',s:'Wasser ist der einzige Stoff, der in der Natur in allen drei Aggregatzuständen vorkommt.',t:true,ex:'Als Eis, als flüssiges Wasser und als Wasserdampf.'},\n {p:'p1',s:'Oberhalb seiner Siedetemperatur kann ein Stoff nur gasförmig sein.',t:true,ex:'Bei Wasser also über 100 °C.'},\n {p:'p1',s:'Bei 20 °C ist Sauerstoff flüssig.',t:false,ex:'Sauerstoff ist bei 20 °C gasförmig.'},\n {p:'p2',s:'Eine gefrorene Pfütze kann auch unter 0 °C verschwinden.',t:true,ex:'Das Eis sublimiert direkt zu Wasserdampf.'},\n {p:'p2',s:'Raureif entsteht, wenn Wasserdampf direkt zu Eis wird.',t:true,ex:'Das nennt man Resublimation.'},\n {p:'p2',s:'Beim Bleigießen erstarrt das flüssige Blei im kalten Wasser.',t:true,ex:'Das Wasser kühlt es sofort unter seine Schmelztemperatur von 327 °C.'},\n {p:'p2',s:'Bei niedriger Temperatur verdunstet Wasser schneller als bei hoher.',t:false,ex:'Je höher die Temperatur, desto schneller verdunstet Wasser.'}\n);\nWQ.push(\n {p:'p1',q:'Nenne den Aggregatzustand von Wasser bei −12 °C, 37 °C und 112 °C und begründe jeweils.',k:['−12 °C: fest, weil unter 0 °C','37 °C: flüssig, weil zwischen 0 °C und 100 °C','112 °C: gasförmig, weil über 100 °C'],a:'Bei −12 °C ist Wasser fest, weil es unter der Schmelztemperatur von 0 °C liegt. Bei 37 °C ist es flüssig, weil die Temperatur zwischen 0 °C und 100 °C liegt. Bei 112 °C ist Wasser gasförmig, weil es über der Siedetemperatur von 100 °C liegt.'},\n {p:'p1',q:'Erkläre die Begriffe Schmelztemperatur und Siedetemperatur und nenne die Werte für Wasser.',k:['Schmelztemperatur: Wechsel zwischen fest und flüssig','Siedetemperatur: Wechsel zwischen flüssig und gasförmig','bei Wasser 0 °C und 100 °C'],a:'Die Schmelztemperatur ist die Temperatur, bei der ein Stoff zwischen fest und flüssig wechselt, bei Wasser 0 °C. Die Siedetemperatur ist die Temperatur, bei der ein Stoff zwischen flüssig und gasförmig wechselt, bei Wasser 100 °C.'},\n {p:'p1',q:'Kann man Wasserdampf sehen? Erkläre, was man über einem Kochtopf sieht.',k:['Wasserdampf ist unsichtbar','die weißen Schwaden sind winzige flüssige Wassertröpfchen','der Dampf ist an der kühleren Luft wieder kondensiert'],a:'Wasserdampf ist unsichtbar. Die weißen Schwaden über dem Kochtopf sind schon winzige flüssige Wassertröpfchen: Der Dampf hat sich an der kühleren Luft abgekühlt und ist wieder kondensiert.'},\n {p:'p1',q:'Warum ist Wasser bei den Aggregatzuständen ein besonderer Stoff?',k:['einziger Stoff, der in der Natur in allen drei Aggregatzuständen vorkommt','fest als Eis oder Schnee','flüssig als Wasser und gasförmig als Wasserdampf'],a:'Wasser ist der einzige Stoff, der in der Natur in allen drei Aggregatzuständen vorkommt: fest als Eis und Schnee, flüssig als Wasser und gasförmig als Wasserdampf.'},\n {p:'p2',q:'Beschreibe, welche Vorgänge beim Bleigießen ablaufen. Verwende Fachbegriffe.',k:['das Blei wird über einer Kerzenflamme erhitzt und schmilzt (Schmelztemperatur 327 °C)','das flüssige Blei wird in kaltes Wasser geschüttet','es kühlt ab und erstarrt sofort wieder'],a:'Ein Stück Blei wird auf einem Löffel über einer Kerzenflamme erhitzt. Bei 327 °C schmilzt es und wird flüssig. Dann wird es in ein Glas mit kaltem Wasser geschüttet. Dort kühlt es ab und erstarrt sofort wieder zu festem Blei.'},\n {p:'p2',q:'Blei ist giftig. Welcher Stoff aus dem Diagramm im Buch (Wasser, Kupfer, Sauerstoff, Zinn, Kerzenwachs) würde sich stattdessen eignen? Begründe.',k:['Zinn (oder Kerzenwachs) ist geeignet','er schmilzt bei einer Temperatur, die man erreichen kann (Zinn etwa 232 °C, Wachs etwa 40 °C), und wird im Wasser wieder fest','Kupfer schmilzt erst weit über 400 °C, Sauerstoff ist gasförmig, Wasser wäre schon flüssig'],a:'Zinn eignet sich, weil es schon bei etwa 232 °C schmilzt und im kalten Wasser wieder fest wird. Auch Kerzenwachs ginge, es schmilzt schon bei etwa 40 °C. Kupfer schmilzt erst weit über 400 °C, Sauerstoff ist gasförmig und Wasser ist bei Raumtemperatur schon flüssig.'},\n {p:'p2',q:'Beschreibe den Iod-Versuch und erkläre die Wechsel der Aggregatzustände mit Fachbegriffen.',k:['festes Iod wird in einem Becherglas mit dem Gasbrenner erhitzt','das Iod wird direkt gasförmig (violetter Ioddampf): Sublimation','am mit Eiswürfeln gekühlten Uhrglas wird der Dampf wieder fest: Resublimation'],a:'Festes Iod liegt in einem Becherglas und wird mit einem Gasbrenner erhitzt. Es wird direkt gasförmig, ohne flüssig zu werden, und es entsteht violetter Ioddampf: Das Iod sublimiert. Oben liegt ein Uhrglas mit Eiswürfeln. Dort kühlt der Dampf ab und wird direkt wieder zu festem Iod: Er resublimiert.'},\n {p:'p2',q:'Wie kann eine gefrorene Pfütze im Winter verschwinden, obwohl es die ganze Zeit unter 0 °C ist?',k:['das Eis wird direkt zu Wasserdampf','ohne vorher flüssig zu werden','Fachbegriff: Sublimation / sublimieren'],a:'Das Eis der Pfütze wird direkt zu Wasserdampf, ohne vorher flüssig zu werden. Das Eis ist sublimiert. Den Vorgang nennt man Sublimation.'},\n {p:'p2',q:'Wie entsteht Raureif an Ästen und Früchten?',k:['an sehr kalten Tagen','Wasserdampf aus der Luft wird direkt zu Eiskristallen','Fachbegriff: Resublimation / resublimieren'],a:'An sehr kalten Tagen wird Wasserdampf aus der Luft direkt zu Eiskristallen, ohne vorher flüssig zu werden. Der Wasserdampf resublimiert. So entsteht Raureif, auf die gleiche Weise auch Eisblumen am Fenster.'},\n {p:'p2',q:'Wovon hängt ab, wie schnell eine Pfütze trocknet? Erkläre mit dem passenden Fachbegriff.',k:['das Wasser verdunstet','Verdunsten passiert unter der Siedetemperatur, also unter 100 °C','je höher die Temperatur, desto schneller verdunstet Wasser'],a:'Die Pfütze trocknet, weil das Wasser verdunstet. Verdunsten passiert auch unter der Siedetemperatur von 100 °C. Je höher die Temperatur ist, desto schneller verdunstet das Wasser.'}\n);\nSITS.push(\n {s:'Beim Bleigießen wird ein Stück Blei über der Kerzenflamme flüssig.',a:['Schmelzen'],ar:'sm'},\n {s:'Das flüssige Blei wird ins kalte Wasser geschüttet und ist sofort wieder fest.',a:['Erstarren'],ar:'er'},\n {s:'Festes Iod wird im Becherglas erhitzt und wird direkt zu violettem Dampf.',a:['Sublimieren'],ar:'su'},\n {s:'Der violette Ioddampf trifft auf das eisgekühlte Uhrglas und wird dort direkt wieder fest.',a:['Resublimieren'],ar:'re'},\n {s:'Eine gefrorene Pfütze verschwindet, obwohl es die ganze Woche unter 0 °C ist.',a:['Sublimieren'],ar:'su'},\n {s:'An einem sehr kalten Morgen sitzen eisige Kristalle auf roten Beeren.',a:['Resublimieren'],ar:'re'},\n {s:'Eiswürfel aus dem Tiefkühlschrank (−15 °C) liegen auf dem Tisch und werden zu Wasser.',a:['Schmelzen'],ar:'sm'},\n {s:'Wasserdampf vom Kochen schlägt sich an der kalten Fensterscheibe als Tropfen nieder.',a:['Kondensieren'],ar:'ko'},\n {s:'Du stellst eine Schale mit Wasser ins Gefrierfach, um Eiswürfel zu machen.',a:['Erstarren'],ar:'er'}\n);\n/* ===== Zauberbuch: jede Karte als konkrete Frage ===== */\nconst CQ={\n'Die drei Aggregatzustände':['Welche drei Aggregatzustände hat Wasser? Nenne zu jedem ein Beispiel.','fest (Eis) · flüssig (Wasser) · gasförmig (Wasserdampf)'],\n'Welcher Zustand bei welcher Temperatur?':['Bei welchen Temperaturen ist Wasser fest, flüssig und gasförmig?',null],\n'Teilchen im Eis':['Wie liegen und bewegen sich die Teilchen im Eis?','In festen Abständen und ganz regelmäßig angeordnet (Kristallgitter). Sie schwingen nur an ihrem Platz. Durch die festen Abstände brauchen sie mehr Platz als im flüssigen Wasser.'],\n'Teilchen im flüssigen Wasser':['Wie liegen und bewegen sich die Teilchen im flüssigen Wasser?','Dicht nebeneinander und ungeordnet. Sie berühren sich noch, bewegen sich aber frei aneinander vorbei.'],\n'Teilchen im Wasserdampf':['Wie liegen und bewegen sich die Teilchen im Wasserdampf?','Mit viel Abstand und ungeordnet. Sie bewegen sich frei und schnell.'],\n'Dampfdruck':['Was ist Dampfdruck, und wozu kann man ihn nutzen?',null],\n'Schmelzen':['Was passiert beim Schmelzen? Nenne ein Beispiel.','fest → flüssig. Beispiel: Eis wird zu Wasser.'],\n'Erstarren':['Was passiert beim Erstarren? Nenne ein Beispiel.','flüssig → fest. Beispiel: Wasser im Gefrierfach wird zu Eis.'],\n'Verdampfen':['Was passiert beim Verdampfen, und bei welcher Temperatur?','flüssig → gasförmig beim Kochen (Sieden) bei 100 °C.'],\n'Verdunsten':['Was ist Verdunsten, und wie unterscheidet es sich vom Verdampfen?','Beides heißt: flüssig → gasförmig. Verdunsten passiert schon unter 100 °C und nur an der Oberfläche, langsam und ohne Blasen. Beispiel: Die Sonne trocknet eine Pfütze. Verdampfen passiert beim Sieden bei 100 °C im ganzen Wasser, mit Blasen. Beispiel: Wasser kocht im Topf.'],\n'Kondensieren':['Was passiert beim Kondensieren? Nenne ein Beispiel.','gasförmig → flüssig. Beispiel: Der Badezimmerspiegel beschlägt.'],\n'Sublimieren':['Was bedeutet Sublimieren? Nenne ein Beispiel.',null],\n'Resublimieren':['Was bedeutet Resublimieren? Nenne ein Beispiel.',null],\n'Warum schwimmt Eis?':['Warum schwimmt Eis auf Wasser? Erkläre mit dem Teilchenmodell.',null],\n'Wasser dehnt sich beim Gefrieren aus':['Was passiert mit dem Volumen, wenn Wasser gefriert? Woran merkt man das?',null],\n'Frostsprengung':['Was ist Frostsprengung, und wie entstehen dadurch Schlaglöcher?','Wasser läuft in Risse im Asphalt. Beim Gefrieren dehnt es sich aus, sprengt den Riss auf und hebt den Asphalt an: Das ist Frostsprengung. Taut das Eis, braucht das Wasser wieder weniger Platz. Unter dem Asphalt bleibt ein Hohlraum, und unter der Last der Autos bricht er ein: ein Schlagloch.'],\n'Ackerboden':['Warum ist Frost gut für den Ackerboden?','Wasser in der Erde dehnt sich beim Gefrieren aus und drückt die Erdklumpen auseinander (Sprengwirkung). Im Frühjahr ist der Boden deshalb locker, und man kann gut säen.'],\n'Warmes Wasser':['Ist warmes Wasser leichter oder schwerer als kaltes? Warum?','Warmes Wasser ist leichter als kaltes: In der gleichen Volumenmenge sind weniger Teilchen, weil sie weiter auseinanderliegen. Deshalb steigt es nach oben.'],\n'Schmelzendes Eis':['Ein Eiswürfel schmilzt in heißem Wasser. Wohin fließt das Schmelzwasser, und warum?','Das kalte Schmelzwasser sinkt nach unten, weil es dichter (schwerer) ist als das heiße Wasser.'],\n'Anomalie':['Was bedeutet „Anomalie des Wassers“?','Anomalie heißt Abweichung von der Norm. Wasser verhält sich anders als die meisten Stoffe: Es ist bei 4 °C am dichtesten, und Eis ist leichter als flüssiges Wasser.'],\n'Die Regel – und die Ausnahme':['Was ist normalerweise die Regel beim Abkühlen, und wo weicht Wasser davon ab?','Regel: Je kälter ein Stoff wird, desto dichter wird er. Wasser hält sich nur bis 4 °C daran. Unter 4 °C dehnt es sich wieder aus, und Eis ist sogar leichter als flüssiges Wasser. Diese Abweichung heißt Anomalie.'],\n'4 °C':['Was ist das Besondere an Wasser mit 4 °C?','Bei 4 °C hat Wasser die höchste Dichte: Es braucht am wenigsten Platz und ist am schwersten. Deshalb sinkt 4 °C kaltes Wasser nach unten, zum Beispiel an den Grund eines Sees.'],\n'Der See im Sommer':['Wie warm ist ein tiefer See im Sommer oben und unten?',null],\n'Der See im Winter':['Wie warm ist ein tiefer See im Winter oben und unten?',null],\n'Fische im Winter':['Wie überleben Fische den Winter in einem zugefrorenen See?','Der See friert nur von oben zu, weil Eis leichter ist. Darunter bleibt das Wasser flüssig, am Grund sind 4 °C. Dort überstehen Fische und Frösche den Winter in Kältestarre und verbrauchen kaum Sauerstoff, denn unter dem Eis gibt es keinen Sauerstoffaustausch mit der Luft.'],\n'Versuchsprotokoll':['Welche Teile hat ein Versuchsprotokoll, in welcher Reihenfolge?',null],\n'Vermutung':['Was schreibt man bei der Vermutung auf, und wann?','Was du glaubst, das passieren wird, und zwar bevor du den Versuch machst. Am besten mit Begründung.'],\n'Beobachtung und Auswertung':['Was ist der Unterschied zwischen Beobachtung und Auswertung?',null],\n'Dreimal messen':['Warum misst man bei einem Versuch mehrmals, zum Beispiel dreimal?',null],\n'Versuch: warm in kalt':['Was passiert, wenn man gefärbtes warmes Wasser in kaltes Wasser stellt?','Das gefärbte warme Wasser steigt nach oben, weil es leichter ist als das kalte Wasser.'],\n'Modellversuch Tinte':['Modellversuch: Was passiert mit 4 °C kaltem Tintenwasser in 20 °C warmem Wasser, und warum?','Das 4 °C kalte Tintenwasser sinkt nach unten und sammelt sich am Boden. Grund: Wasser hat bei 4 °C die höchste Dichte, es ist also schwerer als das 20 °C warme Wasser. So kommt auch im See das 4 °C kalte Wasser an den Grund.'],\n'Schmelztemperatur':['Was ist die Schmelztemperatur, und wie hoch ist sie bei Wasser?',null],\n'Siedetemperatur':['Was ist die Siedetemperatur, und wie hoch ist sie bei Wasser?',null],\n'Wasser – ein besonderer Stoff':['Was ist an Wasser bei den Aggregatzuständen besonders?',null],\n'Kann man Wasserdampf sehen?':['Kann man Wasserdampf sehen? Was sieht man über einem Kochtopf?',null],\n'Andere Stoffe bei 20 °C (Buch S. 117, M1)':['Wasser, Kupfer, Sauerstoff, Zinn und Kerzenwachs: Welcher dieser Stoffe ist bei 20 °C fest, flüssig oder gasförmig?','Fest: Kupfer, Zinn und Kerzenwachs. Flüssig: Wasser. Gasförmig: Sauerstoff.'],\n'Zinn, Kerzenwachs, Kupfer (M1)':['Bei welcher Temperatur schmelzen Zinn, Kerzenwachs und Kupfer (Diagramm im Buch S. 117)?',null],\n'Übergänge überspringen':['Kann ein Stoff den flüssigen Zustand überspringen? Wie heißen diese Übergänge?',null],\n'Die Pfütze verschwindet im Frost':['Warum kann eine gefrorene Pfütze verschwinden, obwohl es unter 0 °C ist?',null],\n'Raureif und Eisblumen':['Wie entstehen Raureif und Eisblumen?',null],\n'Der Iod-Versuch':['Was passiert beim Iod-Versuch, und wie heißen die Übergänge?',null],\n'Bleigießen':['Was passiert beim Bleigießen mit dem Blei? Nenne die Übergänge.','Das Blei schmilzt über der Kerzenflamme bei 327 °C (Schmelzen). Im kalten Wasser wird es sofort wieder fest (Erstarren). Blei ist giftig, heute nimmt man einen anderen Stoff.'],\n'Wie schnell verdunstet Wasser?':['Wovon hängt ab, wie schnell Wasser verdunstet?',null]\n};\nconst CSRC={\"Die drei Aggregatzustände\": \"Lernzettel S. 1, 3 und 5\", \"Welcher Zustand bei welcher Temperatur?\": \"Lernzettel S. 2 (Texte A–C) und S. 3\", \"Teilchen im Eis\": \"Lernzettel S. 2 (Text C) und S. 1\", \"Teilchen im flüssigen Wasser\": \"Lernzettel S. 2 (Text A) und S. 5 (Tabelle)\", \"Teilchen im Wasserdampf\": \"Lernzettel S. 2 (Text B) und S. 5 (Tabelle)\", \"Dampfdruck\": \"Lernzettel S. 2 (Text B)\", \"Schmelzen\": \"Lernzettel S. 5 und S. 3\", \"Erstarren\": \"Lernzettel S. 5 und S. 3\", \"Verdampfen\": \"Lernzettel S. 5 und S. 4\", \"Verdunsten\": \"Lernzettel S. 4 (Buch S. 117)\", \"Kondensieren\": \"Lernzettel S. 5 und S. 4\", \"Sublimieren\": \"Lernzettel S. 6 (Buch S. 118) und S. 7/8\", \"Resublimieren\": \"Lernzettel S. 6 (Buch S. 118) und S. 7/8\", \"Warum schwimmt Eis?\": \"Lernzettel S. 1 und S. 9\", \"Wasser dehnt sich ap;gap:8px;margin-top:8px}\n.lzh-home{background:transparent;color:inherit;border:1px solid var(--lp-line,#aaa)}\n.lzh-ev{margin:12px 0}\n#lzbar{margin:6px 14px 0}#lzbar summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:6px;min-height:36px}\n#lzbar summary::-webkit-details-marker{display:none}#lzbar summary::after{content:\"▾\";margin-left:auto}#lzbar[open] summary::after{content:\"▴\"}\n#lzbar .lzh{margin:0}\n.lp-now{font-size:.72rem;background:var(--lp-accent);color:var(--lp-on);border-radius:999px;padding:2px 8px}\n.lp-day ul{list-style:none;margin:0;padding:0}\n.lp-day li{display:flex;gap:8px;padding:5px 0;line-height:1.3}\n.lp-day li .i{flex:none;width:22px;text-align:center}\n.lp-day li small{display:block;color:var(--lp-muted);font-size:.8rem}\n.lp-chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.88rem;font-weight:700}\n.lp-chk input{width:22px;height:22px;accent-color:var(--lp-accent)}\n.lp-tag{display:inline-block;font-size:.8rem;font-weight:800;border-radius:8px;padding:3px 8px;margin:4px 4px 0 0;background:var(--lp-bg);border:1px solid var(--lp-line)}\n.lp-tag.l{border-color:var(--lp-accent);color:var(--lp-accent)}\n.lp-empty{text-align:center;padding:30px 10px}\n@media (min-width:700px){#lp{font-size:1.08rem}.lp-body{padding:22px}}\n<\/style>\n<div id=\"lp\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Lernplan\">\n  <div class=\"lp-head\"><h2>🗓️ Lernplan<\/h2><button class=\"lp-x\" id=\"lpX\" aria-label=\"Lernplan schließen\">✕<\/button><\/div>\n  <div class=\"lp-tabs\" role=\"tablist\">\n    <button class=\"lp-tab\" role=\"tab\" data-t=\"plan\">Tage<\/button>\n    <button class=\"lp-tab\" role=\"tab\" data-t=\"pk\">Pakete<\/button>\n    <button class=\"lp-tab\" role=\"tab\" data-t=\"set\">Einstellen<\/button>\n  <\/div>\n  <div class=\"lp-body\"><div class=\"lp-wrap\" id=\"lpBody\"><\/div><\/div>\n<\/div>\n<script>\n(function(){\nconst C=window.LP_CONF, U=C.units;\nconst $=s=>document.querySelector(s);\nlet S={n:0,done:[],today:1,ok:[]};\ntry{const r=localStorage.getItem(C.key);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}\nconst save=()=>{try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}};\nlet draft=null, tab=null;\nconst LZU=(window.__NUTZER&&window.__NUTZER.cur)||\"u1\",LZK=\"lzp-\"+C.prefix+\"@\";\nfunction lzGet(u){try{return JSON.parse(localStorage.getItem(LZK+u)||\"null\")||{count:0,doneDate:\"\",log:{}};}catch(e){return{count:0,doneDate:\"\",log:{}};}}\nfunction lzSet(u,o){try{localStorage.setItem(LZK+u,JSON.stringify(o));}catch(e){}}\nfunction lzDay(){const d=new Date();return d.getFullYear()+\"-\"+(d.getMonth()+1)+\"-\"+d.getDate();}\nfunction lzSync(){try{const r=localStorage.getItem(C.key);if(r){const o=JSON.parse(r);S.n=o.n||0;S.done=o.done||[];}}catch(e){}\n  const p=lzGet(LZU);S.ok=[];for(let i=1;i<=Math.min(p.count,S.n);i++)S.ok.push(i);S.today=Math.max(1,Math.min(p.count+1,S.n||1));}\nlzSync();\n\n\nfunction build(n,doneIds){\n  const done=new Set(doneIds);\n  const days=Array.from({length:n},(_,i)=>({d:i+1,learn:[],rep:[],fresh:[],final:false}));\n  const open=U.filter(u=>!done.has(u.id)), k=open.length;\n  if(n===1){days[0].learn=open.slice();days[0].final=true;return days;}\n  days[n-1].final=true;\n  const last=n-1, Lend=n>=4?n-2:n-1;\n  const load=j=>3*days[j].learn.length+days[j].rep.length+days[j].fresh.length;\n  const L=open.map((u,i)=>{const d=1+Math.floor(i*Lend/k);days[d-1].learn.push(u);return d;});\n  open.forEach((u,i)=>{const r1=L[i]+1;if(r1<=last)days[r1-1].rep.push(u);});\n  open.forEach((u,i)=>{\n    const from=L[i]+2; if(from>last)return;\n    let b=-1; for(let j=from-1;j<last;j++){const pref=j+1>=L[i]+3?0:0.5; if(b<0||load(j)+pref<load(b)+(b+1>=L[i]+3?0:0.5))b=j;}\n    days[b].rep.push(u);\n  });\n  U.filter(u=>done.has(u.id)).forEach(u=>{let b=0;for(let j=1;j<last;j++)if(load(j)<load(b))b=j;days[b].fresh.push(u);});\n  return days;\n}\nfunction mask(ids){return U.reduce((m,u,i)=>ids.includes(u.id)?m+Math.pow(2,i):m,0);}\nfunction code(){return C.prefix+S.n+\"-\"+mask(S.done).toString(36).toUpperCase();}\nfunction parse(t){\n  const m=String(t).toUpperCase().replace(/\\s/g,\"\").match(/^([A-Z])(\\d{1,2})-([0-9A-Z]+)$/);\n  if(!m)return{err:\"Der Code hat nicht das richtige Format, zum Beispiel \"+C.prefix+\"6-3.\"};\n  if(m[1]!==C.prefix)return{err:\"Dieser Code gehört zu einer anderen App. Codes dieser App beginnen mit \"+C.prefix+\".\"};\n  const n=+m[2], mk=parseInt(m[3],36);\n  if(n<1||n>30||isNaN(mk)||mk>=Math.pow(2,U.length))return{err:\"Diesen Code kennt die App nicht. Bitte noch einmal prüfen.\"};\n  return{n,done:U.filter((u,i)=>Math.floor(mk/Math.pow(2,i))%2===1).map(u=>u.id)};\n}\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst nm=u=>esc(u.icon+\" \"+u.name);\n\nfunction renderBtn(){\n  const b=document.getElementById(\"lpBtn\"); if(!b)return;\n  b.innerHTML=\"🗓️\"+(S.n?`<span class=\"lp-t\">${S.today}/${S.n}<\/span>`:\"\");\n}\nfunction open(t){lzSync();renderBtn();$(\"#lp\").classList.add(\"open\");document.body.style.overflow=\"hidden\";show(t||(S.n?\"plan\":\"set\"));}\nfunction close(){$(\"#lp\").classList.remove(\"open\");document.body.style.overflow=\"\";setTimeout(()=>{const x=document.querySelector(\".lzh:not(.lzh-ev)\");if(x&&document.querySelector(\".packs\"))x.remove();if(window.lzRehome)lzRehome();if(window.lzBar)lzBar();},0);}\nfunction show(t){tab=t;document.querySelectorAll(\".lp-tab\").forEach(b=>b.setAttribute(\"aria-selected\",b.dataset.t===t));\n  ({plan:rPlan,pk:rPk,set:rSet})[t]();$(\".lp-body\").scrollTop=0;}\n\nfunction rSet(){\n  if(!draft)draft={n:S.n||5,done:S.done.slice()};\n  const groups=[...new Set(U.map(u=>u.group||\"\"))];\n  $(\"#lpBody\").innerHTML=`\n  <div class=\"lp-card\"><h3>Wie viele Lerntage bleiben?<\/h3>\n    <div class=\"lp-muted\">Nur die Tage zählen, an denen wirklich gelernt wird. Freie Tage und Wochenenden also schon abziehen.<\/div>\n    <div class=\"lp-step\"><button id=\"lpM\" aria-label=\"Weniger Tage\">−<\/button><output id=\"lpN\">${draft.n}<\/output><button id=\"lpP\" aria-label=\"Mehr Tage\">+<\/button><span class=\"lp-muted\">Lerntage<\/span><\/div>\n  <\/div>\n  <div class=\"lp-card\"><h3>Was sitzt schon?<\/h3>\n    <div class=\"lp-muted\">Haken setzen bei Paketen, die schon gut klappen. Sie werden nur noch einmal kurz aufgefrischt.<\/div>\n    ${groups.map(g=>(g?`<div class=\"lp-muted\" style=\"margin-top:10px;font-weight:800\">${esc(g)}<\/div>`:\"\")+\n      U.filter(u=>(u.group||\"\")===g).map(u=>`<div class=\"lp-pk\"><input type=\"checkbox\" id=\"lpc_${u.id}\" data-id=\"${u.id}\" ${draft.done.includes(u.id)?\"checked\":\"\"}><label for=\"lpc_${u.id}\">${nm(u)}${u.sub?`<small>${esc(u.sub)}<\/small>`:\"\"}<\/label><\/div>`).join(\"\")).join(\"\")}\n  <\/div>\n  <button class=\"lp-go\" id=\"lpGo\">${S.n?\"Plan neu erstellen\":\"Plan erstellen\"}<\/button>\n  <div class=\"lp-card\" style=\"margin-top:16px\"><h3>Plan auf anderem Gerät<\/h3>\n    <div class=\"lp-muted\">Der Code enthält Lerntage und Häkchen. Auf dem anderen Gerät eintippen, dann entsteht genau derselbe Plan.<\/div>\n    ${S.n?`<div class=\"lp-code\" style=\"margin-top:8px\"><span class=\"lp-muted\">Code dieses Plans:<\/span><b>${code()}<\/b><\/div>`:\"\"}\n    <div class=\"lp-code\" style=\"margin-top:10px\"><input id=\"lpIn\" placeholder=\"${C.prefix}6-3\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\" aria-label=\"Plan-Code\"><button class=\"lp-sm\" id=\"lpUse\">Code übernehmen<\/button><\/div>\n    <div class=\"lp-msg\" id=\"lpMsg\"><\/div>\n  <\/div>`;\n  const setN=v=>{draft.n=Math.max(1,Math.min(30,v));$(\"#lpN\").textContent=draft.n;};\n  $(\"#lpM\").onclick=()=>setN(draft.n-1); $(\"#lpP\").onclick=()=>setN(draft.n+1);\n  document.querySelectorAll(\".lp-pk input\").forEach(c=>c.onchange=()=>{const id=c.dataset.id;draft.done=draft.done.filter(x=>x!==id);if(c.checked)draft.done.push(id);});\n  $(\"#lpGo\").onclick=()=>{apply(draft.n,draft.done);};\n  $(\"#lpUse\").onclick=()=>{const r=parse($(\"#lpIn\").value);if(r.err){$(\"#lpMsg\").textContent=r.err;$(\"#lpMsg\").style.color=\"#b3342b\";return;}apply(r.n,r.done);};\n}\nfunction apply(n,done){\n  const changed=n!==S.n||mask(done)!==mask(S.done);\n  S.n=n;S.done=U.filter(u=>done.includes(u.id)).map(u=>u.id);\n  if(changed){S.ok=[];S.today=1;let L=[];try{L=(JSON.parse(localStorage.getItem(\"nutzer-alle\")||\"null\")||{list:[{id:\"u1\"}]}).list;}catch(e){}L.forEach(u=>lzSet(u.id,{count:0,doneDate:\"\",log:{}}));}\n  S.today=Math.min(S.today,n);draft=null;save();renderBtn();show(\"plan\");\n}\nfunction item(i,u,txt,hint){return `<li><span class=\"i\">${i}<\/span><span><b>${txt}<\/b> ${nm(u)}${hint?`<small>${esc(hint)}<\/small>`:\"\"}<\/span><\/li>`;}\n\nfunction mkTests(C,U,days){\n  const E=C.est||{learn:15,rep:5,test:10,final:20},seen={},learned=[],n=days.length,mid=n>=5?Math.floor(n/2):0;\n  const LA=new Set();days.forEach(d=>d.learn.forEach(u=>LA.add(u.id)));\n  const nm_=g=>(C.tests&&C.tests[g])||C.testName||\"Test\";\n  const grp=(arr,goal,kind,T)=>{const by={};arr.forEach(u=>(by[u.group||\"\"]=by[u.group||\"\"]||[]).push(u));Object.keys(by).forEach(g=>T.push({name:nm_(g),units:U.filter(u=>by[g].includes(u)),goal,kind}));};\n  return days.map(d=>{const T=[];\n    d.learn.forEach(u=>{seen[u.id]=1;learned.push(u);});\n    d.rep.forEach(u=>{seen[u.id]=(seen[u.id]||1)+1;});\n    if(!d.final){\n      grp(d.learn,3,\"Neu\",T);\n      grp(d.rep.filter(u=>seen[u.id]===2),2,\"Wiederholung\",T);\n      grp(d.rep.filter(u=>seen[u.id]>=3).concat(d.fresh),1,\"Wiederholung\",T);\n      if(d.d===mid){const all=U.filter(u=>learned.includes(u)||!LA.has(u.id));if(all.length>=2)grp(all,2,\"Zwischenprobe\",T);}\n    }\n    if(C.write){const wd=mid||(n>=3?n-1:0),allL=U.filter(u=>learned.includes(u)||!LA.has(u.id));\n      if(!d.final&&d.d===wd&&allL.length)T.push({name:\"Schreibtest\",units:allL,goal:3,kind:\"Schreibtest\"});\n      if(d.final)T.push({name:\"Schreibtest\",units:U.slice(),goal:2,kind:\"Schreibtest\"});}\n    const m=E.learn*d.learn.length+E.rep*(d.rep.length+d.fresh.length)+E.test*T.length+T.filter(t=>t.kind===\"Schreibtest\").length*((E.write||15)-E.test)+(d.final?E.final:0);\n    return{tests:T,min:Math.max(10,Math.round(m/5)*5)};});\n}\nfunction extras(days){return mkTests(C,U,days);}\nfunction testLi(t){return `<li><span class=\"i\">🏆<\/span><span><b>${t.kind===\"Neu\"?\"Test neue Pakete\":t.kind===\"Zwischenprobe\"?\"Zwischenprobe\":\"Test Wiederholung\"} (${esc(t.name)}):<\/b> ${t.units.map(nm).join(\", \")}<small>Ziel: Note ${t.goal} oder besser. Nicht geschafft? Fehler anschauen und den Test am nächsten Lerntag wiederholen.<\/small><\/span><\/li>`;}\nfunction rPlan(){\n  if(!S.n){$(\"#lpBody\").innerHTML=`<div class=\"lp-empty\"><p class=\"lp-muted\">Noch kein Plan. Unter „Einstellen“ Lerntage wählen oder einen Code eingeben.<\/p><button class=\"lp-go\" id=\"lpToSet\">Plan einstellen<\/button><\/div>`;$(\"#lpToSet\").onclick=()=>show(\"set\");return;}\n  const days=build(S.n,S.done), X=extras(days);\n  $(\"#lpBody\").innerHTML=`\n  <div class=\"lp-card lp-today\"><label for=\"lpDay\"><b>Heute ist<\/b><\/label>\n    <select id=\"lpDay\">${days.map(d=>`<option value=\"${d.d}\" ${d.d===S.today?\"selected\":\"\"}>Tag ${d.d}<\/option>`).join(\"\")}<\/select>\n    <span class=\"lp-muted\">Plan-Code ${code()}<\/span><\/div>\n  ${days.map(d=>{\n    const grp=(arr,ic,txt)=>{const gs=[...new Set(arr.map(u=>u.group||\"\"))];return gs.map(g=>{const us=arr.filter(u=>(u.group||\"\")===g);\n      return `<li><span class=\"i\">${ic}<\/span><span><b>${txt}<\/b> ${us.map(nm).join(\", \")}<small>${esc(us[0].rep)}${us.length>1?\" \"+C.multi:\"\"}<\/small><\/span><\/li>`;}).join(\"\");};\n    const li=[...d.learn.map(u=>item(\"📘\",u,\"Lernen:\",u.learn))];\n    if(d.rep.length)li.push(grp(U.filter(u=>d.rep.includes(u)),\"🔁\",\"Wiederholen:\"));\n    if(d.fresh.length)li.push(grp(U.filter(u=>d.fresh.includes(u)),\"✨\",\"Auffrischen:\"));\n    X[d.d-1].tests.forEach(t=>li.push(testLi(t)));\n    if(d.final)li.push(`<li><span class=\"i\">🎓<\/span><span><b>Generalprobe:<\/b> ${esc(C.final)}<small>Ziel: Note 1 oder 2. ${S.n>1?\"Kein neuer Stoff. Fehler notieren und die Pakete dazu noch einmal kurz anschauen.\":\"Alles an einem Tag: erst lernen, dann testen.\"}<\/small><\/span><\/li>`);\n    if(!li.length)li.push(`<li><span class=\"i\">☕<\/span><span class=\"lp-muted\">Heute ist nichts eingeplant.<\/span><\/li>`);\n    const ok=S.ok.includes(d.d), now=d.d===S.today;\n    return `<div class=\"lp-card lp-day ${now?\"now\":\"\"} ${ok?\"ok\":\"\"}\"><h3>Tag ${d.d}${now?`<span class=\"lp-now\">heute<\/span>`:\"\"}<span class=\"lp-min\">⏱️ ca. ${X[d.d-1].min} Min.<\/span><\/h3><ul>${li.join(\"\")}<\/ul>\n      <label class=\"lp-chk\"><input type=\"checkbox\" data-d=\"${d.d}\" ${ok?\"checked\":\"\"}> erledigt<\/label><\/div>`;}).join(\"\")}`;\n  $(\"#lpDay\").onchange=e=>{{const p=lzGet(LZU);p.count=+e.target.value-1;p.doneDate=\"\";p.log=p.log||{};for(let i=1;i<=p.count;i++){p.log[i]=p.log[i]||{c:{},g:{}};p.log[i].end=p.log[i].end||Date.now();}Object.keys(p.log).forEach(i=>{if(+i>p.count)delete p.log[i].end;});lzSet(LZU,p);lzSync();}save();renderBtn();rPlan();};\n  document.querySelectorAll(\".lp-chk input\").forEach(c=>c.onchange=()=>{const d=+c.dataset.d,p=lzGet(LZU);if(c.checked){p.count=Math.max(p.count,d);p.doneDate=lzDay();p.log=p.log||{};for(let i=1;i<=d;i++){p.log[i]=p.log[i]||{c:{},g:{}};p.log[i].end=p.log[i].end||Date.now();}}else{p.count=Math.min(p.count,d-1);p.doneDate=\"\";p.log=p.log||{};Object.keys(p.log).forEach(i=>{if(+i>=d)delete p.log[i].end;});}lzSet(LZU,p);lzSync();save();renderBtn();rPlan();});\n  const nowEl=document.querySelector(\".lp-day.now\"); if(nowEl&&S.today>1)setTimeout(()=>nowEl.scrollIntoView({block:\"start\"}),30);\n}\nfunction rPk(){\n  if(!S.n){rPlan();return;}\n  const days=build(S.n,S.done), info={};\ ", de:\"segeln\", ex:\"to sail → sailor, sailing\"},\n  {en:\"world\", de:\"die Welt, die Erde\", ex:\"We want to sail around the world.\"},\n  {en:\"country\", de:\"das Land, die ländliche Gegend\", ex:\"Germany and Britain are countries.\"},\n  {en:\"to begin, began\", de:\"beginnen, anfangen\", ex:\"to begin = to start\"},\n  {en:\"seaside\", de:\"die Küste, die Meeresküste\", ex:\"I like the seaside towns.\"},\n  {en:\"found\", de:\"simple past von to find (finden)\", ex:\"I found = ich fand.\"},\n  {en:\"seawater\", de:\"das Meerwasser\", ex:\"Don't drink seawater!\"},\n  {en:\"king\", de:\"der König\", ex:\"One of the kings built a house in Brighton.\"},\n  {en:\"to build, built\", de:\"bauen\", ex:\"One of the kings built a house in Brighton.\"},\n  {en:\"promenade\", de:\"die Promenade\", ex:\"You can walk along the promenade in Brighton.\"},\n  {en:\"pier\", de:\"der Pier, der Landungssteg\", ex:\"The fairground is on the pier.\"}\n];\n\n/* ---------------- Packages (kleine Lernpakete) ---------------- */\nconst PKG_SIZE = 15;\nconst PACKAGES = [];\nfor(let i=0; i<WORDS.length; i+=PKG_SIZE){\n  PACKAGES.push(WORDS.slice(i, i+PKG_SIZE));\n}\nlet selectedPkg = 0; // index into PACKAGES, or \"all\"\n\n/* ---------------- Test mode state ---------------- */\nconst TEST_SIZE = 30;\nlet testWords = [];\nlet testIdx = 0;\nlet testCorrect = 0;\nlet testAnswers = [];\nlet testSelectedPkgs = new Set(); // Standard: nichts gewählt\n\n/* Antwortprüfung: Artikel und \"to\" zählen mit, alle Begriffe nötig, Reihenfolge und Leerzeichen um Kommas egal */\nconst CONTR=[[/\\bdidn't\\b/g,\"did not\"],[/\\bdoesn't\\b/g,\"does not\"],[/\\bdon't\\b/g,\"do not\"],[/\\bwasn't\\b/g,\"was not\"],[/\\bweren't\\b/g,\"were not\"],[/\\bisn't\\b/g,\"is not\"],[/\\baren't\\b/g,\"are not\"],[/\\bcan't\\b/g,\"cannot\"],[/\\bcouldn't\\b/g,\"could not\"],[/\\bi'd\\b/g,\"i would\"],[/\\bi'm\\b/g,\"i am\"],[/\\bit's\\b/g,\"it is\"]];\nfunction normalizeAnswer(str){\n  let s=String(str).toLowerCase().replace(/[’‘`´]/g,\"'\").replace(/…/g,\"...\").trim();\n  CONTR.forEach(([r,t])=>{s=s.replace(r,t);});\n  return s.replace(/\\.{2,}/g,\" \").replace(/[.!?\"„“”:]/g,\" \").replace(/\\s+/g,\" \").replace(/^-+|-+$/g,\"\").replace(/\\s-+(\\s|$)/g,\"$1\").trim();\n}\n/* Varianten eines Begriffs: (x) optional, a/b im Wort als Alternative */\nfunction variants(term){\n  let out=[term];\n  const expand=(arr,re,fn)=>{let res=[];arr.forEach(t=>{const m=t.match(re);if(!m){res.push(t);return;}fn(m).forEach(r=>res.push(t.slice(0,m.index)+r+t.slice(m.index+m[0].length)));});return res;};\n  for(let k=0;k<6;k++){const before=out.join(\"|\");out=expand(out,/\\(([^()]*)\\)/,m=>[\"\"].concat(m[1].split(\"/\")));if(out.join(\"|\")===before)break;}\n  for(let k=0;k<6;k++){const before=out.join(\"|\");out=expand(out,/([^\\s\\/]+)\\/([^\\s\\/]+)/,m=>[m[1],m[2]]);if(out.join(\"|\")===before)break;}\n  return [...new Set(out.map(normalizeAnswer).filter(Boolean))];\n}\nfunction splitTerms(str){\n  let s=String(str).trim();\n  s=s.replace(/^hier:\\s*/i,\"\");\n  const sp=s.match(/^simple past von (to \\S+)\\s*\\(([^)]+)\\)$/i);\n  if(sp)return [sp[2]];\n  const parts=[];let depth=0,cur=\"\";\n  for(let i=0;i<s.length;i++){const ch=s[i];\n    if(ch===\"(\")depth++;else if(ch===\")\")depth=Math.max(0,depth-1);\n    if(depth===0&&(ch===\",\"||ch===\";\"||(ch===\"/\"&&/\\s/.test(s[i-1]||\"\")&&/\\s/.test(s[i+1]||\"\")))){parts.push(cur);cur=\"\";continue;}\n    cur+=ch;}\n  parts.push(cur);\n  return parts.map(p=>p.trim()).filter(p=>normalizeAnswer(p));\n}\nfunction splitParts(str){return splitTerms(str).map(normalizeAnswer);}\nfunction isAnswerCorrect(given, correctRaw){\n  const terms=splitTerms(correctRaw).map(variants);\n  const gv=splitTerms(given).map(variants);\n  if(!gv.length||gv.length!==terms.length)return false;\n  const used=new Array(terms.length).fill(false);\n  const fits=(g,t)=>g.some(x=>t.includes(x));\n  const match=i=>{if(i===gv.length)return true;\n    for(let j=0;j<ter
