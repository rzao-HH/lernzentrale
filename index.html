|'');G.by='ki';G.aiErr=null;wResult();\n  }catch(e){\n    G.aiErr=lzAIMsg(e)+' Du kannst deine Arbeit jetzt selbst korrigieren.';G.aiRetry=lzAIRetry(e);wSelf();\n  }\n}\nfunction wSelf(){\n  G.phase='self';G.res=G.qs.map((q,i)=>({p:q.k.map(()=>G.a[i].trim()?null:0),c:''}));\n  const c=$('#card');\n  const draw=()=>{\n    c.innerHTML=`${G.aiErr?`<div class=\"wstat\">${esc(G.aiErr)}${G.aiRetry?'<br><button class=\"big go\" id=\"wretry\" style=\"margin-top:8px\">🔁 Nochmal mit KI versuchen<\/button>':''}<\/div>`:''}<div class=\"q\">Selbstkontrolle<\/div><p class=\"wtxt\">Vergleiche deine Antworten mit der Musterantwort. Hake bei jedem Kernpunkt ehrlich ab, ob er in deiner Antwort steht. Danach bekommst du deine Note.<\/p>\n    ${G.qs.map((q,i)=>`<div class=\"wans\"><div class=\"wmeta\">Aufgabe ${i+1}<\/div><b>${esc(q.q)}<\/b>\n      <div class=\"wmine\"><small>Deine Antwort<\/small>${G.a[i].trim()?esc(G.a[i]):'<i>(leer)<\/i>'}<\/div>\n      <div class=\"wmodel\"><small>Musterantwort<\/small>${esc(q.a)}<\/div>\n      <div class=\"wkp\">${q.k.map((k,j)=>{const v=G.res[i].p[j];if(!G.a[i].trim())return`<div class=\"wkr\"><span>${esc(k)}<\/span><span class=\"wk bad\">✗<\/span><\/div>`;return`<div class=\"wkr\"><span>${esc(k)}<\/span><div class=\"wsel\">${[[1,'✓ ja'],[.5,'½ teils'],[0,'✗ nein']].map(([val,l])=>`<button class=\"${v===val?'on v'+String(val).replace('.','')+'':''}\" data-q=\"${i}\" data-j=\"${j}\" data-v=\"${val}\">${l}<\/button>`).join('')}<\/div><\/div>`;}).join('')}<\/div><\/div>`).join('')}\n    <button class=\"big go\" id=\"wcalc\" ${G.res.every(r=>r.p.every(v=>v!==null))?'':'disabled'}>Note berechnen<\/button>\n    <small class=\"wtxt\" style=\"text-align:center\">${G.res.flatMap(r=>r.p).filter(v=>v===null).length} Kernpunkte noch offen<\/small>`;\n    c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{G.res[+b.dataset.q].p[+b.dataset.j]=+b.dataset.v;const y=app.scrollTop;draw();app.scrollTop=y;});\n    const br=$('#wretry');if(br)br.onclick=()=>{G.aiErr=null;wSubmit();};\n    const bc=$('#wcalc');if(bc)bc.onclick=()=>{G.by='selbst';G.overall='';wResult();};\n  };\n  draw();app.scrollTop=0;\n}\nfunction wResult(){\n  stopAll();G.phase='done';\n  const max=G.qs.reduce((s,q)=>s+q.k.length,0),pts=G.res.reduce((s,r)=>s+r.p.reduce((a,b)=>a+(b||0),0),0),pct=pts/max*100,note=noteFor(pct);\n  const xp=[0,100,80,60,40,20,10][note];addXP(xp);if(note<=2)confetti();\n  if(window.lzRec)lzRec('Z',S.sel.slice(),note,'write');S.wgrades=S.wgrades||{};{const wk=combo();if(!S.wgrades[wk]||note<S.wgrades[wk]){S.wgrades[wk]=note;save();}}\n  const fmtP=x=>String(x).replace('.',',');\n  const sym=v=>v===1?'<span class=\"wk ok\">✓<\/span>':v===.5?'<span class=\"wk half\">½<\/span>':'<span class=\"wk bad\">✗<\/span>';\n  app.innerHTML=`<div class=\"result\"><div class=\"rcard wres\"><div class=\"rtitle\">${MODES.write.i} ${MODES.write.t}<\/div>\n    <div class=\"note n${note}\">Note ${note}<\/div><p>${NOTE_TXT[note]} · ${fmtP(pts)} von ${max} Punkten (${Math.round(pct)} %)<\/p>\n    <div class=\"wby\">${G.by==='ki'?'🤖 Korrigiert von der KI (Claude)':'✍️ Selbst korrigiert'}<\/div>\n    ${G.overall?`<div class=\"wover\"><small>Rückmeldung<\/small>${esc(G.overall)}<\/div>`:''}\n    <div class=\"xpgain\">+${xp} Hauspunkte<\/div>\n    ${window.lzEval?lzEval(S.sel.slice(),note,'write'):''}\n    <div class=\"wlist\">${G.qs.map((q,i)=>{const r=G.res[i],sp=r.p.reduce((a,b)=>a+(b||0),0);return`<div class=\"wans\"><div class=\"wmeta\">Aufgabe ${i+1} · ${fmtP(sp)} von ${q.k.length} Punkten<\/div><b>${esc(q.q)}<\/b>\n      <div class=\"wmine\"><small>Deine Antwort<\/small>${G.a[i].trim()?esc(G.a[i]):'<i>(leer)<\/i>'}<\/div>\n      <div class=\"wkp\">${q.k.map((k,j)=>`<div class=\"wkr2\">${sym(r.p[j])}<span>${esc(k)}<\/span><\/div>`).join('')}<\/div>\n      ${r.c?`<div class=\"wcom\"><small>🤖 Kommentar<\/small>${esc(r.c)}<\/div>`:''}\n      <div class=\"wmodel\"><small>Musterantwort<\/small>${esc(q.a)}<\/div><\/div>`;}).join('')}<\/div>\n    <div class=\"rbtns\"><button class=\"big go\" id=\"again\">Neuer Test<\/button><button class=\"big sec\" id=\"tohome\">Zur Eingangshalle<\/button><\/div><\/div><\/div>`;\n  $('#again').onclick=()=>startMode('write');$('#tohome').onclick=home;app.scrollTop=0;\n}\n\n/* ===== Stoff-Thermometer (Buch S. 117, M1) ===== */\nconst THS=[\n {n:'Wasser',m:0,b:100},{n:'Kupfer',m:null,b:null,z:'fest'},{n:'Sauerstoff',m:null,b:null,z:'gasförmig'},\n {n:'Zinn',m:232,b:null},{n:'Kerzenwachs',m:40,b:250}];\nconst THMIN=-100,THMAX=400,STZ=['fest','flüssig','gasförmig'];\nfunction thState(s,t){if(s.z)return s.z;if(s.m!=null&&t<s.m)return'fest';if(s.b!=null&&t>=s.b)return'gasförmig';return'flüssig';}\nfunction thNearEdge(t){return THS.some(s=>[s.m,s.b].some(v=>v!=null&&Math.abs(v-t)<12));}\nfunction thT(){let t;do{t=Math.round((THMIN+10+Math.random()*(THMAX-THMIN-20))/5)*5;}while(thNearEdge(t));return t;}\nfunction thGen(){\n  const out=[],pick=a=>a[Math.floor(Math.random()*a.length)];\n  const mk=[\n    ()=>{const s=pick(THS),t=thT();return{k:'z',s,t,ans:thState(s,t),q:`Welchen Aggregatzustand hat <b>${s.n}<\/b> bei <b>${t} °C<\/b>?`};},\n    ()=>{const t=pick([20,-50,150,300,50,120,-20,80,350].filter(x=>!thNearEdge(x))),z=pick(STZ),ans=THS.filter(s=>thState(s,t)===z).map(s=>s.n);\n      return ans.length?{k:'m',t,z,ans,q:`Tippe alle Stoffe an, die bei <b>${t} °C ${z}<\/b> sind.`}:null;},\n    ()=>{const c=pick([['Wasser','m'],['Wasser','b'],['Zinn','m'],['Kerzenwachs','m'],['Kerzenwachs','b']]),s=THS.find(x=>x.n===c[0]),v=s[c[1]];\n      const opts=[v];[0,40,100,232,250,327,-15].forEach(x=>{if(!opts.includes(x)&&opts.length<4&&Math.random()<.8)opts.push(x);});while(opts.length<4)opts.push(opts[opts.length-1]+50);\n      return{k:'v',s,v,ans:v+' °C',opts:shuffle(opts).map(x=>x+' °C'),q:`Bei welcher Temperatur ${c[1]==='m'?'schmilzt':'siedet'} <b>${s.n}<\/b> laut Diagramm?`};}\n  ];\n  const order=['z','z','m','v','z','m','z','v','z','m'];\n  order.forEach((k,i)=>{let q=null,tries=0;while((!q||(i>=6&&q.k==='z'&&q.s.z))&&tries<30){q=mk[{z:0,m:1,v:2}[k]]();tries++;}q.plain=i>=6;out.push(q);});\n  return out;\n}\nfunction thermo(){\n  G={mode:'therm',finished:false,qs:thGen(),i:0,score:0,log:[],line:null,sel:[]};\n  shell('therm');thQ();\n}\nfunction thSVG(q,showAns){\n  const L=112,R=352,W=360,rowH=30,top=8,X=t=>L+(t-THMIN)/(THMAX-THMIN)*(R-L),H=top+THS.length*rowH+40;\n  const col={fest:'var(--th-f)',flüssig:'var(--th-l)',gasförmig:'var(--th-g)'};\n  let g='';\n  THS.forEach((s,i)=>{const y=top+i*rowH,sel=q.k==='m'&&G.sel.includes(s.n),isA=q.k==='m'&&q.ans.includes(s.n),st=showAns&&q.k==='m'?(sel&&isA?'ok':isA?'miss':sel?'bad':''):'';\n    const segs=[];let a=THMIN;[s.m,s.b].filter(v=>v!=null).forEach(v=>{segs.push([a,v]);a=v;});segs.push([a,THMAX]);\n    g+=`<g class=\"throw${q.k==='m'?' tap':''}\" data-s=\"${s.n}\"><rect x=\"0\" y=\"${y}\" width=\"${W}\" height=\"${rowH-4}\" rx=\"6\" class=\"thhit${sel&&!showAns?' sel':''}${st?' '+st:''}\"/>`;\n    g+=`<text x=\"${L-6}\" y=\"${y+rowH/2+1}\" text-anchor=\"end\" class=\"thlab\">${s.n}<\/text>`;\n    segs.forEach(([x1,x2])=>{const z=thState(s,(x1+x2)/2);g+=`<rect x=\"${X(x1)}\" y=\"${y+4}\" width=\"${X(x2)-X(x1)}\" height=\"${rowH-12}\" fill=\"${q.plain&&!s.z?'var(--th-p)':col[z]}\" stroke=\"var(--line)\"/>`;\n      if((!q.plain||s.z)&&X(x2)-X(x1)>44)g+=`<text x=\"${(X(x1)+X(x2))/2}\" y=\"${y+rowH/2+1}\" text-anchor=\"middle\" class=\"thz\">${z}<\/text>`;});\n    if(q.plain)[s.m,s.b].filter(v=>v!=null).forEach(v=>{g+=`<line x1=\"${X(v)}\" x2=\"${X(v)}\" y1=\"${y+2}\" y2=\"${y+rowH-6}\" class=\"thedge\"/><text x=\"${X(v)+3}\" y=\"${y+rowH/2+1}\" class=\"thev\">${v}<\/text>`;});\n    if(st)g+=`<text x=\"6\" y=\"${y+rowH/2+2}\" class=\"thmk ${st}\">${st==='ok'?'✓':st==='miss'?'!':'✗'}<\/text>`;\n    g+=`<\/g>`;});\n  const ay=top+THS.length*rowH+4;\n  g+=`<line x1=\"${L}\" x2=\"${R}\" y1=\"${ay}\" y2=\"${ay}\" class=\"thax\"/>`;\n  for(let t=THMIN;t<=THMAX;t+=50)g+=`<line x1=\"${X(t)}\" x2=\"${X(t)}\" y1=\"${ay}\" y2=\"${ay+5}\" class=\"thax\"/><text x=\"${X(t)}\" y=\"${ay+17}\" text-anchor=\"middle\" class=\"thtick\">${t}<\/text>`;\n  g+=`<text x=\"${(L+R)/2}\" y=\"${ay+33}\" text-anchor=\"middle\" class=\"thtick\">Temperatur in °C<\/text>`;\n  if(G.line!=null)g+=`<line x1=\"${X(G.line)}\" x2=\"${X(G.line)}\" y1=\"${top-4}\" y2=\"${ay}\" class=\"thline\"/><text x=\"${Math.min(X(G.line)+4,R-40)}\" y=\"${top+2}\" class=\"thlt\">${G.line} °C<\/text>`;\n  return`<svg viewBox=\"0 0 ${W} ${H}\" class=\"thsvg\" role=\"img\" aria-label=\"Diagramm Schmelz- und Siedetemperaturen\">${g}<\/svg>`;\n}\nfunction thQ(){\n  const q=G.qs[G.i],c=$('#card');G.sel=[];G.line=q.t!=null?q.t:null;G.done=false;\n  $('#pprog').textContent=`${G.i+1} / ${G.qs.length}`;\n  const draw=(fb)=>{\n    c.innerHTML=`${q.plain&&G.i===6?'<div class=\"thplain\">🔍 Jetzt ohne Farben: Du siehst nur noch die Grenztemperaturen. Überlege selbst, was links und rechts davon ist. Kupfer und Sauerstoff haben im Diagramm keine Grenze.<\/div>':''}\n    <div class=\"q\">${q.q}<\/div>\n    <div class=\"thwrap\">${thSVG(q,G.done)}<\/div>\n    <label class=\"thsl\">Temperatur-Linie verschieben: <input type=\"range\" min=\"${THMIN}\" max=\"${THMAX}\" step=\"1\" value=\"${G.line==null?20:G.line}\" id=\"thr\"><\/label>\n    ${q.k==='z'?`<div class=\"opts\" id=\"opts\">${STZ.map(z=>`<button class=\"opt\" data-z=\"${z}\">${z}<\/button>`).join('')}<\/div>`:''}\n    ${q.k==='v'?`<div class=\"opts\" id=\"opts\">${q.opts.map(o=>`<button class=\"opt\" data-z=\"${o}\">${o}<\/button>`).join('')}<\/div>`:''}\n    ${q.k==='m'&&!G.done?`<button class=\"big go\" id=\"thok\">Prüfen<\/button>`:''}\n    ${fb||''}`;\n    $('#thr').oninput=e=>{G.line=+e.target.value;const w=$('.thwrap');w.innerHTML=thSVG(q,G.done);bindRows();};\n    const bindRows=()=>c.querySelectorAll('.throw.tap').forEach(r=>r.onclick=()=>{if(G.done)return;const n=r.dataset.s;G.sel=G.sel.includes(n)?G.sel.filter(x=>x!==n):[...G.sel,n];$('.thwrap').innerHTML=thSVG(q,false);bindRows();});\n    bindRows();\n    if(!G.done)c.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>finish(b.dataset.z));\n    if($('#thok'))$('#thok').onclick=()=>finish(G.sel);\n    if($('#thnext'))$('#thnext').onclick=()=>{G.i++;if(G.i>=G.qs.length)return thEnd();thQ();app.scrollTop=0;};\n  };\n  const finish=v=>{\n    if(G.done)return;G.done=true;\n    let ok;if(q.k==='m'){ok=v.length===q.ans.length&&v.every(x=>q.ans.includes(x));}else ok=v===q.ans;\n    G.score+=ok?1:0;G.log.push(ok);recordStat('p1',ok);sfx(ok?'ok':'bad');if(ok)addXP(5);\n    let ex='';\n    if(q.k==='z'){const s=q.s;ex=s.z?`${s.n} ist im ganzen Bereich des Diagramms ${s.z}.`:`${s.n} ${s.m!=null?`schmilzt bei ${s.m} °C`:''}${s.b!=null?` und siedet bei ${s.b} °C`:''}. Bei ${q.t} °C ist es deshalb ${q.ans}.`;}\n    if(q.k==='m'){const miss=q.ans.filter(n=>!v.includes(n)),wrong=v.filter(n=>!q.ans.includes(n));ex=`Bei ${q.t} °C ${q.ans.length===1?'ist':'sind'} ${q.ans.join(', ')} ${q.z}.`+(miss.length?` <b>! Vergessen:<\/b> ${miss.join(', ')}.`:'')+(wrong.length?` <b>✗ Falsch gewählt:<\/b> ${wrong.join(', ')}.`:'');}\n    if(q.k==='v')ex=`${q.s.n} ${q.v===q.s.m?'schmilzt':'siedet'} laut Diagramm bei ${q.ans}.`+(q.s.n==='Kerzenwachs'?' (Echtes Kerzenwachs schmilzt eher bei 50–60 °C.)':'');\n    draw(`<div class=\"fbox ${ok?'ok':'bad'}\"><div>${ok?'✓ Richtig!':'✗ Nicht ganz.'} ${ex}<\/div><button class=\"big go\" id=\"thnext\">${G.i+1<G.qs.length?'Weiter ▶':'Auswertung'}<\/button><\/div>`);\n    c.querySelectorAll('[data-z]').forEach(b=>{b.disabled=true;if(b.dataset.z===q.ans)b.classList.add('right');else if(b.dataset.z===v)b.classList.add('wrong');});\n  };\n  draw();\n}\nfunction thEnd(){\n  const n=G.qs.length,p=G.score/n;\n  if(p>=.9)confetti();\n  showResult('therm',`${stars(p)}<p><b>${G.score} von ${n}<\/b> richtig<\/p><p>${p>=.9?'Du kannst das Diagramm super lesen!':p>=.6?'Gut! Schau dir die Grenztemperaturen noch einmal an.':'Übe noch einmal mit Farben und achte auf die Grenzlinien.'}<\/p>`);\n}\n\n/* ===== Mischlabor: Warum sinkt oder steigt Wasser? ===== */\nconst MX_RHO=T=>1-(T+288.9414)*Math.pow(T-3.9863,2)/(508929.2*(T+68.12963));\nconst MX_F=r=>r.toFixed(4).replace('.',',');\nconst MX_COL={blau:'#2a6fdb',rot:'#e0412f',grün:'#1f9d55'};\nconst MX_TASKS=[\n {s:{bath:40,ins:'ice',dye:0,pos:'top',col:'blau'},t:'Ein blau gefärbter Eiswürfel (0 °C) kommt in 40 °C warmes Wasser.',q:'Was passiert mit dem blauen Schmelzwasser?',o:['Es sinkt nach unten.','Es steigt nach oben.','Es verteilt sich sofort gleichmäßig.'],a:0,\n  wq:'Warum?',w:['Das kalte Schmelzwasser ist dichter, also schwerer, als das warme Wasser.','Das Eis drückt das Wasser nach unten.','Kaltes Wasser ist leichter als warmes Wasser.'],wa:0,\n  ex:'Der Eiswürfel schwimmt oben, denn Eis ist leichter als Wasser. Sein Schmelzwasser hat aber etwa 0 °C: Die Teilchen liegen dichter beieinander als im 40 °C warmen Wasser. In der gleichen Volumenmenge sind mehr Teilchen, es ist schwerer und sinkt.'},\n {s:{bath:20,ins:'water',dye:60,pos:'bottom',col:'rot'},t:'Ein kleines Glas mit rot gefärbtem, 60 °C warmem Wasser steht unten in einem Becherglas mit 20 °C warmem Wasser.',q:'Was passiert mit dem roten Wasser?',o:['Es steigt nach oben und sammelt sich oben.','Es bleibt im kleinen Glas.','Es sinkt tiefer nach unten.'],a:0,\n  wq:'Warum?',w:['Warmes Wasser ist weniger dicht, also leichter: Seine Teilchen liegen weiter auseinander.','Warmes Wasser hat mehr Teilchen in der gleichen Menge.','Die rote Farbe ist leicht.'],wa:0,\n  ex:'Im warmen Wasser bewegen sich die Teilchen schneller und liegen weiter auseinander. Die gleiche Volumenmenge enthält weniger Teilchen, ist also leichter. Das warme Wasser steigt nach oben und bildet dort eine Schicht.'},\n {s:{bath:20,ins:'water',dye:4,pos:'top',col:'blau'},t:'Blau gefärbtes, 4 °C kaltes Wasser wird oben in ein Becken mit 20 °C warmem Wasser gegossen (wie im Modellversuch mit Tintenwasser).',q:'Was passiert?',o:['Das blaue Wasser sinkt zum Boden.','Das blaue Wasser bleibt oben.','Das blaue Wasser steigt noch höher.'],a:0,\n  wq:'Warum?',w:['Wasser mit 4 °C hat die höchste Dichte und ist am schwersten.','Kaltes Wasser ist immer leichter.','Das Becken zieht das Wasser nach unten.'],wa:0,\n  ex:'Bei 4 °C liegen die Wasserteilchen am dichtesten zusammen. Deshalb ist 4 °C kaltes Wasser schwerer als das 20 °C warme Wasser und sinkt nach unten. So kommt auch das 4 °C kalte Wasser an den Grund eines Sees.'},\n {s:{bath:20,ins:'water',dye:45,pos:'top',col:'rot'},t:'Rot gefärbtes, 45 °C warmes Wasser wird vorsichtig oben auf 20 °C warmes Wasser gegossen.',q:'Was passiert?',o:['Es bleibt oben und bildet eine Schicht.','Es sinkt nach unten.','Es verteilt sich sofort im ganzen Glas.'],a:0,\n  wq:'Warum?',w:['Es ist leichter als das kältere Wasser darunter und liegt schon oben.','Es ist schwerer als das Wasser darunter.','Warmes Wasser kann nicht sinken, weil es verdampft.'],wa:0,\n  ex:'Das warme Wasser ist weniger dicht als das kühlere Wasser darunter. Leichteres Wasser liegt oben, deshalb bleibt die rote Schicht oben.'},\n {s:{bath:20,ins:'water',dye:4,pos:'bottom',col:'blau'},t:'Ein kleines Glas mit blauem, 4 °C kaltem Wasser steht unten in 20 °C warmem Wasser.',q:'Was passiert mit dem blauen Wasser?',o:['Es bleibt unten.','Es steigt nach oben.','Es springt aus dem Glas und verteilt sich sofort.'],a:0,\n  wq:'Warum?',w:['Es ist schwerer als das wärmere Wasser und liegt schon ganz unten.','Kaltes Wasser ist leichter und will nach oben, kann aber nicht.','Das kleine Glas hält es mit einem Deckel fest.'],wa:0,\n  ex:'Schweres, dichtes Wasser liegt unten. Das blaue 4 °C kalte Wasser bleibt deshalb am Boden und vermischt sich nur ganz langsam.'},\n {s:{bath:20,ins:'water',dye:20,pos:'bottom',col:'grün'},t:'Ein kleines Glas mit grün gefärbtem Wasser steht unten. Beide Wassersorten haben 20 °C.',q:'Was passiert mit dem grünen Wasser?',o:['Es steigt nicht und sinkt nicht, es verteilt sich nur langsam.','Es steigt schnell nach oben.','Es sinkt schnell nach unten.'],a:0,\n  wq:'Warum?',w:['Gleich warmes Wasser hat die gleiche Dichte, es ist nicht leichter und nicht schwerer.','Grünes Wasser ist schwerer.','Das kleine Glas ist zu klein.'],wa:0,\n  ex:'Gleiche Temperatur bedeutet gleiche Dichte. Es gibt keinen Grund zum Steigen oder Sinken. Die Farbe verteilt sich nur langsam, weil sich die Teilchen ständig bewegen.'},\n {s:{bath:4,ins:'water',dye:1,pos:'bottom',col:'blau'},t:'Überraschung: Blaues, 1 °C kaltes Wasser steht im kleinen Glas unten in 4 °C kaltem Wasser.',q:'Was passiert mit dem blauen Wasser?',o:['Es steigt nach oben.','Es bleibt unten, weil es kälter ist.','Es gefriert sofort.'],a:0,\n  wq:'Warum?',w:['Unter 4 °C dehnt sich Wasser wieder aus. 1 °C kaltes Wasser ist leichter als 4 °C kaltes.','Kälteres Wasser ist immer schwerer.','Das Wasser mit 4 °C drückt es nach oben, weil es wärmer ist.'],wa:0,\n  ex:'Das ist die Anomalie des Wassers: Am dichtesten ist Wasser bei 4 °C. Wird es noch kälter, rücken die Teilchen wieder etwas auseinander. Deshalb steigt 1 °C kaltes Wasser über 4 °C kaltes Wasser, genau wie im See im Winter.'},\n {s:{bath:2,ins:'ice',dye:0,pos:'top',col:'blau'},t:'Ein blauer Eiswürfel kommt in sehr kaltes Wasser mit 2 °C.',q:'Was passiert mit dem blauen Schmelzwasser?',o:['Es bleibt oben.','Es sinkt schnell nach unten.','Es entsteht gar kein Schmelzwasser.'],a:0,\n  wq:'Warum?',w:['Wasser mit 0 °C ist leichter als Wasser mit 2 °C, weil 4 °C die dichteste Temperatur ist.','Eis kann in kaltem Wasser nicht schmelzen.','Schmelzwasser ist immer schwerer.'],wa:0,\n  ex:'Das Schmelzwasser hat etwa 0 °C. Unter 4 °C gilt: je kälter, desto leichter. 0 °C kaltes Wasser ist leichter als 2 °C kaltes und bleibt oben. Der Eiswürfel schmilzt langsam, weil das Wasser kaum wärmer ist als er.'},\n {s:{bath:40,ins:'water',dye:80,pos:'bottom',col:'rot'},t:'Rotes, 80 °C heißes Wasser steht im kleinen Glas unten in 40 °C warmem Wasser.',q:'Was passiert?',o:['Das rote Wasser steigt nach oben.','Nichts, beide sind warm.','Das rote Wasser sinkt.'],a:0,\n  wq:'Warum?',w:['Je wärmer Wasser ist, desto weniger dicht ist es. 80 °C ist leichter als 40 °C.','Heißes Wasser ist schwerer.','Warmes Wasser mischt sich nie.'],wa:0,\n  ex:'Auch zwischen zwei warmen Wassersorten gilt: Das wärmere hat weiter auseinanderliegende Teilchen, ist leichter und steigt.'},\n {s:{bath:1,ins:'water',dye:4,pos:'top',col:'blau'},t:'Blaues, 4 °C kaltes Wasser wird oben in 1 °C kaltes Wasser gegossen.',q:'Was passiert?',o:['Es sinkt nach unten, obwohl es wärmer ist.','Es bleibt oben, weil es wärmer ist.','Es gefriert.'],a:0,\n  wq:'Warum?',w:['Wasser mit 4 °C ist am dichtesten, auch dichter als 1 °C kaltes Wasser.','Wärmeres Wasser ist immer schwerer.','Das kalte Wasser saugt es an.'],wa:0,\n  ex:'4 °C ist die Temperatur mit der größten Dichte. Deshalb sinkt 4 °C kaltes Wasser sogar in noch kälterem Wasser nach unten. So sammelt sich am Grund eines Sees im Winter 4 °C kaltes Wasser.'}\n];\nconst MX_MISS=[['boil','Bring das Wasser zum Kochen, bis ein Teil verdampft ist.'],['freeze','Stell das Glas ins Gefrierfach: Wo entsteht das Eis zuerst?'],['bulge','Friere das ganze Glas ein, bis das Eis herausragt.'],['up','Lass gefärbtes Wasser vom Boden nach oben steigen.'],['down','Lass gefärbtes Wasser von oben nach unten sinken.'],['icesink','Ein Eiswürfel schwimmt, aber sein Schmelzwasser sinkt nach unten.'],['icetop','Schaffe es, dass das Schmelzwasser eines Eiswürfels oben bleibt.'],['coldup','Lass kälteres Wasser nach oben steigen. Tipp: Denk an die 4 °C.']];\nfunction mixLab(){G={mode:'mix',finished:false,phase:'menu',raf:0};shell('mix');mxMenu();}\nfunction mxMenu(){stopAll();G.finished=false;G.tk=null;const c=$('#card');c.classList.remove('wide');S.mixm=S.mixm||{};$('#pprog').textContent='';\n  const cnt=list=>`${list.filter(m=>S.mixm[m[0]]).length}/${list.length} Aufträge`;\n  const B=(id,ic,t,d,n)=>`<button class=\"mxbig\" id=\"${id}\"><span>${ic}<\/span><b>${t}<\/b><small>${d}${n?' · '+n:''}<\/small><\/button>`;\n  c.innerHTML=`<div class=\"q\">Forscherlabor: Probier es selbst aus!<\/div><p class=\"mxp\">Wähle eine Station. Überall zeigt dir die Lupe, was die Teilchen machen.<\/p>\n  <div class=\"mxgrid\">${B('mxT','🔮','Versuchsreihe: Vorhersagen','10 Versuche zum Steigen und Sinken. Erst vorhersagen, dann zuschauen.','')}\n  ${B('mxF','🧪','Mischen: Eiswürfel und Farbwasser','Temperaturen einstellen und schauen, was steigt und sinkt.',cnt(MX_MISS))}\n  ${B('mxH','🔥','Becherglas: Heizen und Gefrieren','Bis zum Kochen erhitzen oder bis zum Eisblock abkühlen.',cnt(LB_MISS.heat))}\n  ${B('mxR','🛣️','Straße im Jahreslauf','Regen, Frost und Tauwetter: Wie entsteht ein Schlagloch?',cnt(LB_MISS.road))}\n  ${B('mxA','🌱','Acker im Winter','Wie Frost den Boden für den Frühling lockert.',cnt(LB_MISS.field))}\n  ${B('mxB','🍾','Flasche im Gefrierfach','Voll oder nicht ganz voll, Deckel zu oder offen?',cnt(LB_MISS.bottle))}<\/div>`;\n  $('#mxT').onclick=()=>{G.tasks=MX_TASKS.slice();G.ti=0;G.score=0;mxTask();};$('#mxF').onclick=mxFree;\n  $('#mxH').onclick=lbHeat;$('#mxR').onclick=lbRoad;$('#mxA').onclick=lbField;$('#mxB').onclick=lbBottle;app.scrollTop=0;}\n/* ---------- Simulation ---------- */\nfunction mxSim(cv,set){\n  const ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);\n  const sim={set,parts:[],t:0,running:false,ice:null,done:false,cv,speed:1.6};\n  const size=()=>{const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);sim.W=w;sim.H=h;\n    sim.x0=w*.18;sim.x1=w*.82;sim.yb=h*.2;sim.y1=h*.92;sim.dep=sim.y1-sim.yb;sim.y0=sim.yb+(1-(sim.level||1))*sim.dep;sim.cx=w/2;sim.gw=Math.min(70,(sim.x1-sim.x0)*.28);sim.gh=(sim.y1-sim.y0)*.3;};\n  size();sim.resize=()=>{size();draw();};\n  sim.reset=s=>{sim.set=s||sim.set;sim.parts=[];sim.t=0;sim.running=false;sim.done=false;sim.ice=null;sim.res=null;sim.level=1;sim.y0=sim.yb;sim.iceTh=0;sim.bulge=0;sim.bub=[];sim.steam=[];const S2=sim.set;\n    if(S2.ins==='ice'){sim.ice={s:44,x:sim.cx,acc:0};}\n    else{for(let i=0;i<240;i++){let x,y;if(S2.pos==='bottom'){x=sim.cx+(Math.random()-.5)*(sim.gw-10);y=sim.y1-6-Math.random()*(sim.gh-12);}else{const a=Math.random()*6.28,r=Math.sqrt(Math.random())*26;x=sim.cx+Math.cos(a)*r*1.4;y=sim.y0+10+Math.abs(Math.sin(a)*r);}\n      sim.parts.push({x,y,T:S2.dye,g:S2.pos==='bottom'});}}\n    draw();};\n  const vel=T=>{const d=(MX_RHO(Math.max(0,sim.set.bath))-MX_RHO(T))*1000;return Math.sign(d)*Math.min(140,40*Math.pow(Math.abs(d),.4));};\n  function step(dt){const S2=sim.set,h=0.035;sim.t+=dt;\n    const B=S2.bath,dep=sim.dep;\n    if(B>=90){const n=(B-88)*0.9*dt;for(let k=0;k<n+(Math.random()<n%1?1:0);k++)sim.bub.push({x:sim.x0+8+Math.random()*(sim.x1-sim.x0-16),y:sim.y1-4,r:1.5+Math.random()*(B>=100?4:2)});}\n    for(const b of sim.bub){b.y-=(50+b.r*12)*dt;b.r+=dt*(B>=100?2:.6);}sim.bub=sim.bub.filter(b=>b.y>sim.y0+2);\n    if(B>=100&&sim.level>0.35){sim.level=Math.max(0.35,sim.level-0.012*dt);}\n    if(B>=45&&Math.random()<(B>=100?6:B/120)*dt*3)sim.steam.push({x:sim.x0+10+Math.random()*(sim.x1-sim.x0-20),y:sim.y0-4,a:B>=100?.55:.18,r:4+Math.random()*6});\n    for(const q of sim.steam){q.y-=24*dt;q.r+=6*dt;q.a-=.12*dt;}sim.steam=sim.steam.filter(q=>q.a>0&&q.y>-20);\n    sim.y0=sim.yb+(1-sim.level)*dep;\n    if(B<0){if(sim.iceTh<dep)sim.iceTh=Math.min(dep,sim.iceTh+(-B)*0.9*dt);else sim.bulge=Math.min(dep*.09,sim.bulge+dep*.03*dt);}\n    if(sim.ice&&sim.ice.s>0){const rate=1.1+0.12*S2.bath;sim.ice.s=Math.max(0,sim.ice.s-rate*dt*0.45);sim.ice.acc+=rate*dt*6;\n      while(sim.ice.acc>1&&sim.parts.length<420){sim.ice.acc-=1;const s=sim.ice.s;sim.parts.push({x:sim.ice.x+(Math.random()-.5)*Math.max(8,s),y:sim.y0+s*.85+2,T:0,g:false});}}\n    for(const p of sim.parts){if(sim.iceTh>0&&p.y<sim.y0+sim.iceTh){continue;}p.T+=(Math.max(0,S2.bath)-p.T)*h*dt;const v=vel(p.T);\n      p.y-=v*dt;p.y+=(Math.random()-.5)*18*dt*3;p.x+=(Math.random()-.5)*18*dt*3;\n      if(p.g){const gl=sim.cx-sim.gw/2+4,gr=sim.cx+sim.gw/2-4,gt=sim.y1-sim.gh;if(p.y>gt){p.x=Math.max(gl,Math.min(gr,p.x));}else p.g=false;}\n      const top=sim.y0+(sim.ice&&Math.abs(p.x-sim.ice.x)<sim.ice.s/2?sim.ice.s*.85+2:3),bot=sim.y1-4;\n      const band=Math.min(26,6+sim.parts.length/22);\n      if(p.y<top+band){if(p.y<top)p.y=top+Math.random()*band;p.x+=(Math.random()-.5)*160*dt+Math.sign(p.x-sim.cx||1)*4*dt;}\n      if(p.y>bot-band&&!p.g){if(p.y>bot)p.y=bot-Math.random()*band;p.x+=(Math.random()-.5)*160*dt+Math.sign(p.x-sim.cx||1)*4*dt;}\n      if(p.g&&p.y>bot)p.y=bot;\n      p.x=Math.max(sim.x0+4,Math.min(sim.x1-4,p.x));}\n  }\n  function draw(){const W=sim.W,H=sim.H,S2=sim.set;ctx.clearRect(0,0,W,H);\n    const warm=Math.max(0,Math.min(1,S2.bath/60)),bc=`rgba(${Math.round(90+150*warm)},${Math.round(160-30*warm)},${Math.round(255-170*warm)},0.20)`;\n    ctx.fillStyle=bc;ctx.fillRect(sim.x0,sim.y0,sim.x1-sim.x0,sim.y1-sim.y0);\n    ctx.strokeStyle='rgba(120,160,200,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sim.x0-4,sim.y0-26);ctx.lineTo(sim.x0-4,sim.y1+3);ctx.lineTo(sim.x1+4,sim.y1+3);ctx.lineTo(sim.x1+4,sim.y0-26);ctx.stroke();\n    ctx.strokeStyle='rgba(120,160,200,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sim.x0,sim.y0);ctx.lineTo(sim.x1,sim.y0);ctx.stroke();\n    if(sim.iceTh>0){ctx.fillStyle='rgba(215,238,255,.92)';ctx.fillRect(sim.x0,sim.y0,sim.x1-sim.x0,sim.iceTh);\n      if(sim.bulge>0){ctx.beginPath();ctx.moveTo(sim.x0,sim.y0);ctx.quadraticCurveTo(sim.cx,sim.y0-sim.bulge*2.1,sim.x1,sim.y0);ctx.closePath();ctx.fill();}\n      ctx.strokeStyle='rgba(120,170,220,.6)';ctx.lineWidth=1;for(let yy=sim.y0+8;yy<sim.y0+sim.iceTh;yy+=14)for(let xx=sim.x0+8;xx<sim.x1;xx+=16){ctx.beginPath();ctx.moveTo(xx-4,yy);ctx.lineTo(xx+4,yy);ctx.moveTo(xx,yy-4);ctx.lineTo(xx,yy+4);ctx.stroke();}}\n    ctx.strokeStyle='rgba(120,160,200,.8)';ctx.lineWidth=1.2;for(const b of sim.bub){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.stroke();}\n    for(const q of sim.steam){ctx.fillStyle=`rgba(200,205,215,${Math.max(0,q.a)})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fill();}\n    if(S2.ins==='water'&&S2.pos==='bottom'){const gl=sim.cx-sim.gw/2,gt=sim.y1-sim.gh;ctx.strokeStyle='rgba(120,160,200,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(gl,gt);ctx.lineTo(gl,sim.y1);ctx.lineTo(gl+sim.gw,sim.y1);ctx.lineTo(gl+sim.gw,gt);ctx.stroke();}\n    if(S2.ins==='water'&&S2.pos==='top'&&sim.t<3){ctx.strokeStyle='rgba(120,160,200,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(sim.cx-30,sim.y0-34);ctx.lineTo(sim.cx-6,sim.y0-6);ctx.lineTo(sim.cx-6,sim.y0+8);ctx.moveTo(sim.cx+30,sim.y0-34);ctx.lineTo(sim.cx+6,sim.y0-6);ctx.lineTo(sim.cx+6,sim.y0+8);ctx.stroke();}\n    const col=MX_COL[S2.col]||'#2a6fdb';ctx.fillStyle=col;ctx.globalAlpha=.75;\n    for(const p of sim.parts){ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,6.283);ctx.fill();}\n    ctx.globalAlpha=1;\n    if(sim.ice&&sim.ice.s>1){const s=sim.ice.s;ctx.fillStyle='rgba(225,240,255,.95)';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.fillRect(sim.ice.x-s/2,sim.y0-s*.15,s,s);ctx.strokeRect(sim.ice.x-s/2,sim.y0-s*.15,s,s);\n      ctx.fillStyle=col;ctx.globalAlpha=.35;ctx.fillRect(sim.ice.x-s/2+3,sim.y0-s*.15+3,s-6,s-6);ctx.globalAlpha=1;}\n    ctx.fillStyle=getComputedStyle(document.body).color;ctx.font='bold 12px system-ui,sans-serif';ctx.textAlign='left';\n    const lab=S2.bath<0?`Gefrierfach: ${S2.bath} °C`:S2.bath>=100?'100 °C: Das Wasser kocht':`Wasser im Glas: ${S2.bath} °C`;ctx.fillText(lab,sim.x0,sim.y1+14);\n    ctx.font='bold 11px system-ui,sans-serif';\n    if(sim.iceTh>0&&sim.iceTh<sim.dep){ctx.fillText('Eis entsteht zuerst oben',sim.x1-150,sim.y0+Math.min(sim.iceTh,40)-4);ctx.fillText('unten noch Wasser (4 °C)',sim.x1-150,sim.y1-8);}\n    if(sim.bulge>2)ctx.fillText('Eis ragt aus dem Glas!',sim.x0+4,sim.yb-sim.bulge*1.2-6);\n    if(S2.bath>=100&&sim.steam.length)ctx.fillText('Die Wolke sind Tröpfchen, der Dampf selbst ist unsichtbar',Math.max(4,sim.x0-20),12);\n  }\n  sim.play=(onEnd,dur)=>{if(sim.running)return;sim.running=true;let last=performance.now();\n    const loop=now=>{if(!sim.running||!document.body.contains(cv))return;const dt=Math.min(.05,(now-last)/1000)*sim.speed;last=now;step(dt);draw();if(sim.onTick)sim.onTick(sim);\n      if(dur&&sim.t>=dur){sim.running=false;sim.done=true;onEnd&&onEnd(sim);return;}G.raf=requestAnimationFrame(loop);};G.raf=requestAnimationFrame(loop);};\n  sim.stop=()=>{sim.running=false;cancelAnimationFrame(G.raf);};\n  sim.stats=()=>{const n=sim.parts.length||1,h=sim.y1-sim.y0;sim.info={level:sim.level,ice:sim.iceTh/sim.dep,bulge:sim.bulge};let top=0,bot=0,mean=0;for(const p of sim.parts){const r=(p.y-sim.y0)/h;if(r<1/3)top++;else if(r>2/3)bot++;mean+=p.T;}return{top:top/n,bot:bot/n,T:sim.parts.length?mean/n:sim.set.dye,n:sim.parts.length,iceLeft:sim.ice?sim.ice.s:0};};\n  sim.reset(set);return sim;\n}\nfunction mxLupe(set,Tdye){\n  const Td=set.ins==='ice'?0:Tdye,rb=MX_RHO(set.bath),rd=MX_RHO(Td),d=(rd-rb)*1000,eq=Math.abs(d)<0.01;\n  const fine=Math.abs(rd-rb)<0.0005,fmt=r=>fine?r.toFixed(5).replace('.',','):MX_F(r);\n  const nb=eq?14:d>0?12:16,nd=eq?14:d>0?16:12;\n  const box=(label,val,n,isIce)=>{let dots='';\n    if(isIce){for(let i=0;i<3;i++)for(let j=0;j<3;j++)dots+=`<circle cx=\"${12+j*18}\" cy=\"${12+i*18}\" r=\"5\"/>`;}\n    else{let seed=n*7919+(label.length*31);const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};const cols=Math.ceil(Math.sqrt(n)),st=48/cols;for(let k=0;k<n;k++){const i=Math.floor(k/cols),j=k%cols;dots+=`<circle cx=\"${6+j*st+st/2+(rnd()-.5)*3}\" cy=\"${6+i*st+st/2+(rnd()-.5)*3}\" r=\"4\"/>`;}}\n    return`<div class=\"mxl\"><svg viewBox=\"0 0 60 60\" width=\"60\" height=\"60\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><g fill=\"currentColor\" fill-opacity=\".75\">${dots}<\/g><\/svg><small>${label}<br><b>${val} g/cm³<\/b><\/small><\/div>`;};\n  const nm=set.ins==='ice'?'Schmelzwasser':'Farbwasser';\n  const cmp=eq?'gleich dicht: kein Steigen und kein Sinken':d>0?'dichter, also schwerer ⬇ sinkt':'weniger dicht, also leichter ⬆ steigt';\n  return`<div class=\"mxlupe\"><div class=\"mxlt\">🔍 Lupe: Teilchen in gleich viel Wasser (vereinfacht)<\/div><div class=\"mxlr\">${box(`Glas ${set.bath} °C`,fmt(rb),nb)}${set.ins==='ice'?box('Eis 0 °C','0,917',9,true):''}${box(`${nm} ${Td} °C`,fmt(rd),nd)}<\/div><div class=\"mxlc\">${nm} ist <b>${cmp}<\/b>.${set.ins==='ice'?' Das Eis selbst ist leichter als Wasser und schwimmt.':''}<\/div><\/div>`;\n}\n/* ---------- Versuchsreihe ---------- */\nfunction mxTask(){const T=G.tasks[G.ti],c=$('#card');c.classList.add('wide');G.pick=null;G.why=null;$('#pprog').textContent=`${G.ti+1} / ${G.tasks.length}`;\n  const order=shuffle(T.o.map((_,i)=>i)),worder=shuffle(T.w.map((_,i)=>i));\n  c.innerHTML=`<div class=\"wkgrid\"><div class=\"wkL\"><div class=\"mxst\">${esc(T.t)}<\/div><canvas class=\"mxcv wkcv\" id=\"mxcv\"><\/canvas><\/div>\n    <div class=\"wkR\"><div class=\"q\" id=\"mxq\">1. ${esc(T.q)}<\/div><div class=\"opts mxopts\" id=\"mxo\">${order.map(i=>`<button class=\"opt\" data-i=\"${i}\">${esc(T.o[i])}<\/button>`).join('')}<\/div>\n    <div id=\"mxw\"><\/div><div id=\"mxr\"><\/div><\/div><\/div>`;\n  const sim=mxSim($('#mxcv'),Object.assign({},T.s));G.sim=sim;\n  c.querySelectorAll('#mxo .opt').forEach(b=>b.onclick=()=>{if(G.pick!==null)return;G.pick=+b.dataset.i;b.classList.add('chosen');c.querySelectorAll('#mxo .opt').forEach(x=>x.disabled=true);\n    $('#mxw').innerHTML=`<div class=\"q\">2. ${esc(T.wq)}<\/div><div class=\"opts mxopts\">${worder.map(i=>`<button class=\"opt\" data-w=\"${i}\">${esc(T.w[i])}<\/button>`).join('')}<\/div>`;\n    c.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{if(G.why!==null)return;G.why=+x.dataset.w;x.classList.add('chosen');c.querySelectorAll('[data-w]').forEach(y=>y.disabled=true);\n      $('#mxr').innerHTML=`<button class=\"big go\" id=\"mxgo\">▶ Versuch starten<\/button>`;$('#mxgo').onclick=()=>{$('#mxgo').remove();if(innerWidth<760)$('#mxcv').scrollIntoView({behavior:'smooth',block:'center'});\n        sim.play(()=>mxTaskEnd(T),T.s.ins==='ice'?14:11);};\n      $('#mxgo').scrollIntoView({behavior:'smooth',block:'center'});});\n    $('#mxw').scrollIntoView({behavior:'smooth',block:'nearest'});});\n}\nfunction mxTaskEnd(T){const c=$('#card'),ok1=G.pick===T.a,ok2=G.why===T.wa;G.score+=(ok1?1:0)+(ok2?1:0);recordStat(T.s.bath<=4||T.s.dye<=4?'p4':'p3',ok1&&ok2);\n  sfx(ok1&&ok2?'ok':'bad');if(ok1)addXP(4);if(ok2)addXP(4);\n  c.querySelectorAll('#mxo .opt').forEach(b=>{if(+b.dataset.i===T.a)b.classList.add('right');else if(b.classList.contains('chosen'))b.classList.add('wrong');});\n  c.querySelectorAll('[data-w]').forEach(b=>{if(+b.dataset.w===T.wa)b.classList.add('right');else if(b.classList.contains('chosen'))b.classList.add('wrong');});\n  const st=G.sim.stats();\n  $('#mxr').innerHTML=`<div class=\"fbox ${ok1&&ok2?'ok':'bad'}\"><b>${ok1&&ok2?'✓ Vorhersage und Begründung richtig!':ok1?'Vorhersage richtig, Begründung noch nicht.':ok2?'Begründung richtig, Vorhersage noch nicht.':'✗ Diesmal nicht richtig.'}<\/b><div>${esc(T.ex)}<\/div><\/div>${mxLupe(T.s,T.s.dye)}\n    <button class=\"big go\" id=\"mxnx\">${G.ti+1<G.tasks.length?'Nächster Versuch ▶':'Auswertung'}<\/button>`;\n  $('#mxnx').onclick=()=>{G.sim.stop();G.ti++;if(G.ti>=G.tasks.length)return mxEnd();mxTask();app.scrollTop=0;};\n  $('#mxr').scrollIntoView({behavior:'smooth',block:'nearest'});}\nfunction mxEnd(){const n=G.tasks.length*2,p=G.score/n;if(p>=.9)confetti();\n  showResult('mix',`${stars(p)}<p><b>${G.score} von ${n}<\/b> Punkten (Vorhersage und Begründung)<\/p><p>${p>=.9?'Du bist ein echter Wasser-Forscher!':p>=.6?'Gut beobachtet! Schau dir die Lupe bei den Fehlern noch einmal an.':'Probier es im freien Experimentieren noch einmal aus und schau auf die Lupe.'}<\/p>`);}\n/* ---------- Freies Experimentieren ---------- */\nfunction mxFree(){const c=$('#card');c.classList.add('wide');S.mixm=S.mixm||{};G.fs={bath:20,ins:'water',dye:60,pos:'bottom',col:'rot'};$('#pprog').textContent='';\n  c.innerHTML=`<div class=\"wkgrid\"><div class=\"wkL\"><div class=\"wkstage\"><canvas class=\"mxcv wkcv\" id=\"mxcv\"><\/canvas>${TK_COVER}<\/div><div id=\"mxlive\" class=\"mxlive tkveil\"><\/div><\/div>\n  <div class=\"wkR\"><div class=\"lbtask\" id=\"tktask\" style=\"display:none\"><\/div><div class=\"mxctl\">\n   <label>Wasser im Glas: <b id=\"lb\">20 °C<\/b><input type=\"range\" id=\"rb\" min=\"-10\" max=\"100\" value=\"20\"><small class=\"mxhint\">Unter 0 °C steht das Glas im Gefrierfach, bei 100 °C auf der heißen Herdplatte.<\/small><\/label>\n   <div class=\"mxchips\" id=\"cins\"><button data-ins=\"water\" class=\"on\">💧 Farbwasser<\/button><button data-ins=\"ice\">🧊 Farb-Eiswürfel<\/button><\/div>\n   <label id=\"ldye\">Farbwasser: <b id=\"ld\">60 °C<\/b><input type=\"range\" id=\"rd\" min=\"0\" max=\"90\" value=\"60\"><\/label>\n   <div class=\"mxchips\" id=\"cpos\"><button data-pos=\"bottom\" class=\"on\">⬇ unten im kleinen Glas<\/button><button data-pos=\"top\">⬆ oben eingießen<\/button><\/div>\n   <div class=\"mxchips\" id=\"ccol\"><button data-col=\"rot\" class=\"on\">🔴 rot<\/button><button data-col=\"blau\">🔵 blau<\/button><button data-col=\"grün\">🟢 grün<\/button><\/div>\n   <div class=\"mxbtns\"><button class=\"big go\" id=\"mxstart\">▶ Einfüllen<\/button><button class=\"big sec\" id=\"mxreset\">⟲ Neu<\/button><\/div>\n  <\/div>\n  <div class=\"tkmis\" id=\"tkmis\"><\/div><button class=\"big sec\" id=\"stback\">◀ Zurück<\/button><\/div><\/div>`;\n  $('#stback').onclick=()=>{G.sim&&G.sim.stop();G.tk=null;(G.mode==='werk'?wkMenu:mxMenu)();};\n  const sim=mxSim($('#mxcv'),Object.assign({},G.fs));G.sim=sim;G.fdone=false;\n  tkNew('mix',MX_MISS,k=>!!S.mixm[k],k=>{S.mixm[k]=1;save();},()=>mxStateText(sim));tkDraw();tkBind(c.querySelector('.mxctl'));\n  const upd=()=>{const f=G.fs;$('#lb').textContent=f.bath<0?f.bath+' °C (Gefrierfach)':f.bath>=100?'100 °C (kocht)':f.bath>=90?f.bath+' °C (fast kochend)':f.bath+' °C';$('#ld').textContent=f.dye+' °C';$('#ldye').style.display=f.ins==='ice'?'none':'';$('#cpos').style.display=f.ins==='ice'?'none':'';\n    ['ins','pos','col'].forEach(k=>c.querySelectorAll(`[data-${k}]`).forEach(b=>b.classList.toggle('on',b.dataset[k]===f[k])));\n    sim.stop();sim.reset(Object.assign({},f,f.ins==='ice'?{dye:0,pos:'top'}:{}));live();};\n  const live=()=>{const st=sim.stats(),f=sim.set;$('#mxlive').innerHTML=(f.bath<0||f.bath>=90?mxPhase(f.bath,sim):mxLupe(f,f.dye))+(sim.running||sim.done?`<div class=\"mxobs\">⏱️ ${Math.round(sim.t)} s · oben ${Math.round(st.top*100)} % · unten ${Math.round(st.bot*100)} % der Farbe<\/div>`:'');};\n  sim.onTick=s=>{if(Math.floor(s.t*4)!==G.lt){G.lt=Math.floor(s.t*4);live();mxCheck(s);}};\n  $('#rb').oninput=e=>{G.fs.bath=+e.target.value;upd();};$('#rd').oninput=e=>{G.fs.dye=+e.target.value;upd();};\n  c.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{G.fs.ins=b.dataset.ins;upd();});\n  c.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{G.fs.pos=b.dataset.pos;upd();});\n  c.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{G.fs.col=b.dataset.col;upd();});\n  $('#mxstart').onclick=()=>{if(sim.running)return;if(sim.done||sim.t>0)sim.reset();sim.play(s=>{live();mxCheck(s,true);},sim.set.bath<0||sim.set.bath>=100?45:sim.set.ins==='ice'?30:25);};\n  $('#mxreset').onclick=upd;upd();\n}\nfunction mxPhase(B,sim){const I=sim.info||{};\n  if(B<0)return`<div class=\"mxlupe\"><div class=\"mxlt\">🔍 Lupe: Wasser wird zu Eis<\/div><div class=\"mxlr\">${mxDots(14,false,'Wasser (4 °C)')}${mxDots(9,true,'Eis (0 °C)')}<\/div><div class=\"mxlc\">Oben kühlt das Wasser zuerst ab. Unter 4 °C wird es wieder leichter und bleibt oben, dort gefriert es. Im Eiskristall liegen die Teilchen regelmäßig und <b>weiter auseinander<\/b>: Eis braucht etwa ein Zehntel mehr Platz.${I.bulge>2?' Deshalb ragt es jetzt aus dem Glas.':''}<\/div><\/div>`;\n  return`<div class=\"mxlupe\"><div class=\"mxlt\">🔍 Lupe: Wasser wird zu Dampf<\/div><div class=\"mxlr\">${mxDots(14,false,'Wasser')}${mxDots(3,false,'Wasserdampf',true)}<\/div><div class=\"mxlc\">${B>=100?'Bei 100 °C siedet Wasser: Überall im Wasser entstehen Dampfblasen, die Teilchen lösen sich und fliegen mit großem Abstand davon. Der Wasserstand sinkt: Das Wasser <b>verdampft<\/b>.':'Kurz vor 100 °C steigen die ersten Blasen auf. An der Oberfläche verdunstet schon Wasser.'} Wasserdampf ist unsichtbar, die weiße Wolke besteht aus winzigen Tröpfchen.<\/div><\/div>`;}\nfunction mxDots(n,lat,label,far){let d='';if(lat){for(let i=0;i<3;i++)for(let j=0;j<3;j++)d+=`<circle cx=\"${12+j*18}\" cy=\"${12+i*18}\" r=\"5\"/>`;}else if(far){[[12,14],[44,28],[22,48]].forEach(([x,y])=>d+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"4\"/>`);}else{const c=Math.ceil(Math.sqrt(n)),st=48/c;for(let k=0;k<n;k++)d+=`<circle cx=\"${6+(k%c)*st+st/2}\" cy=\"${6+Math.floor(k/c)*st+st/2}\" r=\"4\"/>`;}\n  return`<div class=\"mxl\"><svg viewBox=\"0 0 60 60\" width=\"60\" height=\"60\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><g fill=\"currentColor\" fill-opacity=\".75\">${d}<\/g><\/svg><small>${label}<\/small><\/div>`;}\nfunction mxCheck(s,final){const st=s.stats(),f=s.set;if(!G.tk)return;G.tk.cur=new Set();const hit=tkSat;\n  const I=s.info||{};if(s.set.bath>=100&&I.level<0.9)hit('boil');if(s.set.bath<0&&I.ice>0.15)hit('freeze');if(I.bulge>2)hit('bulge');\n  if(s.t<4)return;\n  if(f.ins==='water'&&f.pos==='bottom'&&st.top>.5)hit('up');\n  if(f.ins==='water'&&f.pos==='top'&&st.bot>.5)hit('down');\n  if(f.ins==='ice'&&st.n>60&&st.bot>.45)hit('icesink');\n  if(f.ins==='ice'&&st.n>120&&st.top>.55&&st.iceLeft<30)hit('icetop');\n  if(f.ins==='water'&&f.pos==='bottom'&&f.dye<f.bath&&st.top>.4)hit('coldup');\n}\nwindow.__MX=()=>G;\n/* ===== Forscherlabor: Heizen/Gefrieren, Straße, Acker, Flasche ===== */\nconst LB_MISS={\n heat:[['h_boil','Bring das Wasser zum Sieden (100 °C).'],['h_evap','Lass die Hälfte des Wassers verdampfen.'],['h_freeze','Lass Eis entstehen. Wo bildet es sich zuerst?'],['h_solid','Friere das Wasser ganz ein und schau, wie hoch das Eis steht.'],['h_melt','Schmelze einen ganz gefrorenen Block wieder.']],\n road:[['r_fill','Lass Regenwasser in den Riss laufen.'],['r_freeze','Lass das Wasser im Riss gefrieren und beobachte den Asphalt.'],['r_thaw','Lass es im Frühling tauen. Was bleibt unter dem Asphalt?'],['r_cycle','Schaffe drei Frost-Tau-Runden.'],['r_hole','Lass ein Auto ein Schlagloch machen.']],\n field:[['f_wet','Lass es regnen, damit Wasser in die Erdklumpen zieht.'],['f_freeze','Lass das Wasser im Boden gefrieren.'],['f_loose','Mach den Boden richtig locker (mindestens 80 %).'],['f_sow','Säe im Frühling auf lockerem Boden.']],\n bottle:[['b_burst','Bring eine geschlossene Flasche zum Platzen.'],['b_safe','Friere eine Flasche ein, ohne dass sie platzt.'],['b_open','Friere eine offene, randvolle Flasche ein. Was passiert oben?']]\n};\nconst LB_ALL=Object.values(LB_MISS).flat().concat(MX_MISS);\nfunction lbHit(k){tkSat(k);}\nfunction lbMissHTML(st){S.mixm=S.mixm||{};return`<div class=\"mxmis\"><div class=\"q\" style=\"font-size:17px\">Forscher-Aufträge<\/div>${LB_MISS[st].map(([k,t])=>`<div class=\"mxm ${S.mixm[k]?'ok':''}\" data-k=\"${k}\" data-t=\"${esc(t)}\">${S.mixm[k]?'✅':'⬜'} ${esc(t)}<\/div>`).join('')}<\/div>`;}\nfunction lbLupe(which){const sv=s=>`<div class=\"stlu\">${modelSVG(s,7)}<small>${s}<\/small><\/div>`;return`<div class=\"mxlupe\"><div class=\"mxlt\">🔍 Lupe: So liegen die Teilchen<\/div><div class=\"mxlr stlr\">${which.map(sv).join('')}<\/div><\/div>`;}\nfunction lbShell(st,title,ctl,info){const c=$('#card');$('#pprog').textContent='';\n  c.classList.add('wide');\n  c.innerHTML=`<div class=\"q\">${title}<\/div><div class=\"wkgrid\"><div class=\"wkL\"><div class=\"wkstage\"><canvas class=\"mxcv wkcv\" id=\"stcv\"><\/canvas>${TK_COVER}<\/div><div id=\"stinfo\" class=\"stinfo tkveil\"><\/div><\/div>\n   <div class=\"wkR\"><div class=\"lbtask\" id=\"tktask\" style=\"display:none\"><\/div><div class=\"mxctl\">${ctl}<\/div><div id=\"stlupe\" class=\"tkveil\"><\/div><div class=\"tkmis\" id=\"tkmis\"><\/div><button class=\"big sec\" id=\"stback\">◀ Zurück zur Stationen-Auswahl<\/button><\/div><\/div>`;\n  $('#stback').onclick=()=>{G.tk=null;mxMenu();};\n  tkNew(st,LB_MISS[st],k=>!!S.mixm[k],k=>{S.mixm[k]=1;save();},()=>($('#stinfo')||{}).innerText||'');tkDraw();tkBind(c.querySelector('.mxctl'));const cv=$('#stcv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);\n  const fit=()=>{const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);return{w,h};};let D=fit();\n  return{c,cv,ctx,D:()=>D,refit:()=>{D=fit();}};}\nfunction lbLoop(step,draw){stopAll();G.finished=false;let last=performance.now();const loop=now=>{if(G.finished||!document.getElementById('stcv'))return;const dt=Math.min(.05,(now-last)/1000);last=now;if(G.tk)G.tk.cur=new Set();step(dt);draw();G.raf=requestAnimationFrame(loop);};G.raf=requestAnimationFrame(loop);}\nconst lbTxt=()=>getComputedStyle(document.body).color;\nfunction lbTempCtl(id,label,min,max,val){return`<label>${label}: <b id=\"${id}l\">${val} °C<\/b><input type=\"range\" id=\"${id}\" min=\"${min}\" max=\"${max}\" value=\"${val}\"><\/label>`;}\n/* ---------- A: Becherglas mit Heizen und Gefrieren ---------- */\nfunction lbHeat(){const W={T:20,tgt:20,level:1,ice:0,bub:[],steam:[],solidSeen:false,evap0:1};\n  const sh=lbShell('heat','🔥 Becherglas: Heizen und Gefrieren',lbTempCtl('ht','Heizplatte / Kühlung einstellen',-15,120,20)+`<div class=\"mxbtns\"><button class=\"big sec\" id=\"hfill\">💧 Glas neu füllen (20 °C)<\/button><button class=\"big sec\" id=\"hroom\">🌡️ Auf 20 °C stellen<\/button><\/div>`);\n  $('#ht').oninput=e=>{W.tgt=+e.target.value;$('#htl').textContent=W.tgt+' °C';};\n  $('#hfill').onclick=()=>{Object.assign(W,{T:20,level:1,ice:0,bub:[],steam:[],solidSeen:false});};\n  $('#hroom').onclick=()=>{W.tgt=20;$('#ht').value=20;$('#htl').textContent='20 °C';};\n  let lastInfo='';\n  const step=dt=>{const r=dt*1.6;\n    if(W.tgt>W.T||(W.ice>0&&W.tgt>0)){ // heizen\n      if(W.ice>0){W.ice=Math.max(0,W.ice-0.06*r*(1+W.tgt/40));W.T=0;if(W.ice===0&&W.solidSeen)lbHit('h_melt');}\n      else if(W.T<100){W.T=Math.min(W.tgt,100,W.T+(W.T<0?12:6)*r*(0.5+Math.max(0,W.tgt-W.T)/60));}\n      if(W.T>=100&&W.tgt>=100&&W.level>0){W.level=Math.max(0,W.level-0.025*r*(1+(W.tgt-100)/20));lbHit('h_boil');if(W.level<=0.5)lbHit('h_evap');}\n    }else if(W.tgt<W.T){ // kühlen\n      if(W.T>0)W.T=Math.max(Math.max(W.tgt,0),W.T-6*r*(0.5+(W.T-W.tgt)/60));\n      else if(W.ice<1&&W.tgt<0){W.T=0;W.ice=Math.min(1,W.ice+0.05*r*(1+(-W.tgt)/15));if(W.ice>0.15)lbHit('h_freeze');if(W.ice>=1){W.solidSeen=true;lbHit('h_solid');}}\n      else if(W.ice>=1)W.T=Math.max(W.tgt,W.T-5*r);\n    }\n    if(W.T>=90&&W.ice===0&&W.level>0&&Math.random()<(W.T-88)/12*.9)W.bub.push({x:Math.random(),y:1,v:.25+Math.random()*.35,r:2+Math.random()*3*(W.T>=100?1.6:1)});\n    W.bub.forEach(b=>b.y-=b.v*dt*(W.T>=100?2:1));W.bub=W.bub.filter(b=>b.y>0);\n    if(W.T>=100&&W.tgt>=100&&W.level>0&&Math.random()<.5)W.steam.push({x:.3+Math.random()*.4,y:0,a:1});\n    W.steam.forEach(s=>{s.y+=dt*.5;s.x+=(Math.random()-.5)*dt*.2;s.a-=dt*.35;});W.steam=W.steam.filter(s=>s.a>0);\n    const st=W.ice>=1?'fest':W.ice>0?'fest + flüssig':W.T>=100?'flüssig, siedet (wird gasförmig)':'flüssig';\n    const info=`<b>${Math.round(W.T)} °C<\/b> · ${st}${W.ice>0&&W.ice<1?' · Das Eis wächst von oben nach unten. Unten bleibt es länger flüssig (bis 4 °C).':''}${W.ice>=1?' · Das Eis steht höher als vorher das Wasser: Es braucht mehr Platz.':''}${W.T>=100&&W.tgt>=100&&W.level>0?' · Wasser verdampft, der Wasserstand sinkt.':''}${W.level<=0?' · Alles Wasser ist verdampft.':''}`;\n    if(info!==lastInfo){lastInfo=info;$('#stinfo').innerHTML=info;$('#stlupe').innerHTML=lbLupe(W.ice>=1?['fest']:W.ice>0?['fes ;i<n;i++){ctx.beginPath();ctx.arc(x-cw/2+cw*(i+.5)/n,y+Math.sin(i*2.1)*ch*.2,Math.max(1.5,cw*.05),0,6.3);ctx.fill();}}\n      if(F.frozen>.5&&c.s>.03){ctx.strokeStyle='#3b2715';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-ch/2);ctx.lineTo(x+cw*.1,y+ch/2);ctx.stroke();}});\n    if(F.T<0){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(0,gy-4,w,6);}\n    F.seeds.forEach(s=>{ctx.font=`${Math.round(12+s.g*16)}px system-ui`;ctx.textAlign='center';ctx.fillText(s.g>.5?'🌱':'•',s.x*w,gy+2);});\n    ctx.fillStyle=lbTxt();ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText(F.T<0?'❄️ Frost':F.T>=5?'🌤️ Frühling':'☁️ kühl',8,18);\n  };\n  lbLoop(step,draw);\n}\n/* ---------- D: Flasche im Gefrierfach ---------- */\nfunction lbBottle(){const B={fill:100,cap:true,inFreezer:false,ice:0,T:20,burst:false,out:0};\n  const sh=lbShell('bottle','🍾 Flasche im Gefrierfach',`<label>Füllhöhe: <b id=\"bfl\">100 %<\/b><input type=\"range\" id=\"bf\" min=\"50\" max=\"100\" value=\"100\"><\/label><div class=\"mxchips\"><button id=\"bcap\" class=\"on\">🔒 Deckel zu<\/button><\/div><div class=\"mxbtns\"><button class=\"big go\" id=\"bin\">❄️ Ins Gefrierfach (−18 °C)<\/button><button class=\"big sec\" id=\"bout\">⟲ Neue Flasche<\/button><\/div>`);\n  const reset=()=>{Object.assign(B,{inFreezer:false,ice:0,T:20,burst:false,out:0,msg:''});$('#bin').textContent='❄️ Ins Gefrierfach (−18 °C)';};\n  $('#bf').oninput=e=>{if(B.inFreezer)return;B.fill=+e.target.value;$('#bfl').textContent=B.fill+' %';};\n  $('#bcap').onclick=()=>{if(B.inFreezer)return;B.cap=!B.cap;$('#bcap').classList.toggle('on',B.cap);$('#bcap').textContent=B.cap?'🔒 Deckel zu':'🔓 Deckel offen';};\n  $('#bin').onclick=()=>{if(B.inFreezer)return;B.inFreezer=true;$('#bin').textContent='⏳ friert ein …';};\n  $('#bout').onclick=reset;let lastInfo='';\n  const step=dt=>{if(!B.inFreezer)return;const r=dt*1.4;\n    if(B.T>0)B.T=Math.max(0,B.T-8*r);else if(B.ice<1){B.ice=Math.min(1,B.ice+0.1*r);}else B.T=Math.max(-18,B.T-6*r);\n    const vol=B.fill/100*(1+0.09*B.ice);\n    if(vol>1){if(B.cap){if(vol>1.03&&!B.burst){B.burst=true;lbHit('b_burst');}}else{B.out=vol-1;if(B.fill>=98&&B.ice>=1)lbHit('b_open');}}\n    if(B.ice>=1&&!B.burst&&B.cap&&vol<=1.03)lbHit('b_safe');\n    if(B.ice>=1&&!B.cap&&vol<=1)lbHit('b_safe');\n    if(B.ice>=1)$('#bin').textContent='✅ durchgefroren';\n    const vol2=Math.round(B.fill*(1+0.09*B.ice));\n    const info=`<b>${Math.round(B.T)} °C<\/b> · ${!B.inFreezer?'Flasche mit Wasser, bereit fürs Gefrierfach.':B.ice<=0?'Das Wasser kühlt ab …':B.ice<1?'Das Wasser gefriert zu Eis …':'Ganz durchgefroren.'}<br><small>Platzbedarf: ${B.inFreezer?vol2:B.fill} % der Flasche${B.inFreezer&&B.ice>0?' (Eis braucht etwa 9 % mehr Platz als Wasser)':''}<\/small>${B.burst?'<br>💥 Die Flasche ist geplatzt! Das Eis hatte keinen Platz mehr.':''}${!B.cap&&B.out>0?'<br>Das Eis wächst oben aus der Flasche heraus.':''}${B.ice>=1&&!B.burst&&B.cap?'<br>Genug Luft gelassen: Die Flasche hält.':''}`;\n    if(info!==lastInfo){lastInfo=info;$('#stinfo').innerHTML=info;$('#stlupe').innerHTML=lbLupe(['flüssig','fest'])+'<div class=\"stnote\">Tipp aus dem Alltag: Flaschen nie randvoll einfrieren. Etwa ein Zehntel Luft lassen.<\/div>';}\n  };\n  const draw=()=>{const {w,h}=sh.D(),ctx=sh.ctx;ctx.clearRect(0,0,w,h);\n    if(B.inFreezer){ctx.fillStyle='rgba(180,215,255,.35)';ctx.fillRect(w*.2,h*.04,w*.6,h*.92);ctx.strokeStyle='rgba(120,160,210,.8)';ctx.lineWidth=3;ctx.strokeRect(w*.2,h*.04,w*.6,h*.92);ctx.fillStyle=lbTxt();ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText('Gefrierfach',w*.22,h*.04+16);}\n    const bx=w*.5,bw=Math.min(90,w*.22),by0=h*.2,by1=h*.9,nk=bw*.36,neckTop=by0-h*.08,bulge=B.burst?bw*.12:Math.min(bw*.1,Math.max(0,(B.fill/100*(1+0.09*B.ice)-1))*bw*3)*(B.cap?1:0);\n    const body=(pad)=>{ctx.beginPath();ctx.moveTo(bx-nk/2,neckTop);ctx.lineTo(bx-nk/2,by0);ctx.quadraticCurveTo(bx-bw/2-pad,by0+10,bx-bw/2-pad,by0+30);ctx.lineTo(bx-bw/2-pad,by1);ctx.lineTo(bx+bw/2+pad,by1);ctx.lineTo(bx+bw/2+pad,by0+30);ctx.quadraticCurveTo(bx+bw/2+pad,by0+10,bx+nk/2,by0);ctx.lineTo(bx+nk/2,neckTop);};\n    ctx.save();body(bulge);ctx.clip();const inner=by1-neckTop,fillH=inner*Math.min(1,B.fill/100*(1+0.09*B.ice));\n    const lt=by1-fillH*(1-B.ice),it=by1-fillH;ctx.fillStyle='rgba(70,150,235,.55)';ctx.fillRect(bx-bw,it,bw*2,by1-it);\n    if(B.ice>0){ctx.fillStyle='rgba(230,245,255,.95)';const iceTop=it,iceH=fillH*B.ice;ctx.fillRect(bx-bw,iceTop,bw*2,iceH);ctx.strokeStyle='rgba(150,195,235,.9)';for(let yy=iceTop+6;yy<iceTop+iceH;yy+=9)for(let xx=bx-bw/2;xx<bx+bw/2;xx+=9){ctx.beginPath();ctx.arc(xx,yy,1.4,0,6.3);ctx.stroke();}}\n    ctx.restore();\n    if(!B.cap&&B.out>0){const oh=B.out*inner*1.2;ctx.fillStyle='rgba(230,245,255,.95)';ctx.beginPath();ctx.moveTo(bx-nk/2,neckTop);ctx.quadraticCurveTo(bx,neckTop-oh*2.2,bx+nk/2,neckTop);ctx.fill();}\n    ctx.strokeStyle=B.burst?'#c0392b':'rgba(90,140,190,.95)';ctx.lineWidth=3;body(bulge);ctx.stroke();\n    if(B.cap){ctx.fillStyle='#d9534f';ctx.fillRect(bx-nk/2-3,neckTop-12,nk+6,12);}\n    if(B.burst){ctx.strokeStyle='#c0392b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(bx-bw/2-bulge,by0+60);ctx.lineTo(bx-bw/2-bulge+14,by0+75);ctx.lineTo(bx-bw/2-bulge+4,by0+90);ctx.lineTo(bx-bw/2-bulge+18,by0+108);ctx.stroke();ctx.font='26px system-ui';ctx.fillText('💥',bx-bw/2-bulge-30,by0+90);}\n  };\n  lbLoop(step,draw);\n}\n\n/* ===== Experimentier-Werkstatt ===== */\nconst WK_ST={\n glas:{i:'🔥',t:'Becherglas: Heizen und Gefrieren',d:'Heize bis zum Sieden oder kühle unter 0 °C.',m:[['boil','Bring das Wasser zum Sieden.'],['plateau','Heize kräftig weiter: Beobachte, dass die Temperatur beim Sieden bei 100 °C bleibt.'],['cond','Setz die kalte Platte auf und lass den Dampf kondensieren.'],['empty','Lass das ganze Wasser verdampfen.'],['icetop','Kühle das Wasser unter 0 °C: Wo bildet sich zuerst Eis?'],['full','Friere das Glas ganz durch: Was passiert mit der Oberfläche?']]},\n strasse:{i:'🛣️',t:'Straße: Frostsprengung',d:'Regen, Frost und Tauwetter auf einer Straße mit Riss.',m:[['rain','Lass Regenwasser in den Riss laufen.'],['lift','Lass das Wasser gefrieren: Was passiert mit dem Asphalt?'],['winter','Lass bei Frost ein Auto fahren: Hält die Straße?'],['pot','Lass nach dem Tauen ein Auto fahren.'],['cyc','Mach drei Runden Regen, Frost und Tauwetter.']]},\n acker:{i:'🌱',t:'Acker im Winter',d:'Was macht Frost mit nassen Erdklumpen?',m:[['wet','Lass es auf den Acker regnen.'],['dry','Friere trockenen Boden: Passiert etwas mit den Klumpen?'],['burst','Friere nassen Boden: Was passiert mit den Klumpen?'],['loose','Mach den Boden mit mehreren Frostrunden richtig locker.'],['sow','Säe im Frühling auf lockerem Boden.']]},\n flasche:{i:'🧴',t:'Flasche im Gefrierfach',d:'Was passiert mit Flaschen voller Wasser bei Frost?',m:[['burst','Bring eine randvolle, geschlossene Plastikflasche zum Platzen.'],['safe','Friere Wasser ein, ohne dass die Flasche kaputtgeht.'],['dome','Zeig, dass Eis aus einem randvollen Becher herauswächst.'],['fridge','Stell eine volle Flasche in den Kühlschrank: Friert sie?'],['glass','Probier aus, warum man keine vollen Glasflaschen einfriert.']]}\n};\nfunction werk(){G={mode:'werk',finished:false,raf:0};shell('werk');wkMenu();}\nfunction wkMenu(){stopAll();G.finished=false;G.tk=null;S.werk=S.werk||{};const c=$('#card');c.classList.remove('wide');const done=(k,m)=>S.werk[k+':'+m];\n  c.innerHTML=`<div class=\"q\">Experimentier-Werkstatt<\/div><p class=\"mxp\">Probier aus, was mit Wasser passiert, wenn es heiß oder kalt wird. Jede Station hat Forscher-Aufträge.<\/p>\n  ${Object.entries(WK_ST).map(([k,s])=>`<button class=\"mxbig\" data-st=\"${k}\"><span>${s.i}<\/span><b>${s.t}<\/b><small>${s.d} ${s.m.filter(m=>done(k,m[0])).length} von ${s.m.length} Aufträgen geschafft.<\/small><\/button>`).join('')}\n  <button class=\"mxbig\" id=\"wkmix\"><span>🎨<\/span><b>Farbwasser mischen<\/b><small>Eiswürfel und gefärbtes Wasser in anders warmes Wasser geben (aus dem Mischlabor).<\/small><\/button>`;\n  c.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>wkRun(b.dataset.st));$('#wkmix').onclick=()=>{G.mode='werk';mxFree();};}\nfunction wkLupe(){return`<div class=\"mxlupe\"><div class=\"mxlt\">🔍 Lupe: 12 Teilchen als Wasser und als Eis<\/div><div class=\"mxlr\">\n  <div class=\"mxl\"><svg viewBox=\"0 0 60 60\" width=\"60\" height=\"60\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"58\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><g fill=\"currentColor\" fill-opacity=\".75\">${[[10,12],[22,9],[34,13],[47,10],[12,25],[26,23],[39,27],[50,24],[9,39],[23,37],[36,41],[49,38]].map(([x,y])=>`<circle cx=\"${x}\" cy=\"${y+6}\" r=\"5\"/>`).join('')}<\/g><\/svg><small>Wasser<br>ungeordnet, dicht<\/small><\/div>\n  <div class=\"mxl\"><svg viewBox=\"0 0 66 66\" width=\"66\" height=\"66\"><rect x=\"1\" y=\"1\" width=\"64\" height=\"64\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".4\"/><g stroke=\"currentColor\" stroke-opacity=\".35\">${[0,1,2].map(i=>`<line x1=\"11\" y1=\"${14+i*19}\" x2=\"58\" y2=\"${14+i*19}\"/>`).join('')}${[0,1,2,3].map(j=>`<line x1=\"${11+j*15.5}\" y1=\"14\" x2=\"${11+j*15.5}\" y2=\"52\"/>`).join('')}<\/g><g fill=\"currentColor\" fill-opacity=\".75\">${[0,1,2].map(i=>[0,1,2,3].map(j=>`<circle cx=\"${11+j*15.5}\" cy=\"${14+i*19}\" r=\"5\"/>`).join('')).join('')}<\/g><\/svg><small>Eis<br>Kristallgitter, mehr Platz<\/small><\/div><\/div>\n  <div class=\"mxlc\">Beim Gefrieren ordnen sich die Teilchen im Kristallgitter mit festen Abständen an. Eis braucht etwa ein Zehntel <b>mehr Platz<\/b> als das Wasser vorher.<\/div><\/div>`;}\n/* ===== Aufträge in Werkstatt und Mischlabor: starten, verdecken, prüfen ===== */\nconst TK_H={\n 'glas:boil':['Sieden heißt kochen. Wie heiß muss Wasser dafür werden?','Wasser siedet bei 100 °C. Die Heizplatte muss mindestens so heiß sein.','Lösung: Stell die Heizplatte auf 100 °C oder mehr, zum Beispiel „🔥 kräftig heizen“, und warte, bis Blasen aufsteigen.'],\n 'glas:plateau':['Beobachte die Temperatur, während das Wasser kocht. Steigt sie noch weiter?','Beim Sieden bleibt das Wasser bei 100 °C, auch wenn die Platte viel heißer ist. Heize also deutlich über 100 °C und warte einige Sekunden.','Lösung: „🔥 kräftig heizen“ wählen und mindestens 10 Sekunden kochen lassen.'],\n 'glas:cond':['Kondensieren heißt: Dampf wird wieder flüssig. Dafür braucht der Dampf etwas Kaltes.','Bring das Wasser zum Sieden und leg dann die kalte Platte auf. Dort schlägt sich der Dampf als Tropfen nieder.','Lösung: „🔥 kräftig heizen“, dann „🧊 Kalte Platte auflegen“ und warten, bis Tropfen an der Platte hängen.'],\n 'glas:empty':['Wohin geht das Wasser, wenn es lange kocht?','Beim Sieden verdampft das Wasser nach und nach. Lass es lange genug kochen.','Lösung: Kräftig heizen und warten, bis kein Wasser mehr im Glas ist. Das dauert eine Weile.'],\n 'glas:icetop':['Eis entsteht nur unter 0 °C. Wie stellst du das ein?','Stell die Kühlung unter 0 °C (Gefrierfach) und prüfe, solange erst ein Teil gefroren ist.','Lösung: „❄️ Gefrierfach −15 °C“ wählen und prüfen, während das Wasser erst teilweise zu Eis geworden ist.'],\n 'glas:full':['Damit das ganze Glas gefriert, musst du lange genug kühlen.','Stell das Gefrierfach ein und warte, bis das Eis das ganze Wasser ersetzt hat.','Lösung: „❄️ Gefrierfach −15 °C“ und warten, bis das Eis über den Rand ragt.'],\n 'strasse:rain':['Wie kommt Wasser in den Riss?','Bei Regen läuft Wasser durch den Riss unter den Asphalt. Dabei darf es nicht frieren.','Lösung: Temperatur über 0 °C (zum Beispiel 🍂 Herbst) und auf „🌧️ Regen“ tippen.'],\n 'strasse:lift':['Was macht Wasser, wenn es gefriert? Es braucht mehr Platz.','Erst muss Wasser im Riss sein (Regen). Dann friert es bei Frost und hebt den Asphalt an.','Lösung: „🌧️ Regen“ bei Herbst, dann „❄️ Winter −10 °C“ wählen und warten, bis das Wasser gefroren ist.'],\n 'strasse:winter':['Ein Auto fährt, während der Hohlraum voll Eis ist. Was stützt den Asphalt?','Regen, dann Frost, und während das Eis da ist, ein Auto fahren lassen.','Lösung: Regen → Winter −10 °C → warten, bis alles gefroren ist → „🚗 Auto fahren lassen“.'],\n 'strasse:pot':['Nach dem Tauen ist unter dem Asphalt ein leerer Hohlraum. Was passiert, wenn jetzt ein Auto kommt?','Regen, Frost, dann Tauwetter (Frühling). Erst wenn das Eis weg ist, das Auto fahren lassen.','Lösung: Regen → Winter → Frühling 12 °C, warten, bis das Eis getaut ist → „🚗 Auto fahren lassen“.'],\n 'strasse:cyc':['Eine Runde ist: Regen, Frost, Tauwetter. Du brauchst drei davon.','Wechsle dreimal nacheinander: 🌧️ Regen (Herbst) → ❄️ Winter → 🌷 Frühling. Oben im Bild werden die Runden gezählt.','Lösung: Dreimal die Folge Regen, Winter −10 °C, Frühling 12 °C durchspielen und jeweils warten, bis das Eis gefroren bzw. getaut ist.'],\n 'acker:wet':['Wie kommt Wasser in den Boden?','Bei Temperaturen über 0 °C auf „🌧️ Regen“ tippen: Das Wasser sickert in die Erdklumpen.','Lösung: 🍂 Herbst wählen und auf „🌧️ Regen“ tippen.'],\n 'acker:dry':['Trocken heißt: vorher kein Regen. Ist der Boden gerade trocken?','Nimm einen trockenen Acker (⟲ Neuer Acker) und stell direkt Frost ein, ohne Regen.','Lösung: „⟲ Neuer Acker“, dann „❄️ Winter −10 °C“. Ohne Wasser passiert mit den Klumpen nichts.'],\n 'acker:burst':['Damit Frost etwas bewirkt, muss Wasser in der Erde sein.','Erst regnen lassen (Herbst), dann Frost. Das gefrierende Wasser sprengt die Klumpen.','Lösung: 🍂 Herbst → „🌧️ Regen“ → „❄️ Winter −10 °C“ und warten.'],\n 'acker:loose':['Einmal Frost reicht nicht. Wiederhole Regen und Frost mehrmals.','Jede Runde Regen → Frost → Tauen macht die Klumpen kleiner. Die Anzeige „Boden locker“ zeigt den Fortschritt.','Lösung: Mindestens dreimal Regen (Herbst), Winter −10 °C, Frühling 12 °C, bis „Boden locker“ 60 % oder mehr zeigt.'],\n 'acker:sow':['Säen klappt am besten auf lockerem Boden bei warmem Wetter.','Mach den Boden erst mit mehreren Frostrunden locker (mindestens 50 %), dann Frühling einstellen und säen.','Lösung: Boden lockern (mehrmals Regen, Winter, Frühling), dann 🌷 Frühling 12 °C, auf „🌱 Säen“ tippen und warten.'],\n 'flasche:burst':['Wann wird es für eine Flasche eng? Wenn das Eis keinen Platz hat.','Wähle die Plastikflasche, randvoll und geschlossen, und stell sie ins Gefrierfach.','Lösung: „🧴 Plastikflasche, zu“ + „randvoll“ + „❄️ Gefrierfach −18 °C“ → „▶ Hineinstellen“ und warten.'],\n 'flasche:safe':['Eis braucht mehr Platz. Wo hat es Platz, ohne dass die Flasche kaputtgeht?','Eine nur halb volle Flasche hat oben Luft: Dort kann sich das Eis ausdehnen.','Lösung: „halb voll“ wählen, Gefrierfach −18 °C, hineinstellen und warten, bis alles gefroren ist.'],\n 'flasche:dome':['Wo kann das Eis hin, wenn das Gefäß oben offen ist?','Ein randvoller, offener Becher: Das Eis wächst nach oben über den Rand.','Lösung: „🥛 offener Becher“ + „randvoll“ + Gefrierfach −18 °C → hineinstellen.'],\n 'flasche:fridge':['Wie kalt wird es im Kühlschrank? Reicht das zum Gefrieren?','Im Kühlschrank sind es etwa 4 °C, also über 0 °C. Probier es mit einer vollen Flasche aus.','Lösung: Volle Flasche wählen, „🥶 Kühlschrank 4 °C“ und hineinstellen: Sie friert nicht.'],\n 'flasche:glass':['Glas kann nicht nachgeben wie Plastik. Was passiert dann beim Gefrieren?','Wähle die Glasflasche, randvoll, und stell sie ins Gefrierfach.','Lösung: „🍾 Glasflasche, zu“ + „randvoll“ + Gefrierfach −18 °C → hineinstellen.'],\n 'mix:boil':['Bei welcher Temperatur kocht Wasser?','Stell das Glaswasser auf 100 °C und lass es lange genug kochen.','Lösung: Glas auf 100 °C stellen, „▶ Einfüllen“ und warten, bis der Wasserstand sinkt.'],\n 'mix:freeze':['Eis entsteht nur unter 0 °C.','Stell das Glaswasser unter 0 °C (Gefrierfach) und schau, wo das Eis zuerst entsteht.','Lösung: Glas auf −10 °C stellen, „▶ Einfüllen“ und warten, bis oben Eis entsteht.'],\n 'mix:bulge':['Damit das Eis herausragt, muss das ganze Glas gefrieren.','Stell das Glaswasser unter 0 °C und warte, bis alles gefroren ist. Eis braucht mehr Platz.','Lösung: Glas auf −10 °C, „▶ Einfüllen“ und lange warten, bis das Eis über den Rand ragt.'],\n 'mix:up':['Welches Wasser steigt nach oben: warmes oder kaltes?','Warmes Wasser ist leichter. Stell das Farbwasser wärmer als das Glaswasser ein und gib es unten hinein.','Lösung: Glas 20 °C, Farbwasser 60 °C, „⬇ unten im kleinen Glas“, dann „▶ Einfüllen“.'],\n 'mix:down':['Welches Wasser sinkt: warmes oder kaltes?','Kaltes Wasser ist schwerer. Gieße kaltes Farbwasser oben in wärmeres Wasser.','Lösung: Glas 20 °C, Farbwasser 4 °C, „⬆ oben eingießen“, dann „▶ Einfüllen“.'],\n 'mix:icesink':['Der Eiswürfel schwimmt. Sein Schmelzwasser ist etwa 0 °C kalt. Wann ist das schwerer als das Glaswasser?','Wenn das Glaswasser deutlich wärmer ist als das Schmelzwasser, sinkt das Schmelzwasser.','Lösung: „🧊 Farb-Eiswürfel“, Glas auf 40 °C oder wärmer, „▶ Einfüllen“ und warten.'],\n 'mix:icetop':['Wann bleibt 0 °C kaltes Schmelzwasser oben? Denk an die 4 °C.','Unter 4 °C ist kälteres Wasser leichter. Das Glaswasser muss also sehr kalt sein, zwischen 0 und 4 °C.','Lösung: „🧊 Farb-Eiswürfel“, Glas auf 2 oder 3 °C, „▶ Einfüllen“ und länger warten.'],\n 'mix:coldup':['Normalerweise sinkt kaltes Wasser. Wann ist kälteres Wasser trotzdem leichter?','Unter 4 °C dehnt sich Wasser wieder aus. Nimm Glaswasser bei 4 °C und noch kälteres Farbwasser unten.','Lösung: Glas 4 °C, Farbwasser 1 °C, „⬇ unten im kleinen Glas“, „▶ Einfüllen“.']\n};\nconst TK_H2={\"heat:h_boil\": [\"Sieden heißt kochen. Wie heiß muss das Wasser werden?\", \"Wasser siedet bei 100 °C. Stell die Heizplatte auf mindestens 100 °C.\", \"Lösung: Heizplatte auf 100 °C oder mehr stellen und warten, bis Blasen aufsteigen.\"], \"heat:h_evap\": [\"Beim Kochen verdampft Wasser. Was passiert mit dem Wasserstand?\", \"Lass das Wasser bei über 100 °C lange kochen, bis nur noch die Hälfte übrig ist.\", \"Lösung: Heizplatte auf 120 °C und warten, bis der Wasserstand auf die Hälfte gesunken ist.\"], \"heat:h_freeze\": [\"Eis entsteht nur unter 0 °C.\", \"Stell die Kühlung unter 0 °C und beobachte, wo das Eis zuerst entsteht.\", \"Lösung: Regler auf −15 °C stellen und prüfen, sobald erstes Eis entstanden ist.\"], \"heat:h_solid\": [\"Für einen ganzen Eisblock musst du lange genug kühlen.\", \"Stell die Kühlung unter 0 °C und warte, bis alles gefroren ist. Vergleiche dann die Höhe.\", \"Lösung: −15 °C einstellen und warten, bis das ganze Wasser zu Eis geworden ist.\"], \"heat:h_melt\": [\"Zum Schmelzen brauchst du zuerst einen ganz gefrorenen Block.\", \"Erst ganz einfrieren (−15 °C), dann die Platte über 0 °C stellen und warten, bis alles wieder flüssig ist.\", \"Lösung: −15 °C, bis alles gefroren ist, dann „🌡️ Auf 20 °C stellen“ und warten, bis kein Eis mehr da ist.\"], \"road:r_fill\": [\"Wie kommt Wasser in den Riss?\", \"Bei Regen (über 0 °C) läuft Wasser in den Riss.\", \"Lösung: Temperatur über 0 °C und auf „🌧️ Regen“ tippen, eventuell zweimal.\"], \"road:r_freeze\": [\"Was passiert mit Wasser unter 0 °C?\", \"Erst Regen, dann die Temperatur unter 0 °C stellen. Beobachte den Asphalt.\", \"Lösung: „🌧️ Regen“, dann Regler auf −15 °C und warten, bis alles gefroren ist.\"], \"road:r_thaw\": [\"Tauen heißt: Das Eis wird wieder flüssig. Wie warm muss es sein?\", \"Erst Regen und Frost, dann die Temperatur über 0 °C stellen.\", \"Lösung: Regen → −15 °C → warten → Regler auf 15 °C und warten, bis das Eis weg ist.\"], \"road:r_cycle\": [\"Eine Runde ist: Regen, Frost, Tauen. Du brauchst drei davon.\", \"Wiederhole Regen → Frost → Tauen dreimal. Oben im Bild wird gezählt.\", \"Lösung: Dreimal nacheinander Regen, −15 °C bis gefroren, 15 °C bis getaut.\"], \"road:r_hole\": [\"Wann bricht der Asphalt ein? Wenn darunter ein leerer Hohlraum ist und ein Auto kommt.\", \"Mach mehrere Runden Regen, Frost, Tauen, damit der Hohlraum groß wird. Dann bei Tauwetter das Auto fahren lassen.\", \"Lösung: Zwei bis drei Runden Regen, Frost, Tauen, dann bei über 0 °C „🚗 Auto fährt drüber“.\"], \"field:f_wet\": [\"Wie kommt Wasser in die Erde?\", \"Bei über 0 °C auf „🌧️ Regen“ tippen.\", \"Lösung: Regler über 0 °C stellen und auf „🌧️ Regen“ tippen.\"], \"field:f_freeze\": [\"Damit Wasser im Boden gefriert, muss erst Wasser drin sein.\", \"Erst Regen, dann die Temperatur unter 0 °C stellen.\", \"Lösung: „🌧️ Regen“, dann −15 °C und warten.\"], \"field:f_loose\": [\"Einmal Frost reicht nicht. Wiederhole Regen und Frost.\", \"Jede Runde Regen → Frost → Tauen sprengt die Klumpen weiter auseinander.\", \"Lösung: Mehrmals Regen, −15 °C, 15 °C, bis der Boden mindestens 80 % locker ist.\"], \"field:f_sow\": [\"Säen klappt nur auf lockerem Boden und im Frühling.\", \"Mach den Boden mit Frostrunden locker (80 %), dann über 5 °C stellen und säen.\", \"Lösung: Mehrmals Regen, Frost, Tauen, dann Regler auf 15 °C und „🌾 Im Frühling säen“.\"], \"bottle:b_burst\": [\"Wann wird es für die Flasche eng?\", \"Randvoll und Deckel zu: Das Eis hat keinen Platz.\", \"Lösung: Füllhöhe 100 %, „🔒 Deckel zu“, „❄️ Ins Gefrierfach“ und warten.\"], \"bottle:b_safe\": [\"Eis braucht mehr Platz. Wo bekommt es den?\", \"Fülle die Flasche nicht ganz voll oder lass den Deckel offen.\", \"Lösung: Füllhöhe etwa 80 %, Deckel zu, ins Gefrierfach und warten, bis alles gefroren ist.\"], \"bottle:b_open\": [\"Was passiert, wenn oben kein Deckel ist?\", \"Randvoll, aber Deckel offen: Das Eis wächst nach oben heraus.\", \"Lösung: Füllhöhe 100 %, „🔓 Deckel offen“, ins Gefrierfach und warten.\"]};Object.assign(TK_H,TK_H2);\nconst TK_COVER='<div class=\"lbcover\"><div>🙈 <b>Das Bild ist verdeckt.<\/b><br><small>Stell alles so ein, wie du denkst, und tippe dann auf „Prüfen“.<\/small><\/div><\/div>';\nfunction tkNew(scope,list,isDone,setDone,state){G.tk={scope,list,isDone,setDone,state,task:null,sat:new Set(),cur:new Set()};}\nfunction tkSat(k){const T=G.tk;if(!T)return;T.cur.add(k);if(T.task&&!T.task.solved)T.sat.add(k);}\nfunction tkStart(k){const T=G.tk;if(!T)return;T.task={id:k,fails:0,hide:true,solved:false,msg:'',cls:'',pre:T.cur.has(k)};T.sat=new Set();tkHide();tkDraw();const b=$('#tktask');if(b&&innerWidth<760)b.scrollIntoView({behavior:'smooth',block:'nearest'});}\nfunction tkHide(){const t=G.tk&&G.tk.task,h=!!(t&&t.hide&&!t.solved);document.querySelectorAll('.wkstage').forEach(e=>e.classList.toggle('lbhid',h));document.querySelectorAll('.tkveil').forEach(e=>e.classList.toggle('lbveil',h));}\nfunction tkTouch(){const t=G.tk&&G.tk.task;if(t&&!t.solved&&!t.hide){t.hide=true;tkHide();}}\nfunction tkBind(el){if(!el)return;el.addEventListener('input',tkTouch);el.addEventListener('click',e=>{if(e.target.closest('button'))tkTouch();});}\nfunction tkCheck(){const T=G.tk,t=T&&T.task;if(!t||t.solved)return;t.hide=false;tkHide();const id=t.id;\n  if(T.sat.has(id)){t.solved=true;T.setDone(id);const xp=Math.max(5,15-4*t.fails);addXP(xp);sfx('ok');\n    t.msg=`✅ Richtig gelöst${t.fails?` nach ${t.fails} ${t.fails===1?'Fehlversuch':'Fehlversuchen'}`:' beim ersten Versuch'}! +${xp} Hauspunkte`;t.cls='ok';\n    if(T.list.every(m=>T.isDone(m[0])))setTimeout(()=>{toast('🔮 Alle Aufträge dieser Station erfüllt!');confetti();sfx('rank');},900);}\n  else{t.fails++;sfx('bad');const H=TK_H[T.scope+':'+id]||[],h=H[Math.min(t.fails,H.length)-1]||'';let st='';try{st=T.state?T.state():'';}catch(e){}\n    t.msg=`❌ ${t.fails}. Fehlversuch.${st?' Beobachtung: '+st:''}${h?'<br>💡 '+h:''}`;t.cls='bad';}\n  tkDraw();}\nfunction tkDraw(){const T=G.tk;if(!T)return;const u=$('#tkmis'),bn=$('#tktask'),t=T.task;if(!u)return;\n  u.innerHTML=`<div class=\"lbh\">Forscher-Aufträge (${T.list.filter(m=>T.isDone(m[0])).length} von ${T.list.length})<\/div>${T.list.map(([k,x])=>`<div class=\"tki ${T.isDone(k)?'done':''} ${t&&t.id===k?'act':''}\"><span>${T.isDone(k)?'✅':'🎯'}<\/span><span class=\"lbt\">${esc(x)}<\/span>${T.isDone(k)?'':t&&t.id===k?'<small>läuft<\/small>':`<button class=\"lbgo\" data-tk=\"${k}\">Starten<\/button>`}<\/div>`).join('')}<p class=\"lbnote\">Du kannst jederzeit frei experimentieren. Ein Auftrag zählt erst, wenn du ihn startest und auf „Prüfen“ tippst.<\/p>`;\n  u.querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>tkStart(b.dataset.tk));\n  if(!bn)return;if(!t){bn.innerHTML='';bn.style.display='none';return;}bn.style.display='';const x=T.list.find(m=>m[0]===t.id);\n  bn.innerHTML=`<div class=\"lbtop\"><b>🎯 Auftrag:<\/b> ${esc(x[1])}<\/div>${t.msg?`<div class=\"lbmsg ${t.cls}\">${t.msg}<\/div>`:`<div class=\"lbmsg\">Das Bild ist verdeckt. Stell alles so ein, wie du denkst, und tippe dann auf „Prüfen“. Erst dann siehst du, was passiert.${t.pre?'<br>⚠️ Das Ergebnis ist gerade schon zu sehen. Für einen echten Versuch setz die Station zuerst mit ⟲ zurück.':''}<\/div>`}\n   <div class=\"lbbtns\">${t.solved?'<button class=\"big go\" id=\"tkdone\">Weiter<\/button>':`<button class=\"big go\" id=\"tkchk\">✔ Prüfen<\/button><button class=\"big sec\" id=\"tkx\">Abbrechen<\/button>`}<\/div>${!t.solved&&t.fails?`<div class=\"lbfails\">Fehlversuche: ${'❌'.repeat(t.fails)}<\/div>`:''}`;\n  const c=$('#tkchk');if(c)c.onclick=tkCheck;const xx=$('#tkx');if(xx)xx.onclick=()=>{T.task=null;tkHide();tkDraw();};const d=$('#tkdone');if(d)d.onclick=()=>{T.task=null;tkHide();tkDraw();};}\nfunction mxStateText(sim){const f=sim.set,I=sim.info||{},st=sim.stats();\n  if(f.bath<0)return`Das Glas steht bei ${f.bath} °C. ${I.ice>0?'Ein Teil des Wassers ist gefroren.':'Noch ist kein Eis entstanden.'}${I.bulge>2?' Das Eis ragt über den Rand.':''}`;\n  if(f.bath>=90)return`Das Wasser hat ${f.bath} °C. ${I.level!==undefined&&I.level<0.9?'Ein Teil ist schon verdampft.':'Es ist noch nichts verdampft.'}`;\n  if(!sim.t)return'Du hast noch nichts eingefüllt.';\n  return`Nach ${Math.round(sim.t)} s sind ${Math.round(st.top*100)} % der Farbe oben und ${Math.round(st.bot*100)} % unten.`;}\n\nfunction wkRun(key){stopAll();G.finished=false;const ST=WK_ST[key],c=$('#card');c.classList.add('wide');S.werk=S.werk||{};\n  const W=WK[key]();G.wk=W;\n  c.innerHTML=`<div class=\"wktop\"><button class=\"wkback\" id=\"wkback\">◀ Alle Stationen<\/button><div class=\"q\">${ST.i} ${ST.t}<\/div><\/div><div class=\"wkgrid\"><div class=\"wkL\"><div class=\"wkstage\"><canvas class=\"mxcv wkcv\" id=\"wkcv\"><\/canvas>${TK_COVER}<\/div><div class=\"wkinfo tkveil\" id=\"wkinfo\"><\/div><\/div>\n   <div class=\"wkR\"><div class=\"lbtask\" id=\"tktask\" style=\"display:none\"><\/div><div class=\"mxctl\" id=\"wkctl\">${W.ctl()}<\/div>${W.lupe?W.lupe():''}\n   <div class=\"tkmis\" id=\"tkmis\"><\/div><\/div><\/div>`;\n  $('#wkback').onclick=wkMenu;\n  tkNew(key,ST.m,k=>!!S.werk[key+':'+k],k=>{S.werk[key+':'+k]=1;save();},()=>W.info());tkDraw();tkBind($('#wkctl'));\n  const cv=$('#wkcv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);\n  const size=()=>{cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W.W=cv.clientWidth;W.H=cv.clientHeight;};size();\n  W.bind(c);let last=performance.now(),acc=0;\n  const loop=now=>{if(G.finished||!document.body.contains(cv))return;if(cv.clientWidth!==W.W)size();const dt=Math.min(.05,(now-last)/1000)*(W.speed||1);last=now;W.step(dt);W.draw(ctx);acc+=dt;\n    if(acc>.25){acc=0;$('#wkinfo').innerHTML=W.info();if(G.tk){G.tk.cur=new Set();W.check(tkSat);}}G.raf=requestAnimationFrame(loop);};\n  $('#wkinfo').innerHTML=W.info();G.raf=requestAnimationFrame(loop);}\nconst wkT=T=>`${Math.round(T)} °C`;\nconst WK={\n/* ---------- Becherglas ---------- */\nglas:()=>{const W={tg:20,T:20,m:1,f:0,lid:false,drops:0,boilT:0,bub:[],steam:[],mode:'flüssig'};\n W.ctl=()=>`<label>Heizplatte / Kühlung: <b id=\"wkl\">20 °C<\/b><input type=\"range\" id=\"wkr\" min=\"-20\" max=\"150\" value=\"20\"><\/label>\n  <div class=\"mxchips\"><button data-q=\"-15\">❄️ Gefrierfach −15 °C<\/button><button data-q=\"20\">🏠 Raum 20 °C<\/button><button data-q=\"60\">♨️ 60 °C<\/button><button data-q=\"130\">🔥 kräftig heizen<\/button><\/div>\n  <div class=\"mxbtns\"><button class=\"big sec\" id=\"wklid\">🧊 Kalte Platte auflegen<\/button><button class=\"big sec\" id=\"wkfill\">⟲ Glas neu füllen<\/button><\/div>`;\n W.lupe=()=>wkLupe();\n W.bind=c=>{const r=$('#wkr'),set=v=>{W.tg=v;r.value=v;$('#wkl').textContent=wkT(v);};r.oninput=e=>set(+e.target.value);\n  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>set(+b.dataset.q));\n  $('#wklid').onclick=()=>{W.lid=!W.lid;$('#wklid').textContent=W.lid?'Platte abnehmen':'🧊 Kalte Platte auflegen';};\n  $('#wkfill').onclick=()=>{Object.assign(W,{T:20,m:1,f:0,drops:0,boilT:0,bub:[],steam:[]});};};\n W.step=dt=>{const tg=W.tg;W.boiling=false;W.freezing=false;\n  if(W.m<=0){W.T+=(tg-W.T)*.3*dt;return;}\n  if(W.f>0&&W.f<1||(W.T<=0.01&&tg<0&&W.f<1)||(W.f>=1&&tg>0&&W.T>=-0.01)){\n   if(tg<0&&W.f<1){W.T=0;W.freezing=true;W.f=Math.min(1,W.f+(-tg)*0.0022*dt);}\n   else if(tg>0&&W.f>0){W.T=0;W.f=Math.max(0,W.f-tg*0.004*dt);}\n   else W.T+=(tg-W.T)*.25*dt;}\n  else if(W.T>=99.95&&tg>100){W.T=100;W.boiling=true;W.boilT+=dt;W.m=Math.max(0,W.m-(tg-100)*0.0006*dt);}\n  else{W.T+=(tg-W.T)*.25*dt;if(W.f>=1)W.T=Math.min(W.T,0);if(W.T>100)W.T=100;if(tg<0&&W.T<0.01&&W.f<1)W.T=0;}\n  if(!W.boiling&&W.T>35&&W.f===0)W.m=Math.max(0,W.m-0.00035*(W.T-35)/65*dt);\n  if(W.boiling&&Math.random()<.9)W.bub.push({x:Math.random(),y:1,s:2+Math.random()*4});\n  if((W.boiling||W.T>55)&&Math.random()<(W.boiling?.6:.08))W.steam.push({x:.35+Math.random()*.3,y:0,a:1});\n  W.bub.forEach(b=>b.y-=dt*1.2);W.bub=W.bub.filter(b=>b.y>0);\n  W.steam.forEach(s=>{s.y+=dt*.5;s.a-=dt*.35;if(W.lid&&s.y>.55){s.a=0;W.drops=Math.min(80,W.drops+.25);}});W.steam=W.steam.filter(s=>s.a>0);};\n W.draw=ctx=>{const w=W.W,h=W.H;ctx.clearRect(0,0,w,h);const bx=w*.3,bw=w*.4,by=h*.3,bh=h*.58,rim=by,bot=by+bh;\n  ctx.fillStyle=W.tg>W.T+1?'#e0412f':W.tg<W.T-1?'#2a6fdb':'#999';ctx.fillRect(bx-10,bot+6,bw+20,10);\n  const H0=bh*.95,liq=W.m*H0*(1-W.f),ice=W.m*H0*W.f*1.09,surf=bot-liq-ice;\n  ctx.fillStyle='rgba(90,160,255,.28)';ctx.fillRect(bx,bot-liq,bw,liq);\n  if(ice>0.5){ctx.fillStyle='rgba(225,240,255,.95)';ctx.strokeStyle='rgba(130,170,220,1)';ctx.lineWidth=1;\n   if(W.f>=1&&surf<rim){ctx.beginPath();ctx.moveTo(bx,bot-liq);ctx.lineTo(bx,rim);ctx.quadraticCurveTo(bx+bw/2,surf-(rim-surf)*1.2,bx+bw,rim);ctx.lineTo(bx+bw,bot-liq);ctx.closePath();ctx.fill();ctx.stroke();}\n   else{ctx.fillRect(bx,surf,bw,ice);ctx.strokeRect(bx,surf,bw,ice);}}\n  ctx.fillStyle='rgba(255,255,255,.85)';W.bub.forEach(b=>{const y=bot-(1-b.y)*liq;if(y>bot-liq){ctx.beginPath();ctx.arc(bx+8+b.x*(bw-16),y,b.s,0,6.3);ctx.fill();}});\n  W.steam.forEach(s=>{ctx.fillStyle=`rgba(200,205,215,${s.a*.8})`;ctx.beginPath();ctx.arc(bx+s.x*bw+Math.sin(s.y*9)*8,surf-s.y*(surf-h*.06),8+s.y*14,0,6.3);ctx.fill();});\n  ctx.strokeStyle='rgba(120,160,200,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx-3,rim-10);ctx.lineTo(bx-3,bot+2);ctx.lineTo(bx+bw+3,bot+2);ctx.lineTo(bx+bw+3,rim-10);ctx.stroke();\n  if(W.lid){ctx.fillStyle='#8fb4d9';ctx.fillRect(bx-14,h*.08,bw+28,9);ctx.fillStyle='rgba(60,130,230,.8)';for(let i=0;i<W.drops;i++){ctx.beginPath();ctx.arc(bx-6+((i*37)%(bw+12)),h*.08+13+((i*13)%6),2.6,0,6.3);ctx.fill();}}\n  ctx.fillStyle=getComputedStyle(document.body).color;ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';\n  ctx.fillText(`🌡️ ${wkT(W.T)}`,8,20);\n  if(W.m>0&&W.f>0&&W.f<1){ctx.font='12px system-ui,sans-serif';ctx.fillText('oben 0 °C (Eis)',bx+bw+8,surf+10);ctx.fillText('unten 4 °C',bx+bw+8,bot-6);}\n  else if(W.m>0&&W.f===0&&W.tg<4&&W.T<4.5&&W.T>0.2){ctx.font='12px system-ui,sans-serif';ctx.fillText(`oben ${wkT(W.T)}`,bx+bw+8,bot-liq+12);ctx.fillText('unten 4 °C',bx+bw+8,bot-6);}\n  if(W.m<=0){ctx.textAlign='center';ctx.fillText('Das Wasser ist ganz verdampft.',w/2,bot-20);}};\n W.info=()=>{if(W.m<=0)return'💨 Alles Wasser ist zu unsichtbarem Wasserdampf geworden und in die Luft entwichen. Fülle das Glas neu.';\n  if(W.boiling)return`🫧 <b>Sieden:<\/b> Das Wasser verdampft zu Wasserdampf. Die Blasen sind Dampf, der im Wasser entsteht. Solange noch Wasser da ist, <b>bleibt die Temperatur bei 100 °C<\/b>, auch wenn du stärker heiz
