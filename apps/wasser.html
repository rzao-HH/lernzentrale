    ctx.strokeStyle='rgba(120,160,200,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0-3,yt);ctx.lineTo(x0-3,yb+3);ctx.lineTo(x1+3,yb+3);ctx.lineTo(x1+3,yt);ctx.stroke();
    // Thermometer
    const tx=w*.12,ty0=yt+10,ty1=yb-10,tr=(Math.max(-20,Math.min(110,W.T))+20)/130;ctx.fillStyle='rgba(200,200,200,.4)';ctx.fillRect(tx-5,ty0,10,ty1-ty0);ctx.fillStyle=W.T<=0?'#4a90e2':'#e0412f';ctx.fillRect(tx-5,ty1-(ty1-ty0)*tr,10,(ty1-ty0)*tr);ctx.beginPath();ctx.arc(tx,ty1+6,9,0,6.3);ctx.fill();
    ctx.fillStyle=lbTxt();ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(W.T)+' °C',tx,yt);
  };
  lbLoop(step,draw);
}
/* ---------- B: Straße im Jahreslauf ---------- */
function lbRoad(){const R={T:10,water:0,frozen:0,hollow:.25,lift:0,crack:.4,cycles:0,wasFrozen:false,hole:false,car:null,drain:0,drops:[]};
  const sh=lbShell('road','🛣️ Straße im Jahreslauf: Frostsprengung',lbTempCtl('rt','Temperatur draußen (Winter ↔ Frühling)',-15,20,10)+`<div class="mxbtns"><button class="big sec" id="rrain">🌧️ Regen</button><button class="big sec" id="rcar">🚗 Auto fährt drüber</button></div><button class="big sec" id="rnew">⟲ Neue Straße</button>`);
  $('#rt').oninput=e=>{R.T=+e.target.value;$('#rtl').textContent=R.T+' °C';};
  $('#rrain').onclick=()=>{if(R.hole)return;if(R.T<=0){R.msg='Bei Frost fällt Schnee statt Regen. Stell die Temperatur über 0 °C.';return;}for(let i=0;i<40;i++)R.drops.push({x:Math.random(),y:-Math.random()*.4});};
  $('#rcar').onclick=()=>{if(!R.car)R.car={x:-.15};};
  $('#rnew').onclick=()=>{Object.assign(R,{water:0,frozen:0,hollow:.25,lift:0,crack:.4,cycles:0,wasFrozen:false,hole:false,car:null,drops:[],msg:''});};
  let lastInfo='';
  const step=dt=>{const r=dt*1.4;
    R.drops.forEach(d=>d.y+=dt*1.2);const landed=R.drops.filter(d=>d.y>=1).length;R.drops=R.drops.filter(d=>d.y<1);
    if(landed){R.water=Math.min(1,R.water+landed*0.03*(1-R.frozen));if(R.water>.3)lbHit('r_fill');}
    if(R.T<0&&R.water>0.05){R.frozen=Math.min(1,R.frozen+0.12*r*(1+(-R.T)/10));
      const need=R.water*1.09*R.hollow;if(R.frozen>0.5&&need>R.hollow*R.water){R.lift=Math.min(1,R.lift+0.08*r*R.water);R.hollow=Math.min(1,R.hollow+0.018*r*R.water);R.crack=Math.min(1,R.crack+0.02*r*R.water);}
      if(R.frozen>=1&&!R.wasFrozen){R.wasFrozen=true;lbHit('r_freeze');}}
    else if(R.T>0&&R.frozen>0){R.frozen=Math.max(0,R.frozen-0.15*r*(1+R.T/10));if(R.frozen===0&&R.wasFrozen){R.wasFrozen=false;R.cycles++;lbHit('r_thaw');if(R.cycles>=3)lbHit('r_cycle');}}
    if(R.T>0&&R.frozen===0){R.lift=Math.max(R.lift*.9995,0);R.water=Math.max(0,R.water-0.01*r);}
    if(R.car){R.car.x+=dt*.35;if(!R.hole&&R.car.x>.42&&R.car.x<.5){if(R.hollow>.55&&R.frozen<.3){R.hole=true;lbHit('r_hole');R.msg='💥 Der Asphalt über dem Hohlraum ist eingebrochen: ein Schlagloch!';}
      else if(R.frozen>=.3)R.msg='Das Eis stützt den Asphalt noch. Erst wenn es taut, wird es gefährlich.';else R.msg='Die Straße hält noch. Der Hohlraum ist noch zu klein.';}
      if(R.car.x>1.15)R.car=null;}
    const state=R.hole?'Schlagloch':R.frozen>0.5?'Wasser im Riss ist gefroren: Eis braucht etwa 9 % mehr Platz, drückt den Asphalt hoch und macht den Riss breiter.':R.water>0.1?'Wasser steht im Riss und im Hohlraum darunter.':R.cycles>0?'Getaut: Das Eis ist geschmolzen und braucht weniger Platz. Unter dem Asphalt bleibt ein größerer Hohlraum.':'Eine Straße mit einem kleinen Riss.';
    const info=`<b>${R.T} °C</b> · ${state}<br><small>Hohlraum: ${Math.round(R.hollow*100)} % · Frost-Tau-Runden: ${R.cycles}</small>${R.msg?'<br>'+R.msg:''}`;
    if(info!==lastInfo){lastInfo=info;$('#stinfo').innerHTML=info;$('#stlupe').innerHTML=lbLupe(['flüssig','fest'])+'<div class="stnote">Wasser braucht als Eis etwa 9 % mehr Platz. Im engen Riss drückt es deshalb alles auseinander.</div>';}
  };
  const draw=()=>{const {w,h}=sh.D(),ctx=sh.ctx;ctx.clearRect(0,0,w,h);const sy=h*.38,ay=h*.58,gy=h*.95,cx=w*.5;
    ctx.fillStyle=R.T<0?'#dfefff':'#cfe8ff';ctx.fillRect(0,0,w,sy);
    if(R.T<0){ctx.fillStyle='#fff';for(let i=0;i<14;i++){ctx.beginPath();ctx.arc((i*73)%w,(i*37)%sy,2,0,6.3);ctx.fill();}}
    ctx.fillStyle='#b98c5a';ctx.fillRect(0,ay,w,gy-ay);ctx.fillStyle='#9a6e40';for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*97)%w,ay+10+((i*53)%(gy-ay-12)),3,0,6.3);ctx.fill();}
    // Hohlraum unter dem Asphalt
    const hw=w*(.08+.16*R.hollow),hh=(gy-ay)*(.15+.35*R.hollow);
    if(!R.hole){ctx.fillStyle='#3a2c20';ctx.beginPath();ctx.ellipse(cx,ay+hh*.5,hw,hh*.55,0,0,6.3);ctx.fill();
      const wf=R.water;if(wf>0){ctx.save();ctx.beginPath();ctx.ellipse(cx,ay+hh*.5,hw,hh*.55,0,0,6.3);ctx.clip();const fillTop=ay+hh*.5+hh*.55-(hh*1.1)*Math.min(1,wf*(R.frozen>.5?1.09:1));ctx.fillStyle=R.frozen>.5?'rgba(230,245,255,.95)':'rgba(60,140,230,.85)';ctx.fillRect(cx-hw,fillTop,hw*2,ay+hh);ctx.restore();}}
    // Asphalt mit Wölbung und Riss
    const lift=R.lift*h*.06,cw=w*(.012+.03*R.crack);
    ctx.fillStyle='#444';ctx.beginPath();ctx.moveTo(0,sy);
    if(R.hole){ctx.lineTo(cx-w*.14,sy);ctx.lineTo(cx-w*.1,ay+hh*.6);ctx.lineTo(cx+w*.1,ay+hh*.6);ctx.lineTo(cx+w*.14,sy);}
    else{ctx.lineTo(cx-w*.2,sy);ctx.quadraticCurveTo(cx-w*.1,sy-lift,cx-cw,sy-lift);ctx.lineTo(cx,ay);ctx.lineTo(cx+cw,sy-lift);ctx.quadraticCurveTo(cx+w*.1,sy-lift,cx+w*.2,sy);}
    ctx.lineTo(w,sy);ctx.lineTo(w,ay);ctx.lineTo(0,ay);ctx.closePath();ctx.fill();
    if(R.hole){ctx.fillStyle='#2a2018';ctx.beginPath();ctx.moveTo(cx-w*.14,sy);ctx.lineTo(cx-w*.1,ay+hh*.6);ctx.lineTo(cx+w*.1,ay+hh*.6);ctx.lineTo(cx+w*.14,sy);ctx.fill();
      ctx.fillStyle='#555';for(let i=0;i<7;i++){ctx.fillRect(cx-w*.08+i*w*.024,ay+hh*.4-(i%3)*6,w*.018,8);}}
    else if(R.water>0){ctx.fillStyle=R.frozen>.5?'rgba(230,245,255,.95)':'rgba(60,140,230,.85)';ctx.beginPath();ctx.moveTo(cx-cw*.7,sy-lift+ (1-Math.min(1,R.water))*(ay-sy));ctx.lineTo(cx,ay);ctx.lineTo(cx+cw*.7,sy-lift+(1-Math.min(1,R.water))*(ay-sy));ctx.fill();}
    ctx.strokeStyle='#ddd';ctx.setLineDash([16,12]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,sy+(ay-sy)*.15);ctx.lineTo(cx-w*.22,sy+(ay-sy)*.15);ctx.moveTo(cx+w*.22,sy+(ay-sy)*.15);ctx.lineTo(w,sy+(ay-sy)*.15);ctx.stroke();ctx.setLineDash([]);
    R.drops.forEach(d=>{ctx.strokeStyle='rgba(60,140,230,.9)';ctx.lineWidth=2;const x=cx+(d.x-.5)*w*.12,y=d.y*(sy-5);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+8);ctx.stroke();});
    if(R.car){ctx.font=`${Math.round(h*.16)}px system-ui`;ctx.textAlign='center';ctx.save();ctx.translate(R.car.x*w,sy-4);ctx.scale(-1,1);ctx.fillText('🚗',0,0);ctx.restore();}
    ctx.fillStyle='#222';ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText('Asphalt',6,sy+16);ctx.fillStyle='#fff';ctx.fillText('Untergrund',6,gy-8);
  };
  lbLoop(step,draw);
}
/* ---------- C: Acker im Winter ---------- */
function lbField(){const F={T:8,wet:0,frozen:0,clumps:[],seeds:[],cycles:0,wasFrozen:false};
  const mk=()=>{F.clumps=[];let x=.04;while(x<.96){const s=.09+Math.random()*.05;F.clumps.push({x:x+s/2,s,y:.55+Math.random()*.25});x+=s+.01;}F.seeds=[];F.wet=0;F.frozen=0;F.cycles=0;F.wasFrozen=false;F.msg='';};mk();
  const loose=()=>{const avg=F.clumps.reduce((a,c)=>a+c.s,0)/F.clumps.length;return Math.max(0,Math.min(1,(0.11-avg)/(0.11-0.025)));};
  const sh=lbShell('field','🌱 Acker im Winter',lbTempCtl('ft','Temperatur (Winter ↔ Frühling)',-15,20,8)+`<div class="mxbtns"><button class="big sec" id="frain">🌧️ Regen</button><button class="big sec" id="fsow">🌾 Im Frühling säen</button></div><button class="big sec" id="fnew">⟲ Neuer Acker</button>`);
  $('#ft').oninput=e=>{F.T=+e.target.value;$('#ftl').textContent=F.T+' °C';};
  $('#frain').onclick=()=>{if(F.T<=0){F.msg='Bei Frost regnet es nicht. Stell die Temperatur über 0 °C.';return;}F.wet=Math.min(1,F.wet+.5);if(F.wet>.4)lbHit('f_wet');};
  $('#fsow').onclick=()=>{if(F.T<5){F.msg='Zu kalt zum Säen. Warte auf den Frühling (über 5 °C).';return;}const l=loose(),n=Math.round(3+l*14);F.seeds=[];for(let i=0;i<n;i++)F.seeds.push({x:.05+Math.random()*.9,g:0});F.msg=l>=.8?'Die Samen finden im lockeren Boden guten Halt und keimen gut.':'Auf den harten Klumpen keimen nur wenige Samen.';if(l>=.8)lbHit('f_sow');};
  $('#fnew').onclick=mk;let lastInfo='';
  const step=dt=>{const r=dt*1.4;
    if(F.T<0&&F.wet>.1){F.frozen=Math.min(1,F.frozen+0.15*r);if(F.frozen>=1&&!F.wasFrozen){F.wasFrozen=true;lbHit('f_freeze');
        const nc=[];F.clumps.forEach(c=>{if(c.s>.03&&Math.random()<.9*F.wet){const k=2+(Math.random()<.4?1:0),ns=c.s/k*0.98;for(let i=0;i<k;i++)nc.push({x:c.x-c.s/2+ns*(i+.5)+(Math.random()-.5)*.006,s:ns,y:Math.min(.85,c.y+.02+Math.random()*.04)});}else nc.push(c);});F.clumps=nc;F.wet=Math.max(0,F.wet-.2);}}
    else if(F.T>0&&F.frozen>0){F.frozen=Math.max(0,F.frozen-0.2*r);if(F.frozen===0&&F.wasFrozen){F.wasFrozen=false;F.cycles++;}}
    F.seeds.forEach(s=>s.g=Math.min(1,s.g+dt*.4));if(loose()>=.8)lbHit('f_loose');
    const l=Math.round(loose()*100);const info=`<b>${F.T} °C</b> · ${F.frozen>.5?'Das Wasser in den Erdklumpen ist gefroren. Das Eis dehnt sich aus und sprengt die Klumpen auf.':F.wet>.1?'Wasser ist in die Poren der Erdklumpen gezogen.':'Trockene, feste Erdklumpen.'}<br><small>Lockerheit des Bodens: ${l} % · Frostnächte: ${F.cycles}</small>${F.msg?'<br>'+F.msg:''}`;
    if(info!==lastInfo){lastInfo=info;$('#stinfo').innerHTML=info;$('#stlupe').innerHTML=lbLupe(['flüssig','fest'])+'<div class="stnote">Gefrierendes Wasser dehnt sich aus und drückt die Erde von innen auseinander. Nach mehreren Frostnächten ist der Boden fein und locker.</div>';}
  };
  const draw=()=>{const {w,h}=sh.D(),ctx=sh.ctx;ctx.clearRect(0,0,w,h);const gy=h*.45;
    ctx.fillStyle=F.T<0?'#e3eef9':F.T>=5?'#dff3ff':'#e8eef3';ctx.fillRect(0,0,w,gy);
    ctx.fillStyle='#6b4a2b';ctx.fillRect(0,gy,w,h-gy);
    F.clumps.forEach(c=>{const cw=c.s*w,ch=cw*.6,x=c.x*w,y=gy+(c.y-.45)*h*.5;ctx.fillStyle='#8a5f36';ctx.beginPath();ctx.ellipse(x,y,cw/2,ch/2,0,0,6.3);ctx.fill();
      if(F.wet>.1||F.frozen>0){ctx.fillStyle=F.frozen>.5?'rgba(235,248,255,.95)':'rgba(70,150,235,.9)';const n=Math.max(1,Math.round(cw/12));for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(x-cw/2+cw*(i+.5)/n,y+Math.sin(i*2.1)*ch*.2,Math.max(1.5,cw*.05),0,6.3);ctx.fill();}}
      if(F.frozen>.5&&c.s>.03){ctx.strokeStyle='#3b2715';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-ch/2);ctx.lineTo(x+cw*.1,y+ch/2);ctx.stroke();}});
    if(F.T<0){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(0,gy-4,w,6);}
    F.seeds.forEach(s=>{ctx.font=`${Math.round(12+s.g*16)}px system-ui`;ctx.textAlign='center';ctx.fillText(s.g>.5?'🌱':'•',s.x*w,gy+2);});
    ctx.fillStyle=lbTxt();ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText(F.T<0?'❄️ Frost':F.T>=5?'🌤️ Frühling':'☁️ kühl',8,18);
  };
  lbLoop(step,draw);
}
/* ---------- D: Flasche im Gefrierfach ---------- */
function lbBottle(){const B={fill:100,cap:true,inFreezer:false,ice:0,T:20,burst:false,out:0};
  const sh=lbShell('bottle','🍾 Flasche im Gefrierfach',`<label>Füllhöhe: <b id="bfl">100 %</b><input type="range" id="bf" min="50" max="100" value="100"></label><div class="mxchips"><button id="bcap" class="on">🔒 Deckel zu</button></div><div class="mxbtns"><button class="big go" id="bin">❄️ Ins Gefrierfach (−18 °C)</button><button class="big sec" id="bout">⟲ Neue Flasche</button></div>`);
  const reset=()=>{Object.assign(B,{inFreezer:false,ice:0,T:20,burst:false,out:0,msg:''});$('#bin').textContent='❄️ Ins Gefrierfach (−18 °C)';};
  $('#bf').oninput=e=>{if(B.inFreezer)return;B.fill=+e.target.value;$('#bfl').textContent=B.fill+' %';};
  $('#bcap').onclick=()=>{if(B.inFreezer)return;B.cap=!B.cap;$('#bcap').classList.toggle('on',B.cap);$('#bcap').textContent=B.cap?'🔒 Deckel zu':'🔓 Deckel offen';};
  $('#bin').onclick=()=>{if(B.inFreezer)return;B.inFreezer=true;$('#bin').textContent='⏳ friert ein …';};
  $('#bout').onclick=reset;let lastInfo='';
  const step=dt=>{if(!B.inFreezer)return;const r=dt*1.4;
    if(B.T>0)B.T=Math.max(0,B.T-8*r);else if(B.ice<1){B.ice=Math.min(1,B.ice+0.1*r);}else B.T=Math.max(-18,B.T-6*r);
    const vol=B.fill/100*(1+0.09*B.ice);
    if(vol>1){if(B.cap){if(vol>1.03&&!B.burst){B.burst=true;lbHit('b_burst');}}else{B.out=vol-1;if(B.fill>=98&&B.ice>=1)lbHit('b_open');}}
    if(B.ice>=1&&!B.burst&&B.cap&&vol<=1.03)lbHit('b_safe');
    if(B.ice>=1&&!B.cap&&vol<=1)lbHit('b_safe');
    if(B.ice>=1)$('#bin').textContent='✅ durchgefroren';
    const vol2=Math.round(B.fill*(1+0.09*B.ice));
    const info=`<b>${Math.round(B.T)} °C</b> · ${!B.inFreezer?'Flasche mit Wasser, bereit fürs Gefrierfach.':B.ice<=0?'Das Wasser kühlt ab …':B.ice<1?'Das Wasser gefriert zu Eis …':'Ganz durchgefroren.'}<br><small>Platzbedarf: ${B.inFreezer?vol2:B.fill} % der Flasche${B.inFreezer&&B.ice>0?' (Eis braucht etwa 9 % mehr Platz als Wasser)':''}</small>${B.burst?'<br>💥 Die Flasche ist geplatzt! Das Eis hatte keinen Platz mehr.':''}${!B.cap&&B.out>0?'<br>Das Eis wächst oben aus der Flasche heraus.':''}${B.ice>=1&&!B.burst&&B.cap?'<br>Genug Luft gelassen: Die Flasche hält.':''}`;
    if(info!==lastInfo){lastInfo=info;$('#stinfo').innerHTML=info;$('#stlupe').innerHTML=lbLupe(['flüssig','fest'])+'<div class="stnote">Tipp aus dem Alltag: Flaschen nie randvoll einfrieren. Etwa ein Zehntel Luft lassen.</div>';}
  };
  const draw=()=>{const {w,h}=sh.D(),ctx=sh.ctx;ctx.clearRect(0,0,w,h);
    if(B.inFreezer){ctx.fillStyle='rgba(180,215,255,.35)';ctx.fillRect(w*.2,h*.04,w*.6,h*.92);ctx.strokeStyle='rgba(120,160,210,.8)';ctx.lineWidth=3;ctx.strokeRect(w*.2,h*.04,w*.6,h*.92);ctx.fillStyle=lbTxt();ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText('Gefrierfach',w*.22,h*.04+16);}
    const bx=w*.5,bw=Math.min(90,w*.22),by0=h*.2,by1=h*.9,nk=bw*.36,neckTop=by0-h*.08,bulge=B.burst?bw*.12:Math.min(bw*.1,Math.max(0,(B.fill/100*(1+0.09*B.ice)-1))*bw*3)*(B.cap?1:0);
    const body=(pad)=>{ctx.beginPath();ctx.moveTo(bx-nk/2,neckTop);ctx.lineTo(bx-nk/2,by0);ctx.quadraticCurveTo(bx-bw/2-pad,by0+10,bx-bw/2-pad,by0+30);ctx.lineTo(bx-bw/2-pad,by1);ctx.lineTo(bx+bw/2+pad,by1);ctx.lineTo(bx+bw/2+pad,by0+30);ctx.quadraticCurveTo(bx+bw/2+pad,by0+10,bx+nk/2,by0);ctx.lineTo(bx+nk/2,neckTop);};
    ctx.save();body(bulge);ctx.clip();const inner=by1-neckTop,fillH=inner*Math.min(1,B.fill/100*(1+0.09*B.ice));
    const lt=by1-fillH*(1-B.ice),it=by1-fillH;ctx.fillStyle='rgba(70,150,235,.55)';ctx.fillRect(bx-bw,it,bw*2,by1-it);
    if(B.ice>0){ctx.fillStyle='rgba(230,245,255,.95)';const iceTop=it,iceH=fillH*B.ice;ctx.fillRect(bx-bw,iceTop,bw*2,iceH);ctx.strokeStyle='rgba(150,195,235,.9)';for(let yy=iceTop+6;yy<iceTop+iceH;yy+=9)for(let xx=bx-bw/2;xx<bx+bw/2;xx+=9){ctx.beginPath();ctx.arc(xx,yy,1.4,0,6.3);ctx.stroke();}}
    ctx.restore();
    if(!B.cap&&B.out>0){const oh=B.out*inner*1.2;ctx.fillStyle='rgba(230,245,255,.95)';ctx.beginPath();ctx.moveTo(bx-nk/2,neckTop);ctx.quadraticCurveTo(bx,neckTop-oh*2.2,bx+nk/2,neckTop);ctx.fill();}
    ctx.strokeStyle=B.burst?'#c0392b':'rgba(90,140,190,.95)';ctx.lineWidth=3;body(bulge);ctx.stroke();
    if(B.cap){ctx.fillStyle='#d9534f';ctx.fillRect(bx-nk/2-3,neckTop-12,nk+6,12);}
    if(B.burst){ctx.strokeStyle='#c0392b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(bx-bw/2-bulge,by0+60);ctx.lineTo(bx-bw/2-bulge+14,by0+75);ctx.lineTo(bx-bw/2-bulge+4,by0+90);ctx.lineTo(bx-bw/2-bulge+18,by0+108);ctx.stroke();ctx.font='26px system-ui';ctx.fillText('💥',bx-bw/2-bulge-30,by0+90);}
  };
  lbLoop(step,draw);
}

function lab(){

  {const pb=$('.pbar2'),st=$('#labstage');if(pb&&st)st.style.top=pb.offsetHeight+'px';}

function setT(T){

  const prev=G.T;G.T=T;$('#temp').value=T;
  $('#tval').textContent=T+' °C';$('#sname').textContent=stOf(T);
  let ev=null;
  if(prev<0&&T>=0)ev='Schmelzen';else if(prev>=0&&T<0)ev='Erstarren';
  if(prev<100&&T>=100)ev='Verdampfen';else if(prev>=100&&T<100)ev='Kondensieren';
  if(prev<0&&T>=100)ev='Verdampfen';if(prev>=100&&T<0)ev='Erstarren';

  $('#dval').textContent=T>=100?'fast 0 g/cm³ (Dampf)':d.toFixed(4).replace('.',',')+' g/cm³';
  $('#dtip').textContent=T===4?'👑 Höchste Dichte – hier ist Wasser am schwersten!':T<0?'Eis ist leichter als Wasser – es schwimmt.':T>=100?'Dampf braucht viel mehr Platz.':'';
  if(G.task){const k=G.task;if(T<0)k.frozen=true;if(T>=100)k.boiled=true;if(ev==='Schmelzen')k.melted=true;if(ev==='Kondensieren')k.cond=true;}
}

  if(id==='m4'&&!k.boiled)return'Es ist noch gar kein Dampf entstanden.';
  if(id==='m4'&&!k.cond)return`Bei ${T} °C ist das Wasser noch gasförmig.`;

     <div class="lbbtns">${k.solved?'<button class="big go" id="lbdone">Weiter</button>':`<button class="big go" id="lbchk">✔ Prüfen</button><button class="big sec" id="lbx">Abbrechen</button>`}</div>${!k.solved&&k.fails?`<div class="lbfails">Fehlversuche: ${'❌'.repeat(k.fails)}</div>`:''}`;

function initSim(keep){
  const st=$('#labstage'),cv=$('#cv');if(!st||!cv)return;
  const W=st.clientWidth,H=st.clientHeight,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);

}
function stepSim(){
  const s=G.sim;if(!s)return;const T=G.T,st=stOf(T),r=s.r;G.t++;
  if(st!==s.state){if(s.state==='fest'||s.state===null)s.p.forEach(q=>{q.vx=(Math.random()-.5)*r*.2;q.vy=(Math.random()-.5)*r*.2;});s.state=st;}
  const g=r*.035;
  for(const q of s.p){
    if(st==='fest'){
      const amp=r*(.04+(T+20)/20*.12);
      const tx=q.tx+Math.sin(G.t*.25+q.ph)*amp,ty=q.ty+Math.cos(G.t*.21+q.ph)*amp;
      q.x+=(tx-q.x)*.12;q.y+=(ty-q.y)*.12;q.vx=q.vy=0;
    }else{
      if(st==='flüssig'){const k=r*(.02+T/100*.08);q.vy+=g;q.vx+=(Math.random()-.5)*k*2;q.vy+=(Math.random()-.5)*k*2;q.vx*=.93;q.vy*=.93;}
      else{const target=r*(.28+(T-100)/20*.1),v=Math.hypot(q.vx,q.vy)||.001;if(v<.01){const a=Math.random()*6.28;q.vx=Math.cos(a);q.vy=Math.sin(a);}q.vx+=(q.vx/v*target-q.vx)*.08;q.vy+=(q.vy/v*target-q.vy)*.08;}
      q.x+=q.vx;q.y+=q.vy;
      const e=st==='gasförmig'?1:.5;
      if(q.x<s.x0+r){q.x=s.x0+r;q.vx=Math.abs(q.vx)*e;}if(q.x>s.x1-r){q.x=s.x1-r;q.vx=-Math.abs(q.vx)*e;}
      if(q.y<s.y0+r){q.y=s.y0+r;q.vy=Math.abs(q.vy)*e;}if(q.y>s.y1-r){q.y=s.y1-r;q.vy=-Math.abs(q.vy)*e;}
    }
  }
  if(st!=='fest'){
    const mn=st==='flüssig'?2.02*r:2*r;
    for(let i=0;i<s.p.length;i++)for(let j=i+1;j<s.p.length;j++){
      const a=s.p[i],b=s.p[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<mn&&d>0){const push=(mn-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
        if(st==='gasförmig'){const t=a.vx;a.vx=b.vx;b.vx=t;const u=a.vy;a.vy=b.vy;b.vy=u;}}
    }
  }
  drawSim(st);
}
function drawSim(st){
  const s=G.sim,c=s.ctx,T=G.T,r=s.r;
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue('--text').trim()||'#1b2238',brass=cs.getPropertyValue('--brass').trim()||'#94661c';
  c.clearRect(0,0,s.W,s.H);
  // Feuer oder Frost
  const cx=(s.x0+s.x1)/2,bw=s.x1-s.x0;
  if(T>20){
    const h=(T-20)/100*s.H*.14+6;
    for(let i=0;i<7;i++){const fx=s.x0+bw*(.12+i*.127),fh=h*(.6+Math.random()*.5);
      c.beginPath();c.moveTo(fx-bw*.05,s.y1+s.H*.13);c.quadraticCurveTo(fx,s.y1+s.H*.13-fh*1.4,fx+bw*.05,s.y1+s.H*.13);c.closePath();
      c.fillStyle=`rgba(255,${120+Math.random()*80|0},40,.85)`;c.fill();}
  }else if(T<0){
    c.fillStyle='rgba(140,200,255,.18)';c.fillRect(s.x0-20,s.y0-10,bw+40,s.y1-s.y0+30);
    c.font=`${Math.round(r*2.4)}px sans-serif`;c.textAlign='center';
    ['❄','❅','❆'].forEach((f,i)=>{c.fillText(f,s.x0-r*2.2,s.y0+(s.y1-s.y0)*(.2+i*.3));c.fillText(f,s.x1+r*2.2,s.y0+(s.y1-s.y0)*(.35+i*.25));});
  }
  // Kessel
  c.beginPath();c.moveTo(s.x0-6,s.y0-14);c.lineTo(s.x0-6,s.y1+2);c.quadraticCurveTo(s.x0-6,s.y1+14,s.x0+10,s.y1+14);c.lineTo(s.x1-10,s.y1+14);c.quadraticCurveTo(s.x1+6,s.y1+14,s.x1+6,s.y1+2);c.lineTo(s.x1+6,s.y0-14);
  c.lineWidth=5;c.strokeStyle=brass;c.stroke();
  // Bindungen im Eis
  if(st==='fest'){
    c.strokeStyle='rgba(90,160,230,.6)';c.lineWidth=2;
    for(let i=0;i<s.p.length;i++){const a=s.p[i];for(let j=i+1;j<s.p.length;j++){const b=s.p[j];if(Math.hypot(a.tx-b.tx,a.ty-b.ty)<s.sp*1.15){c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}}}
  }
  const fill=st==='fest'?'#a9d8ff':st==='flüssig'?'#3d8fe0':'#dfe3ec',stroke=st==='fest'?'#2d6fb3':st==='flüssig'?'#1d5ea8':'#8a93a6';
  for(const q of s.p){c.beginPath();c.arc(q.x,q.y,r*.92,0,6.283);c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=stroke;c.stroke();
    c.beginPath();c.arc(q.x-r*.3,q.y-r*.3,r*.22,0,6.283);c.fillStyle='rgba(255,255,255,.6)';c.fill();}
  c.fillStyle=ink;c.font=`800 ${Math.max(14,Math.round(r*1.1))}px Nunito, sans-serif`;c.textAlign='center';
  c.fillText(st==='fest'?'Eis – Kristallgitter mit festen Abständen':st==='flüssig'?'Wasser – Teilchen dicht und ungeordnet':'Wasserdampf – viel Abstand, schnelle Teilchen',cx,s.y0-24);
}

function pkGrades(pid){const u=(window.__NUTZER&&window.__NUTZER.cur)||'u1';let t=null,w=null;
  try{JSON.parse(localStorage.getItem('lz-ergebnisse')||'[]').forEach(r=>{if(!r||r.a!=='Z'||(r.u||'u1')!==u||!(r.units||[]).includes(pid))return;const g=+r.g;if(!g)return;if(r.k==='write'){if(w===null||g<w)w=g;}else if(!r.k){if(t===null||g<t)t=g;}});}catch(e){}
  Object.entries(S.grades||{}).forEach(([k,g])=>{if(k.split('+').includes(pid)&&(t===null||g<t))t=+g;});
  Object.entries(S.wgrades||{}).forEach(([k,g])=>{if(k.split('+').includes(pid)&&(w===null||g<w))w=+g;});return{t,w};}
function pkBadge(ic,lab,g){return g?`<span class="pkg ok n${g}">${ic} ${lab}: <b>Note ${g}</b></span>`:`<span class="pkg">${ic} ${lab}: noch offen</span>`;}
function home(){
