<!DOCTYPE html>
<html lang="de">
<head>
<script src="../js/app-core.js?v=7.1.2"></script>

<!-- ===== Nutzer-Kopf ===== -->

<script src="../js/nutzer-init.js?v=7.1.2"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Winkel-Akademie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecfa; --bg2:#d9def5; --panel:#ffffff; --panel2:#f1f3fc; --line:#c9cfea;
  --text:#171a3a; --muted:#565d86; --accent:#0a78c4; --accent2:#6a36d6;
  --ok:#128a52; --okbg:#dcf5e8; --bad:#c92c44; --badbg:#fde3e7; --half:#b06b00; --halfbg:#fff1d6;
  --ray1:#0a78c4; --ray2:#149b3f; --arc:#d98f00; --star:rgba(40,50,130,.22);
  --display:"Chakra Petch", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f2e; --bg2:#141b47; --panel:#121a40; --panel2:#1a2355; --line:#2c3874;
    --text:#ecf1ff; --muted:#9aa6d8; --accent:#4cc9ff; --accent2:#b58cff;
    --ok:#4eea8c; --okbg:#123a2e; --bad:#ff667a; --badbg:#3d1628; --half:#ffc857; --halfbg:#3a2f14;
    --ray1:#4cc9ff; --ray2:#7cff6b; --arc:#ffd166; --star:rgba(255,255,255,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f2e; --bg2:#141b47; --panel:#121a40; --panel2:#1a2355; --line:#2c3874;
  --text:#ecf1ff; --muted:#9aa6d8; --accent:#4cc9ff; --accent2:#b58cff;
  --ok:#4eea8c; --okbg:#123a2e; --bad:#ff667a; --badbg:#3d1628; --half:#ffc857; --halfbg:#3a2f14;
  --ray1:#4cc9ff; --ray2:#7cff6b; --arc:#ffd166; --star:rgba(255,255,255,.75);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;
  font-family:var(--body);color:var(--text);
  background:radial-gradient(ellipse at 20% 0%, var(--bg2), transparent 60%),
             radial-gradient(ellipse at 90% 100%, var(--bg2), transparent 55%), var(--bg);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, var(--star), transparent),
    radial-gradient(1px 1px at 27% 62%, var(--star), transparent),
    radial-gradient(1.5px 1.5px at 44% 33%, var(--star), transparent),
    radial-gradient(1px 1px at 58% 81%, var(--star), transparent),
    radial-gradient(2px 2px at 71% 14%, var(--star), transparent),
    radial-gradient(1px 1px at 83% 47%, var(--star), transparent),
    radial-gradient(1.5px 1.5px at 92% 76%, var(--star), transparent),
    radial-gradient(1px 1px at 6% 88%, var(--star), transparent),
    radial-gradient(1px 1px at 36% 8%, var(--star), transparent),
    radial-gradient(1.5px 1.5px at 64% 52%, var(--star), transparent);
  background-size:420px 420px;
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top,#app{position:relative;z-index:1}

/* Header */
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--panel) 70%, transparent);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px}
.rank{margin-left:auto;display:flex;align-items:center;gap:10px}
.ri{font-size:28px}
.rt{display:flex;flex-direction:column;min-width:150px}
.rt b{font-family:var(--display);font-size:16px}
.rt small{color:var(--muted);font-size:12px;font-weight:700}
.xpbar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:3px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ray1),var(--ray2))}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;display:grid;place-items:center}
#app{flex:1;min-height:0;overflow:auto}

/* Home */
.home{max-width:1060px;margin:0 auto;padding:26px 22px 60px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-bottom:26px}
.hero svg{width:150px;height:120px}
.hero h1{font-family:var(--display);font-size:clamp(34px,5vw,54px);line-height:1;margin:0 0 10px;letter-spacing:.5px}
.hero p{margin:0;font-size:18px;color:var(--muted);max-width:56ch;line-height:1.45}
h2{font-family:var(--display);font-size:24px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.step{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-size:17px}
.sub{color:var(--muted);margin:-4px 0 12px;font-weight:700}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pack{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.pack.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ptop{display:flex;align-items:center;gap:8px}
.picon{font-size:24px}
.pname{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1}
.pname small{display:block;font-family:var(--body);color:var(--muted);font-size:12px;font-weight:800}
.check{margin-left:auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;flex:none}
.pack.on .check{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pgoal{font-size:14px;line-height:1.4;color:var(--muted)}
.pgoal b{color:var(--text)}
.pbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.pack small.pst{font-size:12px;font-weight:800;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start}
.mode .mi{font-size:30px;grid-row:span 2;line-height:1.2}
.mode b{font-family:var(--display);font-size:18px}
.mode span{font-size:14px;color:var(--muted);line-height:1.35}
.mode.feature{border:2px solid var(--arc)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.warn{color:var(--bad);font-weight:800}
.settings{display:grid;gap:10px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.set>div:first-child{flex:1;min-width:220px}
.set small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:10px 18px;font-weight:800}
.seg button.on{background:var(--accent);color:var(--bg)}
.btn-s{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:800}

/* Game */
.game{display:flex;flex-direction:column;height:100%}
.gbar{position:relative;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line)}
.gtitle{font-family:var(--display);font-weight:700;font-size:19px}
.gprog{margin-left:auto;font-weight:900;font-size:18px}
.timebar{position:absolute;left:0;bottom:-1px;height:4px;background:linear-gradient(90deg,var(--ray2),var(--arc),var(--bad));width:100%}
.gbody{flex:1;display:flex;min-height:0}
.stage{overflow:hidden}#svg,#geo{transform-origin:0 0}
.zoomctl{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:4px;align-items:center;background:var(--panel2,rgba(255,255,255,.12));border-radius:12px;padding:3px}
.zoomctl button{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel,rgba(255,255,255,.2));color:inherit;font-size:20px;font-weight:800;cursor:pointer}
.zoomctl button:disabled{opacity:.35}
.zoomctl .zl{min-width:34px;text-align:center;font-size:.8rem;font-weight:800}
.stage.zoomed{cursor:grab}
.stage{flex:1;position:relative;min-width:0;min-height:0;transition:box-shadow .2s}
.stage.fok{box-shadow:inset 0 0 0 6px var(--ok)}
.stage.fbad{box-shadow:inset 0 0 0 6px var(--bad)}
#svg{position:absolute;inset:0;touch-action:none;display:block}
.bignum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(90px,17vw,200px);color:var(--arc);text-shadow:0 0 30px color-mix(in srgb,var(--arc) 45%,transparent)}
.bignum[hidden]{display:none}
.panel{width:370px;flex:none;padding:18px;overflow:auto;border-left:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);display:flex;flex-direction:column;gap:12px}
@media (orientation:portrait){
  .gbody{flex-direction:column}
  .panel{width:auto;max-height:46%;border-left:0;border-top:1px solid var(--line)}
  .panel .numpad{max-width:420px;align-self:center;width:100%}
  .panel .npd{max-width:420px;align-self:center;width:100%}
}
.ask{font-size:18px;font-weight:800;line-height:1.35}
.ask .tgt{font-family:var(--display);color:var(--arc);font-size:26px}
.npd{font-family:var(--display);font-size:44px;font-weight:700;text-align:center;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.numpad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:28px;font-weight:900}
.numpad button:active{transform:scale(.96);background:var(--panel2)}
.numpad .ok{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:22px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tbtn{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:18px;font-weight:900;padding:6px}
.tbtn:active{transform:scale(.97)}
.tbtn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tbtn.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.big{min-height:60px;border-radius:14px;border:0;font-size:20px;font-weight:900;padding:10px 20px}
.go{background:var(--accent);color:var(--bg)}
.go:disabled{opacity:.4}
.sec{background:var(--panel2);border:1px solid var(--line)}
.hintbtn{background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;font-weight:800;color:var(--muted)}
.hint{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45}
.hint ol{margin:0;padding-left:20px}
.fbox{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:17px;font-weight:700;line-height:1.4;border:2px solid}
.fbox.ok{background:var(--okbg);border-color:var(--ok)}
.fbox.bad{background:var(--badbg);border-color:var(--bad)}
.fbox.half{background:var(--halfbg);border-color:var(--half)}
.panel.answered .numpad,.panel.answered .hintbtn,.panel.answered .hint,.panel.answered #done{display:none}
.panel.answered .types{pointer-events:none}
.xpgain{font-family:var(--display);font-weight:700;color:var(--arc);font-size:22px}
.xpgain.sm{font-size:17px}

/* SVG */
.ray{stroke-width:5;stroke-linecap:round;fill:none}
.ray.thin{stroke-width:3}
.r1{stroke:var(--ray1)} .r2{stroke:var(--ray2)}
.arcf{fill:var(--arc);fill-opacity:.2;stroke:var(--arc);stroke-width:2.5}
.vertex{fill:var(--text);stroke:var(--bg);stroke-width:2}
.dot{fill:var(--arc)}
.deglabel{font-family:var(--display);font-weight:700;font-size:30px;fill:var(--arc);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.ghost{stroke:var(--arc);stroke-width:3;stroke-dasharray:10 8;fill:none}
.help{fill:var(--muted);font-family:var(--body);font-weight:800;font-size:17px}

/* Virtuelles Geodreieck */
#geo{position:absolute;inset:0;pointer-events:none;touch-action:none;display:block}
#geo .geo{pointer-events:auto;cursor:grab}
.geobody{fill:var(--accent);fill-opacity:.13;stroke:var(--accent);stroke-width:2}
.geotick{stroke:var(--text);stroke-width:1.1}
.geonum{fill:var(--text);font-family:var(--body);font-weight:800}
.geonum2{fill:var(--accent2);font-family:var(--body);font-weight:800}
.geozero{fill:var(--bad)}
.geohandle{fill:var(--arc);stroke:var(--bg);stroke-width:2}
.geoctl{display:flex;flex-wrap:wrap;gap:8px}
.geoctl .btn-s{min-height:46px}
/* Result */
.result{min-height:100%;display:grid;place-items:center;padding:24px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px}
.rtitle{font-family:var(--display);font-size:20px;color:var(--muted)}
.rbig{font-family:var(--display);font-size:72px;font-weight:700;line-height:1}
.rstars{font-size:52px;color:var(--arc);letter-spacing:6px}
.rcard p{margin:0;font-size:18px;font-weight:700}
.note{font-family:var(--display);font-size:64px;font-weight:700;line-height:1.1}
.n1,.n2{color:var(--ok)} .n3,.n4{color:var(--half)} .n5,.n6{color:var(--bad)}
.review{list-style:none;padding:0;margin:10px 0;text-align:left;display:grid;gap:6px}
.review li{background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;gap:10px}
.review li span{font-weight:900;width:18px}
.review li.ok span{color:var(--ok)} .review li.half span{color:var(--half)} .review li.bad span{color:var(--bad)}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* Learn */
.learn{max-width:1000px;margin:0 auto;padding:20px 22px 60px}
.learn .back{margin-bottom:10px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tcard b{font-family:var(--display);font-size:18px;display:block}
.tcard span{color:var(--muted);font-weight:700;font-size:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;font-size:17px;line-height:1.5;max-width:75ch}
.box ol{margin:6px 0;padding-left:22px}

/* Pakete 5–8 */
.tlab{font-family:var(--display);font-weight:700;font-size:20px;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.tsm{font-family:var(--body);font-weight:800;font-size:15px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.tlab.hot{fill:var(--arc)} .r1t{fill:var(--ray1)} .r2t{fill:var(--ray2)}
.bigl{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:150px;fill:var(--arc)}
.midl{font-family:var(--display);font-weight:700;font-size:64px;fill:var(--arc)}
.cmp{fill:var(--panel);fill-opacity:.55;stroke:var(--text);stroke-width:2}
.cmpx{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}
.cmpt{stroke:var(--text);stroke-width:2}
.turn{fill:none;stroke:var(--arc);stroke-width:4;stroke-linecap:round}
.turn.thin{stroke-width:2;stroke-dasharray:6 6}
.ahead{fill:var(--arc)}
.hl{fill:none;stroke:var(--bad);stroke-width:12;stroke-opacity:.5;stroke-linecap:round}
.hl.thin{stroke-width:7}
.gl{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--text);stroke-width:2}
.pt{fill:var(--bad);stroke:var(--bg);stroke-width:2}
.shape{fill:var(--accent);fill-opacity:.1;stroke:var(--text);stroke-width:3;stroke-linejoin:round}
.rsq{fill:none;stroke:var(--ok);stroke-width:3.5}
.arcf2{fill:var(--bad);fill-opacity:.16;stroke:var(--bad);stroke-width:2.5}
.types.wide{grid-template-columns:1fr}.types.wide .tbtn{font-size:16px;text-align:left;padding:10px 14px;min-height:52px}
.pgrp{font-family:var(--display);font-size:17px;color:var(--muted);margin:16px 0 8px}
.cl-list{display:grid;gap:8px}
.cl-row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cl-row.done{opacity:.72}
.cl-t{flex:1 1 240px;min-width:0;line-height:1.35}
.cl-t small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
.cl-chip{border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.cl-chip.ok{background:var(--okbg);color:var(--ok)}.cl-chip.half{background:var(--halfbg);color:var(--half)}.cl-chip.no{background:var(--panel2);color:var(--muted)}
.cl-nr{font-family:var(--display);font-weight:700;min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none}
.cl-cb{width:28px;height:28px;accent-color:var(--ok);flex:none;margin:0}
.cl-sec{font-family:var(--display);font-size:16px;color:var(--muted);margin:18px 0 6px}
.cl-go{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px 12px;font-weight:800;flex:none}
.clcard{background:var(--panel);border:2px solid var(--ok);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.clcard>div{flex:1 1 240px}.clcard b{font-family:var(--display);font-size:19px}.clcard small{display:block;color:var(--muted);font-weight:700}
/* Toast & confetti */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:50;background:var(--panel);border:2px solid var(--arc);border-radius:16px;padding:12px 20px;font-weight:900;font-size:18px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}
.conf{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion: reduce){.conf{display:none}.toast{animation:none}}
@media (max-width:520px){header.top{gap:6px;padding:8px 8px}.brand{font-size:15px;gap:6px}.brand svg{width:26px;height:26px}.rank{gap:6px}.ri{font-size:22px}.rt b{font-size:13px}header.top .icon-btn{width:38px;height:38px;font-size:17px}.lp-btn{padding:0 5px}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero svg{display:none}.rt{min-width:0}.rt small{display:none}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Zur Basis">
    <svg viewBox="0 0 40 40" aria-hidden="true"><line x1="6" y1="32" x2="36" y2="32" stroke="var(--ray1)" stroke-width="3.5" stroke-linecap="round"/><line x1="6" y1="32" x2="28" y2="8" stroke="var(--ray2)" stroke-width="3.5" stroke-linecap="round"/><path d="M6 32 L18 32 A12 12 0 0 0 14.1 23.2 Z" fill="var(--arc)" fill-opacity=".35" stroke="var(--arc)" stroke-width="2"/></svg>
    Winkel-Akademie
  </button>
  <div class="rank" id="rank"></div>
  <button class="icon-btn" id="soundBtn" aria-label="Ton an/aus"></button>
</header>
<main id="app"></main>

<script>
(function(){
"use strict";

/* Sound */
let AC=null;
function sfx(type){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const notes=type==='ok'?[[660,0],[990,.09]]:type==='bad'?[[190,0],[140,.12]]:[[523,0],[659,.1],[784,.2],[1046,.3]];
    notes.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='bad'?'sawtooth':'square';
      o.frequency.setValueAtTime(f,t+d);
      if(type==='ok')o.frequency.exponentialRampToValueAtTime(f*1.5,t+d+.08);
      g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(.07,t+d+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);
      o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.17);
    });
  }catch(e){}
}

/* Geometrie */
function P(vx,vy,r,a){const t=a*Math.PI/180;return[vx+r*Math.cos(t),vy-r*Math.sin(t)];}
function arcPath(vx,vy,r,a1,deg){
  const[x1,y1]=P(vx,vy,r,a1),[x2,y2]=P(vx,vy,r,a1+deg);
  return `M ${vx} ${vy} L ${x1} ${y1} A ${r} ${r} 0 ${deg>180?1:0} 0 ${x2} ${y2} Z`;
}
function layout(W,H,deg,rot,pad,maxL){
  const pts=[[0,0],P(0,0,1,rot),P(0,0,1,rot+deg)];
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const bw=Math.max(maxX-minX,.05),bh=Math.max(maxY-minY,.05);
  const L=Math.max(20,Math.min((W-2*pad)/bw,(H-2*pad)/bh,maxL));
  return{vx:pad+((W-2*pad)-(maxX-minX)*L)/2-minX*L,vy:pad+((H-2*pad)-(maxY-minY)*L)/2-minY*L,L};
}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function prepSvg(){
  const svg=$('#svg'),st=$('#stage');const W=st.clientWidth,H=st.clientHeight;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.innerHTML='';
  svg.onpointerdown=svg.onpointermove=svg.onpointerup=svg.onpointercancel=null;
  const defs=el('defs',{},svg);
  const f=el('filter',{id:'glow',filterUnits:'userSpaceOnUse',x:0,y:0,width:W,height:H},defs);
  el('feGaussianBlur',{stdDeviation:3.5,result:'b'},f);
  const m=el('feMerge',{},f);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);
  return{svg,W,H};
}
function label(g,x,y,txt,W,H){
  x=Math.min(W-40,Math.max(40,x));y=Math.min(H-24,Math.max(24,y));
  const t=el('text',{x,y,class:'deglabel','text-anchor':'middle','dominant-baseline':'middle'},g);t.textContent=txt;
}
function renderAngle(q,o={}){
  const{svg,W,H}=prepSvg();
  const big=q.kind==='measure';
  const{vx,vy,L}=big?layout(W,H,q.deg,q.rot,60,Math.min(W,H)*.62):layout(W,H,q.deg,q.rot,40,Math.min(W,H)*.44);
  const ar=big?Math.min(46,L*.2):Math.min(64,L*.26);
  if(G)G.vtx={x:vx,y:vy};
  const g=el('g',{},svg);
  if(q.deg>=360)el('circle',{cx:vx,cy:vy,r:ar,class:'arcf'},g);
  else if(q.deg>0)el('path',{d:arcPath(vx,vy,ar,q.rot,q.deg),class:'arcf'},g);
  const[x1,y1]=P(vx,vy,L,q.rot),[x2,y2]=P(vx,vy,L,q.rot+q.deg);
  const cls=big?' thin':'';
  el('line',{x1:vx,y1:vy,x2:x1,y2:y1,class:'ray r1'+cls,filter:'url(#glow)'},g);
  el('line',{x1:vx,y1:vy,x2:x2,y2:y2,class:'ray r2'+cls,filter:'url(#glow)'},g);
  if(q.deg===90&&!big){const[dx,dy]=P(vx,vy,ar*.5,q.rot+45);el('circle',{cx:dx,cy:dy,r:4.5,class:'dot'},g);}
  el('circle',{cx:vx,cy:vy,r:big?4:6,class:'vertex'},g);
  if(o.reveal){const[lx,ly]=P(vx,vy,ar+36,q.rot+q.deg/2);label(g,lx,ly,q.deg+'°',W,H);}
}

/* Zeichnen */
function setupDraw(){
  const q=G.q;const{svg,W,H}=prepSvg();
  const vx=W/2,vy=H/2,L=Math.min(W,H)/2-34,ar=Math.min(64,L*.26);
  G.dg={vx,vy,L,ar,W,H};
  const g=el('g',{},svg);
  G.dArc=el('path',{class:'arcf',d:''},g);
  const[x1,y1]=P(vx,vy,L,q.rot);
  el('line',{x1:vx,y1:vy,x2:x1,y2:y1,class:'ray r1',filter:'url(#glow)'},g);
  G.dRay=el('line',{x1:vx,y1:vy,x2:vx,y2:vy,class:'ray r2',filter:'url(#glow)'},g);
  el('circle',{cx:vx,cy:vy,r:6,class:'vertex'},g);
  G.dG=g;G.vtx={x:vx,y:vy};
  if(G.drawVal==null){const t=el('text',{x:W/2,y:H-22,'text-anchor':'middle',class:'help'},svg);t.textContent=W<440?'Tippe und zieh':'Tippe und zieh – der grüne Schenkel folgt deinem Finger';G.dHelp=t;}
  const setFrom=e=>{
    if(G.locked)return;
    const r=svg.getBoundingClientRect();
    const vb=svg.viewBox.baseVal,kx=vb.width/r.width,ky=vb.height/r.height;const a=Math.atan2(-((e.clientY-r.top)*ky-vy),(e.clientX-r.left)*kx-vx)*180/Math.PI;
    let rel=Math.round(((a-q.rot)%360+360)%360); if(rel===360)rel=0;
    G.drawVal=rel;updateDraw(rel);
    if(G.dHelp){G.dHelp.remove();G.dHelp=null;}
    const d=$('#done');if(d)d.disabled=false;
  };
  svg.onpointerdown=e=>{try{svg.setPointerCapture(e.pointerId);}catch(_){}G.dragging=true;setFrom(e);};
  svg.onpointermove=e=>{if(G.dragging)setFrom(e);};
  svg.onpointerup=svg.onpointercancel=()=>{G.dragging=false;};
  if(G.drawVal!=null)updateDraw(G.drawVal);
}
function updateDraw(rel){
  const{vx,vy,L,ar}=G.dg;const[x,y]=P(vx,vy,L,G.q.rot+rel);
  G.dRay.setAttribute('x2',x);G.dRay.setAttribute('y2',y);
  G.dArc.setAttribute('d',rel>0?arcPath(vx,vy,ar,G.q.rot,rel):'');
}
function revealDraw(){
  const{vx,vy,L,ar,W,H}=G.dg;const q=G.q;
  const[x,y]=P(vx,vy,L,q.rot+q.deg);
  el('line',{x1:vx,y1:vy,x2:x,y2:y,class:'ghost'},G.dG);
  const[lx,ly]=P(vx,vy,L*.72,q.rot+q.deg);label(G.dG,lx,ly,'Ziel '+q.deg+'°',W,H);
  if(G.drawVal!=null){const[ux,uy]=P(vx,vy,ar+40,q.rot+G.drawVal/2);label(G.dG,ux,uy,G.drawVal+'°',W,H);}
}

let ZM={z:1,px:0,py:0};
try{ZM.z=Math.min(3,Math.max(1,+(localStorage.getItem('winkel-zoom')||1)));}catch(e){}
function zoomApply(){
  const st=$('#stage');if(!st)return;
  const kind=G&&G.q&&G.q.kind,on=kind==='measure'||kind==='draw';
  const zc=$('#zoomctl');if(zc){zc.hidden=!on;const b=zc.querySelector('[data-z="1"]'),c=zc.querySelector('[data-z="-1"]');if(b)b.disabled=ZM.z>=3;if(c)c.disabled=ZM.z<=1;zc.querySelector('.zl').textContent=ZM.z===1?'1×':ZM.z+'×';}
  const z=on?ZM.z:1,v=(G&&G.vtx)||{x:st.clientWidth/2,y:st.clientHeight-26};
  const tx=v.x-z*v.x+ZM.px,ty=v.y-z*v.y+ZM.py;
  ['#svg','#geo'].forEach(s=>{const e=$(s);if(e)e.style.transform=z===1?'':`translate(${tx}px,${ty}px) scale(${z})`;});
  st.classList.toggle('zoomed',z>1);
}
function zoomStep(d){ZM.z=Math.min(3,Math.max(1,ZM.z+d*.5));if(ZM.z===1){ZM.px=0;ZM.py=0;}try{localStorage.setItem('winkel-zoom',ZM.z);}catch(e){}zoomApply();}
document.addEventListener('pointerdown',e=>{
  const st=$('#stage');if(!st||!st.contains(e.target)||e.target.closest('#zoomctl'))return;
  if(!(G&&G.q&&G.q.kind==='measure'&&ZM.z>1)||e.target.closest('.geo'))return;
  const sx=e.clientX,sy=e.clientY,px=ZM.px,py=ZM.py;
  const mv=ev=>{ZM.px=px+(ev.clientX-sx);ZM.py=py+(ev.clientY-sy);zoomApply();};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
});
function renderGeoCtl(){
  const c=$('#geoctl');if(!c)return;
  c.innerHTML=`<button class="btn-s" id="geoTog">📐 Virtuelles Geodreieck ${S.vgeo?'ausblenden':'einblenden'}</button>`+

function geoApply(){if(G&&G.geoG&&GEO)G.geoG.setAttribute('transform',`translate(${GEO.x} ${GEO.y}) rotate(${-GEO.rot})`);}
function angDiff(a,b){const d=Math.abs(((a-b)%360+360)%360);return Math.min(d,360-d);}
function renderGeo(){
  const gs=$('#geo');if(!gs)return;
  gs.innerHTML='';
  if(!(S.vgeo&&G&&G.q&&G.q.kind==='measure'))return;
  const st=$('#stage'),W=st.clientWidth,H=st.clientHeight;
  gs.setAttribute('viewBox',`0 0 ${W} ${H}`);gs.setAttribute('width',W);gs.setAttribute('height',H);
  const Hh=Math.min(W,H)*.55;
  if(!GEO||GEO.x<0||GEO.x>W||GEO.y<0||GEO.y>H)GEO={x:W/2,y:H-26,rot:0};
  const g=el('g',{class:'geo'},gs);G.geoG=g;
  el('polygon',{points:`${-Hh},0 ${Hh},0 0,${-Hh}`,class:'geobody'},g);
  const R=Hh*.68,fs=Math.max(10,Math.round(Hh/21)),big=Hh*.07;
  for(let t=0;t<=180;t++){
    const len=t%10===0?big:t%5===0?Hh*.045:Hh*.025;
    const c=Math.cos(t*Math.PI/180),s=Math.sin(t*Math.PI/180);
    el('line',{x1:R*c,y1:-R*s,x2:(R-len)*c,y2:-(R-len)*s,class:'geotick'},g);
    if(t%10===0){
      const r1=R-big-fs*.8,r2=R-big-fs*2;
      const a=el('text',{x:r1*c,y:-r1*s,class:'geonum','font-size':fs,'text-anchor':'middle','dominant-baseline':'middle'},g);a.textContent=t;
      const b=el('text',{x:r2*c,y:-r2*s,class:'geonum2','font-size':fs*.85,'text-anchor':'middle','dominant-baseline':'middle'},g);b.textContent=180-t;
    }
  }
  const cm=Hh/8;
  for(let i=-7;i<=7;i++){
    for(let m=0;m<10&&i<7;m++){const x=(i+m/10)*cm;if(x>Hh-4)break;el('line',{x1:x,y1:0,x2:x,y2:-(m===5?Hh*.03:Hh*.018),class:'geotick'},g);}
    el('line',{x1:i*cm,y1:0,x2:i*cm,y2:-Hh*.045,class:'geotick'},g);
    if(i!==0){const tx=el('text',{x:i*cm,y:-Hh*.045-fs*.6,class:'geonum','font-size':fs*.8,'text-anchor':'middle'},g);tx.textContent=Math.abs(i);}
  }
  el('line',{x1:0,y1:0,x2:0,y2:-R*.55,class:'geotick'},g);
  el('circle',{cx:0,cy:0,r:4,class:'geozero'},g);
  const hy=-Hh-34;
  el('line',{x1:0,y1:-Hh,x2:0,y2:hy,class:'geotick'},g);
  const hd=el('circle',{cx:0,cy:hy,r:22,class:'geohandle'},g);
  const ht=el('text',{x:0,y:hy,'text-anchor':'middle','dominant-baseline':'central','font-size':22,style:'pointer-events:none'},g);ht.textContent='⟳';
  geoApply();
  const pt=e=>{const r=gs.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
  const snap=()=>{
    const v=G.vtx;
    if(v&&Math.hypot(GEO.x-v.x,GEO.y-v.y)<16){GEO.x=v.x;GEO.y=v.y;}
    const q=G.q;
    for(const t of[q.rot,q.rot+180,q.rot+q.deg,q.rot+q.deg+180]){if(angDiff(GEO.rot,t)<2.5){GEO.rot=((t%360)+360)%360;break;}}
  };
  let drag=null;
  g.addEventListener('pointerdown',e=>{
    e.stopPropagation();try{g.setPointerCapture(e.pointerId);}catch(_){}
    const p=pt(e);
    drag=e.target===hd?{mode:'rot'}:{mode:'move',dx:GEO.x-p.x,dy:GEO.y-p.y};
  });
  g.addEventListener('pointermove',e=>{
    if(!drag)return;const p=pt(e);
    if(drag.mode==='move'){GEO.x=Math.min(W,Math.max(0,p.x+drag.dx));GEO.y=Math.min(H,Math.max(0,p.y+drag.dy));}
    else{const a=Math.atan2(-(p.y-GEO.y),p.x-GEO.x)*180/Math.PI;GEO.rot=((a-90)%360+360)%360;}
    snap();geoApply();
  });
  const end=()=>{drag=null;};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
}

/* ===== Pakete 5–8: Aufgaben-Modul ===== */
const DIRS=['Norden','Nordosten','Osten','Südosten','Süden','Südwesten','Westen','Nordwesten'];

const mA=k=>90-k; /* Kurs (rechts herum ab Norden) -> Mathe-Winkel */
function tx(g,x,y,t,cls,ex){const e=el('text',Object.assign({x,y,class:cls||'tlab','text-anchor':'middle','dominant-baseline':'middle'},ex||{}),g);e.textContent=t;return e;}
function ln(g,x1,y1,x2,y2,cls){return el('line',{x1,y1,x2,y2,class:cls},g);}
function head(g,x,y,ang,sz){const a=ang*Math.PI/180,b1=a+Math.PI*.82,b2=a-Math.PI*.82;
  el('polygon',{points:`${x},${y} ${x+sz*Math.cos(b1)},${y-sz*Math.sin(b1)} ${x+sz*Math.cos(b2)},${y-sz*Math.sin(b2)}`,class:'ahead'},g);}
function compass(g,cx,cy,R){
  el('circle',{cx,cy,r:R,class:'cmp'},g);
  ln(g,cx-R,cy,cx+R,cy,'cmpx');ln(g,cx,cy-R,cx,cy+R,'cmpx');
  for(let k=0;k<8;k++){const a=mA(k*45),[x1,y1]=P(cx,cy,R,a),[x2,y2]=P(cx,cy,k%2?R*.9:R*.82,a);ln(g,x1,y1,x2,y2,'cmpt');}
  [['N',0],['O',90],['S',180],['W',270]].forEach(([t,k])=>{const[x,y]=P(cx,cy,R+20,mA(k));tx(g,x,y,t,'tlab');});

function turnArc(g,cx,cy,r,a0,amt,right){

}
function arrowLine(g,x0,y0,x1,y1,cls){ln(g,x0,y0,x1,y1,cls||'ray r2');head(g,x1,y1,Math.atan2(-(y1-y0),x1-x0)*180/Math.PI,16);}

function arcLabel(g,vx,vy,r,a0,deg,t,cls){const[x,y]=P(vx,vy,r,a0+deg/2);tx(g,x,y,t,cls||'tlab');}

function okFor(kind,d){

function grade(q,v){
  if(q.kind==='task')return gradeTask(q,v);
  const T=typeOf(q.deg),TT=TYPES[T];
  if(q.kind==='visual'||q.kind==='degree'){
    const c=v===T;
    return{correct:c,score:c?1:0,msg:c?`${pick(PRAISE)} ${q.deg}° ist ${TT.s}.`:`Leider nein. ${q.deg}° ist ${TT.s}: ${TT.range}.`};
  }
  if(q.kind==='measure'){
    const d=Math.abs(v-q.deg);
    let msg;
    if(d===0)msg=`Exakt ${q.deg}°! 🎯`;
    else if(d<=2)msg=`${pick(PRAISE)} Genau sind es ${q.deg}° – du hattest ${v}°.`;
    else if(q.deg>180&&Math.abs(v-(360-q.deg))<=3)msg=`Du hast den Innenwinkel gemessen (${v}°). Der markierte Winkel ist überstumpf: 360° − ${360-q.deg}° = ${q.deg}°.`;
    else if(q.deg<180&&Math.abs(v-(180-q.deg))<=3)msg=`Skala verwechselt? Du hast ${v}° abgelesen, richtig sind ${q.deg}°. Lies auf der Skala ab, die am blauen Schenkel bei 0 beginnt.`;
    else if(d<=5)msg=`Knapp daneben: Richtig sind ${q.deg}°, du hattest ${v}°. Leg den Nullpunkt ganz genau auf den Scheitel.`;
    else msg=`Richtig wären ${q.deg}°. Du hattest ${v}°. Schau dir den Tipp zum Messen an.`;
    return{correct:d<=2,score:d<=2?1:d<=5?.5:0,msg};
  }
  if(q.kind==='estimate'){
    const d=Math.abs(v-q.deg),score=d<=5?1:d<=10?.66:d<=20?.33:0,st=Math.round(score*3);
    return{correct:d<=10,score,msg:`<span style="color:var(--arc);font-size:24px">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span><br>Tatsächlich: ${q.deg}° – du lagst ${d}° ${d===0?'daneben? Nein, genau richtig!':'daneben.'}`};
  }
  const d=Math.abs(v-q.deg);
  return{correct:d<=5,score:d<=5?1:d<=10?.5:0,msg:d<=5?`${pick(PRAISE)} Dein Winkel: ${v}°, Ziel: ${q.deg}°.`:`Dein Winkel: ${v}°, Ziel: ${q.deg}°. Die gestrichelte Linie zeigt, wo der Schenkel hingehört.`};
}

}

function miniSVG(deg){
  const W=170,H=120,{vx,vy,L}=layout(W,H,deg,0,16,54),ar=Math.min(26,L*.4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`;
  if(deg>=360)s+=`<circle cx="${vx}" cy="${vy}" r="${ar}" class="arcf"/>`;
  else if(deg>0)s+=`<path d="${arcPath(vx,vy,ar,0,deg)}" class="arcf"/>`;
  const[x1,y1]=P(vx,vy,L,0),[x2,y2]=P(vx,vy,L,deg);
  s+=`<line x1="${vx}" y1="${vy}" x2="${x1}" y2="${y1}" class="ray r1"/><line x1="${vx}" y1="${vy}" x2="${x2}" y2="${y2}" class="ray r2"/>`;
  if(deg===90){const[dx,dy]=P(vx,vy,ar*.5,45);s+=`<circle cx="${dx}" cy="${dy}" r="3.5" class="dot"/>`;}
  return s+`<circle cx="${vx}" cy="${vy}" r="4.5" class="vertex"/></svg>`;
}

  app.querySelectorAll('.cl-go').forEach(b=>b.onclick=()=>{if(b.dataset.k!=null){const r=CL_KANN[+b.dataset.k];clGo(r.packs,r.m);}else{const r=CL_TEILE.find(x=>x.n===+b.dataset.n);clGo(r.packs,r.m);}});

const LEARN2=`
  <h2>✍️ So zeichnest du einen Winkel</h2>
  <div class="box"><ol><li>Zeichne den ersten Schenkel. Er soll mindestens 6 cm lang sein.</li><li>Markiere den Scheitel S und beschrifte den Schenkel a.</li><li>Lege das Geodreieck auf den Schenkel a. Der Nullpunkt liegt genau bei S.</li><li>Wähle die Winkelskala, die auf der Seite von Schenkel a mit 10° beginnt. Suche die Gradzahl und mache eine Markierung.</li><li>Verbinde S mit der Markierung.</li><li>Beschrifte den zweiten Schenkel mit b, zeichne den Winkelbogen und beschrifte den Winkel.</li></ol>
  <b>Überstumpf, zum Beispiel β = 310°:</b> 360° − 310° = 50°. Zeichne 50° und markiere den großen Bogen auf der anderen Seite.</div>
  <h2>🏷️ Teile des Winkels</h2>
  <div class="box">Der Punkt, an dem sich die Schenkel treffen, heißt <b>Scheitel S</b>. Die beiden Strahlen heißen <b>Schenkel a</b> und <b>b</b>. Der <b>Winkelbogen</b> zeigt, welcher Winkel gemeint ist.<br>Winkel werden mit griechischen Buchstaben beschriftet: <b>α</b> Alpha, <b>β</b> Beta, <b>γ</b> Gamma, <b>δ</b> Delta, <b>ε</b> Epsilon.<br><br><b>Das Geodreieck:</b> Nullpunkt, Mittellinie, Längenmaß (Lineal an der langen Kante), innere und äußere Winkelskala, parallele Hilfslinien, eine 90°-Ecke und zwei 45°-Ecken.</div>
  <h2>🧭 Kompass und Kurs</h2>
  <div class="box">Norden 0° · Nordosten 45° · Osten 90° · Südosten 135° · Süden 180° · Südwesten 225° · Westen 270° · Nordwesten 315°.<br>Drehungen als Bruchteil: ⅛ Drehung = 45°, ¼ = 90°, ⅜ = 135°, ½ = 180°, ¾ = 270°, ganze Drehung = 360°. Rechts herum heißt im Uhrzeigersinn.<br>Der <b>Kurs</b> ist immer eine Rechtsdrehung, beginnend bei Norden = 0°. Beispiel: Von A(2|1) nach B(4|3) geht es schräg nach rechts oben, also Nordosten: Kurs 45°.<br>Koordinaten: Erst den x-Wert nach rechts, dann den y-Wert nach oben, B(4|3).</div>
  <h2>🧮 Winkel berechnen</h2>
  <div class="box"><b>Nebenwinkel</b> ergänzen sich zu 180°: α + 50° = 180°, also α = 130°.<br><b>Alle Winkel um einen Punkt</b> ergeben 360°.<br>Schneiden sich zwei Geraden, sind <b>gegenüberliegende Winkel gleich groß</b> (Scheitelwinkel). Zwei benachbarte Winkel ergeben 180°.<br>In jedem <b>Dreieck</b> ist die Summe der Winkel 180°.</div>
  <h2>📏 Senkrechte und Parallelen</h2>
  <div class="box">Zwei Geraden, die sich im rechten Winkel schneiden, sind <b>senkrecht</b> zueinander: g ⊥ h. Den rechten Winkel markierst du mit einem Viertelkreis und Punkt.<br>Zwei Geraden, die überall den gleichen Abstand haben und sich nie schneiden, sind <b>parallel</b>: g ∥ h.<br><b>Senkrechte zeichnen:</b> Mittellinie des Geodreiecks auf die Gerade legen, dann an der langen Kante zeichnen.<br><b>Parallele zeichnen:</b> Eine parallele Hilfslinie auf die Gerade legen und an der langen Kante zeichnen. Für einen Abstand von 1 cm nimmst du die Hilfslinie mit der 1.</div>`;

      <div class="pbar"><i style="width:${done?100:Math.min(100,sum/16*100)}%"></i></div>

  };

  const need=m=>['measure','visual','degree','estimate','draw','time'].includes(m)?sa:m==='task'?st:m==='test'?!dis:true;

  app.innerHTML=`<div class="home">
    <section class="hero">
      <svg viewBox="0 0 150 120" aria-hidden="true"><defs><filter id="hg" x="0" y="0" width="150" height="120" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <path d="${arcPath(28,96,34,0,125)}" class="arcf"/><line x1="28" y1="96" x2="140" y2="96" class="ray r1" filter="url(#hg)"/><line x1="28" y1="96" x2="${P(28,96,95,125)[0]}" y2="${P(28,96,95,125)[1]}" class="ray r2" filter="url(#hg)"/><circle cx="28" cy="96" r="5" class="vertex"/></svg>
      <div><h1>Winkel-Akademie</h1><p>Deine Mission: Winkel messen, erkennen, zeichnen und berechnen, mit dem Kompass navigieren – bis du zur Galaxis-Legende aufsteigst.</p></div>
    </section>
    ${window.lzHint?lzHint():""}${clCard()}<h2><span class="step">1</span>Pakete wählen</h2>
    <p class="sub">Tippe die Pakete an, mit denen du üben willst. Alle Missionen nutzen deine Auswahl.</p>
    ${packs}
    <h2><span class="step">2</span>Mission starten</h2>
    ${dis?'<p class="warn">Wähle zuerst mindestens ein Paket.</p>':''}
    <div class="modes">${modes}</div>
    <h2><span class="step">3</span>Einstellungen</h2>
    <div class="settings">
      <div class="set"><div><b>Schwierigkeit</b><small>${S.diff==='leicht'?'Leicht: Beim Messen und Zeichnen liegt ein Schenkel waagerecht.':'Profi: Alle Winkel sind beliebig gedreht.'}</small></div>
        <div class="seg"><button data-d="leicht" class="${S.diff==='leicht'?'on':''}">Leicht</button><button data-d="profi" class="${S.diff==='profi'?'on':''}">Profi</button></div></div>
      <div class="set"><div><b>Rekorde mit dieser Paket-Auswahl</b><small>Zeitrunde: ${S.high[k]||0} Punkte · Beste Testnote: ${S.grades[k]?S.grades[k]+' ('+NOTE_TXT[S.grades[k]]+')':'noch kein Test'}</small></div></div>
      <div class="set"><div><b>Fortschritt zurücksetzen</b><small>Löscht Punkte, Ränge, Lernziele und Rekorde auf diesem Gerät.</small></div><button class="btn-s" id="reset">Zurücksetzen</button></div>
    </div></div>`;
  app.querySelectorAll('.pack').forEach(b=>b.onclick=()=>{const id=b.dataset.p;S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];save();const y=app.scrollTop;home();app.scrollTop=y;});
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
  const clo=$('#clOpen');if(clo)clo.onclick=checklist;
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;save();const y=app.scrollTop;home();app.scrollTop=y;});
  $('#reset').onclick=()=>{if(confirm('Wirklich den ganzen Fortschritt löschen?')){const sel=S.sel;S=JSON.parse(JSON.stringify(DEF));S.sel=sel;save();renderHeader();home();}};
}

renderHeader();
home();
