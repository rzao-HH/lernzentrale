<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detektiv-Büro</title>
<script src="../js/app-core.js?v=7.13.1"></script>

<!-- ===== Nutzer-Kopf ===== -->
<script>window.__APPK="D";window.__DATAKEY="detektivbuero-v1";window.__NU_TARGET="#lpBtn";window.__NU_CLASS="icon-btn";</script>
<script src="../js/nutzer-init.js?v=7.13.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe3;--panel:#fffdf7;--panel2:#f0e7d6;--line:#dccfb6;--text:#2a221c;--muted:#7a6a57;--accent:#9c5418;--accent2:#1f3a5f;--on:#fff;
 --ok:#2e7d32;--okbg:#e5f4e6;--bad:#c0392b;--badbg:#fbe4e1;--half:#b7791f;--halfbg:#fff3d6;--display:'Special Elite','Courier New',monospace;--body:'Nunito',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--panel:#251f1a;--panel2:#2f2721;--line:#43382e;--text:#f2e9dc;--muted:#b9a88f;--accent:#e2a15b;--accent2:#9fc0ea;--on:#1a1613;
 --ok:#6fd07a;--okbg:#1f3322;--bad:#ff8a7a;--badbg:#3a211d;--half:#f2c25f;--halfbg:#3a3020;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;font-weight:700;min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.brand .lg{font-size:26px}
#rank{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.2;margin-right:4px;min-width:0}
#rank b{font-size:13px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:20px;display:inline-grid;place-items:center;flex:none;padding:0}
@media (max-width:440px){.brand span:not(.lg){display:none}#rank .rt{display:none}}
#app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:34px;margin:6px 0 0;line-height:1.1}
h2{font-family:var(--display);font-size:22px;margin:10px 0 0;display:flex;align-items:center;gap:10px}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on);font-family:var(--body);font-size:15px;font-weight:900}
.sub{color:var(--muted);margin:0;line-height:1.45}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pack{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pack.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.pack .ph{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}.pack .ph .ck{margin-left:auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.pack.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on)}
.pack .gl{font-size:14px;line-height:1.4;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.pack small{font-size:12px;font-weight:800;color:var(--muted)}.pack small.psrc{font-weight:700}
.grp{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;min-height:84px}
.mode .mi{font-size:28px;line-height:1}.mode b{display:block;font-size:16px}.mode span{font-size:13px;color:var(--muted);line-height:1.35}
.mode.feature{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.mode:disabled{opacity:.45}
.pbar2{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:3}
.pbar2 .t{flex:1;font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pprog{font-weight:900}
.card{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.q{font-weight:900;font-size:19px;line-height:1.35}
.sent{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:19px;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:17px;font-weight:800;padding:10px 14px;text-align:left;line-height:1.3}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.big{min-height:54px;border-radius:14px;border:0;font-size:17px;font-weight:900;padding:0 18px}
.go{background:var(--accent);color:var(--on)}.sec{background:var(--panel2);border:1px solid var(--line)}
.big:disabled{opacity:.45}
.btime{height:5px;background:var(--line)}.btime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--accent),var(--bad));transition:width .1s linear}
.bflash{margin-top:12px;text-align:center;font-size:30px;font-weight:900;border-radius:14px;padding:6px}.bflash.ok{color:var(--ok);background:var(--okbg)}.bflash.bad{color:var(--bad);background:var(--badbg)}.bflash small{display:block;font-size:15px;font-weight:700;color:inherit}
.bgap{display:inline-block;min-width:26px;padding:0 6px;border-radius:8px;background:var(--accent);color:#fff;font-weight:900;text-align:center}
.opts.two{grid-template-columns:1fr 1fr}
.fbox{border-radius:16px;padding:12px 14px;border:2px solid;display:flex;flex-direction:column;gap:10px;line-height:1.45}
.fbox.ok{background:var(--okbg);border-color:var(--ok)}.fbox.bad{background:var(--badbg);border-color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;font-size:19px;line-height:1.3}
.w{border:2px solid transparent;border-radius:10px;padding:4px 6px;background:transparent;font-size:19px}
.words.tapm .w{border-color:var(--line);background:var(--panel2)}
.w.sel,.words.tapm .w.sel{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.w.ok,.words.tapm .w.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:800}.w.ok::after{content:' ✓'}.w.miss,.words.tapm .w.miss{background:var(--halfbg);border-color:var(--half);border-style:dashed;font-weight:800}.w.bad,.words.tapm .w.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.gap{min-width:22px;height:34px;border-radius:8px;border:2px dashed var(--line);background:transparent;font-weight:900;font-size:20px;line-height:1;padding:0 2px;color:var(--accent)}
.gap.on{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.gap.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.gap.miss{border-color:var(--half);background:var(--halfbg);color:var(--half)}.gap.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.cw{display:inline-flex;align-items:center;gap:2px}
.src{font-size:15px;color:var(--muted);line-height:1.45}
.line{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel)}
.line .fix{font-weight:800;font-size:18px}
.tile{border:2px solid var(--accent2);background:var(--panel);color:var(--text);border-radius:10px;padding:6px 10px;font-size:18px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.inp{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;font:inherit;font-size:18px}
.result{min-height:100%;display:grid;place-items:center;padding:24px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:680px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px}
.rtitle{font-family:var(--display);font-size:22px}
.note{font-family:var(--display);font-size:60px;line-height:1.1}
.stars{font-size:40px;letter-spacing:4px}
.xpgain{color:var(--accent);font-weight:900}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fc{position:relative;border:0;background:transparent;padding:0;perspective:900px;width:100%;min-height:230px}
.fci{position:relative;width:100%;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:18px;text-align:center}
.fcb{position:relative;min-height:230px}.fcf{background:var(--panel);font-family:var(--display);font-size:24px}.fcf small{font-family:var(--body);font-size:13px;font-weight:800;opacity:.7}
.fcb{background:var(--panel2);transform:rotateY(180deg);font-size:17px;line-height:1.45;font-weight:700;padding-bottom:30px}.fcb .fsrc{position:absolute;left:10px;right:10px;bottom:8px;font-size:12px;font-weight:800;opacity:.7}.fsrc2{display:block;font-size:12px;font-weight:800;opacity:.7;margin-top:2px}
.fex{display:block;font-size:13px;line-height:1.4;font-weight:500;opacity:.85;max-width:560px}.wans .fex{margin-top:4px}
.bktag{position:absolute;top:10px;left:12px;font-family:var(--body);font-size:12px;font-weight:800;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}.chips button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.bkprog{display:flex;align-items:center;gap:10px;font-weight:800}.bkprog .bar{flex:1;height:12px}
.bkbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{background:var(--halfbg);border:1px solid var(--half);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
/* Schreibtest */
.wbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.5}
.wn{display:flex;gap:8px;margin:6px 0 4px}.wn button{min-width:52px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:900;font-size:18px}.wn button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.wstat{background:var(--halfbg);border:2px solid var(--half);border-radius:14px;padding:12px 14px;line-height:1.5}.wstat.ok{background:var(--okbg);border-color:var(--ok)}
.wmeta{font-size:14px;font-weight:800;opacity:.7}
.wta{width:100%;min-height:170px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:inherit;padding:12px 14px;font:inherit;font-size:17px;line-height:1.5;resize:vertical}
.wnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.wdots button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:800}.wdots button.done{background:var(--okbg);border-color:var(--ok)}.wdots button.on{outline:3px solid var(--accent)}
.wspin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:wsp 1s linear infinite;margin:20px auto 0}@keyframes wsp{to{transform:rotate(360deg)}}
.bksearch{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:17px;padding:0 14px}.bksearch:focus{outline:none;border-color:var(--accent)}
mark{background:#ffe27a;color:#2a221c;border-radius:4px;padding:0 2px}
.wans{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;line-height:1.45}
.wmine,.wmodel,.wcom,.wover{border-radius:12px;padding:10px 12px;white-space:pre-wrap;line-height:1.5}
.wmine small,.wmodel small,.wcom small,.wover small{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;opacity:.7;margin-bottom:2px}
.wmine{background:var(--panel2);border:1px dashed var(--line)}.wmodel{background:var(--okbg);border:1px solid var(--ok)}.wcom{background:var(--halfbg);border:1px solid var(--half)}.wover{background:var(--panel2);border:1px solid var(--line);text-align:left}
.wkr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border-top:1px solid var(--line);padding-top:6px}.wkr>span{flex:1 1 200px;font-weight:700}
.wsel{display:flex;gap:4px}.wsel button{min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:14px}
.wsel button.on.v1{background:var(--okbg);border-color:var(--ok)}.wsel button.on.v05{background:var(--halfbg);border-color:var(--half)}.wsel button.on.v0{background:var(--badbg);border-color:var(--bad)}
.wkr2{display:flex;gap:8px;align-items:flex-start;font-weight:700}
.wk{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900}.wk.ok{background:var(--okbg);color:var(--ok)}.wk.half{background:var(--halfbg);color:var(--half)}.wk.bad{background:var(--badbg);color:var(--bad)}
.wlist{display:flex;flex-direction:column;gap:12px;margin-top:8px}

</style></head>
<body>
<header class="top"><div class="brand"><span class="lg">🕵️</span><span>Detektiv-Büro</span></div><div id="rank"></div><button class="icon-btn" id="soundBtn" aria-label="Ton an/aus">🔊</button></header>
<main id="app"></main>
<script>
const PACKS=[
 {id:'p1',src:"Nr. 29 (dazu Nr. 31, Nr. 32, Nr. 38)",icon:'🔍',name:'Hauptsatz & Nebensatz',goal:'Ich finde das gebeugte Verb und erkenne, ob ein Teilsatz ein Haupt- oder Nebensatz ist.'},
 {id:'p2',src:"Nr. 30, Nr. 35, Nr. 36 (dazu Nr. 32)",icon:'🔗',name:'Satzreihe',goal:'Ich verbinde Hauptsätze mit und, oder, aber, sondern, denn, doch und weiß, wann ein Komma steht.'},
 {id:'p3',src:"Nr. 31, Nr. 33, Nr. 37, Nr. 38 (dazu Nr. 32)",icon:'🧩',name:'Satzgefüge',goal:'Ich verbinde Haupt- und Nebensatz mit weil, wenn, obwohl, nachdem … und setze das Verb ans Ende.'},
 {id:'p4',src:"Nr. 34, Nr. 36–38, Nr. 40",icon:'🗝️',name:'Konjunktionen',goal:'Ich wähle die passende Konjunktion: für einen Grund, einen Gegensatz, eine Zeitangabe und mehr.'},
 {id:'p5',src:"Nr. 32, Nr. 39–41",icon:'✒️',name:'Komma-Profi',goal:'Ich setze Kommas bei Aufzählungen, in Satzreihen und Satzgefügen und unterscheide SR und SG.'},
 {id:'p6',src:"Heft Zeitformen (Buch S. 230–236, AH S. 56–58)",icon:'⏳',name:'Zeitformen',goal:'Ich erkenne und bilde Präsens, Präteritum, Perfekt, Plusquamperfekt und Futur.'}
];
const CARDS={/* [Frage (Vorderseite), Antwort (Rückseite)] – Wortlaut wie auf den Lernzetteln Nr. 29–41 und im Heft */
 p1:[['Woran erkennst du einen Hauptsatz?','Er könnte auch allein stehen (Nr. 29). Die gebeugte Verbform steht meist an 2. Stelle: „Christoph kommt zu Besuch.“'],
  ['Woran erkennst du einen Nebensatz?','Er kann nicht allein stehen. Er beginnt oft mit einer Konjunktion, und die gebeugte (finite) Verbform steht am Ende: „…, weil sein Vater dort arbeitet.“'],
  ['Was ist die gebeugte (finite) Verbform?','Die Verbform, die sich nach der Person richtet: ich gehe, du gehst, er geht. Auf Nr. 38 heißt sie auch Prädikat.'],
  ['Wie findest du die gebeugte Verbform in einem Satz?','Setze den Satz in eine andere Person: Die Form, die sich dabei ändert, ist die gebeugte Verbform (er lebt → ich lebe).'],
  ['Woraus werden zusammengesetzte Sätze gebildet?','Entweder aus mehreren Hauptsätzen (Satzreihe) oder aus Haupt- und Nebensätzen (Satzgefüge).'],
  ['Mit welchen Konjunktionen beginnen Nebensätze oft?','als, weil, da, bevor, obwohl, wie, wo, seit, dass, sodass, wenn, nachdem, der (welcher), die (welche), das (welches) – Nr. 29']],
 p2:[['Was ist eine Satzreihe?','Aneinandergereihte Hauptsätze: „Ich stehe auf und meine Mutter macht Frühstück.“ Man trennt sie mit Komma oder Satzschlusszeichen (z. B. Punkt).'],
  ['Muss vor und / oder zwischen zwei Hauptsätzen ein Komma stehen?','Nein, vor und und oder muss kein Komma stehen (erlaubt ist es trotzdem).'],
  ['Vor welchen Hauptsatz-Konjunktionen muss ein Komma stehen?','Vor doch, aber, sondern und denn: „Laura geht gern ins Kino, aber sie hat kein Geld.“'],
  ['Was kann man mit Hauptsatz-Konjunktionen ausdrücken?','etwas aufzählen (und, oder) · einen Gegensatz ausdrücken (aber, doch, sondern) · einen Grund nennen (denn) – Nr. 36'],
  ['Was für ein Satz folgt nach denn?','Ein Hauptsatz – die Wortstellung ändert sich nicht: „Armstrong ist bekannt, denn er landete auf dem Mond.“'],
  ['Was darfst du streichen, wenn du Hauptsätze mit und / oder verbindest?','Wörter, die du nicht wiederholen willst: „Der Mond dreht sich um die Erde und ist unser nächster Nachbar.“']],
 p3:[['Woraus besteht ein Satzgefüge?','Aus einem Hauptsatz und mindestens einem Nebensatz: „Ich stehe auf, weil ich zur Schule gehen muss.“'],
  ['Was steht zwischen Hauptsatz und Nebensatz?','Ein Komma – es muss immer stehen (Nr. 38).'],
  ['Wo steht im Nebensatz die gebeugte Verbform?','An der letzten Stelle: „Wir lernen dort interessante Dinge.“ → „…, weil wir dort interessante Dinge lernen.“'],
  ['Was ändert sich, wenn der Nebensatz vorne steht?','Der Hauptsatz beginnt dann mit dem Verb: „Als die Deiche brachen, stieg das Wasser rasch.“'],
  ['Welche Nebensatz-Konjunktionen kennst du?','weil, da, während, wenn, als, obwohl, damit (Nr. 37/38) – außerdem dass, sodass, nachdem, bevor, seit (Nr. 29)'],
  ['Welche Nebensätze beginnen mit der, die oder das?','Diese Nebensätze stehen oft mitten im Satz, mit Komma davor und danach: „Die erfolgreichen Wettkämpfer, die nach den Spielen in ihr Heimatland reisen, werden dort begeistert empfangen.“']],
 p4:[['Mit welchen Konjunktionen nennst du einen Grund?','weil, da (Nebensatz) · denn (Hauptsatz)'],
  ['Mit welchen Konjunktionen drückst du einen Gegensatz aus?','obwohl (Nebensatz) · aber, doch, sondern (Hauptsatz)'],
  ['Welche Konjunktionen sagen etwas über die Zeit?','als, nachdem, bevor, während, sobald, seit, bis'],
  ['Welche Konjunktion nennt eine Bedingung?','wenn: „Wir kommen, wenn es nicht regnet.“'],
  ['Was ist der Unterschied zwischen damit und sodass?','damit nennt den Zweck: „…, damit der Verbrecher ausfindig gemacht werden kann.“ · sodass nennt die Folge: „…, sodass viele nicht rechtzeitig evakuiert werden konnten.“'],
  ['Was ist der Unterschied zwischen denn und weil?','Gleiche Bedeutung, andere Form: „…, denn die Erde steht davor.“ – „…, weil die Erde davor steht.“ Bei weil wandert das Verb ans Ende.'],
  ['Wann nimmst du als, wann wenn?','als: einmal in der Vergangenheit („Als es noch keine Computer gab, …“). wenn: immer wieder oder als Bedingung.'],
  ['Wann nimmst du ob, wann dass?','ob bei einer offenen Ja-Nein-Frage („Wer kann sagen, ob …?“), dass bei einer Aussage („Er hatte Angst, dass …“).']],
 p5:[['Wie trennst du die Teile einer Aufzählung?','Mit Komma: „Dackel, Collie, Dalmatiner …“'],
  ['Steht in einer Aufzählung vor und / oder ein Komma?','Nein: „… Pekinese und Schäferhund.“ (Nr. 39)'],
  ['Wie unterscheidest du Satzreihe (SR) und Satzgefüge (SG)?','Nur Hauptsätze → Satzreihe. Hauptsatz + Nebensatz (gebeugte Verbform am Ende) → Satzgefüge.'],

const CEX={"p1": ["So prüfst du es: Deck den anderen Teil ab. Ergibt der Rest allein einen Sinn, ist es ein Hauptsatz. In „Das war aber nicht so und jetzt gefällt es ihm sehr gut dort.“ könnten beide Teile allein stehen (Nr. 29).", "Typischer Fehler: „…, weil sein Vater arbeitet dort.“ – im Nebensatz muss die gebeugte (finite) Verbform ganz ans Ende. Noch ein Beispiel (Nr. 29): „…, dass er in den USA keine Freunde findet.“", "Nicht jedes Verb ist gebeugt: In „…, aber genauso wenig wollen sie auf die Winterspiele verzichten.“ (Nr. 32) ist nur „wollen“ gebeugt. „verzichten“ ändert sich nicht, wenn du die Person wechselst.", "Beispiel (Nr. 29): „Julia fällt vor Schreck fast in Ohnmacht …“ → „Ich falle …“: „fällt“ ändert sich, also ist es die gebeugte Verbform. Auf den Zetteln unterstreichst du sie einfach, die Konjunktionen doppelt.", "Tipp (Zusatz): Zähle die gebeugten (finiten) Verbformen. „Christoph kommt nach langer Zeit wieder zu Besuch zu der Familie seines Onkels.“ hat nur eine (kommt) und ist deshalb kein zusammengesetzter Satz (Lösung Nr. 29).", "Vorsicht bei der, die, das: In „Die erfolgreichen Wettkämpfer, die nach den Spielen in ihr Heimatland reisen, werden …“ (Nr. 32) beginnt erst das „die“ nach dem Komma einen Nebensatz. Das erste „Die“ gehört zu „Wettkämpfer“."], "p2": ["Es geht auch ganz ohne Konjunktion (Lösung Nr. 30): „Zuerst beschwerten sie sich, dann verließen sie das Lokal.“ – zwei Hauptsätze, nur durch ein Komma getrennt.", "Darum steht das Komma auf Lösung Nr. 32 in Klammern: „Die Spiele werden alle vier Jahre veranstaltet(,) und sie sind das wichtigste sportliche Ereignis des Jahres.“", "Weitere Beispiele (Lösung Nr. 30): „Tina zögert nicht lange, sondern sie macht sich schnell auf den Heimweg.“ – „Lisa will einen Blumenstrauß kaufen, denn ihre Mutter hat Geburtstag.“", "Nr. 36 übt es mit „Neil Armstrong war für viele ein Held. Er war ein normaler Mensch.“: Mit aber oder doch wird daraus ein Gegensatz, mit und zählst du nur auf.", "Typischer Fehler: „…, denn die Erde genau zwischen Mond und Sonne steht.“ – so geht es nur mit weil. Nach denn bleibt „steht“ an seinem Platz (Nr. 38).", "Übung von Nr. 36: „Forscher beobachten den Mond. Sie untersuchen seine Umlaufbahn.“ → „Forscher beobachten den Mond und untersuchen seine Umlaufbahn.“ (Lösungsvorschlag, Zusatz) – das „Sie“ fällt weg."], "p3": ["Noch ein Beispiel (Nr. 32): „Ich stehe auf (HS), obwohl ich noch müde bin (NS).“ Auf den Zetteln steht HS für Hauptsatz und NS für Nebensatz.", "Steht der Nebensatz vorne, kommt das Komma nach ihm: „Obwohl die Katastrophe vorhergesagt worden war, wurde zu wenig getan.“ (Lösung Nr. 33)", "TIPP von Nr. 38: Das Prädikat „wandert“ im Nebensatz an das Satzende: „Wir wissen viel. Forscher untersuchten das Mondgestein.“ → „Wir wissen viel, weil Forscher das Mondgestein untersuchten.“", "Noch ein Beispiel (Lösung Nr. 33): „Weil sie keine Autos hatten, konnten nicht alle Menschen die Stadt rechtzeitig verlassen.“ – nach dem Komma kommt gleich das Verb „konnten“.", "Achtung: Auf Nr. 33 steht „nebenordnende Konjunktion“. Das ist ein Druckfehler, gemeint sind Nebensatz-Konjunktionen wie weil, wenn, nachdem, obwohl. Du erkennst sie daran, dass die gebeugte (finite) Verbform danach ans Ende wandert.", "Manchmal steht noch ein Wort davor (Lösung Nr. 32): „Es gibt auch eine Winterolympiade, bei der alpine Sportarten im Mittelpunkt stehen.“ Prüfe: Die gebeugte Verbform „stehen“ steht am Ende."], "p4": ["Beispiele: „Moderne Systeme wirken lebensnaher, weil sie von echten Fotos ausgehen.“ (Nr. 34) – „Er ernährte sich von Blättern und Wasser, weil er oben im Baum keine andere Nahrung hatte.“ (Nr. 40)", "Beispiel (Lösung Nr. 34): „So konnte man nach einer Person suchen, obwohl man kein Fahndungsfoto hatte.“ Prüffrage (Zusatz): Passiert etwas „trotzdem“? Dann passt obwohl.", "Beispiel (Nr. 40): „Ein Hubschrauber holte ihn aus dem Baum, nachdem man die Polizei benachrichtigt hatte.“ – zuerst die Polizei, dann der Hubschrauber. Noch eins (Nr. 34): „…, sobald sich Zeugen an Details erinnern.“", "Weiteres Beispiel (Nr. 31): „Ich mag dicke Bücher, wenn sie spannend sind.“ Prüffrage (Zusatz): Passt „nur dann, wenn …“? Dann ist es eine Bedingung.", "Prüffrage (Zusatz): damit → „Wozu?“, sodass → „Was passiert dadurch?“ Beispiel (berichtigt aus Nr. 37): „Ein Planet muss eine Gashülle haben, damit Wind und Wetter entstehen.“", "Typischer Fehler: „…, weil die Erde steht davor.“ – nach weil muss die gebeugte (finite) Verbform ans Ende. Vor denn steht immer ein Komma (Nr. 36).", "Beispiel (Nr. 40): „Ein argentinischer Fischer flüchtete sich auf einen Baum, als ein Hochwasser seine Hütte überschwemmte.“ – das passierte einmal, also als.", "ob und dass beginnen beide einen Nebensatz, davor steht ein Komma (Nr. 41): „Er rief aber vorher an, ob ich denn auch zu Hause sei.“ – „Da sagte meine Mutter, dass ich mal ans Telefon kommen soll.“"], "p5": ["Die Teile können auch aus mehreren Wörtern bestehen (Nr. 39): „…die Spuren von Kaninchen, Füchsen, Wildschweinen und anderen Tieren.“ Tipp: Auf Nr. 39 fehlen im ersten Text genau sechs Kommas – zähl mit.", "Das gilt auch mitten im Satz (Nr. 39): „Der Turnbeutel mit Turnschuhen, Handtuch und Turnhose hängt an der Türklinke.“ Zwischen Hauptsätzen ist es anders: Da darf vor und/oder ein Komma stehen (Nr. 30).", "Schau auf die Konjunktion: und, oder, aber, sondern, denn, doch → Satzreihe (Nr. 36). weil, obwohl, nachdem, damit … → Satzgefüge (Nr. 38). Beispiel (Lösung Nr. 32): „Richtige Sportfans versäumen nie die Sommerspiele, aber genauso wenig wollen sie …“ = SR.", "Probier es an Nr. 41: „Einmal wollte Paul mich besuchen weil wir miteinander Hausaufgaben machen wollten.“ – zwei gebeugte Verbformen (wollte, wollten), also zwei Teile: Komma vor weil.", "Beispiel (Nr. 30): „Ich habe nicht gelogen, ich habe nur nicht die ganze Wahrheit gesagt.“ – hier ginge auch ein Punkt. Bei „…, weil ich zur Schule gehen muss.“ nicht, denn der Nebensatz kann nicht allein stehen."], "p6": ["Im Heft (AH S. 56) sind „tauchen, halten, legen, bleiben“ Präsens-Formen. Merke (Zusatz): Präsens und Präteritum bestehen aus nur einem Verb, Perfekt, Plusquamperfekt und Futur aus zwei Teilen.", "Weitere Beispiele (Heft, AH S. 56 und S. 58): „bauten“, „erkundeten“, „Die Show begann.“ Typischer Fehler (Zusatz): „beginnte“ – viele Verben verändern sich im Präteritum ganz (beginnen → begann, gehen → ging).", "Weitere Beispiele (Heft, AH S. 58): „Die Show hat begonnen.“ – „Die Eltern sind zur Kasse vorgegangen.“ Das Partizip II beginnt oft mit ge- (Zusatz).", "Weitere Beispiele (Heft, AH S. 58): „Die Show hatte begonnen.“ – „Emir hatte seine Käppi verloren.“ Prüfe (Zusatz): hatte/war → Plusquamperfekt, hat/ist → Perfekt.", "Zwischen werden und der Grundform können andere Wörter stehen, darum stehen im Heft Punkte: „werden … aufsuchen“ (AH S. 56). Beispiel (Zusatz, nicht vom Zettel): „Die Forscher werden die Tiefsee erkunden.“", "Beispiele (Heft, AH S. 57): „bin … gekommen“, „ist … gefallen“ – aber „hat … geübt“, „habe … geschafft“. Prüffrage (Zusatz): Bewegt sich jemand von einem Ort zum anderen? Dann meist sein.", "Beispiel (Heft, Buch S. 235): „Das Floß einer Gruppe schaukelte heftig, weil alle gleichzeitig auf die Plattform gesprungen waren.“ – erst sprangen alle, dann schaukelte das Floß.", "Mit weil oder da geht das auch (Heft, Buch S. 235 Nr. 5c): „Theo guckte zu, weil er zuvor einen Fehler gemacht hatte.“ – „Mila gab gute Tipps, da sie schlau gewesen war.“"]};

/* Satz-Baumeister: Bei „A und B“, „A oder B“, „weder A noch B“ ist die Reihenfolge von A und B egal –
   geprüft wird nur, wohin das Verb wandert. A/B = Nomen, optional mit Begleiter davor (kein Wasser, die Sonne …). */
const DET=/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines|kein|keine|keinen|keinem|keiner|mein|meine|sein|seine|ihr|ihre|unser|unsere)$/i;
function orderVariants(list){const out=new Set(list);list.forEach(s=>{const t=s.split(' ');t.forEach((w,c)=>{
  if(!/^(und|oder|noch|sowie)$/.test(w)||c===0)return;let r=c+1;if(r<t.length&&DET.test(t[r]))r++;if(r>=t.length||!/^[A-ZÄÖÜ]/.test(t[r]))return;
  let l=c-1;if(!/^[A-ZÄÖÜ]/.test(t[l]))return;if(l>0&&DET.test(t[l-1]))l--;
  out.add([...t.slice(0,l),...t.slice(c+1,r+1),w,...t.slice(l,c),...t.slice(r+1)].join(' '));});});return [...out];}

{p:'p3',q:'Verbinde zu Satzgefügen: 1) Die Deiche brachen. Das Wasser stieg rasch. 2) Es fehlten Busse. Viele konnten nicht rechtzeitig in Sicherheit gebracht werden.',k:['1) z. B. „Als die Deiche brachen, stieg das Wasser rasch.“','2) z. B. „Es fehlten Busse, sodass viele nicht rechtzeitig in Sicherheit gebracht werden konnten.“','im Nebensatz steht das gebeugte Verb am Ende, Kommas richtig'],a:'1) Als die Deiche brachen, stieg das Wasser rasch. 2) Es fehlten Busse, sodass viele nicht rechtzeitig in Sicherheit gebracht werden konnten.'},
{p:'p3',q:'Setze die Sätze mit einer eigenen Begründung mit weil fort: „Ferien sind wichtig, …“ und „Ich hätte gern einen Hund, …“.',k:['beide Sätze mit weil fortgesetzt','im weil-Satz steht das gebeugte Verb am Ende','sinnvolle Begründungen'],a:'Ferien sind wichtig, weil man sich erholen muss. Ich hätte gern einen Hund, weil ich dann jeden Tag draußen wäre.'},
{p:'p3',q:'Forme um, einmal mit wenn und einmal mit obwohl: „Wir kommen. Es regnet nicht.“ und „Ich esse nichts. Ich habe aber Hunger.“',k:['„Wir kommen, wenn es nicht regnet.“','„Ich esse nichts, obwohl ich Hunger habe.“','Komma und Verbstellung jeweils richtig'],a:'Wir kommen, wenn es nicht regnet. Ich esse nichts, obwohl ich Hunger habe.'},
{p:'p3',q:'Verbinde mit nachdem: „Die Behörden gaben Entwarnung. Der Hurrikan war knapp am Stadtzentrum vorbeigerast.“ Achte auf die Reihenfolge der Ereignisse.',k:['„Nachdem der Hurrikan knapp am Stadtzentrum vorbeigerast war, gaben die Behörden Entwarnung.“ (oder umgekehrte Satzstellung)','nachdem leitet das frühere Ereignis ein','Komma und Verb am Ende des Nebensatzes'],a:'Nachdem der Hurrikan knapp am Stadtzentrum von New Orleans vorbeigerast war, gaben die Behörden Entwarnung.'},
{p:'p4',q:'Erkläre an diesem Beispiel den Unterschied zwischen denn und weil: „Der Mond verdunkelt sich, denn die Erde steht zwischen Mond und Sonne.“',k:['beide nennen einen Grund, die Bedeutung ist gleich','denn leitet einen Hauptsatz ein, das Verb steht an 2. Stelle','weil leitet einen Nebensatz ein, das Verb steht am Ende: „…, weil die Erde zwischen Mond und Sonne steht.“'],a:'denn und weil nennen beide einen Grund. Nach denn folgt ein Hauptsatz, das Verb „steht“ bleibt an 2. Stelle. Mit weil entsteht ein Nebensatz, das Verb wandert ans Ende: „Der Mond verdunkelt sich, weil die Erde zwischen Mond und Sonne steht.“'},
{p:'p4',q:'In diesen Sätzen sind die Konjunktionen falsch. Verbessere sie und begründe: „Fußabdrücke auf dem Mond können nicht verwehen, damit es dort keinen Wind gibt.“ – „Ein Planet muss eine Gashülle haben, obwohl Wind und Wetter entstehen.“',k:['1. Satz: weil statt damit','2. Satz: damit statt obwohl','Begründung: weil nennt einen Grund, damit einen Zweck'],a:'„…, weil es dort keinen Wind gibt.“ – weil nennt den Grund. „…, damit Wind und Wetter entstehen.“ – damit nennt den Zweck.'},
{p:'p4',q:'Nenne je zwei Konjunktionen für einen Grund, einen Gegensatz und eine Zeitangabe.',k:['Grund: z. B. weil, da, denn','Gegensatz: z. B. obwohl, aber, doch, sondern','Zeit: z. B. als, nachdem, bevor, während, sobald'],a:'Grund: weil, da (denn). Gegensatz: obwohl, aber (doch, sondern). Zeit: als, nachdem (bevor, während).'},
{p:'p5',q:'Schreibe den Satz mit allen nötigen Kommas ab und erkläre die Regel: „Dackel Collie Dalmatiner oder Pekinese und Schäferhund sind beliebte Hunderassen.“',k:['„Dackel, Collie, Dalmatiner oder Pekinese und Schäferhund …“','kein Komma vor oder und und','Regel: Aufzählungen durch Komma trennen, aber nicht vor und/oder'],a:'Dackel, Collie, Dalmatiner oder Pekinese und Schäferhund sind beliebte Hunderassen. Aufzählungen werden durch Kommas getrennt, vor und bzw. oder steht kein Komma.'},
{p:'p5',q:'Schreibe mit den richtigen Kommas ab: „Einmal wollte Paul mich besuchen weil wir Hausaufgaben machen wollten. Er rief aber vorher an ob ich zu Hause sei.“',k:['Komma vor weil','Komma vor ob','keine zusätzlichen falschen Kommas'],a:'Einmal wollte Paul mich besuchen, weil wir Hausaufgaben machen wollten. Er rief aber vorher an, ob ich zu Hause sei.'},
{p:'p5',q:'Satzreihe oder Satzgefüge? Begründe: 1) „Richtige Sportfans versäumen nie die Sommerspiele, aber genauso wenig wollen sie auf die Winterspiele verzichten.“ 2) „Nachdem die Preise gestiegen sind, können sich nur wenige Menschen Karten leisten.“',k:['1) Satzreihe: zwei Hauptsätze, verbunden mit aber','2) Satzgefüge: „Nachdem … sind“ ist ein Nebensatz','Begründung über die Stellung des gebeugten Verbs bzw. die Konjunktion'],a:'1) Satzreihe: Beide Teilsätze sind Hauptsätze, das Verb steht an 2. Stelle (versäumen, wollen). 2) Satzgefüge: Der Nebensatz beginnt mit nachdem und das Verb „sind“ steht am Ende.'},
{p:'p6',q:'Setze den Satz „Die Show beginnt.“ ins Perfekt, ins Präteritum und ins Plusquamperfekt.',k:['Perfekt: „Die Show hat begonnen.“','Präteritum: „Die Show begann.“','Plusquamperfekt: „Die Show hatte begonnen.“'],a:'Perfekt: Die Show hat begonnen. Präteritum: Die Show begann. Plusquamperfekt: Die Show hatte begonnen.'},
{p:'p6',q:'Erkläre, wie man Perfekt und Plusquamperfekt bildet, und nenne je ein Beispiel.',k:['Perfekt: haben/sein im Präsens + Partizip II','Plusquamperfekt: haben/sein im Präteritum + Partizip II','zu beidem ein richtiges Beispiel'],a:'Perfekt: haben oder sein im Präsens + Partizip II, z. B. „Ich bin ins Kino gegangen.“ Plusquamperfekt: haben oder sein im Präteritum + Partizip II, z. B. „Ich war ins Kino gegangen.“'},
{p:'p6',q:'Wann bildet man das Perfekt mit sein? Nenne drei Beispiele in ganzen Sätzen.',k:['bei Verben der Bewegung bzw. Ortsveränderung','drei passende Verben (z. B. gehen, laufen, schwimmen, klettern, rennen)','die drei Sätze sind richtig gebildet'],a:'Verben der Bewegung bilden das Perfekt mit sein: Ich bin ins Kino gegangen. Wir sind über den Zaun geklettert. Sie ist ans Ufer geschwommen.'},
{p:'p6',q:'Verbinde mit nachdem und achte auf die Zeitformen: „Ich übte die Knoten. Ich befestigte die Taue.“',k:['„Nachdem ich die Knoten geübt hatte, befestigte ich die Taue.“','der nachdem-Satz steht im Plusquamperfekt','der Hauptsatz steht im Präteritum, Komma gesetzt'],a:'Nachdem ich die Knoten geübt hatte, befestigte ich die Taue.'}
];

  addXP([0,100,80,60,40,20,10][note]);if(note<=2)confetti();if(window.lzRec)lzRec('D',S.sel.slice(),note,'write');
  const f=x=>String(x).replace('.',','),sym=v=>v===1?'<span class="wk ok">✓</span>':v===.5?'<span class="wk half">½</span>':'<span class="wk bad">✗</span>';
  app.innerHTML=`<div class="result"><div class="rcard" style="max-width:760px"><div class="rtitle">✍️ Schreibtest</div><div class="note">Note ${note}</div><p>${NOTE_TXT[note]} · ${f(pts)} von ${max} Punkten (${Math.round(pct)} %)</p>
  <div><b>${G.by==='ki'?'🤖 Korrigiert von der KI (Claude)':'✍️ Selbst korrigiert'}</b></div>${G.overall?`<div class="wover"><small>Rückmeldung</small>${esc(G.overall)}</div>`:''}
  ${window.lzEval?lzEval(S.sel.slice(),note,'write'):''}
  <div class="wlist">${G.qs.map((q,i)=>{const r=G.res[i],sp=r.p.reduce((a,b)=>a+(b||0),0);return`<div class="wans"><div class="wmeta">Aufgabe ${i+1} · ${f(sp)} von ${q.k.length} Punkten</div><b>${esc(q.q)}</b><div class="wmine"><small>Deine Antwort</small>${G.a[i].trim()?esc(G.a[i]):'<i>(leer)</i>'}</div>${q.k.map((k,j)=>`<div class="wkr2">${sym(r.p[j])}<span>${esc(k)}</span></div>`).join('')}${r.c?`<div class="wcom"><small>🤖 Kommentar</small>${esc(r.c)}</div>`:''}<div class="wmodel"><small>Musterantwort</small>${esc(q.a)}</div></div>`;}).join('')}</div>
  <div class="rbtns"><button class="big go" id="again">Neuer Test</button><button class="big sec" id="tohome">Zum Büro</button></div></div></div>`;
  $('#again').onclick=()=>startMode('write');$('#tohome').onclick=home;app.scrollTop=0;}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderHeader();};
window.__D={ITEMS,startMode,home,G:()=>G};
renderHeader();
home();
})();

</script>
